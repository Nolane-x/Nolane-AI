name: Refoundation Wave 5B Evidence Bootstrap

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5-native-foundations
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5b-native-evidence' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply deterministic Wave 5B cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          types_path = Path('cogcoder/organization/types.py')
          text = types_path.read_text(encoding='utf-8')
          import_anchor = 'from typing import Any, Mapping\n'
          if 'from nolane.external_core.evidence import EvidenceRecord\n' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('types.py: typing import anchor not unique')
              text = text.replace(
                  import_anchor,
                  import_anchor + '\nfrom nolane.external_core.evidence import EvidenceRecord\n',
                  1,
              )
          old_block = '''@dataclass(frozen=True, slots=True)\nclass EvidenceRecord:\n    evidence_id: str\n    verifier_agent_id: str\n    passed: bool\n    false_accepts: int = 0\n    regressions: int = 0\n    notes: str = ''\n\n    def __post_init__(self) -> None:\n        if self.false_accepts < 0 or self.regressions < 0: raise ValueError('evidence counters must be non-negative')\n        if not self.evidence_id or not self.verifier_agent_id: raise ValueError('evidence identity must be explicit')\n\n    def to_state(self) -> dict[str, Any]:\n        return {'evidence_id': self.evidence_id, 'verifier_agent_id': self.verifier_agent_id, 'passed': self.passed,\n                'false_accepts': self.false_accepts, 'regressions': self.regressions, 'notes': self.notes}\n\n    @classmethod\n    def from_state(cls, state: Mapping[str, Any]) -> 'EvidenceRecord':\n        return cls(str(state['evidence_id']), str(state['verifier_agent_id']), bool(state['passed']),\n                   int(state.get('false_accepts', 0)), int(state.get('regressions', 0)), str(state.get('notes', '')))\n\n\n'''
          if old_block not in text:
              raise SystemExit('types.py: historical EvidenceRecord block not found exactly')
          types_path.write_text(text.replace(old_block, '', 1), encoding='utf-8')

          replace_once(
              'cogcoder/refoundation/component_versions.py',
              '        "external.verification": 1,\n',
              '        "external.verification": 1,\n        "external.evidence": 1,\n',
          )

          implementation_path = Path('cogcoder/refoundation/implementation_status.py')
          implementation = implementation_path.read_text(encoding='utf-8')
          native_anchor = '''    "external.artifacts": (\n        "nolane.external_core.artifacts",\n        ("cogcoder/organization/artifacts.py",),\n        "Native content-addressed artifact records/store with deterministic evidence ordering, metadata encoding and state round-trip; historical artifact module is a compatibility bridge.",\n    ),\n'''
          evidence_native = native_anchor + '''    "external.evidence": (\n        "nolane.external_core.evidence",\n        ("cogcoder/organization/types.py",),\n        "Native verification evidence primitive with preserved historical import identity and state semantics; mixed historical types module bridges to canonical class authority.",\n    ),\n'''
          if implementation.count(native_anchor) != 1:
              raise SystemExit('implementation_status.py: artifact native anchor not unique')
          implementation = implementation.replace(native_anchor, evidence_native, 1)
          legacy_line = '    "external.evidence": ("cogcoder/organization/types.py", "cogcoder/organization/verification.py"),\n'
          if implementation.count(legacy_line) != 1:
              raise SystemExit('implementation_status.py: evidence legacy hint not unique')
          implementation = implementation.replace(legacy_line, '', 1)
          implementation_path.write_text(implementation, encoding='utf-8')

          replace_once(
              'tests/test_refoundation_component_versions.py',
              '    "external.verification",\n',
              '    "external.verification",\n    "external.evidence",\n',
          )
          replace_once(
              'tests/test_refoundation_implementation_status.py',
              '    "external.verification",\n',
              '    "external.verification",\n    "external.evidence",\n',
          )
          PY
      - name: Materialize native-debt projections
        run: python -m nolane.repository.audit --write
      - name: Prove historical archive index did not drift
        run: git diff --exit-code -- archive/INDEX.json
      - name: Verify Wave 5B targeted contracts
        run: |
          python -m nolane.repository.audit --check
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_wave5b_native_evidence.py
      - name: Commit deterministic Wave 5B cutover
        shell: bash
        run: |
          git add \
            cogcoder/organization/types.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/implementation_status.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md
          if git diff --cached --quiet; then
            echo 'No Wave 5B cutover changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(refoundation): cut over native evidence primitive'
          git push origin HEAD:${GITHUB_HEAD_REF}
