name: E Acting Decision Authority

on:
  push:
    branches:
      - e-acting-authority-integration-gpt56sol
  pull_request:
    branches:
      - main
    paths:
      - 'nolane/external_core/execution.py'
      - 'nolane/external_core/execution_types.py'
      - 'nolane/neural/inference_bridge.py'
      - 'tests/test_refoundation_acting_decision_request_authority.py'
      - '.github/workflows/e-acting-decision-authority.yml'

concurrency:
  group: e-acting-decision-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decision-request-authority:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run decision request authority regression
        run: python -m pytest -q tests/test_refoundation_acting_decision_request_authority.py
