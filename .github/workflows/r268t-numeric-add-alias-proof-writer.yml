name: R2.68-T Numeric Add Alias Proof GREEN Writer

on:
  push:
    branches: [hardening-r268t-finite-fingerprint-authority-gpt56sol]
    paths:
      - 'scripts/r268t_apply_numeric_add_alias_proof.py'
      - '.github/workflows/r268t-numeric-add-alias-proof-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r268t-numeric-add-alias-proof-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-finite-fingerprint-authority-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_numeric_add_alias_proof.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py

  materialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-finite-fingerprint-authority-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_numeric_add_alias_proof.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Materialize tested source correction
        run: |
          if git diff --quiet -- cogcoder/r268_cross_task_causal_transfer.py; then
            echo 'Source correction already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r268_cross_task_causal_transfer.py
          git commit -m 'fix: require numeric proof before commuting R2.68-T add'
          git push origin HEAD:hardening-r268t-finite-fingerprint-authority-gpt56sol
