name: R2.61 Version-Space Expansion

on:
  push:
    branches: [r261-version-space-expansion-gpt56sol]
    paths:
      - 'cogcoder/r261_*.py'
      - 'tests/test_r261_*.py'
      - '.github/workflows/r261-version-space-expansion.yml'
      - 'benchmarks/kfigg/r261_*.py'
      - 'research/r261_*.py'
      - 'R2_61_*.json'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r261_*.py'
      - 'tests/test_r261_*.py'
      - '.github/workflows/r261-version-space-expansion.yml'
      - 'benchmarks/kfigg/r261_*.py'
      - 'research/r261_*.py'
      - 'R2_61_*.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify accepted R2.60 baseline first
        run: PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
      - name: Run R2.61 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r261_*.py

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Run R2.61 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
