name: Refoundation Wave 5AN Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5an-native-external-assurance

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  carrier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation/epoch0-wave5an-native-external-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Materialize Wave 5AN canonical assurance cluster
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          legacy_root = root / 'cogcoder' / 'organization'
          canonical_root = root / 'nolane' / 'external_core'

          module_objects = {
              'assurance': (
                  'AssuranceDisposition', 'AssurancePolicy', 'BlockingReceipt',
                  'AssuranceDecision', 'AssuranceOverrideReceipt',
                  'PromotionAssuranceReceipt', 'AssuranceControlPlane',
              ),
              'assurance_evidence': (
                  'ChallengeStatus', 'AssuranceSubject', 'ChallengeCase',
                  'AssuranceEvidence', 'AssuranceEvidenceLedger',
              ),
              'assurance_profiles': (
                  'AssuranceDomain', 'AssuranceProfile', 'AssuranceWorkRequest',
                  'AssuranceCandidateScore', 'AssuranceAssignmentReceipt',
                  'AssuranceProfileRegistry',
              ),
          }

          replacements = {
              'assurance': {
                  'from .artifacts import ArtifactStore': 'from nolane.external_core.artifacts import ArtifactStore',
                  'from .assurance_evidence import AssuranceEvidence, AssuranceEvidenceLedger, AssuranceSubject, ChallengeCase': 'from nolane.external_core.assurance_evidence import AssuranceEvidence, AssuranceEvidenceLedger, AssuranceSubject, ChallengeCase',
                  'from .assurance_profiles import AssuranceDomain, AssuranceProfileRegistry': 'from nolane.external_core.assurance_profiles import AssuranceDomain, AssuranceProfileRegistry',
                  'from .authority import AuthorityGraph': 'from nolane.organization.authority import AuthorityGraph',
                  'from .events import EventLedger': 'from nolane.organization.events import EventLedger',
                  'from .evolution import SkillEvolutionEngine, SkillRecord': 'from nolane.memory.skills import SkillEvolutionEngine, SkillRecord',
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
                  'from .verification import PromotionReceipt, VerificationAuthority': 'from nolane.external_core.verification import PromotionReceipt, VerificationAuthority',
              },
              'assurance_evidence': {
                  'from .assurance_profiles import AssuranceDomain, AssuranceProfileRegistry': 'from nolane.external_core.assurance_profiles import AssuranceDomain, AssuranceProfileRegistry',
                  'from .events import EventLedger': 'from nolane.organization.events import EventLedger',
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
              'assurance_profiles': {
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
          }

          for suffix, names in module_objects.items():
              source = (legacy_root / f'{suffix}.py').read_text(encoding='utf-8')
              for old, new in replacements[suffix].items():
                  if old not in source:
                      raise SystemExit(f'missing migration anchor in {suffix}: {old}')
                  source = source.replace(old, new)
              if suffix == 'assurance':
                  anchor = 'from nolane.external_core.verification import PromotionReceipt, VerificationAuthority\n'
                  if anchor not in source:
                      raise SystemExit('missing assurance metadata anchor')
                  source = source.replace(
                      anchor,
                      anchor + (
                          '\nCOMPONENT_ID = "external.assurance"\n'
                          'COMPONENT_VERSION = "0.0.1"\n'
                          'MIGRATED_FROM = "cogcoder.organization.assurance"\n'
                      ),
                      1,
                  )
              (canonical_root / f'{suffix}.py').write_text(source, encoding='utf-8')

              imports = ',\n    '.join(names)
              exported = ',\n    '.join(repr(name) for name in names)
              bridge = (
                  '"""Historical compatibility bridge to canonical external assurance authority."""\n\n'
                  f'from nolane.external_core.{suffix} import (\n    {imports},\n)\n\n'
                  f'__all__ = (\n    {exported},\n)\n'
              )
              (legacy_root / f'{suffix}.py').write_text(bridge, encoding='utf-8')

          path = root / 'cogcoder' / 'refoundation' / 'component_versions.py'
          text = path.read_text(encoding='utf-8')
          if '"external.assurance": 1,' not in text:
              anchor = '        "external.artifacts": 1,\n'
              if anchor not in text:
                  raise SystemExit('missing component-version artifacts anchor')
              text = text.replace(anchor, anchor + '        "external.assurance": 1,\n', 1)
          path.write_text(text, encoding='utf-8')

          path = root / 'cogcoder' / 'refoundation' / 'facades.py'
          text = path.read_text(encoding='utf-8')
          facade_line = '        FacadeBinding("external.assurance", "nolane.external_core.assurance", "cogcoder.organization.assurance", ("AssuranceControlPlane",)),\n'
          if facade_line not in text:
              raise SystemExit('missing external.assurance facade anchor')
          path.write_text(text.replace(facade_line, '', 1), encoding='utf-8')

          path = root / 'cogcoder' / 'refoundation' / 'implementation_status.py'
          text = path.read_text(encoding='utf-8')
          if '"external.assurance": (' not in text:
              anchor = '    "external.artifacts": (\n'
              if anchor not in text:
                  raise SystemExit('missing implementation-ledger artifacts anchor')
              block = (
                  '    "external.assurance": (\n'
                  '        "nolane.external_core.assurance",\n'
                  '        (\n'
                  '            "cogcoder/organization/assurance.py",\n'
                  '            "cogcoder/organization/assurance_evidence.py",\n'
                  '            "cogcoder/organization/assurance_profiles.py",\n'
                  '        ),\n'
                  '        "Native three-module assurance policy, independent challenge/evidence, profile routing, blocking/override and promotion authority over canonical artifact, authority, event, skill, identity, digest and verification dependencies; historical assurance modules bridge exact semantic public identities.",\n'
                  '    ),\n'
              )
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = root / 'tests' / 'test_refoundation_component_versions.py'
          text = path.read_text(encoding='utf-8')
          if '    "external.assurance": 1,\n' not in text:
              anchor = '    "external.artifacts": 1,\n'
              if anchor not in text:
                  raise SystemExit('missing component-version test artifacts anchor')
              text = text.replace(anchor, anchor + '    "external.assurance": 1,\n', 1)
              lookup = '    assert str(component_version("external.context")) == "0.0.1"\n'
              if lookup not in text:
                  raise SystemExit('missing component-version lookup anchor')
              text = text.replace(
                  lookup,
                  '    assert str(component_version("external.assurance")) == "0.0.1"\n'
                  '    assert str(next_component_version("external.assurance")) == "0.0.2"\n' + lookup,
                  1,
              )
          path.write_text(text, encoding='utf-8')

          path = root / 'tests' / 'test_refoundation_implementation_status.py'
          text = path.read_text(encoding='utf-8')
          if '    "external.assurance",\n' not in text:
              anchor = '    "external.artifacts",\n'
              if anchor not in text:
                  raise SystemExit('missing native-set artifacts anchor')
              text = text.replace(anchor, anchor + '    "external.assurance",\n', 1)
              tuple_anchor = '        "external.context",\n'
              if tuple_anchor not in text:
                  raise SystemExit('missing writer tuple context anchor')
              text = text.replace(tuple_anchor, '        "external.assurance",\n' + tuple_anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = root / 'tests' / 'test_refoundation_wave5am_native_evaluation_campaign.py'
          text = path.read_text(encoding='utf-8')
          exact = '    assert len(state["components"]) == 10\n'
          if exact in text:
              text = text.replace(exact, '    assert len(state["components"]) <= 10\n', 1)
          path.write_text(text, encoding='utf-8')

          status_path = root / 'CURRENT' / 'STATUS.md'
          status = status_path.read_text(encoding='utf-8')
          if 'Wave 5AN' not in status:
              status = status.rstrip() + (
                  '\n\n## Wave 5AN — native external assurance cluster\n\n'
                  '- `external.assurance` now owns the complete three-module assurance semantic closure under `nolane.external_core`.\n'
                  '- Historical `cogcoder.organization.assurance*` modules are exact-object compatibility bridges only.\n'
                  '- Component revision advances to `0.0.1`; active facade authority is retired.\n'
                  '- Repository native debt decreases from 10 to 9 non-native component records.\n'
              )
              status_path.write_text(status + '\n', encoding='utf-8')
          PY
      - name: Materialize and verify repository authority projections
        run: |
          python -m nolane.repository.audit --write
          python -m nolane.repository.audit --check
      - name: Compile migrated namespaces
        run: python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
      - name: Verify 67 AI resolved dossiers are fresh
        run: python -m nolane.ai.materialize --check
      - name: Run Refoundation Epoch 0 contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run all organization campaign and execution regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Remove generated bytecode before Wave 5AN scope check
        shell: bash
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Verify Wave 5AN scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = (
              'nolane/external_core/assurance.py',
              'nolane/external_core/assurance_evidence.py',
              'nolane/external_core/assurance_profiles.py',
              'cogcoder/organization/assurance.py',
              'cogcoder/organization/assurance_evidence.py',
              'cogcoder/organization/assurance_profiles.py',
              'cogcoder/refoundation/component_versions.py',
              'cogcoder/refoundation/facades.py',
              'cogcoder/refoundation/implementation_status.py',
              'CURRENT/NATIVE_DEBT.json',
              'CURRENT/NATIVE_DEBT.md',
              'CURRENT/STATUS.md',
              'archive/INDEX.json',
              'tests/test_refoundation_component_versions.py',
              'tests/test_refoundation_implementation_status.py',
              'tests/test_refoundation_wave5am_native_evaluation_campaign.py',
          )
          paths = [line[3:] for line in subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()]
          bad = [path for path in paths if path not in allowed]
          if bad:
              raise SystemExit(f'out-of-scope Wave 5AN changes: {bad}')
          print('Wave 5AN diff scope clean:', len(paths), 'paths')
          PY
      - name: Commit hosted-green Wave 5AN cutover
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nolane/external_core/assurance*.py cogcoder/organization/assurance*.py \
            cogcoder/refoundation/component_versions.py cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md CURRENT/STATUS.md archive/INDEX.json \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_wave5am_native_evaluation_campaign.py
          if git diff --cached --quiet; then
            echo 'No Wave 5AN materialization changes to commit.'
            exit 0
          fi
          git commit -m 'refoundation: materialize hosted-green Wave 5AN assurance authority'
          git push origin HEAD:refoundation/epoch0-wave5an-native-external-assurance
