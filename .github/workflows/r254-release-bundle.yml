name: R2.54 Full Repository Release Bundle

on:
  push:
    branches: [ main ]
    paths:
      - "archive/root-history/historical_r_series/R2_54_DELIVERY.md"
      - "archive/root-history/historical_r_series/R2_54_RELEASE_MANIFEST.json"
      - "archive/root-history/historical_r_series/R2_53_TO_R2_54_EVOLUTION.md"
      - "research/R2_54_*.json"
      - ".github/workflows/r254-release-bundle.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen release boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/R2_54_PHASE_A_RESULT.json'))
          v=json.load(open('research/R2_54_VERIFY_RESULT.json'))
          w=json.load(open('research/R2_54_WORLD_FINAL.json'))
          e=json.load(open('research/R2_54_EXTERNAL_TRANSFER.json'))
          m=json.load(open('archive/root-history/historical_r_series/R2_54_RELEASE_MANIFEST.json'))
          assert p['decision']=='ACCEPTED_BOUNDED_CAPABILITY' and p['all_gates_pass'] is True
          assert p['focused_tests']=='24/24' and p['protected_lineage'].startswith('125/125')
          s=p['summary']; assert s['episodes']==10 and s['exact']==10 and s['false_accepts']==0
          assert s['single_shot_lexical_exact']==0 and s['fixed_topk_federated_exact']==0
          assert s['episodes_with_two_hop_graph']==10 and s['episodes_with_mid_reasoning_new_gap']==10
          assert s['episodes_with_stale_supersession']==10 and s['episodes_with_preserved_conflict']==10
          assert s['episodes_with_executable_retrieved_procedure']==10
          assert s['malicious_procedure_manifest_rejections']==10 and s['unsafe_retrieved_content_executions']==0
          assert v['decision']=='accepted_bounded_capability' and v['all_required_steps_success'] is True
          assert v['github']['run_id']==32044278188 and v['github']['main_job_success'] is True
          assert v['github']['cross_python_311_success'] and v['github']['cross_python_313_success']
          assert v['github']['integrity_workflows_success'] is True
          assert e['passed'] is True and e['passed_cases']==2 and e['total_cases']==2
          assert all(c['graph_hops_used']>=1 for c in e['cases']) and all(not c['source_failures'] for c in e['cases'])
          assert w['audit']['valid'] is True and w['gate']['passed'] is False
          assert v['readiness']['current']==45.5 and v['readiness']['delta']==1.0
          assert m['coding_agi_engineering_readiness']==45.5 and m['world_w5_gate_passed'] is False
          assert m['trainable_parameter_count_added']==0
          PY
      - name: Run focused release regressions
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=. pytest -q \
            tests/test_r254_cognitive_retrieval.py \
            tests/test_r254_code_knowledge.py \
            tests/test_r254_behavioral_retrieval.py \
            tests/test_r254_cognitive_retrieval_benchmark.py \
            tests/test_r253_external_cognition.py \
            tests/test_r253_operator_catalog.py \
            tests/test_r253_external_cognitive_reflex_benchmark.py \
            tests/test_r252_repository_query.py \
            tests/test_r252_repository_query_benchmark.py
      - name: Create complete repository snapshot
        run: |
          mkdir -p release
          git archive --format=zip --output=release/Nolane-AI-R2.54-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.54-COMPLETE.zip | tee release/Nolane-AI-R2.54-COMPLETE.zip.sha256
          unzip -t release/Nolane-AI-R2.54-COMPLETE.zip >/tmp/unzip-r254.log
          tail -1 /tmp/unzip-r254.log
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.54-COMPLETE
          path: release/*
          if-no-files-found: error
          retention-days: 90
