name: R2.67.1 Fresh Evidence RED-GREEN

on:
  push:
    branches: [r267-1-fresh-evidence-gpt56sol]
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'benchmarks/kfigg/r267_1_genuine_causal_necessity.py'
      - 'research/r267_1_external_cyclic_dot_transfer.py'
      - 'tests/test_r267_1_fresh_evidence.py'
      - '.github/workflows/r267-1-fresh-evidence-redgreen.yml'
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'scripts/r267_1_apply_genuine_necessity_core.py'
      - 'scripts/r267_1_apply_certified_ablation_authority.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply current R2.67.1 authority correction ephemerally when needed
        run: |
          set -euo pipefail
          if ! grep -q "def _examples_have_target_collision" cogcoder/r267_three_probe_causal_composition.py; then
            python scripts/r267_1_apply_genuine_necessity_core.py
            python scripts/r267_1_apply_certified_ablation_authority.py
          fi
          python -m py_compile cogcoder/r267_three_probe_causal_composition.py
      - name: Fresh authored and pinned NumPy evidence
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_fresh_evidence.py
