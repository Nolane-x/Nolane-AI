name: E Acting Restore Authority RED

on:
  push:
    branches:
      - e-acting-restore-authority-red-20260902

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile authority boundary
        run: python -m compileall -q nolane/external_core/execution.py tests/test_refoundation_acting_restore_authority.py
      - name: RED - restore authority must currently fail
        run: python -m pytest -q tests/test_refoundation_acting_restore_authority.py
