name: Refoundation Wave 5AS Repository Surface Carrier

# PR merge-ref verification is owned by the canonical Refoundation workflow.
# This carrier stays branch-scoped so Wave-4 historical CI isolation remains intact.
on:
  push:
    branches:
      - refoundation/epoch0-wave5as-repository-surface

permissions:
  contents: read

concurrency:
  group: refoundation-wave5as-repository-surface-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Verify materialized zero-loss root-history relocation
        run: |
          python scripts/refoundation_migrate_root_history.py --check
          python -m nolane.ai.materialize --check
          python -m nolane.repository.audit --check
      - name: Verify Python source compilation
        run: python -m compileall -q cogcoder nolane scripts
      - name: Run all Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run broad Coding AGI regressions
        run: python -m pytest -q tests/test_coding_agi_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Verify repository surface and tracked-cache hygiene
        shell: bash
        run: |
          set -euo pipefail
          leftovers="$(find . -maxdepth 1 -type f \( -name 'R[0-9]*' -o -name 'CURRENT_ONE_WEIGHT_*' -o -name 'CURRENT_STATUS.md' -o -name 'CHECKPOINT_MANIFEST.json' \) -print)"
          if [ -n "$leftovers" ]; then
            printf 'Historical artifacts remain at repository root:\n%s\n' "$leftovers"
            exit 1
          fi
          tracked_cache="$(git ls-files | grep -E '(^|/)(__pycache__/|\.pytest_cache/|\.mypy_cache/|\.ruff_cache/)|\.py[co]$' || true)"
          if [ -n "$tracked_cache" ]; then
            printf 'Generated cache artifacts are tracked:\n%s\n' "$tracked_cache"
            exit 1
          fi
          git diff --exit-code
