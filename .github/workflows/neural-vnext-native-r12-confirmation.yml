name: Neural vNext Native R12 Confirmation

on:
  push:
    branches:
      - codex/neural-native-r12-neural-causal-residual
    paths:
      - 'model/neural-vnext-native-r12/PRE_CONFIRM_LOCK.json'
      - 'model/neural-vnext-native-r12/evidence/PRIMARY_DEV_REPRO_001.json'
      - 'model/neural-vnext-native-r12/scripts/evaluate_confirmation.py'
      - '.github/workflows/neural-vnext-native-r12-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify frozen R12 source authority
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r12/PRE_CONFIRM_LOCK.json').read_text())
          assert lock['status']=='FROZEN_CONFIRMATION_UNOPENED'
          assert lock['selected_candidate']=='neural_causal_broad'
          assert lock['frozen_candidate']['checkpoint_sha256']=='830cc54af53309757f7558d5725a525766a346984e41e8702e7cc49035c7852c'
          assert lock['confirmation']['indices']==[640,671]
          assert lock['fresh']['indices']==[280,319]
          assert lock['fresh']['opened'] is False
          for relative,expected in lock['frozen_source_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',relative],text=True).strip()
              assert actual==expected,(relative,expected,actual)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Download canonical frozen R12 artifact
        uses: actions/download-artifact@v4
        with:
          name: neural-vnext-native-r12-dev
          path: frozen-r12
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AI
          run-id: 35488892361

      - name: Verify exact canonical R12 artifact
        run: |
          test "$(stat -c %s frozen-r12/r12.pt)" = "284222"
          test "$(sha256sum frozen-r12/r12.pt | awk '{print $1}')" = "830cc54af53309757f7558d5725a525766a346984e41e8702e7cc49035c7852c"
          test "$(sha256sum frozen-r12/r12.manifest.json | awk '{print $1}')" = "5baa476a8e3a56b9f3d9de1ab66c5defa422b783149a3dcd7b5ba68dd3c3808c"
          test "$(sha256sum frozen-r12/r12.dev.json | awk '{print $1}')" = "037bbbf057d44efb4c46d0b107f5b1d983d906cbd1d53012ef24f98f5c14d3dd"

      - name: Compile locked confirmation evaluator
        env:
          PYTHONPATH: model/neural-vnext-native-r12:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r12/scripts/evaluate_confirmation.py

      - name: Open disjoint R12 confirmation court
        id: confirmation
        env:
          PYTHONPATH: model/neural-vnext-native-r12:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r12-confirmation
          set +e
          python model/neural-vnext-native-r12/scripts/evaluate_confirmation.py             --checkpoint frozen-r12/r12.pt             --result r12-confirmation/confirmation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r12-confirmation-640-671
          path: r12-confirmation/confirmation.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce preregistered confirmation verdict
        if: always()
        run: test "${{ steps.confirmation.outputs.exit_code }}" = "0"
