name: R2.52 Full Repository Release Bundle

on:
  push:
    branches: [ main ]
    paths:
      - "R2_52_DELIVERY.md"
      - "R2_52_RELEASE_MANIFEST.json"
      - "R2_51_TO_R2_52_EVOLUTION.md"
      - "research/R2_52_*.json"
      - ".github/workflows/r252-release-bundle.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen release boundary
        run: |
          python - <<'PY'
          import json
          v=json.load(open('research/R2_52_VERIFY_RESULT.json'))
          m=json.load(open('R2_52_RELEASE_MANIFEST.json'))
          p=json.load(open('research/R2_52_PHASE_A_RESULT.json'))
          w=json.load(open('research/R2_52_WORLD_FINAL.json'))
          assert v['decision']=='accepted_bounded_capability'
          assert v['all_required_steps_success'] is True
          assert v['integrity_workflows_success'] is True
          assert v['cross_python_311_success'] is True and v['cross_python_313_success'] is True
          assert p['all_gates_pass'] is True
          assert p['summary']['exact']==6 and p['summary']['false_accepts']==0
          assert p['summary']['selected_three_file_transaction']==6
          assert p['summary']['r251_independent_baseline_exact']==0
          assert p['summary']['global_apply_baseline_exact']==0
          assert v['nolane_world']['audit_valid'] is True
          assert v['nolane_world']['gate_passed'] is False
          assert w['decision']=='NON_CONVERGED_BOUNDED_ACCEPTANCE_CANDIDATE'
          assert v['readiness']['current']==44.5
          assert m['world_w5_gate_passed'] is False
          PY
      - name: Create complete repository snapshot
        run: |
          mkdir -p release
          git archive --format=zip --output=release/Nolane-AI-R2.52-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.52-COMPLETE.zip | tee release/Nolane-AI-R2.52-COMPLETE.zip.sha256
          unzip -t release/Nolane-AI-R2.52-COMPLETE.zip >/tmp/unzip-r252.log
          tail -1 /tmp/unzip-r252.log
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.52-COMPLETE
          path: release/*
          if-no-files-found: error
          retention-days: 90
