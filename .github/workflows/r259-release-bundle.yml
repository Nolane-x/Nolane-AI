name: R2.59 Full Repository Release Bundle

on:
  push:
    branches: [main, r259-release-evidence-gpt56sol]
    paths:
      - 'archive/root-history/historical_r_series/R2_59_DELIVERY.md'
      - 'archive/root-history/historical_r_series/R2_58_TO_R2_59_EVOLUTION.md'
      - 'archive/root-history/historical_r_series/R2_59_PRE_HOSTED_LOCK.json'
      - 'archive/root-history/historical_r_series/R2_59_PHASE_A_RESULT.json'
      - 'archive/root-history/historical_r_series/R2_59_EXTERNAL_TRANSFER.json'
      - 'archive/root-history/historical_r_series/R2_59_VERIFY_RESULT.json'
      - 'archive/root-history/historical_r_series/R2_59_WORLD_FINAL.json'
      - 'archive/root-history/historical_r_series/R2_59_RELEASE_MANIFEST.json'
      - 'archive/root-history/historical_r_series/R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r259-release-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/root-history/historical_r_series/R2_59_DELIVERY.md'
      - 'archive/root-history/historical_r_series/R2_58_TO_R2_59_EVOLUTION.md'
      - 'archive/root-history/historical_r_series/R2_59_PRE_HOSTED_LOCK.json'
      - 'archive/root-history/historical_r_series/R2_59_PHASE_A_RESULT.json'
      - 'archive/root-history/historical_r_series/R2_59_EXTERNAL_TRANSFER.json'
      - 'archive/root-history/historical_r_series/R2_59_VERIFY_RESULT.json'
      - 'archive/root-history/historical_r_series/R2_59_WORLD_FINAL.json'
      - 'archive/root-history/historical_r_series/R2_59_RELEASE_MANIFEST.json'
      - 'archive/root-history/historical_r_series/R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r259-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release test dependency
        run: python -m pip install pytest
      - name: Verify frozen R2.59 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          phase=json.loads(Path('archive/root-history/historical_r_series/R2_59_PHASE_A_RESULT.json').read_text())
          external=json.loads(Path('archive/root-history/historical_r_series/R2_59_EXTERNAL_TRANSFER.json').read_text())
          verify=json.loads(Path('archive/root-history/historical_r_series/R2_59_VERIFY_RESULT.json').read_text())
          world=json.loads(Path('archive/root-history/historical_r_series/R2_59_WORLD_FINAL.json').read_text())
          manifest=json.loads(Path('archive/root-history/historical_r_series/R2_59_RELEASE_MANIFEST.json').read_text())
          assert phase['discovered'] == phase['configurations'] == 3
          assert phase['no_seed_failures'] == phase['seeded_successes'] == 3
          assert phase['probe_validation_exact'] == phase['probe_validation_cases'] == 12
          assert phase['wrong_role_false_accepts'] == 0
          assert phase['global_budget_respected'] is True
          assert phase['max_total_synthesis_candidates_per_full_search'] == 15000
          assert phase['r258_frozen_synthesis_candidates'] == 261169
          assert phase['r259_synthesis_candidates_considered'] == 10943
          assert phase['synthesis_reduction_ratio'] == 23.866307
          assert phase['trainable_parameter_count'] == 0
          assert external['passed'] is True
          assert external['source_exposure'] == 'io_only'
          assert external['host_selected_intervention'] is False
          assert external['intervention_anchor_source'] == 'downstream_need.constants'
          assert external['derived_anchor_values'] == [0.0, 1.0]
          assert external['legal_interventions_enumerated'] == 20
          assert external['no_seed_passed'] is False
          assert external['seeded_passed'] is True
          assert external['probe_validation_exact'] == external['probe_validation_cases'] == 4
          assert external['challenge_exact'] == external['challenge_cases'] == 8
          assert external['heldout_exact'] == external['heldout_cases'] == 24
          assert external['total_synthesis_candidates'] == 8394
          assert external['r258_external_frozen_synthesis_candidates'] == 136969
          assert external['synthesis_reduction_ratio'] == 16.317489
          assert external['source_commit'] == 'f1fbe6769850823a1976ccc28d14cd966130b645'
          assert external['trainable_parameter_count'] == 0
          assert verify['hosted_run_id'] == 32116672446
          assert verify['hosted_run_conclusion'] == 'success'
          assert verify['focused_r259_tests'] == 12
          assert verify['protected_parent_tests'] == 186
          assert verify['hosted_relevant_tests_total'] == 198
          assert verify['source_lock_revision'] == 2
          assert verify['source_lock_verified'] is True
          assert verify['phase_a_recomputed_exact'] is True
          assert verify['cross_python'] == {'3.11':'success','3.13':'success'}
          assert verify['world_w5_passed'] is False
          assert verify['readiness_after'] == 47.8
          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == '776ffd1c4346803c57ddf782e39bcc131e7dedadef0b0c3c2a8183ab88f3f74e'
          assert world['gate']['passed'] is False
          assert world['gate']['score'] == 0
          assert world['active_seconds_credited'] == 0.0
          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['capability_main_merge_sha'] == '9d8779df83751cfb5a93928c1442e169816bc49d'
          assert manifest['exact_tree_sha'] == 'c84b3a393e0b7086395c0e4f5041f0695fc56031'
          assert manifest['readiness'] == 47.8
          assert manifest['trainable_parameter_count'] == 0
          assert manifest['world_w5_passed'] is False
          print('R259_RELEASE_BOUNDARY_OK')
          PY
      - name: Run focused release regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r259_*.py tests/test_r258_*.py
      - name: Create complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.59-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.59-COMPLETE.zip | tee release/Nolane-AI-R2.59-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.59-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.59-COMPLETE
          path: |
            release/Nolane-AI-R2.59-COMPLETE.zip
            release/Nolane-AI-R2.59-COMPLETE.zip.sha256
      - name: Publish release-bundle commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
            'state':'success',
            'context':'r259/release-bundle',
            'description':'R2.59 release boundary, regressions, archive and ZIP integrity passed',
            'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            data=payload,
            headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
            method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
