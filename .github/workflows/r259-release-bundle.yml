name: R2.59 Full Repository Release Bundle

on:
  push:
    branches: [main, r259-active-repository-probes-gpt56sol]
    paths:
      - 'R2_59_DELIVERY.md'
      - 'R2_58_TO_R2_59_EVOLUTION.md'
      - 'R2_59_RELEASE_MANIFEST.json'
      - 'R2_59_PHASE_A_RESULT.json'
      - 'R2_59_EXTERNAL_TRANSFER.json'
      - 'R2_59_VERIFY_RESULT.json'
      - 'R2_59_WORLD_FINAL.json'
      - 'R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r259-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release test dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify frozen R2.59 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          phase = json.loads(Path('R2_59_PHASE_A_RESULT.json').read_text())
          external = json.loads(Path('R2_59_EXTERNAL_TRANSFER.json').read_text())
          verify = json.loads(Path('R2_59_VERIFY_RESULT.json').read_text())
          world = json.loads(Path('R2_59_WORLD_FINAL.json').read_text())
          manifest = json.loads(Path('R2_59_RELEASE_MANIFEST.json').read_text())
          delivery = Path('R2_59_DELIVERY.md').read_text()
          readiness = Path('R2_READINESS_RECALIBRATION.md').read_text()

          s = phase['summary']
          assert phase['all_gates_pass'] is True
          assert s['active_exact'] == 6
          assert s['random_one_probe_exact'] == 1
          assert s['passive_initial_only_exact'] == 0
          assert s['active_gain_over_random'] == 5
          assert s['active_false_accepts'] == 0
          assert s['active_max_selection_oracle_calls'] == 1
          assert s['active_full_verification_cases'] == 2401
          assert s['candidate_identity_invariant'] is True
          assert s['probe_generation_uses_target_outputs'] is False

          assert external['passed'] is True
          assert external['source_id'] == 'numpy:numpy.gcd'
          assert external['source_version'] == '2.4.6'
          assert external['source_exposure'] == 'io_only'
          assert external['candidate_count'] == 4
          assert external['initial_survivors'] == 4
          assert external['active_selection_oracle_calls'] == 1
          assert external['active_exact'] is True
          assert external['random_one_probe_exact'] is False
          assert external['passive_initial_only_exact'] is False
          assert external['selected_probe_partition_count'] == 4
          assert external['selected_probe_largest_partition'] == 1
          assert external['verification_exact'] == external['verification_cases'] == 625
          assert external['active_false_accepts'] == 0
          assert external['probe_generation_uses_target_outputs'] is False

          assert verify['capability_commit'] == '5abcbbb3b5c159519566fdbdbe353f733871614d'
          assert verify['hosted_run_id'] == 32116854204
          assert verify['hosted_main_job_id'] == 95648197603
          assert verify['hosted_main_job'] == 'success'
          assert verify['focused_r259_tests'] == 7
          assert verify['protected_parent_relevant_tests'] == 186
          assert verify['cross_python'] == {'3.11': 'success', '3.13': 'success'}
          assert verify['frozen_phase_a_recomputed'] == 'success'
          assert verify['readiness_before'] == 47.8
          assert verify['readiness_after'] == 48.1
          assert verify['readiness_delta'] == 0.3
          assert verify['world_audit_valid'] is True
          assert verify['world_w5_passed'] is False
          assert verify['world_w5_score'] == 0

          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == '8ec83909d2b5bb48895124e8071135bf0edca9f0187ce908a58cda1d91e5d605'
          assert world['world_id'] == 'world4_e293c77f03754ec4'
          assert world['epoch'] == 6
          assert world['gate']['passed'] is False
          assert world['gate']['score'] == 0
          assert len(world['critical_unknowns']) >= 6

          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['readiness'] == 48.1
          assert manifest['trainable_parameter_count'] == 0
          assert manifest['world_w5_passed'] is False
          assert '48.1/100' in delivery
          assert '## R2.59 — 48.1 / 100' in readiness
          print('R259_RELEASE_BOUNDARY_OK')
          PY
      - name: Run R2.59 focused release regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
      - name: Recompute pinned external transfer during release
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from research.r259_external_active_probe_transfer import run_external_transfer
          expected = json.loads(Path('R2_59_EXTERNAL_TRANSFER.json').read_text())
          result = run_external_transfer(
              lambda a, b: int(np.gcd(a, b)),
              source_id='numpy:numpy.gcd',
              source_version=np.__version__,
          )
          assert np.__version__ == '2.4.6'
          assert result == expected
          print('R259_EXTERNAL_RECOMPUTE_OK')
          PY
      - name: Create complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.59-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.59-COMPLETE.zip | tee release/Nolane-AI-R2.59-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.59-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.59-COMPLETE
          path: |
            release/Nolane-AI-R2.59-COMPLETE.zip
            release/Nolane-AI-R2.59-COMPLETE.zip.sha256
      - name: Publish release-bundle commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success',
              'context': 'r259/release-bundle',
              'description': 'R2.59 release boundary, external recomputation, regressions and ZIP integrity passed',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
