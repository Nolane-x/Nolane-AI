name: C9 Canonical Surface Closure

on:
  push:
    branches:
      - post-epoch0/reasoning-invention-c-v0.0.1

permissions:
  contents: write

concurrency:
  group: c9-canonical-surface-closure
  cancel-in-progress: false

jobs:
  close-surfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact code closure and main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "05f4719b63a2fb21c7c849b98828cf4da7d35d7a"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0cd7e955c53762ba593b4a0e56d90f7a29a2d807"
      - name: Patch canonical C9 surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          cdoc = "CURRENT/REASONING_INVENTION_C_LAYER.md"
          replace_exact(cdoc, '`external.reasoning_invention` is the canonical post-Epoch-0 Reasoning / Invention protocol family at **v0.0.2**.', '`external.reasoning_invention` is the canonical post-Epoch-0 Reasoning / Invention protocol family at **v0.0.3**.')
          replace_exact(cdoc, 'The v0.0.2 cutover is additive. The original `reasoning-invention-v1` wire/state schema is intentionally unchanged, so C1 protocol identities and serialized artifacts remain backward compatible. v0.0.2 adds separate immutable schemas around that spine rather than widening the original objects until they become a monolith.', 'The v0.0.3 cutover is additive. The original `reasoning-invention-v1` wire/state schema and every C8 schema remain unchanged, so prior serialized identities remain backward compatible. v0.0.3 adds the separate `reasoning-episode-v1` temporal protocol rather than widening frontier, control or review artifacts into a mutable monolith.')
          replace_exact(cdoc, 'v0.0.2 turns C1–C7 into a bounded closed reasoning ecology:', 'v0.0.3 composes C1–C9 into a bounded, replayable reasoning ecology:')
          replace_exact(cdoc, '## Global authority invariants\n', '## C9 — Replayable Reasoning Episodes\n\nSchema: `reasoning-episode-v1`.\n\n`nolane.external_core.reasoning_episode` closes the temporal-integrity gap between individually valid C8 artifacts. A `ReasoningEpisode` binds one root frontier, the exact current frontier, immutable initial action/cost limits, an ordered content-addressed transition chain, an optional terminal C8 control decision and a stable episode key.\n\nEvery `ReasoningFrontierTransition` binds the exact generation, previous frontier, full next frontier, C8 control decision, selected Pareto-authorized action, derived semantic frontier delta, observed cost and overrun state. A transition is admitted only from the current frontier and current derived budget; stale control decisions, reused control/action authority and cross-frontier actions fail closed.\n\n### Continuity and evidence\n\nWithin one episode the `reasoning_receipt_id`, objective, Cognitive Library digest, hard constraints and branch budget are immutable. Changing any of them starts a new epistemic context rather than laundering a context switch into an ordinary reasoning step. Unknowns, rivals and assumptions may evolve only through an evidence-carrying derived delta. A stable hypothesis whose rival content changes is recorded as a revision rather than silently retired and reintroduced.\n\n### Budget conservation\n\nSpent actions and cost are derived from the transition chain, never trusted as caller-supplied counters. Estimated cost must fit before a transition is authorized; observed cost is recorded without clipping. An observed overrun is preserved as evidence and terminalizes the episode as `ABSTAINED_BUDGET_OVERRUN`. Exact exhaustion still requires an explicit zero-budget C8 terminal decision, so compute exhaustion cannot masquerade as epistemic success.\n\n### Replay authority\n\n`to_state()` serializes the root plus ordered journal. `from_state()` replays that journal and requires the reconstructed current frontier, budget, terminal decision, status and derived identities to match exactly. Forged snapshots, skipped generations, duplicate authority consumption, non-canonical deltas and stale replay prefixes are rejected.\n\nEpisode statuses are deliberately limited to `ACTIVE`, `HALTED_NO_FURTHER_VALUE`, `ABSTAINED_UNRESOLVED` and `ABSTAINED_BUDGET_OVERRUN`. There is no `ACCEPTED`, `SUCCESS` or `PROMOTED` state. C9 is reasoning-history authority only; it is not D planning authority, E execution authority, Cognitive Library write authority or Assurance.\n\n' + '## Global authority invariants\n')
          replace_exact(cdoc, 'The component version is `0.0.2` while schemas remain independently versioned:', 'The component version is `0.0.3` while schemas remain independently versioned:')
          replace_exact(cdoc, '| `reasoning_meta_learning.py` | `reasoning-meta-learning-v1` |\n| `reasoning_evaluation.py` | existing C7 evaluation schema |', '| `reasoning_meta_learning.py` | `reasoning-meta-learning-v1` |\n| `reasoning_episode.py` | `reasoning-episode-v1` |\n| `reasoning_evaluation.py` | existing C7 evaluation schema |')
          replace_exact(cdoc, 'The v1 core schema is intentionally retained during the component revision cutover so old C1 serialized states and content identities do not change merely because C8 exists.', 'The v1 core schema and all C8 schemas are intentionally retained during the component revision cutover so earlier serialized states and content identities do not change merely because C9 exists.')
          replace_exact(cdoc, 'C1–C8 reject, as applicable:', 'C1–C9 reject, as applicable:')
          replace_exact(cdoc, '- meta-learning bundles too small to compare behavior;\n- non-canonical restored state.', '- meta-learning bundles too small to compare behavior;\n- stale frontier/control/budget authority and reused control or action identities;\n- episode continuity drift across objective, receipt, library, constraints or branch budget;\n- evidence-free frontier mutation, forged frontier deltas and skipped generations;\n- caller-invented spent-budget counters or replay states inconsistent with the transition journal;\n- continued reasoning authority after observed budget overrun;\n- non-canonical restored state.')
          replace_exact(cdoc, '- C7 evaluation supplies outcome evidence to descriptive meta-learning.', '- C7 evaluation supplies outcome evidence to descriptive meta-learning;\n- C9 episodes consume exact C8 frontier/control/action identities and emit replayable transition history without executing the selected action.')
          replace_exact(cdoc, 'C8 was developed RED -> GREEN. The closure gate requires:\n\n1. coherent `external.reasoning_invention == 0.0.2` across runtime core, evaluation and canonical revision map;\n2. canonical round-trip and forged-ID rejection for new artifacts;\n3. branch-budget and structural-rival constraints;\n4. Pareto/order-invariant metacontrol;\n5. continue/halt/abstain fail-closed semantics;\n6. fresh-context partition and anti-spec-gaming gates;\n7. descriptive-only meta-learning;\n8. source scans preventing mutable C/Assurance/model authority backdoors;\n9. exact-head repository Refoundation gates on Python 3.11 and 3.13;\n10. resynchronization with latest `main` before certification if the base advances.', 'C8 and C9 were developed RED -> GREEN. The closure gate requires:\n\n1. coherent `external.reasoning_invention == 0.0.3` across all Reasoning/Invention modules and the canonical revision map;\n2. canonical round-trip and forged-ID rejection for every C8/C9 artifact;\n3. branch-budget and structural-rival constraints;\n4. Pareto/order-invariant metacontrol;\n5. continue/halt/abstain fail-closed semantics;\n6. fresh-context partition and anti-spec-gaming gates;\n7. descriptive-only meta-learning;\n8. exact frontier-generation continuity and stale control/action rejection;\n9. transition-derived budget conservation, observed-overrun terminalization and critical-unknown preservation;\n10. root-plus-journal replay that rejects forged current snapshots, status, deltas or counters;\n11. source scans preventing mutable C/Assurance/model/execution authority backdoors;\n12. exact-head repository Refoundation gates on Python 3.11 and 3.13 plus resynchronization with latest `main` before certification if the base advances.')

          external = "CURRENT/EXTERNAL_CORE.md"
          replace_exact(external, '`external.reasoning_invention` is canonical-native at **v0.0.2** as the immutable protocol family for C. Reasoning / Invention. The original `reasoning-invention-v1` schema is intentionally retained, preserving C1 serialized identities while v0.0.2 adds independently content-addressed frontier, metacontrol, fresh-review, meta-learning and closed-loop evaluation envelopes. It does not replace Cognitive Library, Candidate Synthesis, Capability Acquisition, Causal, Experimentation, Transfer/Meta or Assurance, and it owns no write-through lifecycle authority.', '`external.reasoning_invention` is canonical-native at **v0.0.3** as the immutable protocol family for C. Reasoning / Invention. The original `reasoning-invention-v1` and C8 schemas are intentionally retained, while v0.0.3 adds the independently content-addressed `reasoning-episode-v1` temporal/replay envelope. It does not replace Cognitive Library, Candidate Synthesis, Capability Acquisition, Causal, Experimentation, Transfer/Meta, D Goal/Design, E Acting or Assurance, and it owns no write-through lifecycle authority.')
          replace_exact(external, 'v0.0.2 adds a bounded **Reasoning Ecology** around that spine.', 'v0.0.3 retains the bounded **Reasoning Ecology** introduced by C8 around that spine.')
          replace_exact(external, '`reasoning-review-v1` provides fresh-context adversarial review envelopes with producer/reviewer and session separation, auditable withheld-rationale boundaries, required checks, reproduced evidence and explicit specification-gaming findings. A scope-supported review cannot contain objections, counterexamples or blocking gaming findings and does not mint Assurance. `reasoning-meta-learning-v1` compiles C7-linked reasoning-action outcomes into descriptive learning evidence such as decision correctness, information efficiency, regressions, generalization and robustness; it exposes no policy-update, model-write, Cognitive Library registration, promotion or transfer-acceptance path.', '`reasoning-review-v1` provides fresh-context adversarial review envelopes with producer/reviewer and session separation, auditable withheld-rationale boundaries, required checks, reproduced evidence and explicit specification-gaming findings. A scope-supported review cannot contain objections, counterexamples or blocking gaming findings and does not mint Assurance. `reasoning-meta-learning-v1` compiles C7-linked reasoning-action outcomes into descriptive learning evidence such as decision correctness, information efficiency, regressions, generalization and robustness; it exposes no policy-update, model-write, Cognitive Library registration, promotion or transfer-acceptance path.' + '\n\nC9 adds replayable reasoning episodes above those immutable C8 objects. `reasoning-episode-v1` binds an exact root/current frontier, monotonic generation, Pareto-authorized selected actions, evidence-carrying semantic frontier deltas and transition-derived action/cost budgets. It rejects stale frontier/control authority, duplicate action consumption, context drift and forged replay snapshots. Observed cost overruns are recorded rather than clipped and terminalize as fail-closed budget-overrun abstention; exact exhaustion still requires an explicit C8 halt/abstain decision. Episode status never means acceptance, promotion or successful execution.')
          replace_exact(external, '`nolane.external_core.reasoning_evaluation` closes the fixed-budget evaluation loop for Reasoning/Invention v0.0.2.', '`nolane.external_core.reasoning_evaluation` closes the fixed-budget evaluation loop for Reasoning/Invention v0.0.3.')

          specs = "nolane/metadata/_component_specs.py"
          replace_exact(specs, '"evidence-bound invention plus bounded epistemic frontier, Pareto metacontrol, fresh-context adversarial review and descriptive meta-learning evidence"', '"evidence-bound invention, bounded epistemic frontier, Pareto metacontrol, fresh-context adversarial review, descriptive meta-learning and replayable budget-conserving reasoning episodes"')

          status = "nolane/metadata/implementation_status.py"
          replace_exact(status, '"Native stateless post-Epoch-0 Reasoning/Invention protocol spine for evidence-bound hypotheses, falsification plans, independent challenge, deterministic Pareto frontiers, capability-gap envelopes and destination-bound transfer intents. It owns canonical protocol identity only: Cognitive Library registration, Capability Acquisition lifecycle, Transfer/Meta acceptance, Assurance and neural mutation remain separate authorities; Nolane World 0.12.0 is design provenance only."', '"Native post-Epoch-0 Reasoning/Invention family for evidence-bound hypotheses, deterministic Pareto reasoning, bounded epistemic frontiers, fresh-context challenge, descriptive meta-learning and replayable reasoning episodes with monotonic generations, stale-authority fencing and transition-derived budget conservation. It owns reasoning protocol and trajectory identity only: Cognitive Library registration, Capability Acquisition lifecycle, Transfer/Meta acceptance, D Goal/Design, E execution, Assurance and neural mutation remain separate authorities; Nolane World 0.12.0 is design provenance only."')
          PY
      - name: Verify canonical surfaces and C9 metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m compileall -q nolane/metadata nolane/external_core
          python -m pytest -q \
            tests/test_refoundation_post_epoch0_reasoning_episode.py \
            tests/test_refoundation_post_epoch0_reasoning_episode_adversarial.py \
            tests/test_refoundation_post_epoch0_reasoning_invention_metadata.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py
          grep -q 'reasoning-episode-v1' CURRENT/REASONING_INVENTION_C_LAYER.md
          grep -q 'canonical-native at \*\*v0.0.3\*\*' CURRENT/EXTERNAL_CORE.md
          test "$(grep -c '## C9 — Replayable Reasoning Episodes' CURRENT/REASONING_INVENTION_C_LAYER.md)" = 1
          git diff --check
      - name: Commit canonical surface closure and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nolane C9 Surface Closure"
          git config user.email "c9-surface@users.noreply.github.com"
          rm .github/workflows/c9-canonical-surface-closure.yml
          git add -A
          git commit -m "docs: close C9 canonical reasoning surfaces"
          git push origin HEAD:post-epoch0/reasoning-invention-c-v0.0.1
