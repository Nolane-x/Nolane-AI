name: C11 Final Closure macOS

on:
  push:
    branches:
      - post-epoch0/reasoning-invention-c-v0.0.1
    paths:
      - .github/workflows/c11-final-closure-macos.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: post-epoch0/reasoning-invention-c-v0.0.1

      - name: Guard exact staging ancestry and main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5c08a78619cd0227510978264d111015e0729b9e"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "608411cba7b8ecdcb35a4881903459fcb9680b00"

      - name: Close C11 revision and canonical surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          stale = (
              "tests/test_refoundation_post_epoch0_reasoning_episode.py",
              "tests/test_refoundation_post_epoch0_reasoning_invention.py",
              "tests/test_refoundation_post_epoch0_reasoning_invention_evaluation.py",
              "tests/test_refoundation_post_epoch0_reasoning_invention_metadata.py",
              "tests/test_refoundation_post_epoch0_reasoning_metacontrol.py",
              "tests/test_refoundation_post_epoch0_reasoning_policy_evolution.py",
          )
          for name in stale:
              p = Path(name)
              s = p.read_text(encoding="utf-8")
              if '"0.0.4"' not in s:
                  raise SystemExit(f"{name}: stale revision literal missing")
              p.write_text(s.replace('"0.0.4"', '"0.0.5"'), encoding="utf-8")

          def one(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if s.count(old) != 1:
                  raise SystemExit(f"{path}: guard mismatch for {old[:70]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          cdoc = "CURRENT/REASONING_INVENTION_C_LAYER.md"
          for old, new in (
              ("protocol family at **v0.0.4**.", "protocol family at **v0.0.5**."),
              ("The v0.0.4 cutover is additive. The original `reasoning-invention-v1` wire/state schema and every C8 schema remain unchanged, so prior serialized identities remain backward compatible. v0.0.4 retains the separate `reasoning-episode-v1` temporal protocol and adds `reasoning-policy-evolution-v1` rather than widening frontier, control or review artifacts into a mutable monolith.", "The v0.0.5 cutover is additive. Existing C1–C10 schemas remain unchanged for backward-compatible identity. v0.0.5 adds `reasoning-policy-qualification-v1` as a separate evidence protocol rather than widening policy evolution into a mutable router or governor."),
              ("v0.0.4 composes C1–C10 into a bounded, replayable reasoning ecology:", "v0.0.5 composes C1–C11 into a bounded, replayable reasoning ecology:"),
              ("The component version is `0.0.4` while schemas remain independently versioned:", "The component version is `0.0.5` while schemas remain independently versioned:"),
              ("| `reasoning_policy_evolution.py` | `reasoning-policy-evolution-v1` |", "| `reasoning_policy_evolution.py` | `reasoning-policy-evolution-v1` |\n| `reasoning_policy_qualification.py` | `reasoning-policy-qualification-v1` |"),
              ("C1–C10 reject, as applicable:", "C1–C11 reject, as applicable:"),
              ("C8–C10 were developed RED -> GREEN. The closure gate requires:", "C8–C11 were developed RED -> GREEN. The closure gate requires:"),
              ("1. coherent `external.reasoning_invention == 0.0.4` across all Reasoning/Invention modules and the canonical revision map;", "1. coherent `external.reasoning_invention == 0.0.5` across all Reasoning/Invention modules and the canonical revision map;"),
          ):
              one(cdoc, old, new)
          p = Path(cdoc)
          s = p.read_text(encoding="utf-8")
          marker = "\n## Non-goals\n"
          if s.count(marker) != 1:
              raise SystemExit("C doc Non-goals marker mismatch")
          c11 = "\n## C11 — Counterfactual Policy Qualification\n\nSchema: `reasoning-policy-qualification-v1`.\n\nC11 binds parent/candidate policy outcomes to exact externally supplied `PolicyTrialContext` snapshots and exact C10 holdout authority. `MatchedPolicyTrial` derives the effect vector rather than trusting caller attribution. `PolicyRegimeQualification` requires multiple distinct-task matched trials, blocks any tail regression, preserves separate Pareto dimensions, and admits no wildcard regime matching.\n\n`PolicyApplicabilityReceipt` returns only `QUALIFIED_FOR_CONTEXT` or fail-closed `ABSTAIN_OUT_OF_SCOPE`. Qualification requires an already externally adopted C10 policy and remains evidence-only: it cannot route a current policy, create adoption/rollback authority, mutate D/E, write Truth/Memory, mint Assurance, or expand caller reasoning budgets.\n"
          p.write_text(s.replace(marker, c11 + marker, 1), encoding="utf-8")

          ext = "CURRENT/EXTERNAL_CORE.md"
          one(ext, "`external.reasoning_invention` is canonical-native at **v0.0.4** as the immutable protocol family for C. Reasoning / Invention. The original `reasoning-invention-v1` and C8 schemas are intentionally retained, while v0.0.4 retains the independently content-addressed `reasoning-episode-v1` temporal/replay envelope and adds governed `reasoning-policy-evolution-v1`.", "`external.reasoning_invention` is canonical-native at **v0.0.5** as the immutable protocol family for C. Reasoning / Invention. Existing C1–C10 schemas are retained, while v0.0.5 adds the independently content-addressed `reasoning-policy-qualification-v1` evidence protocol.")
          one(ext, "v0.0.4 retains the bounded **Reasoning Ecology** introduced by C8 around that spine.", "v0.0.5 retains the bounded **Reasoning Ecology** introduced by C8 around that spine.")
          one(ext, "`nolane.external_core.reasoning_evaluation` closes the fixed-budget evaluation loop for Reasoning/Invention v0.0.4.", "`nolane.external_core.reasoning_evaluation` closes the fixed-budget evaluation loop for Reasoning/Invention v0.0.5.")
          p = Path(ext)
          s = p.read_text(encoding="utf-8")
          anchor = "C10 adds governed metareasoning policy evolution without creating self-modification authority. `reasoning-policy-evolution-v1` binds immutable one-step policy lineage, constraint-only budget/action-kind tightening, disjoint development/holdout evidence, Pareto shadow evaluation, self-contained fresh-context review provenance, and exact externally authorized adoption/rollback. Reasoning/Invention cannot self-authorize, maintain a mutable current-policy governor, relax caller safety bounds, or treat policy adoption as Assurance."
          if s.count(anchor) != 1:
              raise SystemExit("External Core C10 anchor mismatch")
          c11e = "C11 adds exact-context counterfactual policy qualification: matched holdout trials, derived effect vectors, exact regime scope, tail-regression blocking and fail-closed `ABSTAIN_OUT_OF_SCOPE` applicability evidence. It requires an already externally adopted C10 policy and grants no routing, execution or Assurance authority."
          p.write_text(s.replace(anchor, anchor + "\n\n" + c11e, 1), encoding="utf-8")

          one("nolane/metadata/_component_specs.py", '"evidence-bound invention, bounded epistemic frontier, Pareto metacontrol, fresh-context adversarial review, descriptive meta-learning, replayable budget-conserving reasoning episodes, and governed policy evolution with exact external authorization"', '"evidence-bound invention, bounded epistemic frontier, Pareto metacontrol, fresh-context adversarial review, descriptive meta-learning, replayable budget-conserving reasoning episodes, governed policy evolution with exact external authorization, and exact-context counterfactual policy qualification with tail-regression blocking and fail-closed scope abstention"')
          one("nolane/metadata/implementation_status.py", "and governed policy evolution with exact external authorization. It owns reasoning protocol, trajectory and policy-proposal identity only:", "governed policy evolution with exact external authorization, and exact-context counterfactual policy qualification with fail-closed scope evidence. It owns reasoning protocol, trajectory, policy-proposal and qualification-evidence identity only:")
          PY

      - name: Verify focused and full Refoundation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m compileall -q nolane
          python -m pytest -q \
            tests/test_refoundation_post_epoch0_reasoning_policy_qualification.py \
            tests/test_refoundation_post_epoch0_reasoning_policy_qualification_adversarial.py \
            tests/test_refoundation_post_epoch0_reasoning_v004_revision.py \
            tests/test_refoundation_post_epoch0_reasoning_v005_revision.py \
            tests/test_refoundation_post_epoch0_reasoning_episode.py \
            tests/test_refoundation_post_epoch0_reasoning_invention.py \
            tests/test_refoundation_post_epoch0_reasoning_invention_evaluation.py \
            tests/test_refoundation_post_epoch0_reasoning_invention_metadata.py \
            tests/test_refoundation_post_epoch0_reasoning_metacontrol.py \
            tests/test_refoundation_post_epoch0_reasoning_policy_evolution.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py
          python -m pytest -q tests/test_refoundation_*.py

      - name: Commit closure and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/c11-final-closure.yml
          rm -f .github/workflows/c11-final-closure-macos.yml
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git add -A
          git commit -m "test/docs: close C11 v0.0.5 revision and canonical surfaces"
          git push origin HEAD:post-epoch0/reasoning-invention-c-v0.0.1
