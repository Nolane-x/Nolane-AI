name: R2.64 Hosted TDD RED Contract

on:
  push:
    branches: [r264-learned-contextual-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Run R2.64 RED contract before production module exists
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_hosted_red_contract.py
