name: Neural vNext Native R8 Dev

on:
  push:
    branches:
      - codex/neural-native-r8-belief-correction
    paths:
      - 'model/neural-vnext-native-r8/**'
      - '.github/workflows/neural-vnext-native-r8-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r8/**'
      - '.github/workflows/neural-vnext-native-r8-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r8-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R8 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r8:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r8/*.py model/neural-vnext-native-r8/scripts/*.py model/neural-vnext-native-r8/tests/*.py
          python -m pytest -q model/neural-vnext-native-r8/tests
      - name: Run frozen-parent R8 deterministic dev court
        env:
          PYTHONPATH: model/neural-vnext-native-r8:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r8-dev
          python model/neural-vnext-native-r8/scripts/evaluate_r8_dev.py --manifest r8-dev/r8.manifest.json --dev-result r8-dev/r8.dev.json
      - name: Enforce fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r8/PREDEV_LOCK.json').read_text())
          gate=json.loads(Path('model/neural-vnext-native-r8/FRESH_GATE_PREREGISTRATION.json').read_text())
          manifest=json.loads(Path('r8-dev/r8.manifest.json').read_text())
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert lock['benchmark']['fresh_indices']==[200,239]
          assert gate['fresh']['opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['status']=='R8_DEV_ELIGIBLE_FRESH_UNOPENED'
          PY
      - name: Upload deterministic development authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r8-dev
          path: |
            r8-dev/r8.manifest.json
            r8-dev/r8.dev.json
          if-no-files-found: error
          retention-days: 90
