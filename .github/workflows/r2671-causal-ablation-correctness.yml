name: R2.67.1 Causal Ablation Correctness

on:
  push:
    branches: [r2671-causal-ablation-correctness-gpt56sol]
    paths:
      - 'tests/test_r2671_*.py'
      - '.github/workflows/r2671-causal-ablation-correctness.yml'
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 parent safety first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Independent R2.67.1 challenger contracts against production merge-ref
        run: PYTHONPATH=. python -m pytest -q tests/test_r2671_*.py
