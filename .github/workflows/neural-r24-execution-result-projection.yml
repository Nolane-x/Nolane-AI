name: Neural R2.4 Execution Result Projection

on:
  push:
    branches:
      - neural-r24-execution-result-projection-gpt56sol
  pull_request:
    paths:
      - "nolane/external_core/**"
      - "cogcoder/organization/**"
      - "tests/test_execution_result_projection.py"
      - "tests/test_execution_task_completion_projection.py"
      - "tests/test_execution_post_inference_task_authority.py"
      - "tests/test_execution_post_inference_neural_version_authority.py"
      - "tests/test_execution_post_inference_backend_checkpoint_authority.py"
      - "tests/test_execution_post_inference_context_frontier_authority.py"
      - ".github/workflows/neural-r24-execution-result-projection.yml"

permissions:
  contents: read

jobs:
  result-projection-contract:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile execution result projection surface
        run: python -m compileall -q nolane/external_core cogcoder/organization
      - name: Run execution result projection contract
        run: >-
          python -m pytest -q
          tests/test_execution_result_projection.py
          tests/test_execution_task_completion_projection.py
          tests/test_execution_post_inference_task_authority.py
          tests/test_execution_post_inference_neural_version_authority.py
          tests/test_execution_post_inference_backend_checkpoint_authority.py
          tests/test_execution_post_inference_context_frontier_authority.py
