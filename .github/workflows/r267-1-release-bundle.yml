name: R2.67.1 Full Repository Release Bundle

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'R2_67_1_PRE_HOSTED_LOCK.json'
      - 'R2_67_1_PHASE_A_RESULT.json'
      - 'R2_67_1_EXTERNAL_TRANSFER.json'
  pull_request:
    branches: [main]
    paths:
      - 'R2_67_1_PRE_HOSTED_LOCK.json'
      - 'R2_67_1_PHASE_A_RESULT.json'
      - 'R2_67_1_EXTERNAL_TRANSFER.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify frozen R2.67.1 release boundary
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          required=(
              'R2_67_1_PRE_HOSTED_LOCK.json',
              'R2_67_1_PHASE_A_RESULT.json',
              'R2_67_1_EXTERNAL_TRANSFER.json',
              'cogcoder/r267_three_probe_causal_composition.py',
              'benchmarks/kfigg/r267_1_genuine_three_probe.py',
              'research/r267_1_external_cyclic_dot_transfer.py',
              'tests/test_r267_1_authority_boundaries.py',
              'tests/test_r267_1_correctness_hotfix.py',
              'tests/test_r267_1_evidence.py',
              'tests/test_r267_1_no_collision_failclosed.py',
              'tests/test_r267_1_preselection_receipt_units.py',
              'tests/test_r267_1_triangle_min_robustness.py',
              '.github/workflows/r267-1-canonical-gate.yml',
              '.github/workflows/r267-1-release-bundle.yml',
          )
          for path in required:
              assert Path(path).is_file(), path
          lock=json.loads(Path('R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          assert lock['parent_release_commit'] == '43b43ce4b324b0d74357957af18dd0f60b1cb85e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['frozen_evidence_changes_after_lock_forbidden'] is True
          assert lock['authority_corrections']['subset_specific_ablation_fields'] is True
          assert lock['authority_corrections']['uncertified_search_miss_fails_closed'] is True
          assert lock['authority_corrections']['preselection_probe_cases_zero_without_selected_triplet'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R267_1_RELEASE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and pinned external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer
          phase=run_benchmark()
          external=run_external_transfer(np.dot, source_id='numpy.dot', source_version=np.__version__)
          assert np.__version__ == '2.4.6'
          assert phase == json.loads(Path('R2_67_1_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_67_1_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] and external['passed']
          assert external['oracle_accounting_exact']
          print('R267_1_RELEASE_EVIDENCE_OK')
          PY
      - name: Run R2.67.1 and protected lineage
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Create and verify complete repository snapshot
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.67.1-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.67.1-COMPLETE.zip | tee release/Nolane-AI-R2.67.1-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.67.1-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required={
              'R2_67_1_PRE_HOSTED_LOCK.json',
              'R2_67_1_PHASE_A_RESULT.json',
              'R2_67_1_EXTERNAL_TRANSFER.json',
              'cogcoder/r267_three_probe_causal_composition.py',
              'benchmarks/kfigg/r267_1_genuine_three_probe.py',
              'research/r267_1_external_cyclic_dot_transfer.py',
              'tests/test_r267_1_triangle_min_robustness.py',
              '.github/workflows/r267-1-canonical-gate.yml',
              '.github/workflows/r267-1-release-bundle.yml',
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.67.1-COMPLETE.zip') as zf:
              names=set(zf.namelist())
          missing=required-names
          assert not missing, sorted(missing)
          print('R267_1_COMPLETE_ZIP_OK', len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.67.1-COMPLETE
          path: |
            release/Nolane-AI-R2.67.1-COMPLETE.zip
            release/Nolane-AI-R2.67.1-COMPLETE.zip.sha256
      - name: Publish release-bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r267.1/release-bundle',
              'description':'Corrected R2.67.1 frozen authority, exact evidence, protected lineage and COMPLETE ZIP passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R267_1_RELEASE_STATUS_PUBLISHED')
          PY
