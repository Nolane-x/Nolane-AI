name: Neural vNext Native R14 Dev

on:
  push:
    branches:
      - codex/neural-native-r14-belief-tree-causal
    paths:
      - 'model/neural-vnext-native-r14/**'
      - '.github/workflows/neural-vnext-native-r14-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r14/**'
      - '.github/workflows/neural-vnext-native-r14-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r14-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted R11 parent authority
        run: |
          test "$(git hash-object model/neural-vnext-native-r11/ACCEPTED_AUTHORITY.json)" = "f8e8fac794fd339e261e9245ef7b46e1367683f1"
          test "$(git hash-object model/neural-vnext-native-r11/causal_version_space.py)" = "b13657c388d589751919be001d618f6fac2b0643"
          test "$(git hash-object model/neural-vnext-native-r11/causal_runtime.py)" = "9ae28255bd417094b262df948d62860f61116a01"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('model/neural-vnext-native-r11/ACCEPTED_AUTHORITY.json').read_text())
          assert a['status']=='ACCEPTED'
          assert a['successor']['selected_candidate']=='causal_horizon1'
          assert a['successor']['selected_config']=={'horizon':1,'max_support':3}
          assert a['invariants']['fresh_240_279_consumed'] is True
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R14 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r14:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r14/*.py model/neural-vnext-native-r14/scripts/*.py model/neural-vnext-native-r14/tests/*.py
          python -m pytest -q model/neural-vnext-native-r14/tests
      - name: Run accepted-R11 R14 deterministic dev court
        env:
          PYTHONPATH: model/neural-vnext-native-r14:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r14-dev
          python model/neural-vnext-native-r14/scripts/evaluate_r14_dev.py --manifest r14-dev/r14.manifest.json --dev-result r14-dev/r14.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r14/PREDEV_LOCK.json').read_text())
          gate=json.loads(Path('model/neural-vnext-native-r14/FRESH_GATE_PREREGISTRATION.json').read_text())
          manifest=json.loads(Path('r14-dev/r14.manifest.json').read_text())
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert lock['benchmark']['confirmation_indices']==[768,799]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert gate['fresh']['opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['status']=='R14_DEV_ELIGIBLE_FRESH_UNOPENED'
          PY
      - name: Upload frozen R14 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r14-dev
          path: |
            r14-dev/r14.manifest.json
            r14-dev/r14.dev.json
          if-no-files-found: error
          retention-days: 90
