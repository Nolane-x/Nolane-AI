name: R2.69 Lazy Scratch Hotfix

on:
  push:
    branches: [r269-autonomous-transfer-meta-learning-kernel-gpt56sol]
    paths:
      - '.github/workflows/r269-lazy-scratch-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r269-lazy-scratch-hotfix
  cancel-in-progress: false

jobs:
  red-green-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verifier dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Confirm exact hosted RED
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r269_transfer_governor.py::test_successful_transfer_defers_full_scratch_materialization_and_reduces_total_search_work > /tmp/r269-red.log 2>&1
          code=$?
          set -e
          cat /tmp/r269-red.log
          test "$code" -ne 0
          grep -q 'test_successful_transfer_defers_full_scratch_materialization_and_reduces_total_search_work' /tmp/r269-red.log
      - name: Apply true lazy scratch materialization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cogcoder/r269_transfer_runtime.py')
          text = path.read_text()

          marker = """    return rows\n\n\ndef _predict(expr: Expr, context: Mapping[str, object]) -> tuple[bool, int | float | None]:\n"""
          helper = """    return rows\n\n\ndef _scratch_information_floor(\n    signature: PublicTaskSignature,\n    config: MetaLearningConfig,\n) -> list[_Hypothesis]:\n    \"\"\"Materialize only a bounded shallow scratch sentinel for transfer-query safety.\n\n    These hypotheses are allowed to score whether a transfer probe also partitions\n    a generic scratch space, but they are never selection authority.  Full scratch\n    is materialized only for cold scratch or after transfer is abandoned.\n    \"\"\"\n    floor_config = MetaLearningConfig(\n        max_diagnostic_queries=config.max_diagnostic_queries,\n        transfer_candidate_cap=config.transfer_candidate_cap,\n        scratch_candidate_cap=min(config.scratch_candidate_cap, 32),\n        scratch_max_depth=min(config.scratch_max_depth, 1),\n        min_scratch_partitions=config.min_scratch_partitions,\n    )\n    return _scratch_hypotheses(signature, floor_config)\n\n\ndef _predict(expr: Expr, context: Mapping[str, object]) -> tuple[bool, int | float | None]:\n"""
          assert marker in text, 'helper insertion marker drifted'
          text = text.replace(marker, helper, 1)

          old_init = """    transfer = _transfer_hypotheses_many(compatible, signature, config.transfer_candidate_cap)\n    scratch = _scratch_hypotheses(signature, config)\n    transfer_initial = len(transfer)\n    scratch_initial = len(scratch)\n    ledger = SharedObservationLedger(signature)\n"""
          new_init = """    transfer = _transfer_hypotheses_many(compatible, signature, config.transfer_candidate_cap)\n    transfer_initial = len(transfer)\n    scratch_materialized = not bool(transfer)\n    scratch = (\n        _scratch_hypotheses(signature, config)\n        if scratch_materialized\n        else _scratch_information_floor(signature, config)\n    )\n    scratch_initial = len(scratch)\n    ledger = SharedObservationLedger(signature)\n"""
          assert old_init in text, 'episode initialization marker drifted'
          text = text.replace(old_init, new_init, 1)

          old_abandon = """            if not transfer and before_priors:\n                contradictions += 1\n                abandoned = True\n                # All already purchased diagnostic observations are eligible for\n                # scratch continuation. This is the concrete shared-evidence\n                # credit, not an extra oracle call.\n                reused_count = sum(observation.phase == 'diagnostic' for observation in ledger.observations)\n        scratch = _filter(scratch, semantic, row.observed)\n"""
          new_abandon = """            if not transfer and before_priors:\n                contradictions += 1\n                abandoned = True\n                # All already purchased diagnostic observations are eligible for\n                # scratch continuation. This is the concrete shared-evidence\n                # credit, not an extra oracle call.  Only now do we materialize\n                # the full scratch frontier and replay already purchased evidence.\n                reused_count = sum(observation.phase == 'diagnostic' for observation in ledger.observations)\n                full_scratch = _scratch_hypotheses(signature, config)\n                scratch_initial = len(full_scratch)\n                scratch = full_scratch\n                scratch_materialized = True\n                for observation in ledger.observations:\n                    if (\n                        observation.phase != 'diagnostic'\n                        or observation.status != 'ok'\n                        or observation.observed is None\n                    ):\n                        continue\n                    observed_context = dict(\n                        zip(signature.role_names, observation.context_values, strict=True)\n                    )\n                    scratch = _filter(scratch, observed_context, observation.observed)\n                continue\n        scratch = _filter(scratch, semantic, row.observed)\n"""
          assert old_abandon in text, 'transfer-abandonment marker drifted'
          text = text.replace(old_abandon, new_abandon, 1)

          old_select = """    elif len(scratch) == 1 and ledger.physical_oracle_calls >= 1:\n        selected = scratch[0]\n        mode = 'scratch_after_transfer' if abandoned else 'scratch'\n"""
          new_select = """    elif scratch_materialized and len(scratch) == 1 and ledger.physical_oracle_calls >= 1:\n        selected = scratch[0]\n        mode = 'scratch_after_transfer' if abandoned else 'scratch'\n"""
          assert old_select in text, 'scratch-selection marker drifted'
          text = text.replace(old_select, new_select, 1)

          path.write_text(text)
          PY
      - name: Focused GREEN
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r269_transfer_governor.py \
            tests/test_r269_negative_transfer.py \
            tests/test_r269_shared_evidence.py \
            tests/test_r269_multi_prior_adjudication.py \
            tests/test_r269_benchmark.py
      - name: Full R2.69 GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
      - name: Materialize only on exact unchanged branch head
        env:
          BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          git rm .github/workflows/r269-lazy-scratch-hotfix.yml
          git add cogcoder/r269_transfer_runtime.py
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(r269): defer full scratch materialization on successful transfer'
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$GITHUB_SHA"
          git push origin HEAD:"$BRANCH"
