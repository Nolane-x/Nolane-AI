name: R2.67.1 Preselection Receipt Units

on:
  push:
    branches: [validation-r267-1-preselection-receipt-units-sol]
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 safety first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply peer-authored R2.67.1 patches ephemerally
        run: |
          python scripts/r267_1_apply_genuine_necessity_core.py
          python scripts/r267_1_apply_certified_ablation_authority.py
      - name: Challenge preselection receipt case units
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_preselection_receipt_units.py
