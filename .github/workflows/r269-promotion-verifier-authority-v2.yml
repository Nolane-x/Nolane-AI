name: R2.69 Promotion Verifier Authority V2

on:
  push:
    branches: [ r269-promotion-verifier-authority-hardening-v2-gpt56sol ]
    paths:
      - 'tests/test_r269_promotion_verifier_authority.py'
      - 'scripts/r269_patch_promotion_verifier_authority_v2.py'
      - '.github/workflows/r269-promotion-verifier-authority-v2.yml'

permissions:
  contents: write

env:
  BRANCH: r269-promotion-verifier-authority-hardening-v2-gpt56sol

jobs:
  red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Prove issuer-label spoof contract is RED
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r269_promotion_verifier_authority.py
          code=$?
          set -e
          test "$code" -ne 0
      - name: Apply guarded trusted-verifier patch
        run: python scripts/r269_patch_promotion_verifier_authority_v2.py
      - name: Focused authority and governed runtime GREEN
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r269_scoped_promotion.py \
            tests/test_r269_promotion_registry.py \
            tests/test_r269_promotion_verifier_authority.py \
            tests/test_r269_governed_runtime.py
      - name: Complete R2.69 and protected R2.68 GREEN
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Exact authored and external evidence remain valid
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          a=run_benchmark(); e=run_external_transfer()
          assert a['authored_gate_pass'] is True and a['false_accepts']==0
          assert e['all_gates_pass'] is True and e['false_accepts']==0
          print('R269_PROMOTION_HARDENING_AUTHORED='+a['semantic_result_digest'])
          print('R269_PROMOTION_HARDENING_EXTERNAL='+e['semantic_result_digest'])
          PY
      - name: Commit only verifier-proven hardening
        run: |
          git config user.name 'Nolane R2.69 promotion verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add cogcoder/r269_scoped_promotion.py tests/test_r269_scoped_promotion.py tests/test_r269_promotion_registry.py tests/test_r269_governed_runtime.py
          git commit -m 'fix(r269): require host-trusted promotion verifier authority'
          git push origin HEAD:${BRANCH}
