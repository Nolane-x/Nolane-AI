name: Refoundation Wave 5Y Context Migration v4

on:
  push:
    branches:
      - refoundation/epoch0-wave5y-native-context
    paths:
      - '.github/workflows/refoundation-wave5y-context-migration-v4.yml'

permissions:
  contents: write

jobs:
  migrate-context:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Extract and execute fail-closed Wave 5Y migration
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/refoundation-wave5y-context-migration.yml').read_text(encoding='utf-8').splitlines()
          start = source.index("          python - <<'PY'") + 1
          end = source.index('          PY', start)
          body = []
          for line in source[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              body.append(line)
          Path('/tmp/wave5y_migrate.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python /tmp/wave5y_migrate.py
      - name: Make predecessor context contracts monotonic
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, replacements) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              for row in replacements:
                  old, new = row[0], row[1]
                  expected = row[2] if len(row) == 3 else 1
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} match(es) for {old!r}, found {count}')
                  text = text.replace(old, new, expected)
              file.write_text(text, encoding='utf-8')

          patch('tests/test_refoundation_memory_public_layout.py', (
              ('        context: ("external.context", "0.0.0"),\n', '        context: ("external.context", "0.0.1"),\n'),
          ))
          patch('tests/test_refoundation_wave5d_native_memory_lifecycle.py', (
              ('    assert "external.context" in facade_ids\n', ''),
          ))
          patch('tests/test_refoundation_wave5e_native_memory_retrieval.py', (
              ('    assert "external.context" in facade_ids\n', ''),
              ('    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n', ''),
          ))
          patch('tests/test_refoundation_wave5i_native_self_model.py', (
              ('    assert "external.context" in facade_ids\n', ''),
              ('    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n', ''),
          ))
          patch('tests/test_refoundation_wave5j_native_skills.py', (
              ('    assert "external.context" in facade_ids\n', ''),
              ('    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n', '', 2),
          ))
          patch('tests/test_refoundation_wave5w_native_execution_executor.py', (
              ('    assert len(non_native) == 24\n', '    assert len(non_native) <= 24\n'),
          ))
          patch('CURRENT/STATUS.md', (
              ('The generated native-debt projection therefore moves from 24 to 23 records while `neural.inference_bridge` and `external.execution.control` remain explicit compatibility boundaries.\n',
               'The generated native-debt projection therefore moves from 24 to 23 records while `neural.inference_bridge` and `external.execution.control` remain explicit compatibility boundaries. The resulting projection has 23 non-native component records.\n'),
          ))
          PY
      - name: Verify migration scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'CURRENT/STATUS.md',
              'cogcoder/organization/context.py',
              'cogcoder/organization/context_intelligence.py',
              'cogcoder/organization/memory_profiles.py',
              'cogcoder/organization/memory_context.py',
              'cogcoder/organization/memory_context_adapter.py',
              'cogcoder/refoundation/component_versions.py',
              'cogcoder/refoundation/facades.py',
              'cogcoder/refoundation/implementation_status.py',
              'nolane/external_core/context.py',
              'nolane/memory/context.py',
              'nolane/memory/context_adapter.py',
              'nolane/memory/context_intelligence.py',
              'nolane/memory/context_profiles.py',
              'tests/test_refoundation_component_versions.py',
              'tests/test_refoundation_implementation_status.py',
              'tests/test_refoundation_memory_public_layout.py',
              'tests/test_refoundation_wave5d_native_memory_lifecycle.py',
              'tests/test_refoundation_wave5e_native_memory_retrieval.py',
              'tests/test_refoundation_wave5i_native_self_model.py',
              'tests/test_refoundation_wave5j_native_skills.py',
              'tests/test_refoundation_wave5w_native_execution_executor.py',
              'tests/test_refoundation_wave5x_canonical_event_context_schemas.py',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          changed = tracked | untracked
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit('unexpected Wave 5Y migration files: ' + ', '.join(unexpected))
          if missing:
              raise SystemExit('expected Wave 5Y migration files unchanged: ' + ', '.join(missing))
          print(f'Wave 5Y source scope clean: {len(changed)} files ({len(tracked)} tracked + {len(untracked)} untracked)')
          PY
      - name: Compile migrated namespaces
        run: python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
      - name: Verify AI dossiers
        run: python -m nolane.ai.materialize --check
      - name: Materialize repository audit for tests
        run: python -m nolane.repository.audit --write
      - name: Verify repository audit
        run: python -m nolane.repository.audit --check
      - name: Run Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run broad organization/campaign/execution regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Commit GREEN source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CURRENT/STATUS.md \
            cogcoder/organization/context.py \
            cogcoder/organization/context_intelligence.py \
            cogcoder/organization/memory_profiles.py \
            cogcoder/organization/memory_context.py \
            cogcoder/organization/memory_context_adapter.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py \
            nolane/external_core/context.py \
            nolane/memory/context.py \
            nolane/memory/context_adapter.py \
            nolane/memory/context_intelligence.py \
            nolane/memory/context_profiles.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5d_native_memory_lifecycle.py \
            tests/test_refoundation_wave5e_native_memory_retrieval.py \
            tests/test_refoundation_wave5i_native_self_model.py \
            tests/test_refoundation_wave5j_native_skills.py \
            tests/test_refoundation_wave5w_native_execution_executor.py \
            tests/test_refoundation_wave5x_canonical_event_context_schemas.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No GREEN migration changes staged'
            exit 1
          fi
          git commit -m "[wave5y-green] Refoundation Wave 5Y: native context cutover"
          git push origin HEAD:${GITHUB_REF_NAME}
