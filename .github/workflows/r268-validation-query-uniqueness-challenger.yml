name: R2.68 Challenger — Validation Oracle Query Uniqueness

on:
  pull_request:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'tests/test_r268_validation_query_uniqueness.py'
      - '.github/workflows/r268-validation-query-uniqueness-challenger.yml'

permissions:
  contents: read

jobs:
  expected-red:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted parents stay green
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Existing R2.68 contracts stay green before challenger
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_r268_*.py' ! -name 'test_r268_validation_query_uniqueness.py' | sort)
          PYTHONPATH=. python -m pytest -q "${files[@]}"
      - name: Require validation-query uniqueness challenger RED
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r268_validation_query_uniqueness.py > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -Eq '3 failed' /tmp/red.log
          echo R268_VALIDATION_QUERY_UNIQUENESS_CONFIRMED_RED
