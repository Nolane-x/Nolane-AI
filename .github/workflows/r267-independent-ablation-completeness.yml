name: R2.67 Independent Ablation Completeness

on:
  push:
    branches: [validation-r267-ablation-completeness-gpt56sol]
  pull_request:
    branches: [r267-three-probe-causal-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenger:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify accepted R2.66 parent contracts first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Require the current R2.67 production baseline to be green
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_three_probe_causal_composition.py
      - name: Run independent ablation-completeness contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
