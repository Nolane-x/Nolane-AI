name: E Acting PR320 Ready Bridge

on:
  push:
    branches:
      - e-acting-pr320-ready-bridge

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Mark PR 320 ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 320 --repo "$GITHUB_REPOSITORY"
