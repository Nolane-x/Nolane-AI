name: R2.63 Compositional Repository Repair

on:
  push:
    branches: [r263-compositional-repository-repair-gpt56sol]
    paths:
      - 'cogcoder/r263_*.py'
      - 'tests/test_r263_*.py'
      - 'benchmarks/kfigg/r263_*.py'
      - 'research/r263_*.py'
      - 'R2_63_*.json'
      - '.github/workflows/r263-compositional-repository-repair.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r263_*.py'
      - 'tests/test_r263_*.py'
      - 'benchmarks/kfigg/r263_*.py'
      - 'research/r263_*.py'
      - 'R2_63_*.json'
      - '.github/workflows/r263-compositional-repository-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Verify frozen R2.63 source blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_63_PRE_HOSTED_LOCK.json').read_text())
          assert lock['parent_release_commit'] == '02f3d2f6dc16dbb82b0dd1cef111546173b4767e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R263_SOURCE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Verify accepted R2.62 and R2.61 parents first
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_version_space_expansion.py tests/test_r261_expansion_novelty_proof.py
      - name: Run R2.63 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r263_*.py

  phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify source lock and exact Phase-A
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from benchmarks.kfigg.r263_compositional_version_space_expansion import run_benchmark
          lock=json.loads(Path('R2_63_PRE_HOSTED_LOCK.json').read_text())
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          result=run_benchmark()
          expected=json.loads(Path('R2_63_PHASE_A_RESULT.json').read_text())
          assert result == expected, (result, expected)
          assert result['all_gates_pass'] is True
          Path('R2_63_PHASE_A_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print('R263_PHASE_A_EXACT_OK')
          print(json.dumps(result['summary'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.63-phase-a
          path: R2_63_PHASE_A_RECOMPUTED.json

  external-numpy-square:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned external oracle dependency
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify source lock and exact square transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import numpy as np
          from research.r263_external_compositional_transfer import run_external_transfer
          lock=json.loads(Path('R2_63_PRE_HOSTED_LOCK.json').read_text())
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          result=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          expected=json.loads(Path('R2_63_EXTERNAL_TRANSFER.json').read_text())
          assert result == expected, (result, expected)
          assert result['passed'] is True
          assert result['source_version'] == '2.4.6'
          assert result['verification_exact'] == result['verification_cases'] == 46
          Path('R2_63_EXTERNAL_TRANSFER_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print('R263_SQUARE_EXTERNAL_EXACT_OK')
          print(json.dumps({'source_version': result['source_version'], 'verification_cases': result['verification_cases'], 'total_external_oracle_calls': result['total_external_oracle_calls'], 'r261_reason': result['r261_baseline']['reason'], 'r263_reason': result['r263']['reason']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.63-numpy-square-external
          path: R2_63_EXTERNAL_TRANSFER_RECOMPUTED.json

  external-numpy-subtract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned external oracle dependency
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify source lock and measure exact subtract transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import numpy as np
          from research.r263_external_subtract_transfer import run_external_subtract_transfer
          lock=json.loads(Path('R2_63_PRE_HOSTED_LOCK.json').read_text())
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          result=run_external_subtract_transfer(np.subtract, source_id='numpy.subtract', source_version=np.__version__)
          assert result['passed'] is True
          assert result['source_version'] == '2.4.6'
          assert result['source_exposure'] == 'io_only'
          assert result['source_implementation_inspected'] is False
          assert result['correct_target_absent_initial'] is True
          assert result['correct_target_absent_complete_one_step_space'] is True
          assert result['exact_target_supplied_to_solver'] is False
          assert result['r261_baseline']['status'] == 'abstain'
          assert result['r261_baseline']['reason'] == 'independent_verification_failed'
          assert result['r261_baseline']['expansion_rounds'] == 0
          assert result['r263']['status'] == 'accept'
          assert result['r263']['reason'] == 'compositional_candidate_verified'
          assert result['r263']['composition_depth'] == 2
          assert result['r263']['expansion_rounds'] == 2
          assert result['r263']['refinement_counterexamples'] == 2
          assert result['r263']['accepted_edit_count'] == 2
          assert len(result['r263']['accepted_mutation_chain']) == 2
          assert result['r263']['generation_used_target_outputs'] is False
          assert result['r263']['false_terminal_accepts'] == 0
          assert result['r263']['verification_failures'] == 0
          assert result['verification_exact'] == result['verification_cases'] == 256
          assert result['trainable_parameter_count'] == 0
          Path('R2_63_EXTERNAL_SUBTRACT_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          frozen=Path('R2_63_EXTERNAL_SUBTRACT_TRANSFER.json')
          if frozen.exists():
              assert json.loads(frozen.read_text()) == result
              print('R263_SUBTRACT_EXTERNAL_EXACT_OK')
          else:
              print('R263_SUBTRACT_EXTERNAL_FREEZE_PENDING')
          print(json.dumps({'source_version': result['source_version'], 'verification_cases': result['verification_cases'], 'total_external_oracle_calls': result['total_external_oracle_calls'], 'raw_external_callable_calls': result['total_raw_external_callable_calls'], 'r261_reason': result['r261_baseline']['reason'], 'r263_reason': result['r263']['reason']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.63-numpy-subtract-external
          path: R2_63_EXTERNAL_SUBTRACT_RECOMPUTED.json

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run R2.63 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r263_*.py

  canonical-full-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify canonical parent and frozen blobs
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_63_PRE_HOSTED_LOCK.json').read_text())
          assert os.environ['EXPECTED_BASE_SHA'] == lock['parent_release_commit'], (os.environ['EXPECTED_BASE_SHA'], lock['parent_release_commit'])
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R263_PARENT_AND_SOURCE_LOCK_OK', lock['parent_release_commit'])
          PY
      - name: Recompute exact R2.63 Phase-A and both external transfers
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r263_compositional_version_space_expansion import run_benchmark
          from research.r263_external_compositional_transfer import run_external_transfer
          from research.r263_external_subtract_transfer import run_external_subtract_transfer
          phase=run_benchmark()
          assert phase == json.loads(Path('R2_63_PHASE_A_RESULT.json').read_text())
          square=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          assert square == json.loads(Path('R2_63_EXTERNAL_TRANSFER.json').read_text())
          subtract=run_external_subtract_transfer(np.subtract, source_id='numpy.subtract', source_version=np.__version__)
          subtract_frozen=Path('R2_63_EXTERNAL_SUBTRACT_TRANSFER.json')
          if subtract_frozen.exists():
              assert subtract == json.loads(subtract_frozen.read_text())
              print('R263_SUBTRACT_EXTERNAL_EXACT_OK')
          else:
              print('R263_SUBTRACT_EXTERNAL_FREEZE_PENDING')
          assert subtract['passed'] is True
          print('R263_PHASE_A_AND_SQUARE_EXACT_OK')
          PY
      - name: Run R2.63 focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
      - name: Run accepted R2.62 and R2.61 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
      - name: Run R2.60 through R2.58 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
      - name: Run R2.57 through R2.55 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
      - name: Run R2.54 through R2.50 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
      - name: Run R2.49 through R2.41 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py

  publish-full-gate:
    if: github.event_name == 'pull_request'
    needs: [focused, phase-a, external-numpy-square, external-numpy-subtract, cross-python, canonical-full-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r263/full-gate',
              'description':'R2.63 exact Phase-A + dual external transfers, cross-Python and R2.62-R2.41 lineage passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R263_FULL_GATE_STATUS_PUBLISHED')
          PY
