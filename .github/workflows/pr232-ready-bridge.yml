name: PR 232 Ready Bridge

on:
  push:
    branches:
      - post-epoch0/candidate-synthesis-v0.0.2-bounded-search-red
    paths:
      - '.github/workflows/pr232-ready-bridge.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-24.04
    steps:
      - name: Mark PR 232 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 232 --repo Nolane-x/Nolane-AI
