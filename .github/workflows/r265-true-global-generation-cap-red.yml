name: R2.65 True Global Generation Cap RED

on:
  push:
    branches: [validation-r265-true-global-generation-cap-gpt56sol]
    paths:
      - 'tests/test_r265_true_global_generation_cap_falsifier.py'
      - '.github/workflows/r265-true-global-generation-cap-red.yml'
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - 'tests/test_r265_true_global_generation_cap_falsifier.py'
      - '.github/workflows/r265-true-global-generation-cap-red.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Confirm result fairness control and true-global-budget falsifier
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r265_true_global_generation_cap_falsifier.py > r265-global-cap-red.log 2>&1
          rc=$?
          cat r265-global-cap-red.log
          test "$rc" -ne 0
      - name: Require exact over-generation failure with fairness control green
        shell: bash
        run: |
          grep -F 'test_global_generation_cap_bounds_upstream_generation_work' r265-global-cap-red.log
          grep -E 'assert [4-9][0-9]* <= 3|assert [4-9] <= 3' r265-global-cap-red.log
          grep -E '1 failed, 1 passed|1 passed, 1 failed' r265-global-cap-red.log
      - name: Publish independent RED status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
            'state':'success',
            'context':'r265/true-global-generation-cap-red',
            'description':'Independent RED: fair returned rows still exceed the declared global generation budget upstream',
            'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            data=payload,
            headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
            method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
