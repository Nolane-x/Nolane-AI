name: Candidate Synthesis v0.0.4 Hardening RED Proof

on:
  push:
    branches:
      - verify/candidate-synthesis-v004-hardening-red
    paths:
      - .github/workflows/tmp-candidate-synthesis-v004-hardening-red.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify/candidate-synthesis-v004-hardening-red
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Run structural hardening RED contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_post_epoch0_candidate_synthesis_structural_composition.py \
            tests/test_refoundation_post_epoch0_candidate_synthesis_structural_hardening.py
