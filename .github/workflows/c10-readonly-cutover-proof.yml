name: C10 Proven v0.0.4 Cutover

on:
  push:
    branches:
      - post-epoch0/reasoning-invention-c-v0.0.1

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore(C10): apply proven v0.0.4 cutover'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard exact proven parent and integrate latest main
        id: guard
        run: |
          set -euo pipefail
          STAGING_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "d7c558bec828d23fca762328df2a8f7e084afbfc"
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git fetch origin main post-epoch0/reasoning-invention-c-v0.0.1
          REMOTE_HEAD="$(git rev-parse origin/post-epoch0/reasoning-invention-c-v0.0.1)"
          test "$REMOTE_HEAD" = "$STAGING_HEAD"
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          git merge --no-edit origin/main
      - name: Apply the exact proven v0.0.4 cutover
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          family_modules = (
              "nolane/external_core/reasoning_invention.py",
              "nolane/external_core/reasoning_evaluation.py",
              "nolane/external_core/reasoning_frontier.py",
              "nolane/external_core/reasoning_metacontrol.py",
              "nolane/external_core/reasoning_review.py",
              "nolane/external_core/reasoning_meta_learning.py",
              "nolane/external_core/reasoning_episode.py",
          )
          for filename in family_modules:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = 'COMPONENT_VERSION = "0.0.3"'
              if text.count(old) != 1:
                  raise SystemExit(f"{filename}: expected exactly one v0.0.3 declaration")
              path.write_text(text.replace(old, 'COMPONENT_VERSION = "0.0.4"', 1), encoding="utf-8")

          policy_path = Path("nolane/external_core/reasoning_policy_evolution.py")
          policy = policy_path.read_text(encoding="utf-8")
          if policy.count('COMPONENT_VERSION = "0.0.4"') != 1:
              raise SystemExit("C10 policy module is not exactly v0.0.4")

          metadata = Path("nolane/metadata/component_versions.py")
          text = metadata.read_text(encoding="utf-8")
          old = '"external.reasoning_invention": 3,'
          if text.count(old) != 1:
              raise SystemExit("reasoning revision 3 metadata not found exactly once")
          metadata.write_text(text.replace(old, '"external.reasoning_invention": 4,', 1), encoding="utf-8")

          test_paths = (
              "tests/test_refoundation_post_epoch0_reasoning_invention_metadata.py",
              "tests/test_refoundation_post_epoch0_reasoning_invention.py",
              "tests/test_refoundation_post_epoch0_reasoning_metacontrol.py",
              "tests/test_refoundation_post_epoch0_reasoning_invention_evaluation.py",
              "tests/test_refoundation_post_epoch0_reasoning_episode.py",
          )
          for filename in test_paths:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "0.0.3" not in text:
                  raise SystemExit(f"{filename}: no stale v0.0.3 version contract")
              path.write_text(text.replace("0.0.3", "0.0.4").replace("v003", "v004"), encoding="utf-8")

          layer = Path("CURRENT/REASONING_INVENTION_C_LAYER.md")
          text = layer.read_text(encoding="utf-8")
          replacements = {
              "protocol family at **v0.0.3**": "protocol family at **v0.0.4**",
              "The v0.0.3 cutover is additive.": "The v0.0.4 cutover is additive.",
              "v0.0.3 adds the separate `reasoning-episode-v1` temporal protocol": "v0.0.4 retains the separate `reasoning-episode-v1` temporal protocol and adds `reasoning-policy-evolution-v1`",
              "v0.0.3 composes C1–C9 into": "v0.0.4 composes C1–C10 into",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"C-layer status marker mismatch: {old}")
              text = text.replace(old, new, 1)
          if "## C10 — Governed Metareasoning Policy Evolution" not in text:
              text += '''\n\n## C10 — Governed Metareasoning Policy Evolution\n\nSchema: `reasoning-policy-evolution-v1`.\n\nC10 turns C8/C9 metareasoning evidence into a governed proposal surface without granting Reasoning/Invention self-edit authority. `MetareasoningPolicy` revisions are immutable and content-addressed; every non-root policy binds an exact parent, and proposals advance exactly one revision. Policy deltas are monotonic constraints only: they may tighten remaining action count or cost, raise the minimum actionable-gain floor, and remove allowed reasoning-action kinds, but cannot expand caller authority or relax safety thresholds.\n\nPolicy learning uses an explicit multi-episode `PolicyEvidenceSplit` with disjoint development and holdout episodes. Shadow evaluation keeps decision accuracy, information gain, uncertainty reduction, cost, residual risk and regression count as separate Pareto dimensions, so an improvement on one axis cannot compensate for a regression on another. Fresh-context review binds distinct producer/reviewer agents and sessions, auditable review context, withheld rationale, completed checks, reproduced evidence, and explicit objection/specification-gaming/leakage findings. A supported review cannot hide a blocker.\n\nAdoption and rollback remain externally authorized operations. C cannot mint adoption authority, expose a mutable current-policy governor, or self-promote a learned policy. Adoption requires proposal, Pareto-non-regressing shadow evidence, fresh-context review and exact external authorization to bind the same parent/candidate lineage. Rollback is lineage-exact and restores the immutable parent under separate external rollback authorization.\n\nC10 therefore closes policy evolution as **proposal + evidence + external authorization**, not autonomous self-modification. Existing `reasoning-invention-v1`, C8 schemas and `reasoning-episode-v1` identities remain unchanged.\n'''
          layer.write_text(text, encoding="utf-8")

          external = Path("CURRENT/EXTERNAL_CORE.md")
          text = external.read_text(encoding="utf-8")
          replacements = {
              "canonical-native at **v0.0.3** as the immutable protocol family for C. Reasoning / Invention": "canonical-native at **v0.0.4** as the immutable protocol family for C. Reasoning / Invention",
              "while v0.0.3 adds the independently content-addressed `reasoning-episode-v1` temporal/replay envelope": "while v0.0.4 retains the independently content-addressed `reasoning-episode-v1` temporal/replay envelope and adds governed `reasoning-policy-evolution-v1`",
              "v0.0.3 retains the bounded **Reasoning Ecology** introduced by C8": "v0.0.4 retains the bounded **Reasoning Ecology** introduced by C8",
              "Reasoning/Invention v0.0.3": "Reasoning/Invention v0.0.4",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"EXTERNAL_CORE reasoning marker mismatch: {old}")
              text = text.replace(old, new, 1)
          anchor = "C9 adds replayable reasoning episodes above those immutable C8 objects."
          if text.count(anchor) != 1:
              raise SystemExit("C9 EXTERNAL_CORE anchor mismatch")
          c10 = "C10 adds governed metareasoning policy evolution without creating self-modification authority. `reasoning-policy-evolution-v1` binds immutable one-step policy lineage, constraint-only budget/action-kind tightening, disjoint development/holdout evidence, Pareto shadow evaluation, self-contained fresh-context review provenance, and exact externally authorized adoption/rollback. Reasoning/Invention cannot self-authorize, maintain a mutable current-policy governor, relax caller safety bounds, or treat policy adoption as Assurance.\n\n"
          insert_at = text.index(anchor)
          text = text[:insert_at] + c10 + text[insert_at:]
          external.write_text(text, encoding="utf-8")
          PY

          test -z "$(grep -l 'COMPONENT_VERSION = "0.0.3"' nolane/external_core/reasoning_{invention,evaluation,frontier,metacontrol,review,meta_learning,episode,policy_evolution}.py || true)"
      - name: Verify focused C8-C10 and canonical revision contracts
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m compileall -q nolane/external_core nolane/metadata
          python -m pytest -q \
            tests/test_refoundation_post_epoch0_reasoning_policy_evolution.py \
            tests/test_refoundation_post_epoch0_reasoning_policy_evolution_adversarial.py \
            tests/test_refoundation_post_epoch0_reasoning_policy_evolution_monotonicity.py \
            tests/test_refoundation_post_epoch0_reasoning_policy_evolution_provenance.py \
            tests/test_refoundation_post_epoch0_reasoning_v004_revision.py \
            tests/test_refoundation_post_epoch0_reasoning_episode.py \
            tests/test_refoundation_post_epoch0_reasoning_episode_adversarial.py \
            tests/test_refoundation_post_epoch0_reasoning_metacontrol.py \
            tests/test_refoundation_post_epoch0_reasoning_metacontrol_adversarial.py \
            tests/test_refoundation_post_epoch0_reasoning_invention.py \
            tests/test_refoundation_post_epoch0_reasoning_invention_evaluation.py \
            tests/test_refoundation_post_epoch0_reasoning_invention_metadata.py \
            tests/test_refoundation_component_versions.py
          git diff --check
      - name: Race guard, self-clean, commit, and push
        run: |
          set -euo pipefail
          git fetch origin main post-epoch0/reasoning-invention-c-v0.0.1
          test "$(git rev-parse origin/main)" = "${{ steps.guard.outputs.main_sha }}"
          test "$(git rev-parse origin/post-epoch0/reasoning-invention-c-v0.0.1)" = "${{ github.sha }}"
          rm .github/workflows/c10-readonly-cutover-proof.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(C10): cut over governed policy evolution v0.0.4"
          git push origin HEAD:post-epoch0/reasoning-invention-c-v0.0.1
