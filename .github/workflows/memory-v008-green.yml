name: Memory v0.0.8 Green Apply

on:
  push:
    branches:
      - codex/memory-learning-tombstone-authority-v0.0.8

permissions:
  contents: write

concurrency:
  group: memory-v008-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-green:
    if: ${{ !contains(github.event.head_commit.message, 'bind tombstones to archive lifecycle authority') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply minimal GREEN invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/memory/learning_substrate.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def _validate_tombstone_semantics(self, tombstone: MemoryTombstone) -> None:\n        row = self.memory.get(tombstone.memory_id)\n        if row.status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived memory state")\n        archived = any(\n            receipt.new_status is MemoryStatus.ARCHIVED\n            for receipt in self.lifecycle.receipts_for(tombstone.memory_id)\n        )\n        if not archived:\n            raise ValueError("memory tombstone requires archived lifecycle authority")\n'''
          new = '''    def _validate_tombstone_semantics(self, tombstone: MemoryTombstone) -> None:\n        row = self.memory.get(tombstone.memory_id)\n        if row.status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived memory state")\n        archive_authority = tuple(\n            receipt\n            for receipt in self.lifecycle.receipts_for(tombstone.memory_id)\n            if receipt.new_status is MemoryStatus.ARCHIVED\n            and receipt.reason == tombstone.reason\n            and receipt.evidence_refs == tombstone.evidence_refs\n        )\n        if not archive_authority:\n            raise ValueError("memory tombstone requires matching archive lifecycle authority")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected tombstone validation block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Verify focused GREEN
        run: python -m pytest -q tests/test_memory_learning_tombstone_authority_v008.py
      - name: Verify Memory Learning matrix before commit
        shell: bash
        run: |
          shopt -s nullglob
          tests=(
            tests/test_memory_learning_substrate_v005.py
            tests/test_memory_learning_substrate_v005_integration.py
            tests/test_memory_learning_closure_v005.py
            tests/test_memory_learning_adaptive_policy_v005.py
            tests/test_memory_learning_restore_authority_v005.py
            tests/test_memory_learning_runtime_wiring_v005.py
            tests/test_memory_learning_reauthorization_v006.py
            tests/test_memory_learning_retrieval_receipt_replay_v007.py
            tests/test_memory_learning_tombstone_authority_v008.py
            tests/test_refoundation_component_versions.py
            tests/test_refoundation_runtime_state_map.py
            tests/test_refoundation_wave2_zero_loss_runtime_digest.py
            tests/test_refoundation_memory_public_layout.py
            tests/test_refoundation_wave5c_native_memory_fabric.py
            tests/test_refoundation_wave5d_native_memory_lifecycle.py
            tests/test_refoundation_wave5e_native_memory_retrieval.py
            tests/test_refoundation_wave5h_native_experience.py
            tests/test_refoundation_wave5j_native_skills.py
            tests/test_refoundation_wave5ao_native_individual_evolution.py
            tests/test_coding_agi_memory_*.py
            tests/test_coding_agi_self_*.py
          )
          python -m pytest -q "${tests[@]}"
      - name: Commit production GREEN
        shell: bash
        run: |
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git add nolane/memory/learning_substrate.py
          git commit -m "fix(memory): bind tombstones to archive lifecycle authority"
          git push origin HEAD:codex/memory-learning-tombstone-authority-v0.0.8
