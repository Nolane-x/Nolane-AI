name: Memory v0.0.8 Green Apply

on:
  push:
    branches:
      - codex/memory-learning-tombstone-authority-v0.0.8

permissions:
  contents: write

concurrency:
  group: memory-v008-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-green:
    if: ${{ !contains(github.event.head_commit.message, 'reuse existing archive authority') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply already-archived GREEN invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/memory/learning_substrate.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if row.status is not MemoryStatus.ARCHIVED:\n            self.lifecycle.transition(\n                row.memory_id,\n                actor_agent_id=actor_agent_id,\n                new_status=MemoryStatus.ARCHIVED,\n                reason=reason,\n                evidence_refs=evidence,\n            )\n        self._tombstones[row.memory_id] = candidate\n        return candidate\n'''
          new = '''        if row.status is not MemoryStatus.ARCHIVED:\n            self.lifecycle.transition(\n                row.memory_id,\n                actor_agent_id=actor_agent_id,\n                new_status=MemoryStatus.ARCHIVED,\n                reason=reason,\n                evidence_refs=evidence,\n            )\n        else:\n            archive_authority = tuple(\n                receipt\n                for receipt in self.lifecycle.receipts_for(row.memory_id)\n                if receipt.new_status is MemoryStatus.ARCHIVED\n                and receipt.actor_agent_id == str(actor_agent_id).strip()\n                and receipt.reason == reason\n                and receipt.evidence_refs == evidence\n            )\n            if not archive_authority:\n                raise ValueError(\n                    "forgetting already archived memory requires matching archive lifecycle authority"\n                )\n        self._tombstones[row.memory_id] = candidate\n        return candidate\n'''
          if text.count(old) != 1:
              raise SystemExit('expected forget archive block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Verify focused GREEN
        run: python -m pytest -q tests/test_memory_learning_tombstone_authority_v008.py
      - name: Verify Memory Learning matrix before commit
        shell: bash
        run: |
          shopt -s nullglob
          tests=(
            tests/test_memory_learning_substrate_v005.py
            tests/test_memory_learning_substrate_v005_integration.py
            tests/test_memory_learning_closure_v005.py
            tests/test_memory_learning_adaptive_policy_v005.py
            tests/test_memory_learning_restore_authority_v005.py
            tests/test_memory_learning_runtime_wiring_v005.py
            tests/test_memory_learning_reauthorization_v006.py
            tests/test_memory_learning_retrieval_receipt_replay_v007.py
            tests/test_memory_learning_tombstone_authority_v008.py
            tests/test_refoundation_component_versions.py
            tests/test_refoundation_runtime_state_map.py
            tests/test_refoundation_wave2_zero_loss_runtime_digest.py
            tests/test_refoundation_memory_public_layout.py
            tests/test_refoundation_wave5c_native_memory_fabric.py
            tests/test_refoundation_wave5d_native_memory_lifecycle.py
            tests/test_refoundation_wave5e_native_memory_retrieval.py
            tests/test_refoundation_wave5h_native_experience.py
            tests/test_refoundation_wave5j_native_skills.py
            tests/test_refoundation_wave5ao_native_individual_evolution.py
            tests/test_coding_agi_memory_*.py
            tests/test_coding_agi_self_*.py
          )
          python -m pytest -q "${tests[@]}"
      - name: Commit production GREEN
        shell: bash
        run: |
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git add nolane/memory/learning_substrate.py
          git commit -m "fix(memory): reuse existing archive authority for forget"
          git push origin HEAD:codex/memory-learning-tombstone-authority-v0.0.8
