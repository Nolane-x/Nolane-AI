name: R2.53 Full Repository Release Bundle

on:
  push:
    branches: [ main ]
    paths:
      - "R2_53_DELIVERY.md"
      - "R2_53_RELEASE_MANIFEST.json"
      - "R2_52_TO_R2_53_EVOLUTION.md"
      - "R2_READINESS_RECALIBRATION.md"
      - "research/R2_53_*.json"
      - ".github/workflows/r253-release-bundle.yml"
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen release boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/R2_53_PHASE_A_RESULT.json'))
          v=json.load(open('research/R2_53_VERIFY_RESULT.json'))
          w=json.load(open('research/R2_53_WORLD_FINAL.json'))
          m=json.load(open('R2_53_RELEASE_MANIFEST.json'))
          assert p['all_gates_pass'] is True
          assert p['summary']['episodes']==16 and p['summary']['exact']==16 and p['summary']['false_accepts']==0
          assert p['summary']['no_reflex_exact']==0 and p['summary']['self_confidence_only_exact']==0 and p['summary']['retrieve_once_exact']==0
          assert p['summary']['episodes_with_new_midtrajectory_deficit']==16
          assert p['summary']['unsafe_procedure_executions']==0 and p['summary']['provenance_failures']==0
          assert p['catalog']['families']>=38 and p['catalog']['suboperators']>=300
          assert v['decision']=='accepted_bounded_capability' and v['all_required_steps_success'] is True
          assert v['github']['main_job_success'] is True and v['github']['integrity_workflows_success'] is True
          assert v['github']['cross_python_311_success'] is True and v['github']['cross_python_313_success'] is True
          assert v['nolane_world']['audit_valid'] is True and v['nolane_world']['gate_passed'] is False
          assert w['decision']=='NON_CONVERGED_BOUNDED_ACCEPTANCE_CANDIDATE'
          assert w['gate']['passed'] is False
          assert v['readiness']['current']==44.5 and v['readiness']['delta']==0.0
          assert m['coding_agi_engineering_readiness']==44.5 and m['world_w5_gate_passed'] is False
          PY
      - name: Run focused release regressions
        run: |
          python -m pip install --upgrade pytest
          PYTHONPATH=. pytest -q \
            tests/test_r253_operator_catalog.py \
            tests/test_r253_external_cognition.py \
            tests/test_r253_external_cognitive_reflex_benchmark.py \
            tests/test_r21_retrieval_microcycle.py \
            tests/test_r252_repository_query.py \
            tests/test_r252_repository_query_benchmark.py
      - name: Create complete repository snapshot
        run: |
          mkdir -p release
          git archive --format=zip --output=release/Nolane-AI-R2.53-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.53-COMPLETE.zip | tee release/Nolane-AI-R2.53-COMPLETE.zip.sha256
          unzip -t release/Nolane-AI-R2.53-COMPLETE.zip >/tmp/unzip-r253.log
          tail -1 /tmp/unzip-r253.log
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.53-COMPLETE
          path: release/*
          if-no-files-found: error
          retention-days: 90
