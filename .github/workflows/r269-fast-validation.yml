name: R2.69 Fast Validation Lane

on:
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r269_transfer_runtime.py'
      - 'tests/test_r269_transfer_governor.py'
      - 'tests/test_r269_release_authority_closure.py'
      - '.github/workflows/r269-fast-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-red-green:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r269-autonomous-transfer-meta-learning-kernel-gpt56sol
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Focused R2.69 authority and lazy-scratch contracts
        run: python -m pytest -q tests/test_r269_release_authority_closure.py tests/test_r269_transfer_governor.py
