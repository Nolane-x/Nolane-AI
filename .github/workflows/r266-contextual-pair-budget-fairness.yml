name: R2.66 Contextual Pair-Budget Fairness Challenger

on:
  push:
    branches: [validation-r266-contextual-pair-budget-fairness-gpt56sol]
  pull_request:
    branches: [r264-learned-contextual-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run pair-budget fairness contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_contextual_pair_budget_fairness.py
