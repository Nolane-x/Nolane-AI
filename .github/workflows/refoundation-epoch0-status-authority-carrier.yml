name: Refoundation Epoch 0 status authority carrier

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: refoundation-epoch0-status-authority-carrier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-terminal-status:
    if: github.head_ref == 'refoundation-epoch0-status-authority-cleanup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Make CURRENT status terminal without rewriting history
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CURRENT/STATUS.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "Architecture generation: `A1` (Refoundation Epoch 0).\n": "Architecture generation: `A1` (Refoundation Epoch 0).\n\n## Current state — Epoch 0 CLOSED\n\nEpoch 0 is closed. `CURRENT/EPOCH0_CLOSURE.md` is the terminal closure receipt and `CURRENT/NATIVE_DEBT.json` is the generated terminal debt projection. All tracked executable semantic components are under canonical native authority; the sole non-native record is the deliberately frozen `neural.shared` asset, which is not executable migration debt and has no canonical write authority. No later Refoundation extraction wave is implied or required by this status document.\n",
              "## Current native-extraction lineage\n\nThe downstream Refoundation lineage is continuing semantic ownership extraction without treating historical file layout as current authority. The latest cutovers and refinements are:\n": "## Historical native-extraction lineage (closed)\n\nThe following Wave chronology records how semantic ownership was extracted during Epoch 0. It is historical provenance, not an open queue of future extraction work:\n",
              "## Repository authority and remaining debt\n\n`CURRENT/REPOSITORY_AUTHORITY.md` defines repository precedence and quarantine semantics. `archive/INDEX.json` is the generated root-history census. `CURRENT/NATIVE_DEBT.json` / `.md` expose every canonical semantic component that is not yet `canonical_native`, so extraction can continue independently using local `0.0.N` component versions.\n": "## Repository authority and terminal debt\n\n`CURRENT/REPOSITORY_AUTHORITY.md` defines repository precedence and quarantine semantics. `archive/INDEX.json` is the generated root-history census. `CURRENT/NATIVE_DEBT.json` / `.md` are terminal generated projections for Epoch 0: they contain only the accepted frozen `neural.shared` asset and do not authorize further extraction.\n",
              "The dependency graph and the actual import graph must both be clean before a boundary is cut over. In particular, Assurance and Individual Evolution currently expose hidden legacy import coupling beyond their high-level manifest edges; those surfaces must be retargeted or decomposed before authority migration rather than moved cosmetically.\n\nNo current status statement implies that all runtime or External Core surfaces are already native. Compatibility, determinism, evidence, repository quarantine, and the 67 permanent first-generation AI identity constraints remain fail-closed throughout Refoundation.\n": "Earlier extraction waves required both dependency-graph and import-graph closure before cutover; later accepted waves resolved those boundaries. Compatibility, determinism, evidence, repository quarantine, and the 67 permanent first-generation AI identity constraints remain fail-closed as enduring architecture constraints, not as unfinished migration work.\n\nCurrent authority is terminal for Epoch 0: `historical_only` debt is zero, canonical write authority is native-only, and the remaining `neural.shared` record is an intentionally frozen asset rather than an executable compatibility boundary.\n",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one STATUS anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot carrier
        run: git rm .github/workflows/refoundation-epoch0-status-authority-carrier.yml
      - name: Commit terminal CURRENT authority
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT/STATUS.md
          git diff --cached --check
          git commit -m 'docs(refoundation): make Epoch 0 status terminal'
          git push origin HEAD:${{ github.head_ref }}
