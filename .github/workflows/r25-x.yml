name: R2.5 X
on:
  push:
    paths:
      - 'tests/test_r25_arc_local_direction.py'
      - 'cogcoder/local_grid.py'
      - 'cogcoder/arc_local.py'
      - '.github/workflows/r25-x.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_r25_arc_local_direction.py
