name: Neural vNext Native R24 Dev

on:
  push:
    branches:
      - codex/neural-native-r24-sequential-evidence-filter
    paths:
      - 'model/neural-vnext-native-r24/**'
      - '.github/workflows/neural-vnext-native-r24-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r24/**'
      - '.github/workflows/neural-vnext-native-r24-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r24-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r24-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R24 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r24:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r24/*.py model/neural-vnext-native-r24/scripts/*.py model/neural-vnext-native-r24/tests/*.py
          python -m pytest -q model/neural-vnext-native-r24/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r24/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r24/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['benchmark']['development_indices']==[1376,1407]
          assert lock['benchmark']['confirmation_indices']==[1408,1439]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          assert lock['architecture']['expected_successor_parameters']==83607
          assert lock['private_label_boundary']['inference_private_goal_use'] is False
          assert lock['calibration_boundary']['dev_based_threshold_tuning'] is False
          assert lock['training']['max_overrides_per_episode']==1
          PY
      - name: Train, calibrate, and run locked R24 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r24:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r24-output
          python model/neural-vnext-native-r24/scripts/run_dev.py \
            --checkpoint r24-output/r24.pt \
            --manifest r24-output/r24.manifest.json \
            --dev-result r24-output/r24.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r24-output/r24.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_label_boundary']['inference_private_goal_use'] is False
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R24_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R24_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r24-dev
          path: |
            r24-output/r24.pt
            r24-output/r24.manifest.json
            r24-output/r24.dev.json
          if-no-files-found: error
          retention-days: 90
