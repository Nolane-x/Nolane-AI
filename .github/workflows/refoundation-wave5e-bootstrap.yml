name: Refoundation Wave 5E Memory Retrieval Bootstrap

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5d-native-memory-lifecycle
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5e-native-memory-retrieval' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply deterministic Wave 5E authority cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after_once(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if addition in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: insertion anchor count != 1: {text.count(anchor)}')
              target.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          def remove_once(path: str, line: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if line not in text:
                  return
              if text.count(line) != 1:
                  raise SystemExit(f'{path}: removal anchor count != 1: {text.count(line)}')
              target.write_text(text.replace(line, '', 1), encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement anchor count != 1: {text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Advance only Retrieval's local revision.
          insert_after_once(
              'cogcoder/refoundation/component_versions.py',
              '        "external.memory.lifecycle": 1,\n',
              '        "external.memory.retrieval": 1,\n',
          )

          # Retire only Retrieval from active facades; Context remains active.
          remove_once(
              'cogcoder/refoundation/facades.py',
              '        FacadeBinding("external.memory.retrieval", "nolane.memory.retrieval", "cogcoder.organization.memory_retrieval", ("MemoryRetrievalBudget", "MemoryRetrievalEngine")),\n',
          )

          # Record native Retrieval authority with historical provenance.
          impl = Path('cogcoder/refoundation/implementation_status.py')
          text = impl.read_text(encoding='utf-8')
          lifecycle_block = '''    "external.memory.lifecycle": (\n        "nolane.memory.lifecycle",\n        ("cogcoder/organization/memory_lifecycle.py",),\n        "Native governed memory lifecycle receipts and semantic relation graph with canonical Memory/Identity/Event dependencies; historical lifecycle module bridges all public object identities.",\n    ),\n'''
          retrieval_block = '''    "external.memory.retrieval": (\n        "nolane.memory.retrieval",\n        ("cogcoder/organization/memory_retrieval.py",),\n        "Native bounded memory selection budget, receipt and retrieval engine over canonical Memory Fabric and Lifecycle relation graph; historical retrieval module bridges all public object identities.",\n    ),\n'''
          if retrieval_block not in text:
              if text.count(lifecycle_block) != 1:
                  raise SystemExit('implementation_status.py: lifecycle native anchor not unique')
              text = text.replace(lifecycle_block, lifecycle_block + retrieval_block, 1)
              impl.write_text(text, encoding='utf-8')

          # Preserve pinned-tree source→canonical destination after facade retirement.
          insert_after_once(
              'cogcoder/refoundation/inventory.py',
              '    "cogcoder/organization/memory_lifecycle.py": "nolane/memory/lifecycle.py",\n',
              '    "cogcoder/organization/memory_retrieval.py": "nolane/memory/retrieval.py",\n',
          )

          # Accepted native/version sets advance Retrieval. Keep Context as a stable unmigrated oracle.
          versions = Path('tests/test_refoundation_component_versions.py')
          text = versions.read_text(encoding='utf-8')
          accepted_prefix = text.split('}', 1)[0]
          marker = '    "external.memory.retrieval",\n'
          if marker not in accepted_prefix:
              anchor = '    "external.memory.lifecycle",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('component version test lifecycle set anchor not unique')
              text = text.replace(anchor, anchor + marker, 1)
          text = text.replace(
              '    assert str(component_version("external.memory.retrieval")) == "0.0.0"\n',
              '    assert str(component_version("external.context")) == "0.0.0"\n',
          )
          text = text.replace(
              '    assert str(next_component_version("external.memory.retrieval")) == "0.0.1"\n',
              '    assert str(next_component_version("external.context")) == "0.0.1"\n',
          )
          versions.write_text(text, encoding='utf-8')

          status = Path('tests/test_refoundation_implementation_status.py')
          text = status.read_text(encoding='utf-8')
          accepted_prefix = text.split('}', 1)[0]
          if marker not in accepted_prefix:
              anchor = '    "external.memory.lifecycle",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('implementation status lifecycle set anchor not unique')
              text = text.replace(anchor, anchor + marker, 1)
          text = text.replace(
              '    assert ledger["external.memory.retrieval"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
              '    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
          )
          status.write_text(text, encoding='utf-8')

          replace_once(
              'tests/test_refoundation_memory_public_layout.py',
              '        retrieval: ("external.memory.retrieval", "0.0.0"),\n',
              '        retrieval: ("external.memory.retrieval", "0.0.1"),\n',
          )

          # Wave 5C/5D keep their own native-owner invariants without freezing Retrieval debt.
          wave5c = Path('tests/test_refoundation_wave5c_native_memory_fabric.py')
          text = wave5c.read_text(encoding='utf-8')
          text = text.replace('    assert "external.memory.retrieval" in facade_ids\n', '')
          wave5c.write_text(text, encoding='utf-8')

          wave5d = Path('tests/test_refoundation_wave5d_native_memory_lifecycle.py')
          text = wave5d.read_text(encoding='utf-8')
          text = text.replace('    assert "external.memory.retrieval" in facade_ids\n', '    assert "external.context" in facade_ids\n')
          text = text.replace('    assert len(non_native) == 41\n', '    assert len(non_native) <= 41\n')
          old_counts = '''    assert counts == {\n        "compatibility_facade": 29,\n        "frozen_asset": 1,\n        "historical_only": 7,\n        "legacy_internal": 4,\n    }\n'''
          new_counts = '''    assert ledger["external.memory.lifecycle"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert all(row.component_id != "external.memory.lifecycle" for row in non_native)\n'''
          if old_counts in text:
              text = text.replace(old_counts, new_counts, 1)
          elif new_counts not in text:
              raise SystemExit('Wave 5D debt invariant block is neither old nor updated')
          text = text.replace(
              '    assert ledger["external.memory.retrieval"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
              '',
          )
          wave5d.write_text(text, encoding='utf-8')
          PY
      - name: Materialize native-debt projections
        run: python -m nolane.repository.audit --write
      - name: Prove historical archive index did not drift
        run: git diff --exit-code -- archive/INDEX.json
      - name: Verify Wave 5E targeted contracts
        run: |
          python -m nolane.repository.audit --check
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_git_inventory.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5c_native_memory_fabric.py \
            tests/test_refoundation_wave5d_native_memory_lifecycle.py \
            tests/test_refoundation_wave5e_native_memory_retrieval.py
      - name: Commit deterministic Wave 5E cutover
        shell: bash
        run: |
          git add \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/inventory.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5c_native_memory_fabric.py \
            tests/test_refoundation_wave5d_native_memory_lifecycle.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md
          if git diff --cached --quiet; then
            echo 'No Wave 5E cutover changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(refoundation): cut over native memory retrieval authority'
          git push origin HEAD:${GITHUB_HEAD_REF}
