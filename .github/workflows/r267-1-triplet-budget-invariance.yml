name: R2.67.1 Triplet Budget Invariance

on:
  push:
    branches: [r2671-triplet-budget-invariance-gpt56sol]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'tests/test_r267_1_triplet_budget_semantics.py'
      - '.github/workflows/r267-1-triplet-budget-invariance.yml'
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'tests/test_r267_1_triplet_budget_semantics.py'
      - '.github/workflows/r267-1-triplet-budget-invariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 fairness parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_pair_budget_semantics.py
      - name: R2.67.1 multi-triplet semantic budget challenger
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_triplet_budget_semantics.py
