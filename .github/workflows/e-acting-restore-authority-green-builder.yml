name: E Acting Restore Authority GREEN Builder

on:
  push:
    branches:
      - e-acting-restore-authority-green-20260902

permissions:
  contents: write

jobs:
  build-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply deterministic authority closure
        run: python tools/e_acting_restore_authority_patch.py
      - name: Compile changed authority surfaces
        run: |
          python -m compileall -q \
            nolane/external_core/execution.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_acting_restore_authority.py \
            tests/test_refoundation_component_versions.py
      - name: Focused E Acting GREEN with diagnostic transport
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_refoundation_acting_*.py \
            tests/test_refoundation_wave5aa_native_execution_control.py \
            tests/test_refoundation_component_versions.py \
            > /tmp/e-acting-green.txt 2>&1
          status=$?
          set -e
          cat /tmp/e-acting-green.txt
          if [ "$status" -ne 0 ]; then
            mkdir -p .ci-diagnostics
            cp /tmp/e-acting-green.txt .ci-diagnostics/e-acting-restore-authority.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci-diagnostics/e-acting-restore-authority.txt
            git commit -m "ci(E): capture restore-authority regression diagnostics [skip ci]"
            git push origin HEAD:e-acting-restore-authority-green-20260902
            exit "$status"
          fi
      - name: Whitespace integrity
        run: git diff --check
      - name: Commit verified production patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nolane/external_core/execution.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_component_versions.py
          git diff --cached --check
          git commit -m "E Acting: close persisted restore authority [skip ci]"
          git push origin HEAD:e-acting-restore-authority-green-20260902
