name: Post-Epoch 0 metadata authority carrier

on:
  push:
    branches:
      - post-epoch0/metadata-authority-hardening
    paths:
      - .github/workflows/post-epoch0-metadata-authority-carrier.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-epoch0/metadata-authority-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Move metadata authority into nolane
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("cogcoder/refoundation")
          target = Path("nolane/metadata")
          target.mkdir(parents=True, exist_ok=True)

          for name in ('_component_specs.py', 'versioning.py', 'component_versions.py', 'manifests.py', 'regions.py', 'migration.py', 'composition.py', 'capabilities.py', 'runtime_state_map.py', 'runtime_composition.py', 'facades.py', 'implementation_status.py'):
              shutil.copyfile(source / name, target / name)

          writes = {'nolane/metadata/__init__.py': '"""Canonical post-Epoch-0 architecture metadata authority.\n\nThis package owns component/manifests/version/runtime-description metadata.\nHistorical ``cogcoder.refoundation`` modules are compatibility re-exports only.\n"""\n', 'nolane/metadata/organization_spec.py': '"""Canonical organization specification sourced from AI-first Nolane data."""\n\nfrom nolane.ai.catalog import (\n    CENTRAL_TOOLS,\n    GENERAL_TOOLS,\n    LOCAL_PARAMETER_BANDS,\n    REGION_SPECS,\n    SHARED_CORE_PARAMETERS,\n    UNIVERSAL_COGNITIVE_CAPABILITIES,\n    CanonicalRegionSpec,\n    CanonicalRoleSpec,\n    build_canonical_identity_states,\n    load_profiles,\n    load_regions,\n    load_shared_external,\n    load_shared_neural,\n)\n\n__all__ = (\n    "CanonicalRoleSpec",\n    "CanonicalRegionSpec",\n    "UNIVERSAL_COGNITIVE_CAPABILITIES",\n    "GENERAL_TOOLS",\n    "CENTRAL_TOOLS",\n    "SHARED_CORE_PARAMETERS",\n    "LOCAL_PARAMETER_BANDS",\n    "REGION_SPECS",\n    "load_shared_neural",\n    "load_shared_external",\n    "load_regions",\n    "load_profiles",\n    "build_canonical_identity_states",\n)\n', 'nolane/external_core/catalog.py': 'from nolane.metadata.capabilities import (\n    ExternalCoreManifest,\n    agent_capability_projection,\n    build_external_core_catalog,\n)\n\nCOMPONENT_VERSION = "0.0.0"\n\n__all__ = (\n    "ExternalCoreManifest",\n    "agent_capability_projection",\n    "build_external_core_catalog",\n)\n', 'nolane/tools/catalog.py': 'from nolane.metadata.capabilities import ToolManifest, build_tool_catalog\n\nCOMPONENT_VERSION = "0.0.0"\n\n__all__ = ("ToolManifest", "build_tool_catalog")\n', 'nolane/organization/manifests.py': 'from nolane.ai.catalog import (\n    CENTRAL_TOOLS,\n    GENERAL_TOOLS,\n    REGION_SPECS,\n    UNIVERSAL_COGNITIVE_CAPABILITIES,\n)\nfrom nolane.metadata.manifests import AgentManifest, build_bootstrap_agent_manifests\nfrom nolane.schemas.identity import AgentIdentity\n\nCOMPONENT_ID = "organization.identity"\nCOMPONENT_VERSION = "0.0.0"\n\n\ndef build_agent_manifests() -> tuple[AgentManifest, ...]:\n    return build_bootstrap_agent_manifests()\n\n\ndef build_agent_identities() -> tuple[AgentIdentity, ...]:\n    rows = tuple(AgentIdentity.from_state(row.identity_state()) for row in build_bootstrap_agent_manifests())\n    if len(rows) != 67 or len({row.agent_id for row in rows}) != 67:\n        raise ValueError("canonical identity authority requires exactly 67 unique permanent identities")\n    return rows\n\n\n__all__ = (\n    "AgentManifest",\n    "CENTRAL_TOOLS",\n    "GENERAL_TOOLS",\n    "REGION_SPECS",\n    "UNIVERSAL_COGNITIVE_CAPABILITIES",\n    "build_agent_identities",\n    "build_agent_manifests",\n)\n', 'nolane/organization/regions.py': 'from nolane.metadata.regions import RegionManifest, build_region_manifests\n\nCOMPONENT_ID = "organization.identity"\nCOMPONENT_VERSION = "0.0.0"\n\n__all__ = ("RegionManifest", "build_region_manifests")\n', 'nolane/organization/composition.py': 'from nolane.metadata.composition import CompositionLock, build_wave1_composition_lock\nfrom nolane.metadata.manifests import ComponentManifest, build_component_manifests\n\nCOMPONENT_ID = "organization.runtime"\nCOMPONENT_VERSION = "0.0.0"\n\n\ndef build_component_graph() -> tuple[ComponentManifest, ...]:\n    return build_component_manifests()\n\n\ndef build_composition_lock() -> CompositionLock:\n    return build_wave1_composition_lock()\n\n\n__all__ = (\n    "ComponentManifest",\n    "CompositionLock",\n    "build_component_graph",\n    "build_composition_lock",\n)\n', 'nolane/runtime/state.py': 'from nolane.metadata.runtime_state_map import (\n    CanonicalStateBundle,\n    RuntimeStateBinding,\n    RuntimeStateEnvelope,\n    RuntimeStateMapper,\n    build_runtime_state_bindings,\n)\n\nCOMPONENT_ID = "organization.runtime"\nCOMPONENT_VERSION = "0.0.0"\n\n__all__ = (\n    "CanonicalStateBundle",\n    "RuntimeStateBinding",\n    "RuntimeStateEnvelope",\n    "RuntimeStateMapper",\n    "build_runtime_state_bindings",\n)\n', 'nolane/runtime/composition.py': '"""Semantic runtime composition authority."""\n\nfrom nolane.metadata.runtime_composition import (\n    SemanticRuntimeComposition,\n    SemanticRuntimeNode,\n    build_semantic_runtime_composition,\n)\n\n\ndef build_runtime_composition() -> SemanticRuntimeComposition:\n    return build_semantic_runtime_composition()\n\n\n__all__ = (\n    "SemanticRuntimeComposition",\n    "SemanticRuntimeNode",\n    "build_runtime_composition",\n)\n', 'nolane/runtime/versioning.py': 'from nolane.metadata.component_versions import (\n    component_revision_map,\n    component_version,\n    next_component_version,\n)\nfrom nolane.metadata.versioning import ComponentVersion\n\n__all__ = (\n    "ComponentVersion",\n    "component_revision_map",\n    "component_version",\n    "next_component_version",\n)\n', 'cogcoder/refoundation/_component_specs.py': '"""Compatibility re-export of canonical component specifications."""\n\nfrom nolane.metadata._component_specs import COMPONENT_SPECS\n\n__all__ = ("COMPONENT_SPECS",)\n', 'cogcoder/refoundation/versioning.py': '"""Compatibility re-export of canonical component version semantics."""\n\nfrom nolane.metadata.versioning import ComponentVersion\n\n__all__ = ("ComponentVersion",)\n', 'cogcoder/refoundation/component_versions.py': '"""Compatibility re-export of canonical component revision authority."""\n\nfrom nolane.metadata import component_versions as _canonical\nfrom nolane.metadata.component_versions import (\n    component_revision_map,\n    component_version,\n    next_component_version,\n)\n\n_COMPONENT_REVISIONS = _canonical._COMPONENT_REVISIONS\n\n__all__ = (\n    "component_revision_map",\n    "component_version",\n    "next_component_version",\n)\n', 'cogcoder/refoundation/manifests.py': '"""Compatibility re-export of canonical Nolane manifest authority."""\n\nfrom nolane.metadata.manifests import (\n    FIRST_GENERATION_SNAPSHOT,\n    REFUNDATION_EPOCH,\n    AgentManifest,\n    ComponentManifest,\n    build_bootstrap_agent_manifests,\n    build_component_manifests,\n)\n\n__all__ = (\n    "FIRST_GENERATION_SNAPSHOT",\n    "REFUNDATION_EPOCH",\n    "AgentManifest",\n    "ComponentManifest",\n    "build_bootstrap_agent_manifests",\n    "build_component_manifests",\n)\n', 'cogcoder/refoundation/regions.py': '"""Compatibility re-export of canonical region metadata."""\n\nfrom nolane.metadata.regions import RegionManifest, build_region_manifests\n\n__all__ = ("RegionManifest", "build_region_manifests")\n', 'cogcoder/refoundation/migration.py': '"""Compatibility re-export of canonical migration metadata."""\n\nfrom nolane.metadata.migration import (\n    LegacyDisposition,\n    LegacyPathRecord,\n    ReviewDepth,\n    WAVE1_PRESERVED_LEGACY_PATHS,\n)\n\n__all__ = (\n    "LegacyDisposition",\n    "LegacyPathRecord",\n    "ReviewDepth",\n    "WAVE1_PRESERVED_LEGACY_PATHS",\n)\n', 'cogcoder/refoundation/composition.py': '"""Compatibility re-export of canonical composition metadata."""\n\nfrom nolane.metadata.composition import CompositionLock, build_wave1_composition_lock\n\n__all__ = ("CompositionLock", "build_wave1_composition_lock")\n', 'cogcoder/refoundation/capabilities.py': '"""Compatibility re-export of canonical capability metadata."""\n\nfrom nolane.metadata.capabilities import (\n    AgentCapabilityProjection,\n    ExternalCoreManifest,\n    ToolManifest,\n    agent_capability_projection,\n    build_external_core_catalog,\n    build_tool_catalog,\n)\n\n__all__ = (\n    "AgentCapabilityProjection",\n    "ExternalCoreManifest",\n    "ToolManifest",\n    "agent_capability_projection",\n    "build_external_core_catalog",\n    "build_tool_catalog",\n)\n', 'cogcoder/refoundation/runtime_state_map.py': '"""Compatibility re-export of canonical runtime state metadata."""\n\nfrom nolane.metadata.runtime_state_map import (\n    CanonicalStateBundle,\n    RuntimeStateBinding,\n    RuntimeStateEnvelope,\n    RuntimeStateMapper,\n    build_runtime_state_bindings,\n)\n\n__all__ = (\n    "CanonicalStateBundle",\n    "RuntimeStateBinding",\n    "RuntimeStateEnvelope",\n    "RuntimeStateMapper",\n    "build_runtime_state_bindings",\n)\n', 'cogcoder/refoundation/runtime_composition.py': '"""Compatibility re-export of canonical semantic runtime composition."""\n\nfrom nolane.metadata.runtime_composition import (\n    SemanticRuntimeComposition,\n    SemanticRuntimeNode,\n    build_semantic_runtime_composition,\n)\n\n__all__ = (\n    "SemanticRuntimeComposition",\n    "SemanticRuntimeNode",\n    "build_semantic_runtime_composition",\n)\n', 'cogcoder/refoundation/facades.py': '"""Compatibility re-export of canonical facade metadata."""\n\nfrom nolane.metadata.facades import (\n    FacadeBinding,\n    FacadeParityReport,\n    build_active_facade_bindings,\n    validate_active_facades,\n)\n\n__all__ = (\n    "FacadeBinding",\n    "FacadeParityReport",\n    "build_active_facade_bindings",\n    "validate_active_facades",\n)\n', 'cogcoder/refoundation/implementation_status.py': '"""Compatibility re-export of canonical implementation-status authority."""\n\nfrom nolane.metadata import implementation_status as _canonical\nfrom nolane.metadata.implementation_status import (\n    ComponentImplementationRecord,\n    ImplementationStatus,\n    build_component_implementation_ledger,\n)\n\n_NATIVE = _canonical._NATIVE\n_HISTORICAL_ONLY = _canonical._HISTORICAL_ONLY\n_FROZEN_ASSET = _canonical._FROZEN_ASSET\n_LEGACY_SOURCE_HINTS = _canonical._LEGACY_SOURCE_HINTS\n\n__all__ = (\n    "ComponentImplementationRecord",\n    "ImplementationStatus",\n    "build_component_implementation_ledger",\n)\n', 'cogcoder/refoundation/organization_spec.py': '"""Compatibility re-export of canonical AI-first organization specification."""\n\nfrom nolane.metadata.organization_spec import *\nfrom nolane.metadata.organization_spec import __all__\n'}
          for relative, content in writes.items():
              path = Path(relative)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          audit_path = Path("nolane/repository/audit_v2.py")
          audit = audit_path.read_text(encoding="utf-8")
          old = '''from cogcoder.refoundation.implementation_status import (
              ImplementationStatus,
              build_component_implementation_ledger,
          )'''
          new = '''from nolane.metadata.implementation_status import (
              ImplementationStatus,
              build_component_implementation_ledger,
          )'''
          if audit.count(old) != 1:
              raise SystemExit("audit_v2 import anchor drift")
          audit_path.write_text(audit.replace(old, new), encoding="utf-8")
          PY

      - name: Verify focused metadata migration
        shell: bash
        run: |
          python -m compileall -q cogcoder/refoundation nolane
          python -m pytest -q \
            tests/test_refoundation_post_epoch0_metadata_authority.py \
            tests/test_refoundation_post_epoch0_native_boundary.py \
            tests/test_refoundation_epoch0_final_closure.py
          python -m nolane.repository.audit --check

      - name: Self-delete and commit
        shell: bash
        run: |
          rm .github/workflows/post-epoch0-metadata-authority-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move canonical metadata authority into nolane"
          git push origin HEAD:post-epoch0/metadata-authority-hardening
