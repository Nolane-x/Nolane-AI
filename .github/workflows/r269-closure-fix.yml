name: R2.69 Compositional Scratch Closure Fix

on:
  push:
    branches: [ r269-autonomous-transfer-meta-learning-kernel-gpt56sol ]
    paths:
      - '.github/workflows/r269-closure-fix.yml'

permissions:
  contents: write

env:
  BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol

jobs:
  red-green-materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Confirm hosted RED contract on current source
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r269_scratch_compositional_closure.py
          code=$?
          set -e
          test "$code" -ne 0
      - name: Materialize fair compositional closure
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cogcoder/r269_transfer_runtime.py')
          text = path.read_text()
          old = '''    for op in signature.allowed_binary_ops:
              for nested in level1:
                  for field in fields:
                      if not add(Binary(op, nested, field)):
                          return rows
                      if not add(Binary(op, field, nested)):
                          return rows
              if config.scratch_max_depth == 2:
                  return rows

              # Depth 3 is reserved for the roomy expressibility control. Proposal
              # ordering up through depth 2 is identical to the tight baseline.
              previous = tuple(row.expression for row in rows)
              frontier = tuple(expr for expr in previous if expr.depth == 2)
              lower = tuple(expr for expr in previous if expr.depth <= 2)
              for op in signature.allowed_binary_ops:
                  for left in frontier:
                      for right in lower:
                          if not add(Binary(op, left, right)):
                              return rows
                          if right is not left and not add(Binary(op, right, left)):
                              return rows
              return rows
          '''
          new = '''    # Enumerate the complete binary composition shapes at expression depth 2.
              # Operand-pair-first scheduling gives every outer operator an equal chance
              # under a hard proof-distinct candidate cap; chain-shaped expressions cannot
              # starve balanced forms such as (a+b)-(c+d).
              lower = fields + tuple(level1)
              for left in lower:
                  for right in lower:
                      if max(left.depth, right.depth) != 1:
                          continue
                      for op in signature.allowed_binary_ops:
                          if not add(Binary(op, left, right)):
                              return rows
              if config.scratch_max_depth == 2:
                  return rows

              # Depth 3 extends the now-compositionally-closed depth-2 frontier.  Keep
              # operand-pair-first / operator-round-robin scheduling so no operator family
              # can monopolize the bounded scratch candidate ledger.
              previous = tuple(row.expression for row in rows)
              frontier = tuple(expr for expr in previous if expr.depth == 2)
              lower_depth = tuple(expr for expr in previous if expr.depth <= 2)
              for left in frontier:
                  for right in lower_depth:
                      for op in signature.allowed_binary_ops:
                          if not add(Binary(op, left, right)):
                              return rows
                          if right is not left and not add(Binary(op, right, left)):
                              return rows
              return rows
          '''
          if old not in text:
              raise SystemExit('expected scratch block not found; refusing blind mutation')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Closure GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_scratch_compositional_closure.py
      - name: Full R2.69 and protected R2.68 GREEN before commit
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Commit verified source fix
        run: |
          git config user.name 'Nolane R2.69 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add cogcoder/r269_transfer_runtime.py
          git commit -m 'fix(r269): close scratch composition grammar fairly'
          git push origin HEAD:${BRANCH}
