name: R2.38 Compositional Probe Language

on:
  push:
    branches: [main]
    paths:
      - 'cogcoder/r237_query_generation.py'
      - 'cogcoder/r238_*.py'
      - 'benchmarks/kfigg/r238_*.py'
      - 'tests/test_r238_*.py'
      - 'research/R2_38_*.json'
      - 'archive/root-history/historical_r_series/R2_38_DELIVERY.md'
      - 'archive/root-history/historical_r_series/R2_38_RELEASE_MANIFEST.json'
      - '.github/workflows/r238-compositional-probe-language.yml'
  workflow_dispatch:

jobs:
  verify-r238-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify R2.38 executable core
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_r238_probe_language.py \
            tests/test_r238_probe_synthesis.py \
            tests/test_r238_compositional_discovery.py \
            tests/test_r238_compositional_probe_language.py
      - name: Verify frozen evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('research/R2_38_VERIFY_RESULT.json').read_text())
          p=json.loads(Path('research/R2_38_PHASE_A_RESULT.json').read_text())
          m=json.loads(Path('archive/root-history/historical_r_series/R2_38_RELEASE_MANIFEST.json').read_text())
          assert v['decision']=='accepted'
          assert v['checks_passed']==v['check_count']==8
          assert v['exact_replays']==6
          assert p['accepted'] is True and p['agi_engineering_readiness']==25.6
          assert m['decision']=='ACCEPTED' and m['readiness']==25.6
          print('R2.38 evidence boundary OK')
          PY
