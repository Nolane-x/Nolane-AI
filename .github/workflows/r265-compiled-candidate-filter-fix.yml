name: R2.65 Compiled Candidate Filter Fix

on:
  push:
    branches: [fix-r265-compiled-candidate-filter-gpt56sol]
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Apply content-addressed compiled-candidate filter fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text=path.read_text()
          old="    allowed_ids = {candidate.candidate_id for candidate in filtered}\n    live = [row for row in primitive_rows if row.candidate.candidate_id in allowed_ids]\n"
          new="    allowed_content_digests = {repository_content_digest(row.candidate) for row in filtered}\n    live = [row for row in primitive_rows if row.content_digest in allowed_content_digests]\n"
          if old in text:
              assert text.count(old) == 1
              text=text.replace(old, new, 1)
              path.write_text(text)
          assert old not in path.read_text()
          assert new in path.read_text()
          PY
      - name: Run active R2.65 focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Preserve accepted R2.64.1 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: Commit correction after GREEN verification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_COMPILED_FILTER_ALREADY_APPLIED
          else
            git commit -m 'fix: filter R2.65 compiled candidates by repository content'
            git push origin HEAD:fix-r265-compiled-candidate-filter-gpt56sol
          fi
