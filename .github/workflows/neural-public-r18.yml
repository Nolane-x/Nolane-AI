name: Neural Public R18 Recovery Candidate

on:
  push:
    paths:
      - 'model/neural-public-r18/**'
      - '.github/workflows/neural-public-r18.yml'
  pull_request:
    paths:
      - 'model/neural-public-r18/**'
      - '.github/workflows/neural-public-r18.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-public-r18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install -q pytest numpy
          python - <<'PY' || python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          import torch
          print(torch.__version__)
          PY
      - name: Compile
        run: python -m py_compile model/neural-public-r18/npr18/*.py model/neural-public-r18/scripts/*.py model/neural-public-r18/tests/*.py
      - name: Run contracts
        env:
          PYTHONPATH: model/neural-public-r18:model/r1.8
        run: python -m pytest -q model/neural-public-r18/tests

  train-dev-smoke:
    runs-on: ubuntu-24.04
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install torch
        run: |
          python - <<'PY' || python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          import torch
          print(torch.__version__)
          PY
      - name: Train, freeze and run oracle-free dev
        run: |
          python model/neural-public-r18/scripts/train_and_dev.py \
            --output-dir neural-public-r18-evidence \
            --train-count 24 \
            --dev-count 4 \
            --epochs 4 \
            --hidden-dim 160 \
            --reasoning-steps 4
      - name: Upload frozen candidate and dev evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-public-r18-smoke-evidence
          path: neural-public-r18-evidence/
          if-no-files-found: warn
          retention-days: 7
