name: R2.65 PatchMacro Support Invariant Fix

on:
  push:
    branches: [fix-r265-patchmacro-support-invariant-gpt56sol]
    paths: ['.github/workflows/r265-support-invariant-fix.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply minimal PatchMacro invariant correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text=path.read_text()
          old='''                support=0,\n'''
          new='''                support=1,\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one support=0 hypothesis construction, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install focused dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Run all R2.65 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Recompute authored and local external evidence smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer
          phase=run_benchmark()
          external=run_external_transfer(np.multiply, source_id='numpy.multiply', source_version=np.__version__)
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R265_SUPPORT_INVARIANT_GREEN')
          PY
      - name: Commit verified minimal production fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          git commit -m 'fix: satisfy PatchMacro support invariant in R2.65 hypotheses'
          git push origin HEAD:fix-r265-patchmacro-support-invariant-gpt56sol
