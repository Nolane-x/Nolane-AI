name: Neural R2.4 Shared Core Acceptance

on:
  push:
    branches:
      - neural-r24-shared-cognition-contract-gpt56sol
      - main
    paths:
      - 'nolane/neural/**'
      - 'nolane/core/canonical_digest.py'
      - 'nolane/external_core/context.py'
      - 'nolane/external_core/execution_types.py'
      - 'tests/test_neural_r24_*.py'
      - '.github/workflows/neural-r24-shared-core.yml'
  pull_request:
    paths:
      - 'nolane/neural/**'
      - 'nolane/core/canonical_digest.py'
      - 'nolane/external_core/context.py'
      - 'nolane/external_core/execution_types.py'
      - 'tests/test_neural_r24_*.py'
      - '.github/workflows/neural-r24-shared-core.yml'

permissions:
  contents: read

jobs:
  neural-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile Neural R2.4 and bridge modules
        run: |
          python -m py_compile \
            nolane/neural/core_contract.py \
            nolane/neural/inference_bridge.py \
            nolane/core/canonical_digest.py \
            nolane/external_core/context.py \
            nolane/external_core/execution_types.py
      - name: Run Neural R2.4 contract suite
        run: |
          python -m pytest -q \
            tests/test_neural_r24_core_contract.py \
            tests/test_neural_r24_hardening.py
      - name: Verify frozen Neural R2.3 checkpoint authority
        run: python model/neural-r2.3/scripts/verify_neural_r23.py

  dependent-regression:
    runs-on: ubuntu-24.04
    needs: neural-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Run execution, context, memory and assurance regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 checkpoint authority
        run: python model/neural-r2.3/scripts/verify_neural_r23.py

  full-regression:
    runs-on: ubuntu-24.04
    needs: neural-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Run campaign and Parts I-XV regression suite
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 checkpoint authority
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
