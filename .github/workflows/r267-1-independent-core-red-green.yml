name: R2.67.1 Independent Core RED-GREEN

on:
  push:
    branches: [validation-r267-1-core-red-green-gpt56sol]
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Confirm combined R2.67.1 correctness contract is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_correctness_hotfix.py
          rc=$?
          set -e
          test "$rc" -ne 0
          echo R267_1_COMBINED_RED_CONFIRMED
      - name: Apply peer-authored minimal correctness core patch ephemerally
        run: python scripts/r267_1_apply_genuine_necessity_core.py
      - name: Verify combined R2.67.1 correctness contract GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_correctness_hotfix.py
      - name: Reverify accepted R2.66 after ephemeral mutation
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
