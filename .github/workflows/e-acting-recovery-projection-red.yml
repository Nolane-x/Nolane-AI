name: E Acting Recovery Projection RED

on:
  push:
    branches:
      - e-acting-recovery-projection-red-gpt56sol

jobs:
  recovery-projection-red:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run committed recovery authority RED
        run: python -m pytest -q tests/test_refoundation_acting_recovery_projection_authority.py
