name: R2.67.1 Self-Hosted Exact-Lock Validation

on:
  push:
    branches: [validation-r2671-selfhosted-exact-lock-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cross-python:
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify frozen lock and focused contracts
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          assert lock['source_freeze_head'] == '6c516f854fb34773287f00e6efd021293f039d73'
          assert lock['authority_corrections']['attempted_case_receipt_accounting'] is True
          assert lock['authority_corrections']['triplet_budget_semantic_invariance'] is True
          assert lock['authority_corrections']['post_merge_gate_blob_frozen'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R2671_SELFHOSTED_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  full-lineage:
    needs: [cross-python]
    runs-on: self-hosted
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
      - name: Recompute exact evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer
          assert np.__version__ == '2.4.6'
          phase=run_benchmark()
          external=run_external_transfer(np.dot, source_id='numpy:numpy.dot', source_version=np.__version__)
          assert phase == json.loads(Path('R2_67_1_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_67_1_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert phase['oracle_accounting_exact'] is True
          assert external['passed'] is True
          assert external['oracle_accounting_exact'] is True
          print('R2671_SELFHOSTED_EVIDENCE_OK')
          PY
      - name: Protected lineage
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Build complete validation snapshot
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED.zip HEAD
          sha256sum release/Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED.zip > release/Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED.zip.sha256
          unzip -tq release/Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED
          path: |
            release/Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED.zip
            release/Nolane-AI-R2.67.1-SELFHOSTED-VALIDATED.zip.sha256
      - name: Publish exact-lock success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r2671/selfhosted-exact-lock',
              'description':'Exact frozen R2.67.1 lock, cross-Python, evidence, lineage and ZIP passed on self-hosted runner',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
