name: Neural R2.1 Recursive Latent Core

on:
  push:
    paths:
      - 'model/neural-r2.1/**'
      - '.github/workflows/neural-r21-recursive-core.yml'
  pull_request:
    paths:
      - 'model/neural-r2.1/**'
      - '.github/workflows/neural-r21-recursive-core.yml'
  workflow_dispatch:

jobs:
  neural-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install neural test dependencies
        run: |
          python -m pip install -q pytest
          python - <<'PY' || python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          import torch
          print(torch.__version__)
          PY
      - name: Compile Neural R2.1
        run: python -m py_compile model/neural-r2.1/cogcoder/*.py model/neural-r2.1/scripts/*.py
      - name: Verify architecture contracts
        run: python model/neural-r2.1/scripts/verify_neural_r21.py
      - name: Run Neural R2.1 tests
        env:
          PYTHONPATH: model/neural-r2.1
        run: python -m pytest -q model/neural-r2.1/tests
