name: R2.66 Intervention Oracle Fail-Closed Challenger

on:
  push:
    branches: [validation-r266-intervention-oracle-failclosed-gpt56sol]
  pull_request:
    branches: [r266-learned-contextual-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted parent regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Intervention-oracle fail-closed contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_intervention_oracle_failclosed.py
