name: Neural vNext Native R16 Dev

on:
  push:
    branches:
      - codex/neural-native-r16-public-dynamics-ensemble
    paths:
      - 'model/neural-vnext-native-r16/**'
      - '.github/workflows/neural-vnext-native-r16-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r16/**'
      - '.github/workflows/neural-vnext-native-r16-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r16-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r16-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R16 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r16:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r16/*.py model/neural-vnext-native-r16/scripts/*.py model/neural-vnext-native-r16/tests/*.py
          python -m pytest -q model/neural-vnext-native-r16/tests
      - name: Train public dynamics ensemble and run locked dev
        env:
          PYTHONPATH: model/neural-vnext-native-r16:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python model/neural-vnext-native-r16/scripts/run_dev.py --output r16-output
      - name: Enforce fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r16/PREDEV_LOCK.json').read_text())
          result=json.loads(Path('r16-output/r16.dev.json').read_text())
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert result['fresh_opened'] is False
          PY
      - name: Upload R16 development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r16-dev
          path: |
            r16-output/r16.pt
            r16-output/r16.dev.json
          if-no-files-found: error
          retention-days: 90
