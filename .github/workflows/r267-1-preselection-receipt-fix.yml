name: R2.67.1 Preselection Receipt Fix

on:
  push:
    branches: [fix-r267-1-preselection-receipt-units-sol]
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply peer R2.67.1 correctness patches ephemerally
        run: |
          python scripts/r267_1_apply_genuine_necessity_core.py
          python scripts/r267_1_apply_certified_ablation_authority.py
      - name: Confirm independent preselection contract RED before this fix
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_preselection_receipt_units.py
          rc=$?
          set -e
          test "$rc" -ne 0
          echo R267_1_PRESELECTION_RED_CONFIRMED
      - name: Apply minimal preselection observation-ledger fix
        run: python scripts/r267_1_apply_preselection_receipt_units.py
      - name: Confirm preselection contract GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_preselection_receipt_units.py
      - name: Preserve accepted parent after ephemeral fix
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
