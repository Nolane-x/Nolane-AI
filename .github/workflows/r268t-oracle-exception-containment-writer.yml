name: R2.68-T Oracle Exception Containment GREEN Writer

on:
  push:
    branches: [hardening-r268t-oracle-exception-containment-gpt56sol]
    paths:
      - 'scripts/r268t_apply_oracle_exception_containment.py'
      - '.github/workflows/r268t-oracle-exception-containment-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r268t-oracle-exception-containment-writer
  cancel-in-progress: false

jobs:
  cross-version-validate-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-oracle-exception-containment-gpt56sol
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_oracle_exception_containment.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_oracle_exception_containment.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py

      - name: Materialize tested oracle-boundary source
        run: |
          if git diff --quiet -- cogcoder/r268_cross_task_causal_transfer.py; then
            echo 'Production source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r268_cross_task_causal_transfer.py
          git commit -m 'fix: contain ordinary R2.68-T oracle exceptions'
          git push origin HEAD:hardening-r268t-oracle-exception-containment-gpt56sol
