name: R2.41 Multi-Macro Competition

on:
  push:
    branches: [ main ]
    paths:
      - "cogcoder/r241_*.py"
      - "benchmarks/kfigg/r241_*.py"
      - "tests/test_r241_*.py"
      - "research/R2_41_*.json"
      - "R2_41_DELIVERY.md"
      - "R2_41_RELEASE_MANIFEST.json"
      - ".github/workflows/r241-multi-macro-competition.yml"
  pull_request:
    paths:
      - "cogcoder/r241_*.py"
      - "benchmarks/kfigg/r241_*.py"
      - "tests/test_r241_*.py"
      - "research/R2_41_*.json"
      - "R2_41_DELIVERY.md"
      - "R2_41_RELEASE_MANIFEST.json"
      - ".github/workflows/r241-multi-macro-competition.yml"

jobs:
  verify-r241-core:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest z3-solver
      - name: Run R2.41 focused capability tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r241_macro_competition.py \
            tests/test_r241_competitive_discovery.py \
            tests/test_r241_multi_macro_benchmark.py
      - name: Verify frozen accepted evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          phase = json.loads(Path('research/R2_41_PHASE_A_RESULT.json').read_text())
          verify = json.loads(Path('research/R2_41_VERIFY_RESULT.json').read_text())
          assert phase['decision'] == 'ACCEPTED'
          assert phase['accepted'] is True
          assert phase['agi_engineering_readiness'] == 27.9
          assert verify['decision'] == 'accepted'
          assert verify['checks_passed'] == 8
          assert verify['exact_replays'] == 6
          assert verify['readiness_if_accepted'] == 27.9
          print('R2.41 evidence boundary PASS')
          PY
