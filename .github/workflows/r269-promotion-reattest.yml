name: R2.69 Promotion Exact-Source Reattestation

on:
  push:
    branches: [r269-autonomous-transfer-meta-learning-kernel-gpt56sol]
    paths:
      - '.github/workflows/r269-promotion-reattest.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol
  SOURCE_AUTHORITY_PARENT: fda7f502185266fedb00886d5786c6d28cc0e0eb
  VERIFIER_ISSUER: github.hosted.r269.promotion-verifier

concurrency:
  group: r269-promotion-exact-source-reattest
  cancel-in-progress: false

jobs:
  verify-materialize-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Refuse stale reattestation writer
        run: |
          set -euo pipefail
          git fetch origin ${BRANCH}
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/${BRANCH})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_AUTHORITY_PARENT" HEAD
      - name: Derive hosted authority identities
        id: identity
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json,os,subprocess
          workflow_blob=subprocess.check_output(['git','hash-object','.github/workflows/r269-promotion-reattest.yml'],text=True).strip()
          tree_sha=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          root_payload={
              'schema_version':1,
              'repository':os.environ['GITHUB_REPOSITORY'],
              'workflow_blob':workflow_blob,
              'verifier_issuer':os.environ['VERIFIER_ISSUER'],
          }
          authority_root=hashlib.sha256(json.dumps(root_payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          source_tree_digest=hashlib.sha256(tree_sha.encode()).hexdigest()
          print('authority_root='+authority_root)
          print('source_tree_digest='+source_tree_digest)
          print('run_identity=github-actions:'+os.environ['GITHUB_RUN_ID']+':'+os.environ['GITHUB_RUN_ATTEMPT'])
          print('workflow_blob='+workflow_blob)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Python 3.11 protected lineage and promotion authority
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_scoped_promotion.py tests/test_r269_promotion_registry.py tests/test_r269_promotion_evidence_authority.py tests/test_r269_promotion_verifier_authority.py tests/test_r269_promotion_authority_benchmark.py tests/test_r269_governed_runtime.py
      - name: Freeze Python 3.11 promotion result
        env:
          AUTHORITY_ROOT: ${{ steps.identity.outputs.authority_root }}
          SOURCE_TREE_DIGEST: ${{ steps.identity.outputs.source_tree_digest }}
          RUN_IDENTITY: ${{ steps.identity.outputs.run_identity }}
          WORKFLOW_BLOB: ${{ steps.identity.outputs.workflow_blob }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json,os
          from pathlib import Path
          from benchmarks.kfigg.r269_promotion_authority import run_promotion_authority_benchmark
          r=run_promotion_authority_benchmark(authority_root_digest=os.environ['AUTHORITY_ROOT'],hosted_run_identity=os.environ['RUN_IDENTITY'],source_tree_digest=os.environ['SOURCE_TREE_DIGEST'])
          assert r['promotion_gate_pass'] is True
          assert r['promotion_accepted'] is True
          assert r['governed_reuse_passed'] is True
          assert r['rollback_revoked'] is True
          assert r['false_accepts']==0 and r['trainable_parameter_count']==0
          r['verifier_workflow_blob']=os.environ['WORKFLOW_BLOB']
          Path('/tmp/r269_promotion_311.json').write_text(json.dumps(r,sort_keys=True,separators=(',',':')),encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Python 3.13 promotion authority
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_scoped_promotion.py tests/test_r269_promotion_registry.py tests/test_r269_promotion_evidence_authority.py tests/test_r269_promotion_verifier_authority.py tests/test_r269_promotion_authority_benchmark.py tests/test_r269_governed_runtime.py
      - name: Cross-Python exact receipt
        env:
          AUTHORITY_ROOT: ${{ steps.identity.outputs.authority_root }}
          SOURCE_TREE_DIGEST: ${{ steps.identity.outputs.source_tree_digest }}
          RUN_IDENTITY: ${{ steps.identity.outputs.run_identity }}
          WORKFLOW_BLOB: ${{ steps.identity.outputs.workflow_blob }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import json,os
          from pathlib import Path
          from benchmarks.kfigg.r269_promotion_authority import run_promotion_authority_benchmark
          first=json.loads(Path('/tmp/r269_promotion_311.json').read_text())
          second=run_promotion_authority_benchmark(authority_root_digest=os.environ['AUTHORITY_ROOT'],hosted_run_identity=os.environ['RUN_IDENTITY'],source_tree_digest=os.environ['SOURCE_TREE_DIGEST'])
          second['verifier_workflow_blob']=os.environ['WORKFLOW_BLOB']
          assert json.dumps(first,sort_keys=True,separators=(',',':')) == json.dumps(second,sort_keys=True,separators=(',',':'))
          assert second['champion_accepted_targets'] > second['challenger_accepted_targets'] or second['oracle_call_advantage'] > 0 or second['search_work_advantage'] > 0
          receipt={'schema_version':2,'milestone':'R2.69','capability':'cross-python-host-authority-bound-scoped-promotion','python_versions_verified':['3.11','3.13'],'protected_r268_green':True,**second}
          Path('R2_69_PROMOTION_AUTHORITY.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('R269_PROMOTION_REATTEST_OK='+second['semantic_result_digest'])
          PY
      - name: Recheck exact branch and retire writer
        run: |
          set -euo pipefail
          git fetch origin ${BRANCH}
          test "$(git rev-parse origin/${BRANCH})" = "$GITHUB_SHA"
          git rm .github/workflows/r269-promotion-reattest.yml
          git add R2_69_PROMOTION_AUTHORITY.json
          git config user.name 'Nolane R2.69 promotion reattestation verifier'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'evidence(r269): reattest promotion on exact hardened source'
          git push origin HEAD:${BRANCH}
