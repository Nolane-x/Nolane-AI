name: R2.66 Learned Contextual Composition

on:
  push:
    branches: [r266-learned-contextual-composition-gpt56sol]
    paths:
      - 'cogcoder/r266_*.py'
      - 'tests/test_r266_*.py'
      - 'benchmarks/kfigg/r266_*.py'
      - 'research/r266_*.py'
      - '.github/workflows/r266-learned-contextual-composition.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r266_*.py'
      - 'tests/test_r266_*.py'
      - 'benchmarks/kfigg/r266_*.py'
      - 'research/r266_*.py'
      - '.github/workflows/r266-learned-contextual-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contextual-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.65 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: R2.66 contextual contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
