name: Refoundation Wave 5Y Context Migration

on:
  push:
    branches:
      - refoundation/epoch0-wave5y-native-context

permissions:
  contents: write

jobs:
  migrate-context:
    if: ${{ !contains(github.event.head_commit.message, '[wave5y-green]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply fail-closed Wave 5Y native context cutover
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              (ROOT / path).parent.mkdir(parents=True, exist_ok=True)
              (ROOT / path).write_text(content, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1) Canonical base ContextCapsule + ContextCompiler ownership.
          existing_context = read('nolane/external_core/context.py')
          schema_start = existing_context.index('@dataclass')
          schema_end = existing_context.index('\ndef __getattr__')
          schema_body = existing_context[schema_start:schema_end].rstrip()
          legacy_context = read('cogcoder/organization/context.py')
          compiler_start = legacy_context.index('_ADMIN_EVENT_KINDS')
          compiler_body = legacy_context[compiler_start:].rstrip()
          canonical_context = f'''from __future__ import annotations

from dataclasses import dataclass
from typing import TYPE_CHECKING, Any

from nolane.memory.fabric import MemoryEntry, MemoryFabric
from nolane.organization.events import CognitiveEvent, EventKind, EventLedger
from nolane.organization.identity import AgentRegistry
from nolane.organization.tasks import TaskGraph

if TYPE_CHECKING:
    from nolane.memory.skills import SkillEvolutionEngine

COMPONENT_ID = "external.context"
COMPONENT_VERSION = "0.0.1"
MIGRATED_FROM = "cogcoder.organization.context + cogcoder.organization.types"


{schema_body}


{compiler_body}


__all__ = (
    "ContextCapsule",
    "ContextCompiler",
    "COMPONENT_ID",
    "COMPONENT_VERSION",
    "MIGRATED_FROM",
)
'''
          write('nolane/external_core/context.py', canonical_context)

          # 2) Canonical context intelligence layer.
          intelligence = read('cogcoder/organization/context_intelligence.py')
          old_intelligence_imports = '''from .events import EventLedger
from .evolution import SkillEvolutionEngine
from .memory import MemoryFabric
from .memory_lifecycle import MemoryLifecycleLedger
from .memory_retrieval import MemoryRetrievalBudget, MemoryRetrievalEngine
from .registry import AgentRegistry
from .scheduler import WakeSleepScheduler
from .tasks import TaskGraph
from .types import CognitiveEvent, ContextCapsule, EventKind, MemoryStatus, canonical_digest
'''
          new_intelligence_imports = '''from nolane.core.canonical_digest import canonical_digest
from nolane.external_core.context import ContextCapsule
from nolane.memory.fabric import MemoryFabric, MemoryStatus
from nolane.memory.lifecycle import MemoryLifecycleLedger
from nolane.memory.retrieval import MemoryRetrievalBudget, MemoryRetrievalEngine
from nolane.memory.skills import SkillEvolutionEngine
from nolane.organization.events import CognitiveEvent, EventKind, EventLedger
from nolane.organization.identity import AgentRegistry
from nolane.organization.lifecycle import WakeSleepScheduler
from nolane.organization.tasks import TaskGraph
'''
          intelligence = replace_once(
              intelligence,
              old_intelligence_imports,
              new_intelligence_imports,
              label='context_intelligence imports',
          ).rstrip() + '''\n\n\n__all__ = (
    "ContextBudget",
    "ContextDeltaKind",
    "SemanticContextDeltaItem",
    "SemanticContextDelta",
    "ContinuityCheckpoint",
    "ContextCompilationReceipt",
    "ContextCompilationResult",
    "ContextIntelligenceCompiler",
)
'''
          write('nolane/memory/context_intelligence.py', intelligence)

          # 3) Canonical Memory/Context profile routing layer.
          profiles = read('cogcoder/organization/memory_profiles.py')
          profiles = replace_once(
              profiles,
              'from .registry import AgentRegistry\nfrom .types import canonical_digest\n',
              'from nolane.core.canonical_digest import canonical_digest\nfrom nolane.organization.identity import AgentRegistry\n',
              label='context_profiles imports',
          ).rstrip() + '''\n\n\n__all__ = (
    "MemoryIntelligenceDomain",
    "MemoryIntelligenceProfile",
    "MemoryWorkRequest",
    "MemoryCandidateScore",
    "MemoryAssignmentReceipt",
    "MemoryIntelligenceProfileRegistry",
)
'''
          write('nolane/memory/context_profiles.py', profiles)

          # 4) Canonical MemoryContextControlPlane ownership with preserved facade exports.
          control = read('cogcoder/organization/memory_context.py')
          old_control_imports = '''from .context_intelligence import (
    ContextBudget,
    ContextCompilationResult,
    ContextIntelligenceCompiler,
    ContinuityCheckpoint,
)
from .events import EventLedger
from .evolution import SkillEvolutionEngine, SkillRecord
from .memory import MemoryFabric
from .memory_lifecycle import MemoryLifecycleLedger, MemoryRelationGraph
from .memory_profiles import MemoryIntelligenceProfileRegistry
from .memory_retrieval import MemoryRetrievalEngine
from .registry import AgentRegistry
from .scheduler import WakeSleepScheduler
from .tasks import TaskGraph
from .types import MemoryStatus, canonical_digest
'''
          new_control_imports = '''from nolane.core.canonical_digest import canonical_digest
from nolane.memory.context_intelligence import (
    ContextBudget,
    ContextCompilationResult,
    ContextIntelligenceCompiler,
    ContinuityCheckpoint,
)
from nolane.memory.context_profiles import MemoryIntelligenceProfileRegistry
from nolane.memory.fabric import MemoryFabric, MemoryStatus
from nolane.memory.lifecycle import MemoryLifecycleLedger, MemoryRelationGraph
from nolane.memory.retrieval import MemoryRetrievalEngine
from nolane.memory.skills import SkillEvolutionEngine, SkillRecord
from nolane.organization.events import EventLedger
from nolane.organization.identity import AgentRegistry
from nolane.organization.lifecycle import WakeSleepScheduler
from nolane.organization.tasks import TaskGraph
'''
          control = replace_once(control, old_control_imports, new_control_imports, label='memory_context imports')
          control = replace_once(
              control,
              'from typing import Any, Mapping\n',
              'from typing import Any, Mapping\n\nCOMPONENT_ID = "external.context"\nCOMPONENT_VERSION = "0.0.1"\nMIGRATED_FROM = "cogcoder.organization.memory_context"\n',
              label='memory_context component metadata',
          ).rstrip() + '''\n\n\n__all__ = (
    "ContextBudget",
    "ContextCompilationResult",
    "ContextIntelligenceCompiler",
    "ContinuityCheckpoint",
    "MemoryRepairReceipt",
    "MemoryContextControlPlane",
    "COMPONENT_ID",
    "COMPONENT_VERSION",
    "MIGRATED_FROM",
)
'''
          write('nolane/memory/context.py', control)

          # 5) Canonical memory-aware adapter.
          adapter = read('cogcoder/organization/memory_context_adapter.py').rstrip() + '''\n\n\n__all__ = ("MemoryAwareContextCompiler",)\n'''
          write('nolane/memory/context_adapter.py', adapter)

          # 6) Historical modules become exact-object bridges.
          write('cogcoder/organization/context.py', '''from nolane.external_core.context import ContextCapsule, ContextCompiler\n\n__all__ = ("ContextCapsule", "ContextCompiler")\n''')
          write('cogcoder/organization/context_intelligence.py', '''from nolane.memory.context_intelligence import (\n    ContextBudget,\n    ContextDeltaKind,\n    SemanticContextDeltaItem,\n    SemanticContextDelta,\n    ContinuityCheckpoint,\n    ContextCompilationReceipt,\n    ContextCompilationResult,\n    ContextIntelligenceCompiler,\n)\n\n__all__ = (\n    "ContextBudget",\n    "ContextDeltaKind",\n    "SemanticContextDeltaItem",\n    "SemanticContextDelta",\n    "ContinuityCheckpoint",\n    "ContextCompilationReceipt",\n    "ContextCompilationResult",\n    "ContextIntelligenceCompiler",\n)\n''')
          write('cogcoder/organization/memory_profiles.py', '''from nolane.memory.context_profiles import (\n    MemoryIntelligenceDomain,\n    MemoryIntelligenceProfile,\n    MemoryWorkRequest,\n    MemoryCandidateScore,\n    MemoryAssignmentReceipt,\n    MemoryIntelligenceProfileRegistry,\n)\n\n__all__ = (\n    "MemoryIntelligenceDomain",\n    "MemoryIntelligenceProfile",\n    "MemoryWorkRequest",\n    "MemoryCandidateScore",\n    "MemoryAssignmentReceipt",\n    "MemoryIntelligenceProfileRegistry",\n)\n''')
          write('cogcoder/organization/memory_context.py', '''from nolane.memory.context import (\n    ContextBudget,\n    ContextCompilationResult,\n    ContextIntelligenceCompiler,\n    ContinuityCheckpoint,\n    MemoryRepairReceipt,\n    MemoryContextControlPlane,\n)\n\n__all__ = (\n    "ContextBudget",\n    "ContextCompilationResult",\n    "ContextIntelligenceCompiler",\n    "ContinuityCheckpoint",\n    "MemoryRepairReceipt",\n    "MemoryContextControlPlane",\n)\n''')
          write('cogcoder/organization/memory_context_adapter.py', '''from nolane.memory.context_adapter import MemoryAwareContextCompiler\n\n__all__ = ("MemoryAwareContextCompiler",)\n''')

          # 7) Retire the external.context compatibility facade.
          facades = read('cogcoder/refoundation/facades.py')
          facades = replace_once(
              facades,
              '        FacadeBinding("external.context", "nolane.memory.context", "cogcoder.organization.memory_context", ("MemoryContextControlPlane",)),\n',
              '',
              label='external.context facade retirement',
          )
          write('cogcoder/refoundation/facades.py', facades)

          # 8) Advance the independent component revision.
          versions = read('cogcoder/refoundation/component_versions.py')
          versions = replace_once(
              versions,
              '        "external.integration": 1,\n        "external.invokable_cores": 1,\n',
              '        "external.integration": 1,\n        "external.context": 1,\n        "external.invokable_cores": 1,\n',
              label='external.context component revision',
          )
          write('cogcoder/refoundation/component_versions.py', versions)

          # 9) Claim canonical-native implementation authority over the full closure.
          status = read('cogcoder/refoundation/implementation_status.py')
          native_entry = '''    "external.context": (\n        "nolane.memory.context",\n        (\n            "cogcoder/organization/context.py",\n            "cogcoder/organization/context_intelligence.py",\n            "cogcoder/organization/memory_profiles.py",\n            "cogcoder/organization/memory_context.py",\n            "cogcoder/organization/memory_context_adapter.py",\n        ),\n        "Native bounded base context compiler, semantic delta/continuity intelligence, Memory/Context profile routing, contradiction-repair control plane and memory-aware adapter over canonical event, identity, memory, lifecycle, retrieval, skill, task and digest authorities; historical context modules bridge exact semantic public identities.",\n    ),\n'''
          status = replace_once(
              status,
              '    "external.execution.workspace": (\n',
              native_entry + '    "external.execution.workspace": (\n',
              label='external.context implementation ledger',
          )
          write('cogcoder/refoundation/implementation_status.py', status)

          # 10) Current acceptance oracles move with the component; historical Wave 5X stays monotonic.
          versions_test = read('tests/test_refoundation_component_versions.py')
          versions_test = replace_once(
              versions_test,
              '    "external.integration": 1,\n    "external.invokable_cores": 1,\n',
              '    "external.integration": 1,\n    "external.context": 1,\n    "external.invokable_cores": 1,\n',
              label='accepted context revision',
          )
          versions_test = replace_once(
              versions_test,
              '    assert str(component_version("external.context")) == "0.0.0"\n    assert str(next_component_version("external.context")) == "0.0.1"\n',
              '    assert str(component_version("external.context")) == "0.0.1"\n    assert str(next_component_version("external.context")) == "0.0.2"\n',
              label='context version lookup expectation',
          )
          write('tests/test_refoundation_component_versions.py', versions_test)

          impl_test = read('tests/test_refoundation_implementation_status.py')
          impl_test = replace_once(
              impl_test,
              '    "external.integration",\n    "external.invokable_cores",\n',
              '    "external.integration",\n    "external.context",\n    "external.invokable_cores",\n',
              label='accepted native context set',
          )
          impl_test = replace_once(
              impl_test,
              '    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n    assert not ledger["external.context"].canonical_write_authority\n',
              '    assert ledger["external.context"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert ledger["external.context"].canonical_write_authority\n',
              label='context implementation status expectation',
          )
          write('tests/test_refoundation_implementation_status.py', impl_test)

          wave5x = read('tests/test_refoundation_wave5x_canonical_event_context_schemas.py')
          wave5x = replace_once(
              wave5x,
              '    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
              '',
              label='Wave 5X historical context status pin',
          )
          wave5x = replace_once(
              wave5x,
              '    assert "external.context" in ids\n',
              '',
              label='Wave 5X historical context debt pin',
          )
          write('tests/test_refoundation_wave5x_canonical_event_context_schemas.py', wave5x)

          # 11) Current authority receipt.
          current_status = read('CURRENT/STATUS.md')
          current_status = replace_once(
              current_status,
              '- Wave 5X prerequisite: canonical event/context schema authority -> `nolane.organization.events` + `nolane.external_core.context`\n',
              '- Wave 5X prerequisite: canonical event/context schema authority -> `nolane.organization.events` + `nolane.external_core.context`\n- Wave 5Y candidate: `external.context` -> native `nolane.memory.context` semantic closure\n',
              label='Wave 5Y status bullet',
          )
          context_paragraph = '''\nWave 5Y retires the `external.context` compatibility boundary by moving the base `ContextCompiler`, bounded context-intelligence/continuity/delta receipts, Memory/Context profile routing, contradiction-repair control plane and memory-aware adapter under canonical ownership. `ContextCapsule` remains owned by `nolane.external_core.context`; the five historical organization context modules are exact semantic public-object bridges. Canonical context code contains no reverse import of those historical context authorities. The generated native-debt projection therefore moves from 24 to 23 records while `neural.inference_bridge` and `external.execution.control` remain explicit compatibility boundaries.\n'''
          current_status = replace_once(
              current_status,
              '\n## Repository authority and remaining debt\n',
              context_paragraph + '\n## Repository authority and remaining debt\n',
              label='Wave 5Y status receipt',
          )
          write('CURRENT/STATUS.md', current_status)

          # 12) Entire canonical tree must not import historical context authorities.
          forbidden = {
              'cogcoder.organization.context',
              'cogcoder.organization.context_intelligence',
              'cogcoder.organization.memory_profiles',
              'cogcoder.organization.memory_context',
              'cogcoder.organization.memory_context_adapter',
          }
          offenders: list[str] = []
          for source_path in sorted((ROOT / 'nolane').rglob('*.py')):
              tree = ast.parse(source_path.read_text(encoding='utf-8'), filename=str(source_path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name in forbidden:
                              offenders.append(f'{source_path}:{node.lineno}:import:{alias.name}')
                  elif isinstance(node, ast.ImportFrom):
                      module = node.module or ''
                      if module in forbidden:
                          offenders.append(f'{source_path}:{node.lineno}:from:{module}')
          if offenders:
              raise SystemExit('canonical reverse context imports remain:\n' + '\n'.join(offenders))
          PY
      - name: Verify migration scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'CURRENT/STATUS.md',
              'cogcoder/organization/context.py',
              'cogcoder/organization/context_intelligence.py',
              'cogcoder/organization/memory_profiles.py',
              'cogcoder/organization/memory_context.py',
              'cogcoder/organization/memory_context_adapter.py',
              'cogcoder/refoundation/component_versions.py',
              'cogcoder/refoundation/facades.py',
              'cogcoder/refoundation/implementation_status.py',
              'nolane/external_core/context.py',
              'nolane/memory/context.py',
              'nolane/memory/context_adapter.py',
              'nolane/memory/context_intelligence.py',
              'nolane/memory/context_profiles.py',
              'tests/test_refoundation_component_versions.py',
              'tests/test_refoundation_implementation_status.py',
              'tests/test_refoundation_wave5x_canonical_event_context_schemas.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected Wave 5Y migration files: ' + ', '.join(unexpected))
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit('expected Wave 5Y migration files unchanged: ' + ', '.join(missing))
          print(f'Wave 5Y source scope clean: {len(changed)} files')
          PY
      - name: Compile migrated namespaces
        run: python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
      - name: Verify AI dossiers
        run: python -m nolane.ai.materialize --check
      - name: Materialize repository audit for tests
        run: python -m nolane.repository.audit --write
      - name: Verify repository audit
        run: python -m nolane.repository.audit --check
      - name: Run Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run broad organization/campaign/execution regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Commit GREEN source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CURRENT/STATUS.md \
            cogcoder/organization/context.py \
            cogcoder/organization/context_intelligence.py \
            cogcoder/organization/memory_profiles.py \
            cogcoder/organization/memory_context.py \
            cogcoder/organization/memory_context_adapter.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py \
            nolane/external_core/context.py \
            nolane/memory/context.py \
            nolane/memory/context_adapter.py \
            nolane/memory/context_intelligence.py \
            nolane/memory/context_profiles.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_wave5x_canonical_event_context_schemas.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No GREEN migration changes staged'; exit 1; } || true
          git commit -m "[wave5y-green] Refoundation Wave 5Y: native context cutover"
          git push origin HEAD:${GITHUB_REF_NAME}
