name: Neural R1.6 Snapshot Recovery

on:
  push:
    branches:
      - codex/neural-r16-snapshot-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and inspect snapshot
        run: |
          set -euxo pipefail
          mkdir -p recovered
          cat snapshots/r1.6/current-source/chunk-*.bin > recovered/current-source.gz
          sha256sum recovered/current-source.gz | tee recovered/current-source.gz.sha256
          file recovered/current-source.gz | tee recovered/current-source.gz.file
          set +e
          gzip -dc recovered/current-source.gz > recovered/current-source.recovered 2> recovered/gzip.stderr
          gzip_status=$?
          set -e
          printf '%s\n' "$gzip_status" > recovered/gzip.exit-code
          wc -c recovered/current-source.recovered | tee recovered/current-source.recovered.bytes
          sha256sum recovered/current-source.recovered | tee recovered/current-source.recovered.sha256
          file recovered/current-source.recovered | tee recovered/current-source.recovered.file
          cat recovered/gzip.stderr || true
          python - <<'PY'
          import pathlib, tarfile, zipfile, json
          p = pathlib.Path("recovered/current-source.recovered")
          raw = p.read_bytes()
          result = {
              "gzip_exit_code": int(pathlib.Path("recovered/gzip.exit-code").read_text().strip()),
              "is_tar": tarfile.is_tarfile(p),
              "is_zip": zipfile.is_zipfile(p),
              "size": len(raw),
              "prefix_hex": raw[:64].hex(),
              "prefix_repr": repr(raw[:256]),
          }
          if result["is_tar"]:
              with tarfile.open(p, errorlevel=0) as tf:
                  result["members"] = tf.getnames()
          elif result["is_zip"]:
              with zipfile.ZipFile(p) as zf:
                  result["members"] = zf.namelist()
          else:
              try:
                  text = raw.decode("utf-8")
                  result["utf8"] = True
                  result["line_count"] = len(text.splitlines())
                  result["first_lines"] = text.splitlines()[:30]
              except UnicodeDecodeError as exc:
                  result["utf8"] = False
                  result["utf8_error"] = str(exc)
          pathlib.Path("recovered/inspection.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload recovered snapshot
        uses: actions/upload-artifact@v4
        with:
          name: neural-r16-current-source-recovered
          path: recovered/
          if-no-files-found: error
          retention-days: 7
