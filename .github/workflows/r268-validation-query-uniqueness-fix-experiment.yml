name: R2.68 Fix Experiment — Validation Oracle Query Uniqueness

on:
  pull_request:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'tests/test_r268_validation_query_uniqueness.py'
      - 'scripts/r268_apply_validation_query_uniqueness.py'
      - 'scripts/r268_apply_projection_unique_external_validation.py'
      - '.github/workflows/r268-validation-query-uniqueness-fix-experiment.yml'

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted parent safety
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Require genuine validation-uniqueness RED
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r268_validation_query_uniqueness.py > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -Eq '3 failed' /tmp/red.log
          echo R268_VALIDATION_QUERY_UNIQUENESS_GENUINE_RED
      - name: Apply guarded pre-oracle uniqueness patch
        run: python scripts/r268_apply_validation_query_uniqueness.py
      - name: New authority regression GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_validation_query_uniqueness.py
      - name: Migrate determinant validation to projection-unique code
        run: python scripts/r268_apply_projection_unique_external_validation.py
      - name: Full current R2.68 suite after authority hardening
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Verify fresh determinant evidence strength is preserved
        run: |
          PYTHONPATH=. python - <<'PY'
          import itertools, numpy as np
          from research.r268_external_transfer import run_external_transfer
          vals=(3.0,4.0,5.0,6.0)
          rows=tuple((vals[i],vals[j],vals[k],vals[(-i-j-k)%4]) for i,j,k in itertools.product(range(4),repeat=3))[:24]
          assert len(rows)==len(set(rows))==24
          for pos in range(4):
              projected=[]
              for row in rows:
                  q=list(row);q[pos]=0.0;projected.append(tuple(q))
              assert len(set(projected))==24,(pos,len(set(projected)))
          result=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          assert result['passed'] is True,result
          assert result['discovery_validation_oracle_query_disjoint'] is True,result
          assert result['selected_basis_size']==2 and result['globally_minimal'] is True,result
          assert result['lower_basis_count']==result['lower_basis_certified']==4,result
          assert result['necessity_certificate_count']==2 and result['false_accepts']==0,result
          assert result['oracle_accounting_exact'] is True,result
          assert result['oracle_calls_total']==result['source_calls_observed']==1238,result
          print('R268_PROJECTION_UNIQUE_EXTERNAL_OK',result['oracle_calls_total'])
          PY
      - name: Patch remains scoped to public authority plus external evidence corpus
        run: |
          git diff -- cogcoder/r268_adaptive_causal_basis.py research/r268_external_transfer.py
          git diff --exit-code -- cogcoder/_r268_runtime.py cogcoder/_r268_proof.py cogcoder/_r268_search.py cogcoder/_r268_types.py
