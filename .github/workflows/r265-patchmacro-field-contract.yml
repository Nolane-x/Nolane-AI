name: R2.65 PatchMacro Field Contract

on:
  push:
    branches: [fix-r265-patchmacro-field-contract-gpt56sol]
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run inherited PatchMacro field contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_patchmacro_field_contract.py
