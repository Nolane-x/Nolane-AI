name: R2.65 PatchMacro Field Contract

on:
  push:
    branches: [fix-r265-patchmacro-field-contract-gpt56sol]
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Apply exact inherited-field correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text=path.read_text()
          old="        row.slot, row.operation, row.source_value, row.target_value, row.macro_id,\n"
          new="        row.slot, row.kind, row.src or '', row.dst or '', row.macro_id,\n"
          if old in text:
              assert text.count(old) == 1
              text=text.replace(old, new, 1)
              path.write_text(text)
          assert old not in path.read_text()
          assert new in path.read_text()
          PY
      - name: Run inherited PatchMacro field contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_patchmacro_field_contract.py
      - name: Run active R2.65 focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Commit correction after GREEN verification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_FIELDCONTRACT_ALREADY_APPLIED
          else
            git commit -m 'fix: use inherited PatchMacro fields in R2.65 ordering'
            git push origin HEAD:fix-r265-patchmacro-field-contract-gpt56sol
          fi
