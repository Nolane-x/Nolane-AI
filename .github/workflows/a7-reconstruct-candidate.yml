name: A7 Candidate Reconstruct

on:
  push:
    branches:
      - upgrade/external-core-a7-atomic-observation
    paths:
      - '.a7_chunks/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/external-core-a7-atomic-observation
          fetch-depth: 0
      - name: Reconstruct exact candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          specs = {
              "current": ("CURRENT/EXTERNAL_CORE.md", "fd3f20dfbb6a46b192fa5a2602217817edc26333"),
              "bundle": ("nolane/external_core/integration_admission_bundle.py", "1e8e86f4a6007af64d98714f7b89698b8ec9e092"),
              "integration": ("nolane/external_core/integration.py", "6581c1158e02c34c8227a300ace5ebe29213bf8b"),
          }
          for prefix, (target, _expected) in specs.items():
              chunks = sorted(Path(".a7_chunks").glob(f"{prefix}-*.b64"))
              if not chunks:
                  raise SystemExit(f"missing chunks for {prefix}")
              encoded = "".join(p.read_text(encoding="ascii") for p in chunks)
              data = gzip.decompress(base64.b64decode(encoded))
              out = Path(target)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
          PY
          test "$(git hash-object CURRENT/EXTERNAL_CORE.md)" = "fd3f20dfbb6a46b192fa5a2602217817edc26333"
          test "$(git hash-object nolane/external_core/integration_admission_bundle.py)" = "1e8e86f4a6007af64d98714f7b89698b8ec9e092"
          test "$(git hash-object nolane/external_core/integration.py)" = "6581c1158e02c34c8227a300ace5ebe29213bf8b"
          rm -rf .a7_chunks
          rm -f .github/workflows/a7-reconstruct-candidate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: complete A7 atomic observation candidate"
          git push origin HEAD:upgrade/external-core-a7-atomic-observation
