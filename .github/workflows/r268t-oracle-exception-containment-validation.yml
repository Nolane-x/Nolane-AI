name: R2.68-T Oracle Exception Containment Validation

on:
  pull_request:
    branches: [r268-cross-task-causal-transfer-gpt56sol]
    paths:
      - 'tests/test_r268_oracle_exception_containment.py'
      - 'scripts/r268t_apply_oracle_exception_containment.py'
      - '.github/workflows/r268t-oracle-exception-containment-validation.yml'
      - 'cogcoder/r268_cross_task_causal_transfer.py'

permissions:
  contents: read

jobs:
  cross-version-proposed-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_oracle_exception_containment.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_oracle_exception_containment.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py

      - name: Recompute authored fair-budget benchmark
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r268_cross_task_causal_transfer import run_benchmark
          result = run_benchmark()
          assert result['all_gates_pass'] is True
          assert result['candidate_budget_unit'] == 'proof_distinct_hypotheses'
          assert result['positive_transfer_exact'] == 3
          assert result['tight_scratch_exact'] == 1
          assert result['transfer_advantage_over_tight_scratch'] == 2
          assert result['source_prior_ablation_exact'] == 0
          assert result['false_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          PY
