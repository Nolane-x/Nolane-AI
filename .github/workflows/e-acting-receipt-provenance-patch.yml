name: E Acting Receipt Provenance Production Patch

on:
  push:
    branches:
      - e-acting-control-reconciliation-gpt56sol
    paths:
      - '.github/e_acting_receipt_provenance_patch.py'
      - '.github/workflows/e-acting-receipt-provenance-patch.yml'

permissions:
  contents: write

concurrency:
  group: e-acting-receipt-provenance-production-patch
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e-acting-control-reconciliation-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic production patch
        run: python .github/e_acting_receipt_provenance_patch.py
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical E modules
        run: python -m py_compile nolane/external_core/*.py
      - name: Verify receipt provenance before commit
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_runtime.py \
            tests/test_refoundation_acting_receipt_provenance.py \
            tests/test_refoundation_acting_crash_reconciliation.py
      - name: Commit production delta only after GREEN
        run: |
          git config user.name 'nolane-e-acting-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            nolane/external_core/acting_runtime.py \
            tests/test_refoundation_acting_runtime.py \
            CURRENT/E_ACTING.md
          git diff --cached --check
          git commit -m 'feat(e-acting): bind concrete receipt provenance'
          git push origin HEAD:e-acting-control-reconciliation-gpt56sol
