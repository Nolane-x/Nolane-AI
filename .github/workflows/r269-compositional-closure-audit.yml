name: R2.69 Compositional Closure Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply runner-only closure proposal
        run: PYTHONPATH=. python scripts/r269_compositional_closure_patch.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Protected R2.68 safety
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Four-role exact-domain closure
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_scratch_compositional_closure.py
      - name: Existing R2.69 contracts excluding authored benchmark
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py -k 'not benchmark'
      - name: Authored benchmark recalibration
        env:
          PYTHONHASHSEED: '777'
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          result = run_benchmark()
          print(json.dumps({
              'transfer': result['positive_transfer_solved'],
              'tight': result['tight_cold_scratch_solved'],
              'roomy': result['roomy_scratch_solved'],
              'transfer_calls': result['median_transfer_diagnostic_calls'],
              'cold_calls': result['median_cold_solved_diagnostic_calls'],
              'transfer_work': result['median_transfer_search_work'],
              'cold_work': result['median_tight_scratch_search_work'],
              'ablation': result['source_prior_ablation_solved'],
              'shuffled': result['shuffled_prior_solved'],
              'false_accepts': result['false_accepts'],
              'negative_false_accepts': result['negative_transfer_false_accepts'],
              'regret': result['max_negative_transfer_diagnostic_regret'],
              'authored_gate_pass': result['authored_gate_pass'],
          }, sort_keys=True))
          assert result['false_accepts'] == 0
          assert result['negative_transfer_false_accepts'] == 0
          PY
