name: R2.65 Unanimous Misspecification Fix

on:
  push:
    branches: [fix-r265-unanimous-misspecification-gpt56sol]
    paths:
      - 'tests/test_r265_unanimous_misspecification.py'
      - '.github/workflows/r265-unanimous-misspecification-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extend diagnostics from discrimination to misspecification detection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text = path.read_text()
          old = '''        if probe is None or partitions is None:\n            return receipt('abstain', None, None, False, 'no_informative_diagnostic_probe')\n'''
          new = '''        if probe is None or partitions is None:\n            # Zero entropy only means no remaining diagnostic splits the\n            # current version space. It does not prove that the oracle lies\n            # inside that space, so continue with bounded misspecification\n            # probing below.\n            break\n'''
          assert text.count(old) == 1, f'unexpected informative-probe exit count: {text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''    if selected_probe is None:\n        return receipt('abstain', None, None, False, 'no_out_of_space_counterexample_for_induction')\n'''
          new = '''    if selected_probe is None and survivors:\n        # Entropy-based probe selection is for discrimination. Once it cannot\n        # split survivors (including a singleton), unused public diagnostics\n        # still have a second role: falsify the entire surviving version space.\n        # Oracle outputs are recorded only after the candidate outcomes for the\n        # probe are computed, and candidate generation still receives no target\n        # outputs.\n        for probe in diagnostics:\n            if probe.probe_id in used_diagnostics:\n                continue\n            if diagnostic_calls >= selection_budget:\n                return receipt('abstain', None, None, False, 'selection_oracle_budget_exhausted')\n\n            fallback_partitions = {}\n            for compiled_row in survivors:\n                candidate_key, _candidate_value = _outcome(compiled_row.fn, probe.args)\n                candidate_evaluations += 1\n                fallback_partitions.setdefault(candidate_key, []).append(compiled_row)\n\n            oracle_key, oracle_value, oracle_ok = _oracle_outcome(oracle, probe.args)\n            diagnostic_calls += 1\n            used_diagnostics.add(probe.probe_id)\n            if not oracle_ok:\n                return receipt('abstain', None, None, False, 'diagnostic_oracle_error')\n            test_id = 'r265:diagnostic:' + probe.probe_id.split(':', 1)[-1]\n            if test_id not in observed_test_ids:\n                observed_tests.append(PatchTest(test_id, tuple(probe.args), oracle_value))\n                observed_test_ids.add(test_id)\n            if probe.probe_id not in observed_probe_ids:\n                observed_probe_ids.append(probe.probe_id)\n\n            matching = fallback_partitions.get(oracle_key)\n            if matching:\n                survivors = tuple(matching)\n                continue\n            diagnostic_counterexamples += 1\n            selected_probe = probe\n            break\n\n    if selected_probe is None:\n        reason = (\n            'no_informative_diagnostic_probe'\n            if len(survivors) > 1\n            else 'no_out_of_space_counterexample_for_induction'\n        )\n        return receipt('abstain', None, None, False, reason)\n'''
          assert text.count(old) == 1, f'unexpected no-out-of-space exit count: {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install focused dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Run accepted R2.64 and all R2.65 focused contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Recompute authored and external evidence smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer
          phase = run_benchmark()
          external = run_external_transfer(np.multiply, source_id='numpy.multiply', source_version=np.__version__)
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R265_UNANIMOUS_MISSPEC_GREEN')
          PY
      - name: Commit verified production fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_UNANIMOUS_MISSPEC_ALREADY_APPLIED
          else
            git commit -m 'fix: detect unanimous R2.65 version-space misspecification'
            git push origin HEAD:fix-r265-unanimous-misspecification-gpt56sol
          fi
