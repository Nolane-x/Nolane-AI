name: R2.69 RED GREEN

on:
  push:
    branches: [ r269-autonomous-transfer-meta-learning-kernel-gpt56sol ]
    paths:
      - 'cogcoder/r269_*.py'
      - 'benchmarks/kfigg/r269_meta_learning.py'
      - 'tests/test_r269_*.py'
      - 'scripts/r269_integrate_sequential_meta.py'
      - '.github/workflows/r269-red-green.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol

jobs:
  cross-python-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: R2.68 source ancestry
        run: git merge-base --is-ancestor fda7f502185266fedb00886d5786c6d28cc0e0eb HEAD
      - name: Apply guarded sequential-meta source integration
        run: python scripts/r269_integrate_sequential_meta.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Python 3.11 protected R2.68
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Python 3.11 complete authored R2.69
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py --ignore=tests/test_r269_external_numpy_transfer.py
      - name: Python 3.11 canonical authored benchmark
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          result = run_benchmark()
          assert result['milestone'] == 'R2.69'
          assert result['accepted_parent_sha'] == 'fda7f502185266fedb00886d5786c6d28cc0e0eb'
          assert result['source_basis_sizes'] == [2, 3, 4]
          assert result['positive_transfer_solved'] >= 17
          assert result['tight_cold_scratch_solved'] <= 12
          assert result['roomy_scratch_solved'] >= 17
          assert result['source_prior_ablation_advantage_removed_fraction'] >= 0.80
          assert result['negative_targets'] == 12
          assert result['negative_transfer_false_accepts'] == 0
          assert result['continued_scratch_correctness_preserved'] is True
          assert result['max_negative_transfer_diagnostic_regret'] <= 1
          assert result['false_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          assert result['authored_gate_pass'] is True
          print('R269_AUTHORED_DIGEST=' + result['semantic_result_digest'])
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Python 3.13 protected R2.68
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Python 3.13 complete authored R2.69
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py --ignore=tests/test_r269_external_numpy_transfer.py

      - name: Materialize cross-python integration evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          result = run_benchmark()
          evidence = {
              'schema_version': 1,
              'milestone': 'R2.69',
              'capability': 'authority-safe-sequential-meta-learning-integration',
              'accepted_parent_sha': 'fda7f502185266fedb00886d5786c6d28cc0e0eb',
              'python_versions_verified': ['3.11', '3.13'],
              'protected_r268_green': True,
              'complete_authored_r269_green': True,
              'sequential_chain_contract': True,
              'authored_benchmark_digest': result['semantic_result_digest'],
              'authored_gate_pass': result['authored_gate_pass'],
              'false_accepts': result['false_accepts'],
              'trainable_parameter_count': 0,
          }
          Path('R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json').write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit only after both Python versions are green
        run: |
          if git diff --quiet -- cogcoder/r269_causal_basis_adapter.py cogcoder/r269_meta_learning_kernel.py R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json; then
            echo 'Sequential meta-learning integration already materialized.'
            exit 0
          fi
          git config user.name 'Nolane R2.69 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add cogcoder/r269_causal_basis_adapter.py cogcoder/r269_meta_learning_kernel.py R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json
          git commit -m 'feat(r269): integrate verified sequential meta-learning'
          git push origin HEAD:${BRANCH}
