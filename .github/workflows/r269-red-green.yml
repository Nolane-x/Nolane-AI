name: R2.69 RED GREEN

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'cogcoder/r269_*.py'
      - 'benchmarks/kfigg/r269_*.py'
      - 'tests/test_r269_*.py'
      - '.github/workflows/r269-red-green.yml'
      - 'docs/superpowers/specs/2026-08-19-r269-autonomous-transfer-meta-learning-kernel-design.md'
      - 'docs/superpowers/plans/2026-08-19-r269-autonomous-transfer-meta-learning-kernel.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted R2.68 safety first
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: R2.69 focused contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
