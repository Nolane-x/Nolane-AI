name: R2.65 Full Repository Release Bundle

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - 'R2_65_*.json'
      - 'cogcoder/r265_*.py'
      - 'benchmarks/kfigg/r265_*.py'
      - 'research/r265_*.py'
      - 'tests/test_r265_*.py'
      - '.github/workflows/r265-canonical-gate.yml'
      - '.github/workflows/r265-freeze-evidence.yml'
      - '.github/workflows/r265-release-bundle.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify frozen R2.65 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path

          required = (
              'R2_65_PRE_HOSTED_LOCK.json',
              'R2_65_PHASE_A_RESULT.json',
              'R2_65_EXTERNAL_TRANSFER.json',
              'cogcoder/r265_verified_patch_primitive_induction.py',
              'benchmarks/kfigg/r265_patch_primitive_induction.py',
              'research/r265_external_patch_primitive_transfer.py',
              'tests/test_r265_patchmacro_field_contract.py',
              'tests/test_r265_hypothesis_budget_fairness.py',
              'tests/test_r265_true_global_generation_cap.py',
              'tests/test_r265_singleton_out_of_space_induction.py',
              'tests/test_r265_unanimous_misspecification.py',
              'tests/test_r265_post_selection_singleton_misspec.py',
              '.github/workflows/r265-canonical-gate.yml',
              '.github/workflows/r265-freeze-evidence.yml',
              '.github/workflows/r265-release-bundle.yml',
          )
          for path in required:
              assert Path(path).is_file(), path

          lock = json.loads(Path('R2_65_PRE_HOSTED_LOCK.json').read_text())
          assert lock['schema_version'] >= 6
          assert lock['parent_release_commit'] == 'f8a28627dc34f6db4fafca629df3b64d668b05c8'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['inherited_patchmacro_contract_frozen'] is True
          assert lock['hypothesis_budget_fairness_frozen'] is True
          assert lock['true_global_generation_cap_frozen'] is True
          assert lock['singleton_out_of_space_diagnostic_frozen'] is True
          assert lock['unanimous_misspecification_diagnostic_frozen'] is True
          assert lock['post_selection_singleton_misspecification_frozen'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R265_RELEASE_BOUNDARY_OK', lock['schema_version'], len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer

          assert np.__version__ == '2.4.6'
          phase = run_benchmark()
          external = run_external_transfer(
              np.multiply,
              source_id='numpy.multiply',
              source_version=np.__version__,
          )
          assert phase == json.loads(Path('R2_65_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_65_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R265_RELEASE_EVIDENCE_EXACT_OK')
          PY
      - name: Run R2.65 and protected lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Create and verify complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.65-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.65-COMPLETE.zip | tee release/Nolane-AI-R2.65-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.65-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required = {
              'R2_65_PRE_HOSTED_LOCK.json',
              'R2_65_PHASE_A_RESULT.json',
              'R2_65_EXTERNAL_TRANSFER.json',
              'cogcoder/r265_verified_patch_primitive_induction.py',
              'benchmarks/kfigg/r265_patch_primitive_induction.py',
              'research/r265_external_patch_primitive_transfer.py',
              'tests/test_r265_hypothesis_budget_fairness.py',
              'tests/test_r265_true_global_generation_cap.py',
              'tests/test_r265_singleton_out_of_space_induction.py',
              'tests/test_r265_unanimous_misspecification.py',
              'tests/test_r265_post_selection_singleton_misspec.py',
              '.github/workflows/r265-canonical-gate.yml',
              '.github/workflows/r265-freeze-evidence.yml',
              '.github/workflows/r265-release-bundle.yml',
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.65-COMPLETE.zip') as zf:
              names = set(zf.namelist())
          missing = required - names
          assert not missing, sorted(missing)
          print('R265_COMPLETE_ZIP_CONTENTS_OK', len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.65-COMPLETE
          path: |
            release/Nolane-AI-R2.65-COMPLETE.zip
            release/Nolane-AI-R2.65-COMPLETE.zip.sha256
      - name: Publish release-bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success',
              'context': 'r265/release-bundle',
              'description': 'R2.65 lock, exact evidence, protected lineage and COMPLETE ZIP passed',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              },
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R265_RELEASE_BUNDLE_STATUS_PUBLISHED')
          PY
