name: R2.5 Prefix200
on:
  workflow_dispatch:
  push:
    paths:
      - 'cogcoder/arc_current_local.py'
      - 'cogcoder/arc_local.py'
      - 'cogcoder/local_grid_v2.py'
      - 'cogcoder/arc_pair_v2.py'
      - 'cogcoder/arc_ops_view.py'
      - 'scripts/measure_r25_local.py'
      - '.github/workflows/r25-prefix200.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select deterministic prefix
        run: |
          mkdir r25_prefix200
          find external/ARC-AGI-2/data/training -maxdepth 1 -name '*.json' | sort | head -n 200 | xargs -I{} cp {} r25_prefix200/
          test "$(find r25_prefix200 -name '*.json' | wc -l)" -eq 200
      - name: Measure prefix
        run: python scripts/measure_r25_local.py r25_prefix200 --max-attempts 2 --max-programs 64 | tee r25_prefix200.json
      - uses: actions/upload-artifact@v4
        with:
          name: r25-prefix200
          path: r25_prefix200.json
