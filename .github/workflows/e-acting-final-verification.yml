name: E Acting Final Merged-Head Verification

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-final-verification.yml

concurrency:
  group: e-acting-final-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile E canonical modules
        run: python -m py_compile nolane/external_core/*.py nolane/metadata/*.py
      - name: Run E Acting contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_protocol.py \
            tests/test_refoundation_acting_workspace.py \
            tests/test_refoundation_acting_runtime.py
      - name: Run Refoundation regression
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run merged Truth Knowledge contracts
        run: python -m pytest -q tests/test_truth_knowledge_*.py
      - name: Run complete repository test suite
        run: python -m pytest -q
