name: E Acting Final Verification

on:
  push:
    branches:
      - e-acting-control-reconciliation-gpt56sol

concurrency:
  group: e-acting-final-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical E modules
        run: python -m py_compile nolane/external_core/*.py
      - name: Run canonical E Acting contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_protocol.py \
            tests/test_refoundation_acting_record_integrity.py \
            tests/test_refoundation_acting_workspace.py \
            tests/test_refoundation_acting_runtime.py \
            tests/test_refoundation_acting_effect_authority.py \
            tests/test_refoundation_acting_receipt_provenance.py \
            tests/test_refoundation_acting_workspace_fencing.py \
            tests/test_refoundation_acting_crash_reconciliation.py \
            tests/test_refoundation_acting_control_reconciliation.py \
            tests/test_refoundation_acting_control_commit_projection.py \
            tests/test_refoundation_acting_control_provenance.py
      - name: Run full Refoundation regression suite
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Verify diff hygiene
        run: git diff --check HEAD^ HEAD
