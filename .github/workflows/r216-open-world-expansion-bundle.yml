name: R2.16 Open-World Expansion Bundle Reproduction

on:
  push:
    branches: [main]
    paths:
      - 'research/bundles/R2_16-source-and-evidence.part-*.b64'
      - 'research/R2_16_GITHUB_SEAL.json'
      - '.github/workflows/r216-open-world-expansion-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-r216-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct exact R2.16 source/evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          cat research/bundles/R2_16-source-and-evidence.part-*.b64 > /tmp/r216.b64
          base64 -d /tmp/r216.b64 > /tmp/r216.tar.gz
          echo 'fdac76c4f5555358a2649b4e906667c246fa72e0b5a1e4cfa06b1d2e71936ebd  /tmp/r216.tar.gz' | sha256sum -c -
          tar -xzf /tmp/r216.tar.gz -C .
      - name: Install test dependency
        run: pip install pytest
      - name: Verify frozen contracts
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r216_hypothesis_expansion.py \
            tests/test_r216_open_world_runtime.py \
            tests/test_r216_protocol.py \
            tests/test_r216_lock.py \
            tests/test_r216_result.py
      - name: Reproduce frozen heldout
        run: |
          PYTHONPATH=. python scripts/run_r216_open_world_expansion.py \
            --seeds 33601 \
            --cases-per-family 40 \
            --retention-count 64 \
            --beyond-count 40 \
            --oracle-budget 8 \
            --output /tmp/r216-heldout.json
          python - <<'PY'
          import json
          actual=json.load(open('/tmp/r216-heldout.json'))
          frozen=json.load(open('research/R2_16_HELDOUT_RAW.json'))
          assert actual == frozen
          PY
      - name: Compile active source
        run: python -m compileall -q cogcoder benchmarks/kfigg scripts tests
      - name: Upload reproduction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nolane-r216-open-world-expansion-reproduction
          path: |
            /tmp/r216.tar.gz
            /tmp/r216-heldout.json
            research/R2_16_GITHUB_SEAL.json
            research/R2_16_PRE_HELDOUT_LOCK.json
            research/R2_16_PHASE_A_RESULT.json
