name: R2.67.1 Canonical Full Gate

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'R2_67_1_*.json'
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'benchmarks/kfigg/r267_1_*.py'
      - 'research/r267_1_*.py'
      - 'tests/test_r267_1_*.py'
      - 'tests/test_r267_independent_ablation_completeness.py'
      - 'scripts/r267_1_*.py'
      - '.github/workflows/r267-1-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R2_67_1_*.json'
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'benchmarks/kfigg/r267_1_*.py'
      - 'research/r267_1_*.py'
      - 'tests/test_r267_1_*.py'
      - 'tests/test_r267_independent_ablation_completeness.py'
      - 'scripts/r267_1_*.py'
      - '.github/workflows/r267-1-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  frozen-focused:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify frozen R2.67.1 authority boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock_path = Path('R2_67_1_PRE_HOSTED_LOCK.json')
          if not lock_path.is_file():
              raise SystemExit('R2.67.1 lock not frozen yet')
          lock = json.loads(lock_path.read_text())
          assert lock['schema_version'] >= 1
          assert lock['parent_release_commit'] == '43b43ce4b324b0d74357957af18dd0f60b1cb85e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['frozen_evidence_changes_after_lock_forbidden'] is True
          assert lock['historical_r267_artifacts_superseded_not_mutated'] is True
          a = lock['authority_corrections']
          assert a['subset_specific_ablation_fields'] is True
          assert a['uncertified_search_miss_fails_closed'] is True
          assert a['public_collision_certificate_required_for_lower_order_insufficiency'] is True
          assert a['postselection_probe_case_unit'] == 'probe_observation'
          assert a['preselection_probe_cases_zero_without_selected_triplet'] is True
          assert a['attempted_case_receipt_accounting'] is True
          assert a['terminal_selected_probe_reobservation'] is True
          assert a['oracle_ledger_exact'] is True
          assert a['positive_domain_triangle_min_robustness'] is True
          assert a['triplet_budget_semantic_invariance'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'], check=True)
          print('R267_1_FROZEN_AUTHORITY_OK', len(lock['frozen_git_blobs']), lock['source_freeze_head'])
          PY
      - name: Accepted R2.66 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.67.1 focused authority suite
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py

  cross-python:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  canonical-full-gate:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/')) && (github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
      - name: Verify accepted R2.67 ancestry and frozen source/evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lock = json.loads(Path('R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          parent = lock['parent_release_commit']
          base = os.environ['EXPECTED_BASE_SHA']
          subprocess.run(['git','merge-base','--is-ancestor',parent,base], check=True)
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'], check=True)
          assert lock['authority_corrections']['attempted_case_receipt_accounting'] is True
          assert lock['authority_corrections']['triplet_budget_semantic_invariance'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R267_1_PARENT_AND_LOCK_OK', parent, base, len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and pinned NumPy evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer

          assert np.__version__ == '2.4.6'
          phase = run_benchmark()
          external = run_external_transfer(np.dot, source_id='numpy:numpy.dot', source_version=np.__version__)
          phase_text = json.dumps(phase, indent=2, sort_keys=True) + '\n'
          external_text = json.dumps(external, indent=2, sort_keys=True) + '\n'
          assert Path('R2_67_1_PHASE_A_RESULT.json').read_text() == phase_text
          assert Path('R2_67_1_EXTERNAL_TRANSFER.json').read_text() == external_text
          lock = json.loads(Path('R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          canonical_phase = json.dumps(phase, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
          canonical_external = json.dumps(external, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
          assert hashlib.sha256(canonical_phase).hexdigest() == lock['authored_evidence']['sha256_canonical_json']
          assert hashlib.sha256(canonical_external).hexdigest() == lock['external_evidence']['sha256_canonical_json']
          assert phase['all_gates_pass'] is True and phase['false_accepts'] == 0
          assert phase['oracle_accounting_exact'] is True
          assert phase['oracle_calls_total'] == lock['authored_evidence']['oracle_calls_total']
          assert external['passed'] is True and external['false_accepts'] == 0
          assert external['source_id'] == 'numpy:numpy.dot'
          assert external['source_exposure'] == 'io_only'
          assert external['oracle_calls_collision_certificates'] == 72
          assert external['oracle_accounting_exact'] is True
          assert external['oracle_calls_total'] == lock['external_evidence']['oracle_calls_total']
          assert external['oracle_calls_total'] == (
              external['oracle_calls_learning_terminal']
              + external['oracle_calls_collision_certificates']
              + external['oracle_calls_challenge']
              + external['oracle_calls_heldout']
          )
          print('R267_1_EXACT_EVIDENCE_OK')
          PY
      - name: Run R2.67.1 and accepted R2.66
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Run protected R2.65 through R2.60 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
      - name: Run protected R2.59 through R2.50 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
      - name: Run protected R2.49 through R2.41 lineage
        run: PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py

  publish-full-gate:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/')) && (github.event_name == 'pull_request') }}
    needs: [frozen-focused, cross-python, canonical-full-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r2671/full-gate',
              'description':'R2.67.1 frozen authority, attempted-case evidence, triplet fairness and protected R2.66-R2.41 lineage passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R267_1_FULL_GATE_STATUS_PUBLISHED')
          PY
