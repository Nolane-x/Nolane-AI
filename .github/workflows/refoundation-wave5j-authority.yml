name: Refoundation Wave 5J Authority

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - refoundation/epoch0-wave5i-native-self-model

permissions:
  contents: write

jobs:
  authority:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5j-native-skills' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Fail closed on one-shot ancestry
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          if [[ "$parent" == "ac74ea6af6cd9f18143d886fb23ec993b80d7e53" ]]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "Carrier already consumed or ancestry changed; refusing mutation."
          fi

      - name: Apply exact Skills authority cutover
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "cogcoder/refoundation/facades.py",
              '        FacadeBinding("external.skills", "nolane.memory.skills", "cogcoder.organization.evolution", ("SkillEvolutionEngine",)),\n',
              "",
          )
          replace_once(
              "cogcoder/refoundation/component_versions.py",
              '        "external.self_model": 1,\n        "external.memory.fabric": 1,\n',
              '        "external.self_model": 1,\n        "external.skills": 1,\n        "external.memory.fabric": 1,\n',
          )
          replace_once(
              "cogcoder/refoundation/implementation_status.py",
              '''    "external.self_model": (\n        "nolane.external_core.self_model",\n        ("cogcoder/organization/self_model.py",),\n        "Native evidence-gated permanent-agent self-model registry with preserved initialization, revision and state semantics; historical module bridges both public object identities.",\n    ),\n    "external.memory.fabric": (\n''',
              '''    "external.self_model": (\n        "nolane.external_core.self_model",\n        ("cogcoder/organization/self_model.py",),\n        "Native evidence-gated permanent-agent self-model registry with preserved initialization, revision and state semantics; historical module bridges both public object identities.",\n    ),\n    "external.skills": (\n        "nolane.memory.skills",\n        ("cogcoder/organization/evolution.py", "cogcoder/organization/types.py"),\n        "Native skill scope, deterministic skill records and evidence-governed promotion/quarantine/visibility engine; historical evolution and mixed types surfaces bridge exact canonical identities without whole-file types ownership.",\n    ),\n    "external.memory.fabric": (\n''',
          )
          replace_once(
              "cogcoder/refoundation/inventory.py",
              '    "cogcoder/organization/self_model.py": "nolane/external_core/self_model.py",\n    "cogcoder/organization/memory.py": "nolane/memory/fabric.py",\n',
              '    "cogcoder/organization/self_model.py": "nolane/external_core/self_model.py",\n    "cogcoder/organization/evolution.py": "nolane/memory/skills.py",\n    "cogcoder/organization/memory.py": "nolane/memory/fabric.py",\n',
          )
          replace_once(
              "tests/test_refoundation_component_versions.py",
              '    "external.self_model",\n    "external.memory.fabric",\n',
              '    "external.self_model",\n    "external.skills",\n    "external.memory.fabric",\n',
          )
          replace_once(
              "tests/test_refoundation_implementation_status.py",
              '    "external.self_model",\n    "external.memory.fabric",\n',
              '    "external.self_model",\n    "external.skills",\n    "external.memory.fabric",\n',
          )
          replace_once(
              "tests/test_refoundation_wave5i_native_self_model.py",
              '    assert "external.individual_evolution" in facade_ids\n    assert "external.context" in facade_ids\n    assert "external.skills" in facade_ids\n',
              '    assert "external.individual_evolution" in facade_ids\n    assert "external.context" in facade_ids\n',
          )
          replace_once(
              "tests/test_refoundation_wave5i_native_self_model.py",
              '''    assert len(non_native) == 36\n    assert counts == {\n        "compatibility_facade": 26,\n        "frozen_asset": 1,\n        "historical_only": 7,\n        "legacy_internal": 2,\n    }\n    assert ledger["external.individual_evolution"].status is ImplementationStatus.COMPATIBILITY_FACADE\n    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n    assert ledger["external.skills"].status is ImplementationStatus.COMPATIBILITY_FACADE\n''',
              '''    # Wave 5I established an upper bound, not permanent downstream debt.\n    assert len(non_native) <= 36\n    assert counts.get("compatibility_facade", 0) <= 26\n    assert counts.get("frozen_asset", 0) <= 1\n    assert counts.get("historical_only", 0) <= 7\n    assert counts.get("legacy_internal", 0) <= 2\n    assert ledger["external.self_model"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert ledger["external.individual_evolution"].status is ImplementationStatus.COMPATIBILITY_FACADE\n    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n''',
          )
          PY

      - name: Regenerate repository audit projections
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m nolane.repository.audit --write
          git diff --exit-code -- archive/INDEX.json
          python -m nolane.repository.audit --check

      - name: Run all Refoundation contracts
        if: steps.gate.outputs.apply == 'true'
        run: python -m pytest -q tests/test_refoundation_*.py

      - name: Verify exact mutation scope and commit
        if: steps.gate.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'CURRENT/NATIVE_DEBT.json\nCURRENT/NATIVE_DEBT.md\ncogcoder/refoundation/component_versions.py\ncogcoder/refoundation/facades.py\ncogcoder/refoundation/implementation_status.py\ncogcoder/refoundation/inventory.py\ntests/test_refoundation_component_versions.py\ntests/test_refoundation_implementation_status.py\ntests/test_refoundation_wave5i_native_self_model.py'
          if [[ "$changed" != "$expected" ]]; then
            echo "Unexpected mutation scope:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/inventory.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_wave5i_native_self_model.py
          git diff --cached --name-only | sort
          git commit -m "refoundation(wave5j): accept native skills authority"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
