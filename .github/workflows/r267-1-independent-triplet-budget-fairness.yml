name: R2.67.1 Independent Triplet Budget Fairness

on:
  push:
    branches: [r2671-causal-ablation-correctness-gpt56sol]
    paths:
      - 'tests/test_r267_1_triplet_budget_semantic_invariance.py'
      - '.github/workflows/r267-1-independent-triplet-budget-fairness.yml'
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triplet-budget-fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 safety first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Challenge semantic triplet-budget invariance
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_triplet_budget_semantic_invariance.py
