name: Neural R2.5 Context Version Probe

on:
  push:
    branches:
      - neural-r25-skill-frontier-authority
    paths:
      - .github/workflows/neural-r25-context-version-probe.yml

permissions:
  contents: write

jobs:
  patch-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-r25-skill-frontier-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply exact external.context 4 to 5 projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'nolane/external_core/context.py': [
                  ('COMPONENT_VERSION = "0.0.4"', 'COMPONENT_VERSION = "0.0.5"'),
              ],
              'nolane/memory/context.py': [
                  ('COMPONENT_VERSION = "0.0.4"', 'COMPONENT_VERSION = "0.0.5"'),
              ],
              'nolane/metadata/component_versions.py': [
                  ('"external.context": 4,', '"external.context": 5,'),
              ],
              'tests/test_refoundation_component_versions.py': [
                  ('"external.context": 4,', '"external.context": 5,'),
                  ('component_version("external.context")) == "0.0.4"', 'component_version("external.context")) == "0.0.5"'),
                  ('next_component_version("external.context")) == "0.0.5"', 'next_component_version("external.context")) == "0.0.6"'),
              ],
              'tests/test_refoundation_memory_public_layout.py': [
                  ('context: ("external.context", "0.0.4")', 'context: ("external.context", "0.0.5")'),
              ],
              'tests/test_refoundation_wave5y_native_context.py': [
                  ('component_version("external.context")) == "0.0.4"', 'component_version("external.context")) == "0.0.5"'),
                  ('next_component_version("external.context")) == "0.0.5"', 'next_component_version("external.context")) == "0.0.6"'),
              ],
          }
          for name, rows in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in rows:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one {old!r}, got {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact context projection tests
        run: >-
          python -m pytest -q
          tests/test_refoundation_component_versions.py
          tests/test_refoundation_memory_public_layout.py
          tests/test_refoundation_wave5y_native_context.py
      - name: Remove temporary probe workflow
        run: rm .github/workflows/neural-r25-context-version-probe.yml
      - name: Commit and push context revision
        shell: bash
        run: |
          git config user.name 'Nolane Neural Version Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nolane/external_core/context.py nolane/memory/context.py nolane/metadata/component_versions.py tests/test_refoundation_component_versions.py tests/test_refoundation_memory_public_layout.py tests/test_refoundation_wave5y_native_context.py .github/workflows/neural-r25-context-version-probe.yml
          git diff --cached --check
          git commit -m 'fix(metadata): advance context revision for skill frontier authority'
          git push origin HEAD:neural-r25-skill-frontier-authority
      - name: Probe exact component ownership after fallback semantic change
        shell: bash
        run: |
          git fetch origin main
          python -m nolane.metadata.version_discipline_cli --base origin/main --head HEAD --json
          python -m nolane.metadata.version_discipline_cli --base origin/main --head HEAD --check
