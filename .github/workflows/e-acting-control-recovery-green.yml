name: E Acting Control Recovery Green

on:
  push:
    branches:
      - e-acting-control-reconciliation-gpt56sol
    paths:
      - '.github/workflows/e-acting-control-recovery-green.yml'

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: e-acting-control-reconciliation-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic control recovery patch
        run: python .github/e_acting_control_recovery_patch.py
      - name: Compile canonical E modules
        run: python -m py_compile nolane/external_core/*.py
      - name: Run control recovery contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_refoundation_acting_control_reconciliation.py \
            tests/test_refoundation_acting_control_commit_projection.py \
            tests/test_refoundation_acting_crash_reconciliation.py \
            tests/test_refoundation_wave5aa_native_execution_control.py \
            tests/test_refoundation_component_versions.py
      - name: Run full Refoundation regression
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Commit verified production delta
        if: success()
        run: |
          git config user.name "nolane-e-acting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nolane/external_core/execution.py nolane/metadata/component_versions.py tests/test_refoundation_component_versions.py tests/test_refoundation_wave5aa_native_execution_control.py CURRENT/E_ACTING.md
          git commit -m "feat(e-acting): reconcile acting recovery into execution sessions"
          git push origin HEAD:e-acting-control-reconciliation-gpt56sol
