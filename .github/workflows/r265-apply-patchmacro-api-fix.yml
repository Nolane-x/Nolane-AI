name: R2.65 Apply PatchMacro API Fix

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - '.github/workflows/r265-apply-patchmacro-api-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact semantic adapter patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text = path.read_text()
          marker = "_SUPPORTED_BINOPS = frozenset({'Add', 'Sub', 'Mult', 'Div', 'FloorDiv', 'Mod'})\n"
          adapter = '''\n\nclass PatchPrimitiveMacro(PatchMacro):\n    \"\"\"R2.65 semantic view of a verified legacy PatchMacro.\n\n    The inherited fields remain the runtime authority (`kind/src/dst`).  These\n    read-only aliases make the R2.65 primitive-induction API explicit without\n    mutating or widening the accepted parent PatchMacro contract.\n    \"\"\"\n\n    @property\n    def operation(self) -> str:\n        return self.kind\n\n    @property\n    def source_value(self) -> str | None:\n        return self.src\n\n    @property\n    def target_value(self) -> str | None:\n        return self.dst\n'''
          if 'class PatchPrimitiveMacro(PatchMacro):' not in text:
              assert text.count(marker) == 1, 'unexpected supported-binops marker count'
              text = text.replace(marker, marker + adapter, 1)
          old = '            rows.append(PatchMacro(\n'
          new = '            rows.append(PatchPrimitiveMacro(\n'
          if old in text:
              assert text.count(old) == 1, 'unexpected PatchMacro construction count'
              text = text.replace(old, new, 1)
          assert 'rows.append(PatchPrimitiveMacro(' in text
          assert 'class PatchPrimitiveMacro(PatchMacro):' in text
          path.write_text(text)
          PY
      - name: Verify focused R2.65 tests before commit
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_PATCH_ALREADY_APPLIED
          else
            git commit -m 'fix: add R2.65 semantic PatchMacro adapter'
            git push origin HEAD:r265-verified-patch-language-induction-gpt56sol
          fi
