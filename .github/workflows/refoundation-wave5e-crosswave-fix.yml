name: Refoundation Wave 5E Cross-Wave Invariant Fix

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5d-native-memory-lifecycle
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5e-native-memory-retrieval' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove stale Wave 5C Retrieval assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_refoundation_wave5c_native_memory_fabric.py')
          text = path.read_text(encoding='utf-8')
          stale = '    assert ledger["external.memory.retrieval"].status is ImplementationStatus.COMPATIBILITY_FACADE\n'
          if stale in text:
              if text.count(stale) != 1:
                  raise SystemExit('stale Wave-5C retrieval assertion is not unique')
              path.write_text(text.replace(stale, '', 1), encoding='utf-8')
          PY
          if git diff --quiet -- tests/test_refoundation_wave5c_native_memory_fabric.py; then
            echo 'No stale Wave 5C assertion remains.'
            exit 0
          fi
          git add tests/test_refoundation_wave5c_native_memory_fabric.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(refoundation): unfreeze retrieval from Wave 5C invariant'
          git push origin HEAD:${GITHUB_HEAD_REF}
