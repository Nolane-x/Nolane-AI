name: R2.68 Canonical Full Gate

on:
  push:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'R2_68_*.json'
      - 'cogcoder/r268_*.py'
      - 'cogcoder/_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - 'research/r268_*.py'
      - 'tests/test_r268_*.py'
      - '.github/workflows/r268-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R2_68_*.json'
      - 'cogcoder/r268_*.py'
      - 'cogcoder/_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - 'research/r268_*.py'
      - 'tests/test_r268_*.py'
      - '.github/workflows/r268-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  frozen-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify frozen R2.68 authority boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          path=Path('R2_68_PRE_HOSTED_LOCK.json')
          if not path.is_file(): raise SystemExit('R2.68 lock not frozen yet')
          lock=json.loads(path.read_text())
          assert lock['schema_version']==3
          assert lock['milestone']=='R2.68'
          assert lock['parent_release_commit']=='b789dd7a48f10f3afb1cf42ee62d3dc77dee200e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['frozen_evidence_changes_after_lock_forbidden'] is True
          a=lock['authority_hardening']
          required=(
            'target_preserving_nuisance_rejected','proposal_validation_disjoint','proper_subset_certificate_authority',
            'intervention_distinct_global_universe','replayable_global_lower_basis_ledger','attempted_observation_accounting',
            'terminal_selected_probe_reobservation','uncertified_search_miss_inconclusive','proposal_alias_budget_invariant',
            'proposal_search_reused_once','proposal_cache_discovery_only','proposal_cache_authority_validation_separate',
            'discovery_validation_oracle_query_disjoint','cross_phase_overlap_rejected_pre_oracle',
            'validation_oracle_query_multiset_unique','validation_duplicate_queries_rejected_pre_oracle',
            'external_projection_unique_validation_code','private_runtime_query_authority_enforced',
            'public_private_authority_defense_in_depth','private_cross_phase_bypass_rejected_pre_oracle',
            'private_validation_duplicate_bypass_rejected_pre_oracle','one_shot_integrator_retired_before_freeze',
            'canonical_json_evidence_comparison','refreeze_tracked_evidence_delta_isolated',
          )
          for key in required: assert a[key] is True,key
          iv=lock['independent_validation']
          assert iv['semantic_alias_search_reuse_red_run']==32237610280
          assert iv['semantic_alias_search_reuse_challenger_pr']==84
          assert iv['release_object_json_type_red_run']==32253395151
          assert iv['release_object_json_type_diagnostic_pr']==92
          assert iv['learning_validation_query_disjointness_red_run']==32253837397
          assert iv['learning_validation_query_disjointness_challenger_pr']==91
          assert iv['learning_validation_query_disjointness_fix_commit']=='b34037a41c073a826063e2ba4cb33874ff0c4044'
          assert iv['validation_query_uniqueness_red_run']==32256422916
          assert iv['validation_query_uniqueness_challenger_pr']==102
          assert iv['validation_query_uniqueness_fix_commit']=='a984b80ad28d7f2876d77be91f556a50ae0d581f'
          assert iv['external_projection_unique_corpus_fix_commit']=='b2e205837940e081cda0fa7da8232e7d81966446'
          assert iv['private_runtime_challenger_pr']==103
          assert iv['private_runtime_old_base_core_green_run']==32256837502
          assert iv['private_runtime_old_base_external_green_run']==32256837610
          assert iv['private_runtime_integration_trigger_commit']=='26d865d82be97cc481498bfa765e2da9eac6b2be'
          assert iv['private_runtime_integration_commit']=='d8428379550cc601acbadfbd8cc5646db50b95f7'
          assert iv['private_runtime_integrator_retirement_commit']=='c6f58646acaeb547f31709648f01c7eae12857c1'
          for file,expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',file],text=True).strip()
              assert actual==expected,(file,actual,expected)
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'],check=True)
          print('R268_FROZEN_AUTHORITY_OK',len(lock['frozen_git_blobs']),lock['source_freeze_head'])
          PY
      - name: Accepted parent safety
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.68 focused authority suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Recompute exact frozen evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r268_adaptive_causal_basis import run_benchmark
          from research.r268_external_transfer import run_external_transfer
          assert np.__version__=='2.4.6'
          phase=run_benchmark()
          external=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          phase_text=json.dumps(phase,indent=2,sort_keys=True)+'\n'
          external_text=json.dumps(external,indent=2,sort_keys=True)+'\n'
          assert Path('R2_68_PHASE_A_RESULT.json').read_text()==phase_text
          assert Path('R2_68_EXTERNAL_TRANSFER.json').read_text()==external_text
          lock=json.loads(Path('R2_68_PRE_HOSTED_LOCK.json').read_text())
          cp=json.dumps(phase,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          ce=json.dumps(external,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          assert hashlib.sha256(cp).hexdigest()==lock['authored_evidence']['sha256_canonical_json']
          assert hashlib.sha256(ce).hexdigest()==lock['external_evidence']['sha256_canonical_json']
          assert phase['all_gates_pass'] is True
          assert phase['selected_basis_sizes']==[0,2,3,4]
          assert phase['replayable_global_ledgers'] is True
          assert phase['complete_local_ledgers'] is True
          assert phase['false_accepts']==0 and phase['trainable_parameter_count']==0
          assert external['passed'] is True and external['globally_minimal'] is True
          assert external['source_id']=='numpy:numpy.linalg.det' and external['source_exposure']=='io_only'
          assert external['discovery_validation_oracle_query_disjoint'] is True
          assert external['validation_oracle_query_attempts']==120
          assert external['validation_oracle_query_unique']==120
          assert external['validation_oracle_query_duplicates']==0
          assert external['legal_interventions']==external['semantic_profiles']==4
          assert external['lower_basis_count']==external['lower_basis_certified']==external['lower_basis_certificate_count']==4
          assert external['necessity_certificate_count']==2
          assert external['proof_ledger_complete'] is True
          assert external['oracle_accounting_exact'] is True and external['false_accepts']==0
          print('R268_EXACT_EVIDENCE_OK')
          PY

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  canonical-lineage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
      - name: Verify accepted parent ancestry
        run: git merge-base --is-ancestor b789dd7a48f10f3afb1cf42ee62d3dc77dee200e HEAD
      - name: Protected R2.67.1 through R2.60
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
      - name: Protected R2.59 through R2.50
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py

  publish-full-gate:
    if: github.event_name == 'pull_request'
    needs: [frozen-focused,cross-python,canonical-lineage]
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          payload=json.dumps({'state':'success','context':'r268/full-gate','description':'R2.68 frozen private/public pre-oracle authority, query uniqueness, canonical JSON evidence, cross-Python and protected lineage passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          print('R268_FULL_GATE_STATUS_PUBLISHED')
          PY
