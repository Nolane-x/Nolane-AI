name: R2.67.1 Commit Core On Green

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'scripts/r267_1_apply_genuine_necessity_core.py'
      - 'scripts/r267_1_apply_certified_ablation_authority.py'
      - 'tests/test_r267_1_correctness_hotfix.py'
      - 'tests/test_r267_1_no_collision_failclosed.py'
      - '.github/workflows/r267-1-commit-core-on-green.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify workflow still targets the triggering head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply guarded source corrections ephemerally
        run: |
          python scripts/r267_1_apply_genuine_necessity_core.py
          python scripts/r267_1_apply_certified_ablation_authority.py
          python -m py_compile cogcoder/r267_three_probe_causal_composition.py
      - name: Verify corrected authority contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r267_1_correctness_hotfix.py \
            tests/test_r267_1_no_collision_failclosed.py
      - name: Verify compatible R2.67 safety contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r267_independent_ablation_completeness.py \
            tests/test_r267_independent_authority_boundaries.py \
            tests/test_r267_oracle_accounting.py \
            tests/test_r267_terminal_probe_evidence.py

  commit:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Refuse to write if branch moved after verification
        run: |
          set -euo pipefail
          git fetch origin r267-1-genuine-causal-necessity-hotfix-gpt56sol
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/r267-1-genuine-causal-necessity-hotfix-gpt56sol)" = "$GITHUB_SHA"
      - name: Materialize exactly the verified production delta
        run: |
          set -euo pipefail
          python scripts/r267_1_apply_genuine_necessity_core.py
          python scripts/r267_1_apply_certified_ablation_authority.py
          python -m py_compile cogcoder/r267_three_probe_causal_composition.py
          changed="$(git diff --name-only)"
          test "$changed" = "cogcoder/r267_three_probe_causal_composition.py"
          PYTHONPATH=. python -m pytest -q \
            tests/test_r267_1_correctness_hotfix.py \
            tests/test_r267_1_no_collision_failclosed.py
      - name: Commit verified core correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cogcoder/r267_three_probe_causal_composition.py
          git commit -m "fix: certify R2.67.1 lower-order causal necessity"
          git push origin HEAD:r267-1-genuine-causal-necessity-hotfix-gpt56sol
