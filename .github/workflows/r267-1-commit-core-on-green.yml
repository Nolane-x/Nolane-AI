name: R2.67.1 Materialized Core Integrity

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'tests/test_r267_1_*.py'
      - '.github/workflows/r267-1-commit-core-on-green.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'tests/test_r267_1_*.py'
      - '.github/workflows/r267-1-commit-core-on-green.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Require materialized core
        run: |
          grep -q "def _examples_have_target_collision" cogcoder/r267_three_probe_causal_composition.py
          python -m py_compile cogcoder/r267_three_probe_causal_composition.py
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.67.1 authority suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
      - name: Historical compatible fail-closed regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
