name: R2.65 Singleton Diagnostic Misspecification Fix

on:
  push:
    branches: [fix-r265-singleton-diagnostic-misspec-gpt56sol]
    paths:
      - '.github/workflows/r265-singleton-diagnostic-misspec-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extend diagnostics to misspecification detection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text = path.read_text()
          old = '''        if probe is None or partitions is None:\n            return receipt('abstain', None, None, False, 'no_informative_diagnostic_probe')\n'''
          new = '''        if probe is None or partitions is None:\n            # No remaining probe splits the current version space. That does\n            # not imply the version space contains the oracle: an unanimous\n            # (or singleton) prediction can still be contradicted. Fall\n            # through to target-independent misspecification probing below.\n            break\n'''
          assert text.count(old) == 1, f'expected one informative-probe exit, found {text.count(old)}'
          text = text.replace(old, new, 1)

          old = '''    if selected_probe is None:\n        return receipt('abstain', None, None, False, 'no_out_of_space_counterexample_for_induction')\n'''
          new = '''    if selected_probe is None and survivors:\n        # Once entropy-based discrimination is exhausted (including a\n        # singleton version space), remaining diagnostics still serve a\n        # different purpose: detect that every surviving hypothesis predicts\n        # an outcome absent from the oracle. This is bounded by the same oracle\n        # budget and receives no target output before candidate generation.\n        for probe in diagnostics:\n            if probe.probe_id in used_diagnostics:\n                continue\n            if diagnostic_calls >= selection_budget:\n                return receipt('abstain', None, None, False, 'selection_oracle_budget_exhausted')\n\n            fallback_partitions: dict[tuple[str, object], list[object]] = {}\n            for compiled_row in survivors:\n                candidate_key, _candidate_value = _outcome(compiled_row.fn, probe.args)\n                candidate_evaluations += 1\n                fallback_partitions.setdefault(candidate_key, []).append(compiled_row)\n\n            oracle_key, oracle_value, oracle_ok = _oracle_outcome(oracle, probe.args)\n            diagnostic_calls += 1\n            used_diagnostics.add(probe.probe_id)\n            if not oracle_ok:\n                return receipt('abstain', None, None, False, 'diagnostic_oracle_error')\n            test_id = 'r265:diagnostic:' + probe.probe_id.split(':', 1)[-1]\n            if test_id not in observed_test_ids:\n                observed_tests.append(PatchTest(test_id, tuple(probe.args), oracle_value))\n                observed_test_ids.add(test_id)\n            if probe.probe_id not in observed_probe_ids:\n                observed_probe_ids.append(probe.probe_id)\n\n            matching = fallback_partitions.get(oracle_key)\n            if matching:\n                survivors = matching\n                continue\n            diagnostic_counterexamples += 1\n            selected_probe = probe\n            break\n\n    if selected_probe is None:\n        reason = (\n            'no_informative_diagnostic_probe'\n            if len(survivors) > 1\n            else 'no_out_of_space_counterexample_for_induction'\n        )\n        return receipt('abstain', None, None, False, reason)\n'''
          assert text.count(old) == 1, f'expected one no-out-of-space exit, found {text.count(old)}'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install focused dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Run accepted R2.64 and all R2.65 focused contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Recompute authored and external smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer
          phase = run_benchmark()
          external = run_external_transfer(np.multiply, source_id='numpy.multiply', source_version=np.__version__)
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R265_SINGLETON_MISSPEC_GREEN')
          PY
      - name: Commit verified production fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_SINGLETON_MISSPEC_ALREADY_APPLIED
          else
            git commit -m 'fix: probe singleton R2.65 version spaces for misspecification'
            git push origin HEAD:fix-r265-singleton-diagnostic-misspec-gpt56sol
          fi
