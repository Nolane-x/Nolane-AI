name: R2.65 Freeze Hosted RED Evidence

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - '.github/workflows/r265-freeze-tdd-red.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  freeze-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover earliest contract-relevant hosted RED
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          if Path('R2_65_TDD_RED.json').exists():
              print('R265_TDD_RED_ALREADY_FROZEN')
              raise SystemExit(0)

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          branch='r265-verified-patch-language-induction-gpt56sol'
          workflow='r265-verified-patch-primitive-induction.yml'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'}

          def get_json(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read())

          runs=get_json(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch={branch}&per_page=100')['workflow_runs']
          runs=sorted(runs, key=lambda row: row['created_at'])
          needle="ModuleNotFoundError: No module named 'cogcoder.r265_verified_patch_primitive_induction'"
          evidence=[]
          for run in runs:
              if run.get('conclusion') != 'failure':
                  continue
              jobs=get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")['jobs']
              matching=[]
              for job in jobs:
                  if job.get('conclusion') != 'failure':
                      continue
                  req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/jobs/{job['id']}/logs", headers=headers)
                  try:
                      with urllib.request.urlopen(req) as response:
                          text=response.read().decode('utf-8', errors='replace')
                  except Exception:
                      continue
                  if needle in text:
                      matching.append({'job_id':job['id'],'job_name':job['name']})
              if matching:
                  evidence.append({
                      'workflow_run_id':run['id'],
                      'head_sha':run['head_sha'],
                      'created_at':run['created_at'],
                      'matching_failed_jobs':matching,
                      'expected_failure':needle,
                  })
                  break
          assert evidence, 'No hosted R2.65 missing-module RED run found'
          result={
              'schema_version':1,
              'milestone':'R2.65 Verified Patch Primitive Induction',
              'status':'HOSTED_TDD_RED_CONFIRMED',
              'production_module_absent_at_red':True,
              'failure_was_contract_relevant':True,
              'core_red':evidence[0],
              'claim':'The R2.65 core contract ran on hosted GitHub Actions and failed specifically because the production primitive-induction module did not yet exist. Production implementation was added only after that RED state.'
          }
          Path('R2_65_TDD_RED.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print('R265_TDD_RED_RECOVERED', evidence[0]['workflow_run_id'])
          PY
      - name: Commit RED receipt if newly frozen
        run: |
          set -euo pipefail
          if [ ! -f R2_65_TDD_RED.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R2_65_TDD_RED.json
          if git diff --cached --quiet; then
            echo R265_TDD_RED_UNCHANGED
          else
            git commit -m 'test: freeze hosted R2.65 RED evidence'
            git push origin HEAD:r265-verified-patch-language-induction-gpt56sol
          fi
