name: R2.67 Three-Probe Causal Composition

on:
  push:
    branches: [r267-three-probe-causal-composition-gpt56sol]
    paths:
      - 'cogcoder/r267_*.py'
      - 'tests/test_r267_*.py'
      - 'scripts/r267_apply_ablation_completeness_fix.py'
      - '.github/workflows/r267-three-probe-causal-composition.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r267_*.py'
      - 'tests/test_r267_*.py'
      - '.github/workflows/r267-three-probe-causal-composition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.67 three-probe contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_*.py

  ablation-authority-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-three-probe-causal-composition-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Apply complete finite-grammar ablation authority fix
        run: |
          if grep -q 'Authority must never infer causal necessity' cogcoder/r267_three_probe_causal_composition.py; then
            echo R267_ABLATION_AUTHORITY_PATCH_ALREADY_PRESENT
          else
            python scripts/r267_apply_ablation_completeness_fix.py
          fi
      - name: Independent ablation blocker must turn GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
      - name: Full R2.67 and accepted R2.66 must remain GREEN
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit exact tested source and revalidate against concurrent branch updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          if git diff --cached --quiet; then
            echo R267_ABLATION_AUTHORITY_PATCH_ALREADY_PRESENT
            exit 0
          fi
          git commit -m 'fix: require complete R2.67 ablation falsification'
          git fetch origin r267-three-probe-causal-composition-gpt56sol
          git rebase origin/r267-three-probe-causal-composition-gpt56sol
          PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          git push origin HEAD:r267-three-probe-causal-composition-gpt56sol
