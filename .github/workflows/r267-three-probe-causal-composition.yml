name: R2.67 Three-Probe Causal Composition

on:
  push:
    branches: [r267-three-probe-causal-composition-gpt56sol]
    paths:
      - 'cogcoder/r267_*.py'
      - 'tests/test_r267_*.py'
      - 'scripts/r267_*.py'
      - '.github/workflows/r267-three-probe-causal-composition.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r267_*.py'
      - 'tests/test_r267_*.py'
      - 'scripts/r267_*.py'
      - '.github/workflows/r267-three-probe-causal-composition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.67 three-probe contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_*.py

  search-root-cause-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-three-probe-causal-composition-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Apply bounded required-probe algebraic closure
        run: python scripts/r267_apply_three_probe_search_fix.py
      - name: Verify R2.67 GREEN candidate
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
      - name: Verify accepted R2.66 regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit exact tested patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          if git diff --cached --quiet; then
            echo R267_SEARCH_PATCH_ALREADY_PRESENT
          else
            git commit -m 'fix: add bounded R2.67 required-probe algebraic closure'
            git push origin HEAD:r267-three-probe-causal-composition-gpt56sol
          fi
