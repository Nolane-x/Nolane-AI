name: Refoundation Wave 5AQ Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5aq-native-research

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Materialize Wave 5AQ native Research authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          legacy_root = root / 'cogcoder' / 'organization'
          canonical_root = root / 'nolane' / 'external_core'

          modules = {
              'research': {
                  'from .artifacts import ArtifactStore': 'from nolane.external_core.artifacts import ArtifactStore',
                  'from .assurance import AssuranceControlPlane, AssuranceDisposition': 'from nolane.external_core.assurance import AssuranceControlPlane, AssuranceDisposition',
                  'from .evolution import SkillEvolutionEngine, SkillRecord': 'from nolane.memory.skills import SkillEvolutionEngine, SkillRecord',
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .research_profiles import ResearchDomain, ResearchProfileRegistry': 'from nolane.external_core.research_profiles import ResearchDomain, ResearchProfileRegistry',
                  'from .research_provenance import (': 'from nolane.external_core.research_provenance import (',
                  'from .types import canonical_digest, canonical_json': 'from nolane.core.canonical_digest import canonical_digest, canonical_json',
              },
              'research_profiles': {
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
              'research_provenance': {
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .research_profiles import ResearchDomain, ResearchProfileRegistry': 'from nolane.external_core.research_profiles import ResearchDomain, ResearchProfileRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
          }

          originals = {name: (legacy_root / f'{name}.py').read_text(encoding='utf-8') for name in modules}
          for name, replacements in modules.items():
              text = originals[name]
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Wave 5AQ canonicalization anchor missing in {name}: {old}')
                  text = text.replace(old, new)
              if name == 'research':
                  text += '\n\nCOMPONENT_ID = "external.research"\nCOMPONENT_VERSION = "0.0.1"\nMIGRATED_FROM = "cogcoder.organization.research"\n'
              (canonical_root / f'{name}.py').write_text(text, encoding='utf-8')

          for name in modules:
              (legacy_root / f'{name}.py').write_text(
                  f'from nolane.external_core.{name} import *\n', encoding='utf-8'
              )

          versions = root / 'cogcoder' / 'refoundation' / 'component_versions.py'
          text = versions.read_text(encoding='utf-8')
          if '        "external.research": 1,\n' not in text:
              anchor = '        "external.operations": 1,\n'
              if anchor not in text:
                  raise SystemExit('Wave 5AQ component-version insertion anchor missing')
              text = text.replace(anchor, anchor + '        "external.research": 1,\n', 1)
              versions.write_text(text, encoding='utf-8')

          facades = root / 'cogcoder' / 'refoundation' / 'facades.py'
          text = facades.read_text(encoding='utf-8')
          row = '        FacadeBinding("external.research", "nolane.external_core.research", "cogcoder.organization.research", ("ResearchControlPlane",)),\n'
          if row not in text:
              raise SystemExit('Wave 5AQ active-facade row missing')
          facades.write_text(text.replace(row, '', 1), encoding='utf-8')

          implementation = root / 'cogcoder' / 'refoundation' / 'implementation_status.py'
          text = implementation.read_text(encoding='utf-8')
          if '        "nolane.external_core.research",\n' not in text:
              anchor = '    "external.operations": (\n'
              entry = '''    "external.research": (\n        "nolane.external_core.research",\n        (\n            "cogcoder/organization/research.py",\n            "cogcoder/organization/research_profiles.py",\n            "cogcoder/organization/research_provenance.py",\n        ),\n        "Native Research routing, source/provenance/freshness/contradiction authority, synthesis and assurance-gated engineering handoff over canonical artifacts, assurance, skills, identity and digest dependencies; historical Research modules bridge exact semantic public identities.",\n    ),\n'''
              if anchor not in text:
                  raise SystemExit('Wave 5AQ implementation-ledger insertion anchor missing')
              text = text.replace(anchor, entry + anchor, 1)
              implementation.write_text(text, encoding='utf-8')

          version_oracle = root / 'tests' / 'test_refoundation_component_versions.py'
          text = version_oracle.read_text(encoding='utf-8')
          if '    "external.research": 1,\n' not in text:
              anchor = '    "external.operations": 1,\n'
              if anchor not in text:
                  raise SystemExit('Wave 5AQ version-oracle insertion anchor missing')
              text = text.replace(anchor, anchor + '    "external.research": 1,\n', 1)
              version_oracle.write_text(text, encoding='utf-8')

          native_oracle = root / 'tests' / 'test_refoundation_implementation_status.py'
          text = native_oracle.read_text(encoding='utf-8')
          if '    "external.research",\n' not in text:
              anchor = '    "external.operations",\n'
              if anchor not in text:
                  raise SystemExit('Wave 5AQ native-oracle insertion anchor missing')
              text = text.replace(anchor, anchor + '    "external.research",\n', 1)
              native_oracle.write_text(text, encoding='utf-8')

          predecessor = root / 'tests' / 'test_refoundation_wave5ap_native_operations.py'
          text = predecessor.read_text(encoding='utf-8')
          text = text.replace('assert len(state["components"]) == 7', 'assert len(state["components"]) <= 7')
          predecessor.write_text(text, encoding='utf-8')

          status = root / 'CURRENT' / 'STATUS.md'
          text = status.read_text(encoding='utf-8')
          if '## Wave 5AQ — native Research authority' not in text:
              text += '''\n\n## Wave 5AQ — native Research authority\n\nWave 5AQ retires `external.research` by moving the complete Research semantic closure under canonical `nolane.external_core` ownership: exact four-identity research routing, source quality and logical freshness, provenance and domain authorization, contradiction assessment/resolution, synthesis artifact authority, and assurance-gated engineering handoff. Canonical Research code resolves artifacts, assurance, skills, identity and digest dependencies only through `nolane` authorities; historical Research modules are exact semantic public-object bridges. The generated native-debt projection moves from 7 to 6 non-native component records, leaving only five historical semantic reservations and the frozen `neural.shared` asset.\n'''
              status.write_text(text, encoding='utf-8')
          PY
      - name: Materialize repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Verify generated authority is fresh
        run: |
          python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
          python -m nolane.ai.materialize --check
          python -m nolane.repository.audit --check
      - name: Run Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run Research and dependent regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Commit verified Wave 5AQ authority receipts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nolane/external_core/research.py \
                  nolane/external_core/research_profiles.py \
                  nolane/external_core/research_provenance.py \
                  cogcoder/organization/research.py \
                  cogcoder/organization/research_profiles.py \
                  cogcoder/organization/research_provenance.py \
                  cogcoder/refoundation/component_versions.py \
                  cogcoder/refoundation/facades.py \
                  cogcoder/refoundation/implementation_status.py \
                  tests/test_refoundation_component_versions.py \
                  tests/test_refoundation_implementation_status.py \
                  tests/test_refoundation_wave5ap_native_operations.py \
                  CURRENT/STATUS.md CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md archive/INDEX.json
          if git diff --cached --quiet; then
            echo 'No Wave 5AQ carrier changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(refoundation): materialize Wave 5AQ native Research authority'
          git push origin HEAD:refoundation/epoch0-wave5aq-native-research
