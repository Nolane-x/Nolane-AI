name: R2.59 Active Diagnostic Repository Probes

on:
  push:
    branches: [main, r259-active-repository-probes-gpt56sol]
    paths:
      - 'cogcoder/r259_*.py'
      - 'benchmarks/kfigg/r259_*.py'
      - 'research/r259_*.py'
      - 'tests/test_r259_*.py'
      - 'R2_59_PHASE_A_RESULT.json'
      - 'docs/superpowers/specs/2026-08-18-r259-active-repository-probe-synthesis-design.md'
      - 'docs/superpowers/plans/2026-08-18-r259-active-repository-probe-synthesis.md'
      - '.github/workflows/r259-active-repository-probes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r259_*.py'
      - 'benchmarks/kfigg/r259_*.py'
      - 'research/r259_*.py'
      - 'tests/test_r259_*.py'
      - 'R2_59_PHASE_A_RESULT.json'
      - '.github/workflows/r259-active-repository-probes.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused-and-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest z3-solver 'numpy==2.4.6'
      - name: Run R2.59 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
      - name: Run pinned NumPy GCD external I/O transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from research.r259_external_active_probe_transfer import run_external_transfer

          calls = {'count': 0}
          def oracle(a, b):
              calls['count'] += 1
              return int(np.gcd(a, b))

          result = run_external_transfer(
              oracle,
              source_id='numpy:numpy.gcd',
              source_version=np.__version__,
          )
          assert np.__version__ == '2.4.6'
          assert result['passed'] is True
          assert result['source_exposure'] == 'io_only'
          assert result['active_exact'] is True
          assert result['active_selection_oracle_calls'] == 1
          assert result['random_one_probe_exact'] is False
          assert result['passive_initial_only_exact'] is False
          assert result['selected_probe_partition_count'] == 4
          assert result['selected_probe_largest_partition'] == 1
          assert result['verification_exact'] == result['verification_cases'] == 625
          assert result['oracle_calls_total'] == calls['count']
          assert result['probe_generation_uses_target_outputs'] is False
          Path('R2_59_EXTERNAL_TRANSFER.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload pinned external transfer evidence
        uses: actions/upload-artifact@v4
        with:
          name: R2.59-numpy-gcd-external-transfer
          path: R2_59_EXTERNAL_TRANSFER.json
      - name: Recompute frozen R2.59 Phase-A evidence exactly
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r259_active_repository_probe_transfer import run_frozen_heldout
          expected = json.loads(Path('R2_59_PHASE_A_RESULT.json').read_text())
          actual = run_frozen_heldout()
          assert actual == expected, (actual, expected)
          s = actual['summary']
          assert actual['all_gates_pass'] is True
          assert s['active_exact'] == 6
          assert s['active_gain_over_random'] == 5
          assert s['active_max_selection_oracle_calls'] == 1
          assert s['active_full_verification_cases'] == 2401
          assert s['candidate_identity_invariant'] is True
          assert s['probe_generation_uses_target_outputs'] is False
          print(json.dumps(actual, indent=2, sort_keys=True))
          PY
      - name: Run direct repository parent R2.52
        run: PYTHONPATH=. python -m pytest -q tests/test_r252_repository_query.py tests/test_r252_repository_query_benchmark.py
      - name: Run protected R2.58 and R2.57 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
      - name: Run protected R2.56 to R2.50 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r254_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r253_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r251_*.py tests/test_r250_*.py
      - name: Run protected R2.49 to R2.41 lineage
        run: PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Publish R2.59 hosted status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r259/hosted-gate','description':'R2.59 active repository probes + external transfer + protected lineage passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install focused dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify R2.59 focused behavior
        run: PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
      - name: Publish cross-Python status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYVER: ${{ matrix.python }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':f"r259/cross-python-{os.environ['PYVER']}",'description':f"R2.59 focused tests passed on Python {os.environ['PYVER']}",'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY
