name: R2.69 Authority Binding Migration

on:
  push:
    branches: [ r269-autonomous-transfer-meta-learning-kernel-gpt56sol ]
    paths:
      - '.github/workflows/r269-authority-binding-migrate.yml'

permissions:
  contents: write

env:
  BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify hardened compiler contract first
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_source_authority_binding.py
      - name: Migrate R2.69 callers to verifier evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          generic = [
              Path('benchmarks/kfigg/r269_meta_learning.py'),
              Path('benchmarks/kfigg/r269_external_numpy_transfer.py'),
              Path('tests/test_r269_matching_authority.py'),
              Path('tests/test_r269_meta_credit.py'),
              Path('tests/test_r269_multi_prior_adjudication.py'),
              Path('tests/test_r269_negative_transfer.py'),
              Path('tests/test_r269_transfer_governor.py'),
          ]
          for path in generic:
              text = path.read_text()
              text = text.replace('source_authority_digest=', 'verifier_evidence_digest=')
              text = text.replace('verifier_evidence_digest="authority.', 'verifier_evidence_digest="verifier.fixture.')
              path.write_text(text)

          authored = Path('benchmarks/kfigg/r269_meta_learning.py')
          text = authored.read_text()
          text = text.replace('_authority_digest', '_verifier_evidence_digest')
          text = text.replace('r269.source-authority.', 'r269.verifier-evidence.')
          authored.write_text(text)

          external = Path('benchmarks/kfigg/r269_external_numpy_transfer.py')
          text = external.read_text()
          text = text.replace('_source_authority_digest', '_source_verifier_evidence_digest')
          text = text.replace('r269.external-source-authority.', 'r269.external-verifier-evidence.')
          external.write_text(text)

          portable = Path('tests/test_r269_portable_experience.py')
          text = portable.read_text()
          text = text.replace(
              'source_authority_digest="authority.123",',
              'verifier_evidence_digest="verifier.fixture.authority.123",',
          )
          marker = (
              'source_receipt_digest=portable.source_receipt_digest,\n'
              '            source_authority_digest=portable.source_authority_digest,'
          )
          replacement = (
              'source_receipt_digest=portable.source_receipt_digest,\n'
              '            source_verifier_evidence_digest=portable.source_verifier_evidence_digest,\n'
              '            source_authority_digest=portable.source_authority_digest,'
          )
          text = text.replace(marker, replacement)
          portable.write_text(text)
          PY
      - name: Reject stale compile channels
        run: |
          python - <<'PY'
          from pathlib import Path
          offenders=[]
          for path in list(Path('benchmarks/kfigg').glob('r269*.py')) + list(Path('tests').glob('test_r269_*.py')):
              if path.name == 'test_r269_source_authority_binding.py':
                  continue
              text=path.read_text()
              if 'compile_r268_experience' in text and 'source_authority_digest=' in text:
                  # PortableExperience direct constructors legitimately carry the bound field.
                  if path.name != 'test_r269_portable_experience.py':
                      offenders.append(str(path))
          if offenders:
              raise SystemExit('stale caller-chosen authority channels: '+', '.join(offenders))
          print('R269_VERIFIER_CHANNEL_MIGRATION_OK')
          PY
      - name: Full R2.69 plus protected R2.68 GREEN
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Commit verified migration
        run: |
          git config user.name 'Nolane R2.69 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add benchmarks/kfigg/r269_meta_learning.py benchmarks/kfigg/r269_external_numpy_transfer.py tests/test_r269_*.py
          git commit -m 'fix(r269): bind source authority to verifier evidence'
          git push origin HEAD:${BRANCH}
