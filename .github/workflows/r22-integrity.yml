name: R2.2 Integrity
on:
  workflow_dispatch:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen R2.2 provenance
        run: python scripts/verify_r22_release.py
      - name: Compile frozen R2.2 verification surface
        run: python -m compileall -q cogcoder/epistemic_workspace.py cogcoder/epistemic_program.py cogcoder/r22_runtime.py cogcoder/kfigg22.py scripts/evaluate_r22.py scripts/verify_r22_release.py
