name: Memory v0.0.9 Version Apply

on:
  push:
    branches:
      - codex/memory-learning-retrieval-snapshot-authority-v0.0.9
    paths:
      - '.github/workflows/memory-v009-version-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/memory-learning-retrieval-snapshot-authority-v0.0.9
          fetch-depth: 0
      - name: Advance accepted retrieval authority revision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('nolane/memory/retrieval.py'): [
                  ('COMPONENT_VERSION = "0.0.3"', 'COMPONENT_VERSION = "0.0.4"'),
              ],
              Path('nolane/metadata/component_versions.py'): [
                  ('"external.memory.retrieval": 3,', '"external.memory.retrieval": 4,'),
              ],
              Path('tests/test_refoundation_component_versions.py'): [
                  ('"external.memory.retrieval": 3,', '"external.memory.retrieval": 4,'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit revision and remove transaction workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memory-v009-version-apply.yml
          git add nolane/memory/retrieval.py nolane/metadata/component_versions.py tests/test_refoundation_component_versions.py
          git commit -m "chore(memory): advance retrieval authority to 0.0.4"
          git push origin HEAD:codex/memory-learning-retrieval-snapshot-authority-v0.0.9
