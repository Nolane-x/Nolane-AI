name: R2.65 True Global Generation Cap Cleanup

on:
  push:
    branches: [fix-r265-true-global-generation-cap-gpt56sol]
    paths:
      - 'tests/test_r265_true_global_generation_cap.py'
      - '.github/workflows/r265-true-global-generation-cap-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deduplicate structural-capacity helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text = path.read_text()
          marker = 'def _hypothesis_structural_capacity(\n'
          count = text.count(marker)
          assert count in {1, 2}, f'unexpected helper definition count: {count}'
          if count == 2:
              first = text.index(marker)
              second = text.index(marker, first + 1)
              generator = text.index('def _generate_hypothesis_fair_candidates(', second)
              first_block = text[first:second]
              second_block = text[second:generator]
              assert first_block.strip() == second_block.strip(), 'duplicate helpers are not byte-equivalent'
              text = text[:second] + text[generator:]
          assert text.count(marker) == 1
          path.write_text(text)
          PY
      - name: Install focused dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Run all R2.65 focused contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Recompute authored and external smoke
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer
          phase = run_benchmark()
          external = run_external_transfer(np.multiply, source_id='numpy.multiply', source_version=np.__version__)
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R265_TRUE_GLOBAL_CAP_CLEAN_GREEN')
          PY
      - name: Commit verified clean production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_TRUE_GLOBAL_CAP_SOURCE_ALREADY_CLEAN
          else
            git commit -m 'fix: deduplicate R2.65 structural capacity helper'
            git push origin HEAD:fix-r265-true-global-generation-cap-gpt56sol
          fi
