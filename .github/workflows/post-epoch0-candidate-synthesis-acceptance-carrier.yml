name: Post-Epoch 0 Candidate Synthesis Acceptance Carrier

on:
  push:
    branches:
      - 'post-epoch0/candidate-synthesis-v0.0.1'

permissions:
  contents: write

jobs:
  migrate-accepted-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Migrate exact accepted component tables
        run: |
          python - <<'PY'
          from pathlib import Path

          versions = Path('tests/test_refoundation_component_versions.py')
          text = versions.read_text(encoding='utf-8')
          anchor = '    "external.capability_acquisition": 1,\n'
          addition = anchor + '    "external.candidate_synthesis": 1,\n'
          if text.count(anchor) != 1:
              raise SystemExit('component revision acceptance anchor drift')
          if '"external.candidate_synthesis": 1' in text:
              raise SystemExit('candidate synthesis revision already accepted')
          versions.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          status = Path('tests/test_refoundation_implementation_status.py')
          text = status.read_text(encoding='utf-8')
          anchor = '    "external.capability_acquisition",\n'
          addition = anchor + '    "external.candidate_synthesis",\n'
          if text.count(anchor) != 2:
              raise SystemExit('implementation-status acceptance anchors drift')
          # The exact-native set must learn the new component. The separate
          # write-authority spot-check intentionally remains narrow because the
          # final writers==native assertion already proves the global boundary.
          first = text.find(anchor)
          if first < 0:
              raise SystemExit('native acceptance anchor missing')
          text = text[:first] + text[first:].replace(anchor, addition, 1)
          status.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact stale acceptance contracts plus new synthesis contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_post_epoch0_candidate_synthesis.py
      - name: Commit tested acceptance migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_refoundation_component_versions.py tests/test_refoundation_implementation_status.py
          git commit -m 'test: accept native candidate synthesis component'
          git push origin HEAD:${GITHUB_REF_NAME}
