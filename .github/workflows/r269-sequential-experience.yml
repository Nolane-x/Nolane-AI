name: R2.69 Sequential Experience Compilation

on:
  pull_request:
    paths:
      - 'cogcoder/r269_causal_basis_adapter.py'
      - 'cogcoder/r269_experience_compiler.py'
      - 'tests/test_r269_sequential_experience_compilation.py'
      - '.github/workflows/r269-sequential-experience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Protected R2.68 safety
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Existing portable adapter contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_portable_experience.py tests/test_r269_causal_basis_adapter.py
      - name: Sequential verifier-backed compilation
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_sequential_experience_compilation.py
      - name: Existing R2.69 contracts except independent closure track
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py -k 'not scratch_compositional_closure'
