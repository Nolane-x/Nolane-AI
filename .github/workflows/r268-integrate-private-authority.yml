name: R2.68 Integrate Combined Private Authority
# Exact-head retrigger after scheduler-only validation-domain isolation.

on:
  push:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - '.github/workflows/r268-integrate-private-authority.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r268-proof-carrying-adaptive-causal-basis-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Refuse stale integration writer
        run: |
          set -euo pipefail
          git fetch origin r268-proof-carrying-adaptive-causal-basis-gpt56sol
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/r268-proof-carrying-adaptive-causal-basis-gpt56sol)" = "$GITHUB_SHA"
      - name: Apply combined pre-oracle authority inside private runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('cogcoder/_r268_runtime.py')
          text=path.read_text()
          anchor1="""    if max_basis_size<1 or per_basis<1 or max_total<1:raise ValueError('basis size and candidate budgets must be positive')
    oracle_calls=0;queried=set()
"""
          replacement1="""    if max_basis_size<1 or per_basis<1 or max_total<1:raise ValueError('basis size and candidate budgets must be positive')

    # Validation is independent authority evidence. Prepare the complete oracle
    # query universe for both phases before any oracle execution. Keep the
    # validation keys as a multiset to reject repeated evidence, and as a set
    # for cross-phase intersection. This invariant lives in the private runtime
    # so direct internal callers cannot bypass the public authority wrapper.
    specs=enumerate_interventions(schema.field_names,tuple(map(float,anchor_values)),arity=int(intervention_arity))
    prepared_specs=[]
    discovery_query_keys={context_key(schema,row) for row in discovery}
    validation_query_keys=[context_key(schema,row) for row in validation]
    for spec in specs:
        ad=tuple(spec.apply(r,schema.field_names) for r in discovery);av=tuple(spec.apply(r,schema.field_names) for r in validation)
        if context_validator is not None and any(not bool(context_validator(r)) for r in (*ad,*av)):continue
        prepared_specs.append((spec,ad,av))
        discovery_query_keys.update(context_key(schema,row) for row in ad)
        validation_query_keys.extend(context_key(schema,row) for row in av)
    validation_query_set=set(validation_query_keys)
    if len(validation_query_set)!=len(validation_query_keys):
        raise ValueError(f'validation oracle query inputs must be semantically unique (duplicate_count={len(validation_query_keys)-len(validation_query_set)})')
    overlap=discovery_query_keys & validation_query_set
    if overlap:
        raise ValueError(f'discovery and validation oracle query inputs must be semantically disjoint (overlap_count={len(overlap)})')

    oracle_calls=0;queried=set()
"""
          anchor2="""    specs=enumerate_interventions(schema.field_names,tuple(map(float,anchor_values)),arity=int(intervention_arity));profiles=[]
    for spec in specs:
        ad=tuple(spec.apply(r,schema.field_names) for r in discovery);av=tuple(spec.apply(r,schema.field_names) for r in validation)
        if context_validator is not None and any(not bool(context_validator(r)) for r in (*ad,*av)):continue
        dv=[];vv=[]
"""
          replacement2="""    profiles=[]
    for spec,ad,av in prepared_specs:
        dv=[];vv=[]
"""
          assert text.count(anchor1)==1, text.count(anchor1)
          assert text.count(anchor2)==1, text.count(anchor2)
          text=text.replace(anchor1,replacement1,1).replace(anchor2,replacement2,1)
          path.write_text(text)
          print('R268_PRIVATE_COMBINED_AUTHORITY_PATCHED')
          PY
      - name: Direct private authority RED-to-GREEN contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_learning_validation_query_disjointness.py tests/test_r268_validation_query_uniqueness.py
      - name: Full R2.68 and accepted parents before commit
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Verify exact delta and commit private runtime hardening
        run: |
          set -euo pipefail
          git fetch origin r268-proof-carrying-adaptive-causal-basis-gpt56sol
          test "$(git rev-parse origin/r268-proof-carrying-adaptive-causal-basis-gpt56sol)" = "$GITHUB_SHA"
          changed="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$changed"
          test "$changed" = "cogcoder/_r268_runtime.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/_r268_runtime.py
          git commit -m 'fix: enforce combined R2.68 authority in private runtime'
          git push origin HEAD:r268-proof-carrying-adaptive-causal-basis-gpt56sol
