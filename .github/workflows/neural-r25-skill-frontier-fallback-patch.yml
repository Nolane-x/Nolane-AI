name: Neural R2.5 Skill Frontier Fallback Patch

on:
  push:
    branches:
      - neural-r25-skill-frontier-authority
    paths:
      - .github/workflows/neural-r25-skill-frontier-fallback-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-r25-skill-frontier-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply exact fallback authority patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/memory/context_intelligence.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from nolane.external_core.context import ContextCapsule\n'
          new_import = 'from nolane.external_core.context import ContextCapsule, skill_frontier_digest\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'expected exactly one ContextCapsule import, got {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_frontier = "            authoritative_artifacts=tuple((name, int(value)) for name, value in self._frontier()),\n"
          new_frontier = "            authoritative_artifacts=(\n                *tuple((name, int(value)) for name, value in self._frontier()),\n                ('skill-frontier', skill_frontier_digest(skills)),\n            ),\n"
          if text.count(old_frontier) != 1:
              raise SystemExit(f'expected exactly one fallback frontier expression, got {text.count(old_frontier)}')
          text = text.replace(old_frontier, new_frontier, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused context intelligence suite
        run: python -m pytest -q tests/test_coding_agi_context_intelligence.py
      - name: Remove temporary patch workflow
        run: rm .github/workflows/neural-r25-skill-frontier-fallback-patch.yml
      - name: Commit fallback GREEN
        shell: bash
        run: |
          git config user.name 'Nolane Neural Patch Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nolane/memory/context_intelligence.py .github/workflows/neural-r25-skill-frontier-fallback-patch.yml
          git diff --cached --check
          git commit -m 'fix(memory): preserve skill frontier in fallback context provenance'
          git push origin HEAD:neural-r25-skill-frontier-authority
