name: Refoundation Wave 5AY source authority hardening carrier

on:
  push:
    branches:
      - refoundation-wave5ay-native-transfer-meta
    paths:
      - .github/workflows/refoundation-wave5ay-source-authority-hardening-carrier.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation-wave5ay-native-transfer-meta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Bind source authority to exact native Experience and Attribution state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/external_core/transfer_meta.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''    source_experience_id: str\n    attribution_id: str\n    source_evidence_digest: str\n''',
                  '''    source_experience_id: str\n    attribution_id: str\n    source_experience_digest: str\n    source_attribution_digest: str\n    source_evidence_digest: str\n''',
              ),
              (
                  '''            "attribution_id": _nonempty(self.attribution_id, "attribution_id"),\n            "source_evidence_digest": _nonempty(self.source_evidence_digest, "source_evidence_digest"),\n''',
                  '''            "attribution_id": _nonempty(self.attribution_id, "attribution_id"),\n            "source_experience_digest": _nonempty(self.source_experience_digest, "source_experience_digest"),\n            "source_attribution_digest": _nonempty(self.source_attribution_digest, "source_attribution_digest"),\n            "source_evidence_digest": _nonempty(self.source_evidence_digest, "source_evidence_digest"),\n''',
              ),
              (
                  '''        object.__setattr__(self, "attribution_id", values["attribution_id"])\n        object.__setattr__(self, "source_evidence_digest", values["source_evidence_digest"])\n''',
                  '''        object.__setattr__(self, "attribution_id", values["attribution_id"])\n        object.__setattr__(self, "source_experience_digest", values["source_experience_digest"])\n        object.__setattr__(self, "source_attribution_digest", values["source_attribution_digest"])\n        object.__setattr__(self, "source_evidence_digest", values["source_evidence_digest"])\n''',
              ),
              (
                  '''        attribution_id: str,\n        source_evidence_digest: str,\n        causal_row_digest: str | None,\n''',
                  '''        attribution_id: str,\n        source_experience_digest: str,\n        source_attribution_digest: str,\n        source_evidence_digest: str,\n        causal_row_digest: str | None,\n''',
              ),
              (
                  '''            "attribution_id": _nonempty(attribution_id, "attribution_id"),\n            "source_evidence_digest": _nonempty(source_evidence_digest, "source_evidence_digest"),\n''',
                  '''            "attribution_id": _nonempty(attribution_id, "attribution_id"),\n            "source_experience_digest": _nonempty(source_experience_digest, "source_experience_digest"),\n            "source_attribution_digest": _nonempty(source_attribution_digest, "source_attribution_digest"),\n            "source_evidence_digest": _nonempty(source_evidence_digest, "source_evidence_digest"),\n''',
              ),
              (
                  '''            "attribution_id": self.attribution_id,\n            "source_evidence_digest": self.source_evidence_digest,\n''',
                  '''            "attribution_id": self.attribution_id,\n            "source_experience_digest": self.source_experience_digest,\n            "source_attribution_digest": self.source_attribution_digest,\n            "source_evidence_digest": self.source_evidence_digest,\n''',
              ),
              (
                  '''            attribution_id=str(state["attribution_id"]),\n            source_evidence_digest=str(state["source_evidence_digest"]),\n''',
                  '''            attribution_id=str(state["attribution_id"]),\n            source_experience_digest=str(state["source_experience_digest"]),\n            source_attribution_digest=str(state["source_attribution_digest"]),\n            source_evidence_digest=str(state["source_evidence_digest"]),\n''',
              ),
              (
                  '''        source_evidence_digest = canonical_digest(attribution.evidence.to_state())\n        receipt = PortableExperienceSourceReceipt.create(\n            portable_id=portable.portable_id,\n            source_experience_id=source.experience_id,\n            attribution_id=attribution.attribution_id,\n            source_evidence_digest=source_evidence_digest,\n            causal_row_digest=causal_digest,\n        )\n''',
                  '''        source_experience_digest = canonical_digest(source.to_state())\n        source_attribution_digest = canonical_digest(attribution.to_state())\n        source_evidence_digest = canonical_digest(attribution.evidence.to_state())\n        receipt = PortableExperienceSourceReceipt.create(\n            portable_id=portable.portable_id,\n            source_experience_id=source.experience_id,\n            attribution_id=attribution.attribution_id,\n            source_experience_digest=source_experience_digest,\n            source_attribution_digest=source_attribution_digest,\n            source_evidence_digest=source_evidence_digest,\n            causal_row_digest=causal_digest,\n        )\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify hardened Wave 5AY contracts
        run: |
          python -m pytest -q tests/test_refoundation_wave5ay_native_transfer_meta.py tests/test_refoundation_wave5ay_transfer_meta_hardening.py
          python -m pytest -q tests/test_refoundation_*.py
          python -m nolane.repository.audit --check
      - name: Commit hardened implementation and remove carrier
        shell: bash
        run: |
          rm .github/workflows/refoundation-wave5ay-source-authority-hardening-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nolane/external_core/transfer_meta.py .github/workflows/refoundation-wave5ay-source-authority-hardening-carrier.yml
          git commit -m "Harden Wave 5AY native source authority binding"
          git push origin HEAD:refoundation-wave5ay-native-transfer-meta
