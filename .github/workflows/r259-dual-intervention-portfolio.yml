name: R2.59 Dual Intervention Portfolio

on:
  push:
    branches: [r259-dual-intervention-portfolio, main]
    paths:
      - 'cogcoder/r259_*.py'
      - 'tests/test_r259_*.py'
      - '.github/workflows/r259-dual-intervention-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run R2.59 focused portfolio tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r259_intervention_portfolio.py
      - name: Publish R2.59 focused status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r259/focused','description':'R2.59 dual intervention portfolio passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY
