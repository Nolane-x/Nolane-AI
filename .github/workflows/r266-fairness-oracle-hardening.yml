name: R2.66 Fairness and Oracle Hardening

on:
  push:
    branches: [fix-r266-fairness-oracle-gpt56sol]
    paths:
      - 'cogcoder/_r266_contextual_composition_core.py'
      - 'tests/test_r266_independent_pair_budget_fairness.py'
      - 'tests/test_r266_intervention_oracle_failclosed.py'
      - '.github/workflows/r266-fairness-oracle-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify hosted RED contracts before first production mutation
        id: red
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "profiles.sort(key=lambda row: row.intervention.intervention_id)" cogcoder/_r266_contextual_composition_core.py; then
            set +e
            PYTHONPATH=. python -m pytest -q tests/test_r266_independent_pair_budget_fairness.py
            FAIR_RC=$?
            PYTHONPATH=. python -m pytest -q tests/test_r266_intervention_oracle_failclosed.py
            ORACLE_RC=$?
            set -e
            test "$FAIR_RC" -ne 0
            test "$ORACLE_RC" -ne 0
            echo 'R266_BOTH_RED_CONFIRMED'
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'R266_PATCH_ALREADY_PRESENT'
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply minimal root-cause fixes
        if: steps.red.outputs.needs_patch == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cogcoder/_r266_contextual_composition_core.py')
          text = path.read_text()

          old_sort = "    profiles.sort(key=lambda row: row.intervention.intervention_id)\n"
          new_sort = """    # Schedule intervention profiles by public semantic behavior first, not\n    # positional/content-addressed IDs.  This keeps a hard global composition\n    # budget invariant to external field ordering while retaining a stable ID\n    # tie-break for genuinely behavior-identical profiles.\n    profiles.sort(key=lambda row: (\n        _profile_semantic_id(row),\n        row.intervention.intervention_id,\n    ))\n"""
          if text.count(old_sort) != 1:
              raise SystemExit('expected positional profile scheduler not found exactly once')
          text = text.replace(old_sort, new_sort, 1)

          old_catch = """            except Exception:\n                invalid = True\n                oracle_calls += 1\n                break\n            oracle_calls += 1\n"""
          new_catch = """            except Exception as exc:\n                oracle_calls += 1\n                return ContextualCompositionStructureReceipt(\n                    False, None, 0, len(profiles), invalid_rejected, degenerate_rejected,\n                    len(specs), 0, 0, oracle_calls, 0,\n                    f'oracle_error:{type(exc).__name__}:{exc}', 0,\n                )\n            oracle_calls += 1\n"""
          if text.count(old_catch) != 2:
              raise SystemExit(f'expected two intervention oracle catch blocks, found {text.count(old_catch)}')
          text = text.replace(old_catch, new_catch, 2)
          path.write_text(text)
          PY
      - name: Verify GREEN contracts and protected parent
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r266_independent_pair_budget_fairness.py \
            tests/test_r266_intervention_oracle_failclosed.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Commit verified source hardening
        if: steps.red.outputs.needs_patch == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/_r266_contextual_composition_core.py
          git commit -m 'fix: harden R2.66 semantic scheduling and oracle failures'
          git push origin HEAD:fix-r266-fairness-oracle-gpt56sol
