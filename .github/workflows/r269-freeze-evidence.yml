name: R2.69 Self-Retiring Evidence Freeze

on:
  push:
    branches: [r269-autonomous-transfer-meta-learning-kernel-gpt56sol]
    paths:
      - 'R2_69_FREEZE_REQUEST'

permissions:
  contents: write

env:
  BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol
  SOURCE_AUTHORITY_PARENT: fda7f502185266fedb00886d5786c6d28cc0e0eb

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Refuse stale or premature freeze
        run: |
          set -euo pipefail
          git fetch origin ${BRANCH} main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/${BRANCH})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_AUTHORITY_PARENT" HEAD
          test -f R2_69_FREEZE_REQUEST
          test -f R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json
          test -f R2_69_EXTERNAL_TRANSFER.json
          test -f R2_69_PROMOTION_AUTHORITY.json
          test -f R2_69_WORLD_BOUNDED_ADJUDICATION.json
          test -f R2_69_WORLD_STATE_SNAPSHOT.json
          test -f R2_69_WORLD_GATE_SNAPSHOT.json
          test -f scripts/r269_world_adjudication.py
          test ! -f .github/workflows/r269-authority-binding-migrate.yml
          test ! -f .github/workflows/r269-sync-current-main.yml
          test ! -f scripts/r269_integrate_sequential_meta.py
          ! grep -q 'contents: write' .github/workflows/r269-red-green.yml
          ! grep -q 'contents: write' .github/workflows/r269-external-numpy-transfer.yml
          ! grep -q 'contents: write' .github/workflows/r269-promotion-authority.yml
          ! grep -q 'contents: write' .github/workflows/r269-multi-prior-hardening.yml

      - name: Full protected and R2.69 authority suite
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py

      - name: Recompute authored external promotion and World evidence
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          from benchmarks.kfigg.r269_promotion_authority import run_promotion_authority_benchmark
          from scripts.r269_world_adjudication import verify_receipt as verify_world_receipt

          authored=run_benchmark(); external=run_external_transfer()
          assert authored['authored_gate_pass'] is True
          assert authored['positive_transfer_solved']>=17
          assert authored['tight_cold_scratch_solved']<=12
          assert authored['roomy_scratch_solved']>=17
          assert authored['source_prior_ablation_advantage_removed_fraction']>=0.80
          assert authored['negative_targets']==12
          assert authored['negative_transfer_false_accepts']==0
          assert authored['continued_scratch_correctness_preserved'] is True
          assert authored['max_negative_transfer_diagnostic_regret']<=1
          assert authored['false_accepts']==0 and authored['trainable_parameter_count']==0
          assert external['all_gates_pass'] is True
          assert external['source_from_authored_generator'] is False
          assert external['source_exposure']==external['target_exposure']=='io_only'
          assert external['source_oracle_accounting_exact'] is True
          assert external['oracle_accounting_exact'] is True
          assert external['negative_extra_physical_oracle_regret']<=1
          assert external['false_accepts']==0 and external['trainable_parameter_count']==0
          Path('R2_69_PHASE_A_RESULT.json').write_text(json.dumps(authored,indent=2,sort_keys=True)+'\n')

          ext=json.loads(Path('R2_69_EXTERNAL_TRANSFER.json').read_text())
          assert ext['semantic_result_digest']==external['semantic_result_digest']
          assert ext['all_gates_pass'] is True
          if ext.get('source_head_sha'):
              subprocess.run(['git','merge-base','--is-ancestor',str(ext['source_head_sha']),'HEAD'],check=True)
          seq=json.loads(Path('R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json').read_text())
          assert seq['authored_benchmark_digest']==authored['semantic_result_digest']
          assert seq['complete_authored_r269_green'] is True

          promo=json.loads(Path('R2_69_PROMOTION_AUTHORITY.json').read_text())
          assert promo['milestone']=='R2.69'
          assert promo['promotion_gate_pass'] is True
          assert promo['false_accepts']==0 and promo['trainable_parameter_count']==0
          assert promo['python_versions_verified']==['3.11','3.13']
          tree_sha=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          current_tree_digest=hashlib.sha256(tree_sha.encode()).hexdigest()
          promotion_replay=run_promotion_authority_benchmark(
              authority_root_digest=promo['authority_root_digest'],
              hosted_run_identity=f"github-actions:freeze:{os.environ['FREEZE_RUN_ID']}",
              source_tree_digest=current_tree_digest,
          )
          assert promotion_replay['promotion_gate_pass'] is True
          assert promotion_replay['semantic_result_digest']==promo['semantic_result_digest']
          assert promotion_replay['false_accepts']==0
          assert promotion_replay['trainable_parameter_count']==0

          world=verify_world_receipt()
          assert world['milestone']=='R2.69'
          assert world['final_bounded_release']=='ACCEPT'
          assert world['full_w5_gate_pass'] is False
          assert world['w5_convergence_claimed'] is False
          assert world['convergence_forced'] is False
          assert world['false_accepts']==0
          print('R269_FREEZE_EVIDENCE_RECOMPUTED')
          PY

      - name: Materialize exact frozen blob lock and retire freeze writer
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PRE_FREEZE_HEAD="$(git rev-parse HEAD)"
          INTEGRATION_BASE="$(git rev-parse origin/main)"
          git rm R2_69_FREEZE_REQUEST .github/workflows/r269-freeze-evidence.yml
          PYTHONPATH=. PRE_FREEZE_HEAD="$PRE_FREEZE_HEAD" INTEGRATION_BASE="$INTEGRATION_BASE" python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          from scripts.r269_world_adjudication import CLAIM_BOUNDARY, verify_receipt as verify_world_receipt

          authored=run_benchmark(); external=run_external_transfer()
          promo=json.loads(Path('R2_69_PROMOTION_AUTHORITY.json').read_text())
          world=verify_world_receipt()
          assert world['claim_boundary']==CLAIM_BOUNDARY
          fixed=[
            'cogcoder/r269_causal_basis_adapter.py','cogcoder/r269_experience_compiler.py','cogcoder/r269_meta_learning_kernel.py',
            'cogcoder/r269_transfer_runtime.py','cogcoder/r269_meta_governance.py','cogcoder/r269_scoped_promotion.py',
            'cogcoder/r269_promotion_authority.py','cogcoder/r269_governed_runtime.py',
            'benchmarks/kfigg/r269_meta_learning.py','benchmarks/kfigg/r269_external_numpy_transfer.py',
            'benchmarks/kfigg/r269_promotion_authority.py','scripts/r269_world_adjudication.py',
            '.github/workflows/r269-red-green.yml','.github/workflows/r269-external-numpy-transfer.yml',
            '.github/workflows/r269-promotion-authority.yml','.github/workflows/r269-multi-prior-hardening.yml',
            '.github/workflows/r269-canonical-gate.yml','.github/workflows/r269-release-bundle.yml',
            '.github/workflows/r269-post-merge-release-bundle.yml','scripts/r269_build_complete_bundle.py',
            'docs/superpowers/specs/2026-08-19-r269-autonomous-transfer-meta-learning-kernel-design.md',
            'docs/superpowers/plans/2026-08-19-r269-autonomous-transfer-meta-learning-kernel.md',
            'CURRENT_STATUS.md','R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json','R2_69_EXTERNAL_TRANSFER.json',
            'R2_69_PROMOTION_AUTHORITY.json','R2_69_WORLD_BOUNDED_ADJUDICATION.json',
            'R2_69_WORLD_STATE_SNAPSHOT.json','R2_69_WORLD_GATE_SNAPSHOT.json','R2_69_PHASE_A_RESULT.json',
          ]
          tests=sorted(str(p) for p in Path('tests').glob('test_r269_*.py'))
          frozen=tuple(dict.fromkeys(fixed+tests))
          for path in frozen:
              assert Path(path).is_file(),path
          blobs={path:subprocess.check_output(['git','hash-object',path],text=True).strip() for path in frozen}
          lock={
            'schema_version':4,
            'milestone':'R2.69',
            'name':'Autonomous Transfer & Meta-Learning Kernel',
            'status':'PRE_HOSTED_SOURCE_AND_EVIDENCE_LOCK',
            'source_authority_parent':'fda7f502185266fedb00886d5786c6d28cc0e0eb',
            'source_head_sha':os.environ['PRE_FREEZE_HEAD'],
            'integration_base_sha':os.environ['INTEGRATION_BASE'],
            'freeze_workflow_run_id':int(os.environ['FREEZE_RUN_ID']),
            'added_trainable_parameters':0,
            'writers_retired':True,
            'w5_convergence_claimed':False,
            'claim_boundary':CLAIM_BOUNDARY,
            'authored_semantic_digest':authored['semantic_result_digest'],
            'external_semantic_digest':external['semantic_result_digest'],
            'promotion_semantic_digest':promo['semantic_result_digest'],
            'promotion_authority_root_digest':promo['authority_root_digest'],
            'promotion_hosted_attestation_digest':promo['hosted_attestation_digest'],
            'promotion_authority_envelope_digest':promo['authority_envelope_digest'],
            'promotion_verifier_workflow_blob':promo['verifier_workflow_blob'],
            'world_bounded_receipt_digest':world['receipt_digest'],
            'world_state_sha256':world['world_state_sha256'],
            'world_gate_sha256':world['world_gate_sha256'],
            'authored_gate_pass':bool(authored['authored_gate_pass']),
            'external_gate_pass':bool(external['all_gates_pass']),
            'promotion_gate_pass':bool(promo['promotion_gate_pass']),
            'negative_transfer_false_accepts':int(authored['negative_transfer_false_accepts']),
            'false_accepts':int(authored['false_accepts'])+int(external['false_accepts'])+int(promo['false_accepts']),
            'governed_promotion_required_for_learned_prior_reuse':True,
            'host_attested_promotion_authority_required':True,
            'promotion_authority_source_frozen':True,
            'content_addressed_world_adjudication_required':True,
            'exact_rollback_registry_required':True,
            'frozen_git_blobs':blobs,
          }
          Path('R2_69_PRE_HOSTED_LOCK.json').write_text(json.dumps(lock,indent=2,sort_keys=True)+'\n')
          PY
          git add R2_69_PHASE_A_RESULT.json R2_69_PRE_HOSTED_LOCK.json
          git config user.name 'Nolane R2.69 freeze verifier'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'release(r269): freeze exact source and evidence authority'
          git fetch origin ${BRANCH}
          test "$(git rev-parse origin/${BRANCH})" = "$GITHUB_SHA"
          git push origin HEAD:${BRANCH}
