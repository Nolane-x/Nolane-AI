name: R2.67 Independent Composed Search Fix Validation

on:
  push:
    branches: [validation-r267-composed-search-fixes-gpt56sol]
  pull_request:
    branches: [r267-three-probe-causal-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify accepted R2.66 parent before ephemeral patching
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply peer-authored R2.67 search patches in declared order
        run: |
          python scripts/r267_apply_three_probe_search_fix.py
          python scripts/r267_apply_probe_search_fix.py
      - name: Verify exact patched R2.67 tree
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
      - name: Reverify R2.66 after ephemeral patching
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
