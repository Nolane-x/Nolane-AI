name: R2.67 Independent Composed Search Fix Validation

on:
  push:
    branches: [validation-r267-composed-search-fixes-gpt56sol]
  pull_request:
    branches: [r267-three-probe-causal-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify accepted R2.66 parent before any ephemeral patching
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Ensure both peer-authored R2.67 search fixes are present
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'def _synthesize_required_three_probe_skeleton' cogcoder/r267_three_probe_causal_composition.py; then
            python scripts/r267_apply_three_probe_search_fix.py
          else
            echo R267_REQUIRED_THREE_PROBE_FIX_ALREADY_PRESENT
          fi
          if ! grep -q 'def _synthesize_bilinear_pair_skeleton' cogcoder/r267_three_probe_causal_composition.py; then
            python scripts/r267_apply_probe_search_fix.py
          else
            echo R267_BILINEAR_PROBE_FIX_ALREADY_PRESENT
          fi
      - name: Verify exact current R2.67 tree
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
      - name: Reverify R2.66 after R2.67 search surface
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
