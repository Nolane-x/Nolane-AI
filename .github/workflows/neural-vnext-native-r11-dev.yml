name: Neural vNext Native R11 Dev

on:
  push:
    branches:
      - codex/neural-native-r11-causal-version-space
    paths:
      - 'model/neural-vnext-native-r11/**'
      - '.github/workflows/neural-vnext-native-r11-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r11/**'
      - '.github/workflows/neural-vnext-native-r11-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r11-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted R9 parent authority
        run: |
          test "$(git hash-object model/neural-vnext-native-r9/ACCEPTED_AUTHORITY.json)" = "f3c829cdeb4fa3e2cfadd69ca4c583997b466049"
          test "$(git hash-object model/neural-vnext-native-r9/public_planner.py)" = "5bf3057e36e2a3163c85d55ffda6de6edf5e1eee"
          test "$(git hash-object model/neural-vnext-native-r9/planner_runtime.py)" = "b36faed53f3668cef9aceb3e99bfff4a1093b590"
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R11 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r11/*.py model/neural-vnext-native-r11/scripts/*.py model/neural-vnext-native-r11/tests/*.py
          python -m pytest -q model/neural-vnext-native-r11/tests
      - name: Run accepted-R9 R11 primary dev court
        env:
          PYTHONPATH: model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r11-dev
          python model/neural-vnext-native-r11/scripts/evaluate_r11_dev.py --manifest r11-dev/r11.manifest.json --dev-result r11-dev/r11.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r11/PREDEV_LOCK.json').read_text())
          manifest=json.loads(Path('r11-dev/r11.manifest.json').read_text())
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert lock['benchmark']['development_indices']==[544,575]
          assert lock['benchmark']['confirmation_indices']==[576,607]
          assert lock['benchmark']['fresh_indices']==[240,279]
          assert manifest['fresh_opened'] is False
          assert manifest['status']=='R11_DEV_ELIGIBLE_FRESH_UNOPENED'
          PY
      - name: Upload deterministic R11 development authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r11-dev
          path: |
            r11-dev/r11.manifest.json
            r11-dev/r11.dev.json
          if-no-files-found: error
          retention-days: 90
