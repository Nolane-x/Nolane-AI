name: Neural R2.5 Transitive Owner Version Patch

on:
  push:
    branches:
      - neural-r25-skill-frontier-authority
    paths:
      - .github/workflows/neural-r25-transitive-owner-version-patch.yml

permissions:
  contents: write

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-r25-skill-frontier-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply exact transitive owner revisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'nolane/metadata/component_versions.py': [
                  ('"external.integration": 12,', '"external.integration": 13,'),
                  ('"external.execution.control": 19,', '"external.execution.control": 20,'),
              ],
              'tests/test_refoundation_component_versions.py': [
                  ('"external.integration": 12,', '"external.integration": 13,'),
                  ('"external.execution.control": 19,', '"external.execution.control": 20,'),
                  ('assert str(component_version("external.integration")) == "0.0.12"', 'assert str(component_version("external.integration")) == "0.0.13"'),
                  ('assert str(next_component_version("external.integration")) == "0.0.13"', 'assert str(next_component_version("external.integration")) == "0.0.14"'),
                  ('assert str(component_version("external.execution.control")) == "0.0.19"', 'assert str(component_version("external.execution.control")) == "0.0.20"'),
                  ('assert str(next_component_version("external.execution.control")) == "0.0.20"', 'assert str(next_component_version("external.execution.control")) == "0.0.21"'),
              ],
              'tests/test_refoundation_wave5p_native_integration.py': [
                  ('assert row.component_version == "0.0.12"', 'assert row.component_version == "0.0.13"'),
                  ('assert str(component_version("external.integration")) == "0.0.12"', 'assert str(component_version("external.integration")) == "0.0.13"'),
              ],
              'tests/test_external_core_integration_revalidation.py': [
                  ('test_integration_surface_v008_projects_canonical_dependency_revision_v012', 'test_integration_surface_v008_projects_canonical_dependency_revision_v013'),
                  ('assert str(component_version("external.integration")) == "0.0.12"', 'assert str(component_version("external.integration")) == "0.0.13"'),
              ],
              'tests/test_external_core_scoped_revalidation_public_contract.py': [
                  ('assert str(component_version("external.integration")) == "0.0.12"', 'assert str(component_version("external.integration")) == "0.0.13"'),
              ],
              'tests/test_external_core_a5_public_contract.py': [
                  ('test_current_integration_owner_contract_preserves_v008_surface_at_revision_twelve', 'test_current_integration_owner_contract_preserves_v008_surface_at_revision_thirteen'),
                  ('assert component_revision_map()["external.integration"] == 12', 'assert component_revision_map()["external.integration"] == 13'),
              ],
              'tests/test_external_core_a6_temporal_reattestation.py': [
                  ('assert component_revision_map()["external.integration"] == 12', 'assert component_revision_map()["external.integration"] == 13'),
              ],
              'tests/test_external_core_a7_atomic_observation.py': [
                  ('assert component_revision_map()["external.integration"] == 12', 'assert component_revision_map()["external.integration"] == 13'),
              ],
              'tests/test_refoundation_wave5aa_native_execution_control.py': [
                  ('assert row.component_version == "0.0.19"', 'assert row.component_version == "0.0.20"'),
                  ('assert str(component_version("external.execution.control")) == "0.0.19"', 'assert str(component_version("external.execution.control")) == "0.0.20"'),
              ],
          }

          for name, rows in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in rows:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected exactly one {old!r}, got {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact owner projections
        run: >-
          python -m pytest -q
          tests/test_refoundation_component_versions.py
          tests/test_refoundation_wave5p_native_integration.py
          tests/test_external_core_integration_revalidation.py
          tests/test_external_core_scoped_revalidation_public_contract.py
          tests/test_external_core_a5_public_contract.py
          tests/test_external_core_a6_temporal_reattestation.py
          tests/test_external_core_a7_atomic_observation.py
          tests/test_refoundation_wave5aa_native_execution_control.py
      - name: Remove temporary patch workflow
        run: rm .github/workflows/neural-r25-transitive-owner-version-patch.yml
      - name: Commit candidate locally
        shell: bash
        run: |
          git config user.name 'Nolane Neural Version Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nolane/metadata/component_versions.py tests/test_refoundation_component_versions.py tests/test_refoundation_wave5p_native_integration.py tests/test_external_core_integration_revalidation.py tests/test_external_core_scoped_revalidation_public_contract.py tests/test_external_core_a5_public_contract.py tests/test_external_core_a6_temporal_reattestation.py tests/test_external_core_a7_atomic_observation.py tests/test_refoundation_wave5aa_native_execution_control.py .github/workflows/neural-r25-transitive-owner-version-patch.yml
          git diff --cached --check
          git commit -m 'fix(metadata): advance transitive context owner revisions'
      - name: Enforce exact component ownership
        shell: bash
        run: |
          git fetch origin main
          python -m nolane.metadata.version_discipline_cli --base origin/main --head HEAD --json
          python -m nolane.metadata.version_discipline_cli --base origin/main --head HEAD --check
      - name: Push verified candidate
        run: git push origin HEAD:neural-r25-skill-frontier-authority
