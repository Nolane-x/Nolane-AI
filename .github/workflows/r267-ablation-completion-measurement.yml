name: R2.67 Ablation Completion Measurement

on:
  push:
    branches: [measure-r267-ablation-closure-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        cap: [20000, 50000, 100000, 250000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify accepted R2.66 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Verify current R2.67 baseline witness exists
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_three_probe_causal_composition.py
      - name: Measure six lower-order ablations without promotion authority
        run: |
          mkdir -p measurement
          PYTHONPATH=. python research/r267_ablation_completion_probe.py \
            --cap ${{ matrix.cap }} \
            --output measurement/r267-ablation-cap-${{ matrix.cap }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: r267-ablation-cap-${{ matrix.cap }}
          path: measurement/r267-ablation-cap-${{ matrix.cap }}.json
