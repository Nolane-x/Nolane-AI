name: R2.68 Full Repository Release Bundle

on:
  push:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'R2_68_*.json'
      - 'R2_68_*.md'
      - 'cogcoder/r268_*.py'
      - 'cogcoder/_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - 'research/r268_*.py'
      - 'tests/test_r268_*.py'
      - '.github/workflows/r268-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R2_68_*.json'
      - 'R2_68_*.md'
      - 'cogcoder/r268_*.py'
      - 'cogcoder/_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - 'research/r268_*.py'
      - 'tests/test_r268_*.py'
      - '.github/workflows/r268-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
      - name: Verify frozen R2.68 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json,subprocess
          from pathlib import Path
          required=(
            'R2_68_PRE_HOSTED_LOCK.json','R2_68_PHASE_A_RESULT.json','R2_68_EXTERNAL_TRANSFER.json',
            'cogcoder/r268_adaptive_causal_basis.py','cogcoder/_r268_runtime.py','cogcoder/_r268_proof.py','cogcoder/_r268_search.py','cogcoder/_r268_types.py',
            'benchmarks/kfigg/r268_adaptive_causal_basis.py','research/r268_external_transfer.py',
            '.github/workflows/r268-red-green.yml','.github/workflows/r268-external-transfer.yml','.github/workflows/r268-canonical-gate.yml','.github/workflows/r268-freeze-evidence.yml','.github/workflows/r268-release-bundle.yml','.github/workflows/r268-post-merge-release-bundle.yml',
          )
          for file in required: assert Path(file).is_file(),file
          lock=json.loads(Path('R2_68_PRE_HOSTED_LOCK.json').read_text())
          assert lock['parent_release_commit']=='b789dd7a48f10f3afb1cf42ee62d3dc77dee200e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['frozen_evidence_changes_after_lock_forbidden'] is True
          for file,expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',file],text=True).strip()
              assert actual==expected,(file,actual,expected)
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'],check=True)
          print('R268_RELEASE_BOUNDARY_OK',len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r268_adaptive_causal_basis import run_benchmark
          from research.r268_external_transfer import run_external_transfer
          assert np.__version__=='2.4.6'
          phase=run_benchmark(); external=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          assert phase==json.loads(Path('R2_68_PHASE_A_RESULT.json').read_text())
          assert external==json.loads(Path('R2_68_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True and phase['false_accepts']==0
          assert phase['selected_basis_sizes']==[0,2,3,4]
          assert phase['replayable_global_ledgers'] is True and phase['complete_local_ledgers'] is True
          assert external['passed'] is True and external['source_exposure']=='io_only'
          assert external['source_id']=='numpy:numpy.linalg.det' and external['source_version']=='2.4.6'
          assert external['lower_basis_count']==external['lower_basis_certified']==external['lower_basis_certificate_count']==4
          assert external['necessity_certificate_count']==2 and external['proof_ledger_complete'] is True
          assert external['oracle_accounting_exact'] is True and external['false_accepts']==0
          print('R268_RELEASE_EVIDENCE_EXACT_OK')
          PY
      - name: Run R2.68 and accepted parent
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Run protected lineage R2.65 through R2.50
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
      - name: Create and verify complete repository snapshot
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.68-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.68-COMPLETE.zip | tee release/Nolane-AI-R2.68-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.68-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required={
            'R2_68_PRE_HOSTED_LOCK.json','R2_68_PHASE_A_RESULT.json','R2_68_EXTERNAL_TRANSFER.json',
            'cogcoder/r268_adaptive_causal_basis.py','cogcoder/_r268_runtime.py','cogcoder/_r268_proof.py','cogcoder/_r268_search.py','cogcoder/_r268_types.py',
            'benchmarks/kfigg/r268_adaptive_causal_basis.py','research/r268_external_transfer.py',
            '.github/workflows/r268-canonical-gate.yml','.github/workflows/r268-freeze-evidence.yml','.github/workflows/r268-release-bundle.yml','.github/workflows/r268-post-merge-release-bundle.yml'
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.68-COMPLETE.zip') as zf: names=set(zf.namelist())
          missing=required-names
          assert not missing,sorted(missing)
          print('R268_COMPLETE_ZIP_OK',len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.68-COMPLETE
          path: |
            release/Nolane-AI-R2.68-COMPLETE.zip
            release/Nolane-AI-R2.68-COMPLETE.zip.sha256
      - name: Publish release bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          payload=json.dumps({'state':'success','context':'r268/release-bundle','description':'R2.68 frozen proof-carrying authority, exact evidence, lineage and COMPLETE ZIP passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          print('R268_RELEASE_BUNDLE_STATUS_PUBLISHED')
          PY
