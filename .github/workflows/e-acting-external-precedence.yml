name: E Acting Safety GREEN

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-external-precedence.yml

concurrency:
  group: e-acting-safety-hardening
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply conservative process-tool classification
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('nolane/external_core/execution.py')
          text = path.read_text(encoding='utf-8')
          old = '''            is_external = action.tool_action.tool_id in self.executor.external_core_ids\n            if session.counters.tool_calls >= session.budget.max_tool_calls:\n'''
          new = '''            is_external = action.tool_action.tool_id in self.executor.external_core_ids\n            unconfined_process_tools = frozenset({'terminal', 'compiler', 'test-runner'})\n            if session.counters.tool_calls >= session.budget.max_tool_calls:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one process-tool declaration seam, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''            if is_external:\n                effect_class = EffectClass.EXTERNAL_MUTATION\n'''
          new = '''            if is_external or action.tool_action.tool_id in unconfined_process_tools:\n                effect_class = EffectClass.EXTERNAL_MUTATION\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one external-effect branch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - run: python -m pip install -q pytest
      - name: Run safety regressions
        run: |
          python -m py_compile nolane/external_core/*.py
          python -m pytest -q tests/test_refoundation_acting_workspace.py \
            -k 'ignored_payload_is_part_of_digest_and_rollback_proof or empty_directory_is_part_of_workspace_digest'
          python -m pytest -q tests/test_refoundation_acting_runtime.py \
            -k 'elapsed_core_time_can_expire_lease_before_commit or unconfined_process_tools_use_external_like_risk_floor'
      - name: Run all E Acting contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_protocol.py \
            tests/test_refoundation_acting_workspace.py \
            tests/test_refoundation_acting_runtime.py
      - name: Run full Refoundation regression
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Commit process-tool hardening
        if: success()
        run: |
          git config user.name "nolane-e-acting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nolane/external_core/execution.py
          git commit -m "fix(e-acting): classify unconfined process tools conservatively [e-acting-process-risk]"
          git push origin HEAD:refoundation/e-acting-transactional-runtime-gpt56sol
