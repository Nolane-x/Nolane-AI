name: E Acting Lease Expiry RED

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-external-precedence.yml

concurrency:
  group: e-acting-safety-hardening
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Prove elapsed lease expiry regression is RED
        run: python -m pytest -q tests/test_refoundation_acting_runtime.py -k elapsed_core_time_can_expire_lease_before_commit
