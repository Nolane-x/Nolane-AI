name: E Acting Workspace Process RED

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-external-precedence.yml

concurrency:
  group: e-acting-safety-hardening
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Prove full-workspace digest regressions are RED
        run: |
          python -m pytest -q tests/test_refoundation_acting_workspace.py \
            -k 'ignored_payload_is_part_of_digest_and_rollback_proof or empty_directory_is_part_of_workspace_digest'
      - name: Prove unconfined process classification regression is RED
        if: always()
        run: |
          python -m pytest -q tests/test_refoundation_acting_runtime.py \
            -k unconfined_process_tools_use_external_like_risk_floor
