name: E Acting Version Authority Closure

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-external-precedence.yml

concurrency:
  group: e-acting-safety-hardening
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  authority:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply E semantic revision bumps atomically
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_s: str, old: str, new: str, *, count: int = 1) -> None:
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path_s}: expected {count} occurrences of {old!r}, found {actual}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('nolane/external_core/execution_workspace.py', 'COMPONENT_VERSION = "0.0.2"', 'COMPONENT_VERSION = "0.0.3"')
          replace_exact('nolane/external_core/execution.py', 'COMPONENT_VERSION = "0.0.2"', 'COMPONENT_VERSION = "0.0.3"')
          replace_exact('nolane/external_core/acting_runtime.py', 'COMPONENT_VERSION = "0.1.0"', 'COMPONENT_VERSION = "0.1.1"')

          replace_exact(
              'nolane/metadata/component_versions.py',
              '        "external.execution.workspace": 2,',
              '        "external.execution.workspace": 3,',
          )
          replace_exact(
              'nolane/metadata/component_versions.py',
              '        "external.execution.control": 2,',
              '        "external.execution.control": 3,',
          )

          replace_exact(
              'tests/test_refoundation_component_versions.py',
              '    "external.execution.workspace": 2,',
              '    "external.execution.workspace": 3,',
          )
          replace_exact(
              'tests/test_refoundation_component_versions.py',
              '    "external.execution.control": 2,',
              '    "external.execution.control": 3,',
          )
          replace_exact(
              'tests/test_refoundation_component_versions.py',
              '    assert str(component_version("external.execution.workspace")) == "0.0.2"\n    assert str(next_component_version("external.execution.workspace")) == "0.0.3"',
              '    assert str(component_version("external.execution.workspace")) == "0.0.3"\n    assert str(next_component_version("external.execution.workspace")) == "0.0.4"',
          )
          replace_exact(
              'tests/test_refoundation_component_versions.py',
              '    assert str(component_version("external.execution.control")) == "0.0.2"\n    assert str(next_component_version("external.execution.control")) == "0.0.3"',
              '    assert str(component_version("external.execution.control")) == "0.0.3"\n    assert str(next_component_version("external.execution.control")) == "0.0.4"',
          )

          replace_exact(
              'tests/test_refoundation_wave5s_native_execution_workspace.py',
              '"0.0.2"',
              '"0.0.3"',
              count=3,
          )
          replace_exact(
              'tests/test_refoundation_wave5aa_native_execution_control.py',
              '"0.0.2"',
              '"0.0.3"',
              count=3,
          )
          PY
      - run: python -m pip install -q pytest
      - name: Print post-bump canonical runtime fingerprint
        run: |
          python - <<'PY'
          from cogcoder.organization.types import canonical_digest
          from cogcoder.refoundation.canonical_runtime import CanonicalOrganization
          state = CanonicalOrganization.first_generation().to_state()
          print('E_ACTING_POST_HARDENING_RUNTIME_STATE_DIGEST=' + canonical_digest(state))
          PY
      - name: Run version and E authority contracts
        run: |
          python -m py_compile nolane/external_core/*.py nolane/metadata/*.py
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_wave5s_native_execution_workspace.py \
            tests/test_refoundation_wave5aa_native_execution_control.py \
            tests/test_refoundation_acting_protocol.py \
            tests/test_refoundation_acting_workspace.py \
            tests/test_refoundation_acting_runtime.py
      - name: Run full Refoundation regression
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Commit version authority closure
        if: success()
        run: |
          git config user.name "nolane-e-acting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            nolane/external_core/execution_workspace.py \
            nolane/external_core/execution.py \
            nolane/external_core/acting_runtime.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_wave5s_native_execution_workspace.py \
            tests/test_refoundation_wave5aa_native_execution_control.py
          git commit -m "chore(e-acting): advance semantic component revisions [e-acting-authority]"
          git push origin HEAD:refoundation/e-acting-transactional-runtime-gpt56sol
