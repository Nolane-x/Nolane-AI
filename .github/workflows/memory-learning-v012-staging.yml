name: Memory Learning v0.0.12 Staging

on:
  push:
    branches:
      - codex/memory-learning-verified-admission-forgetting-v0.0.12

permissions:
  contents: write

concurrency:
  group: memory-learning-v012-staging
  cancel-in-progress: true

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Prove v0.0.12 contracts are RED before production change
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_memory_learning_verified_admission_forgetting_v012.py > /tmp/v012-red.log 2>&1
          status=$?
          cat /tmp/v012-red.log
          if [[ $status -eq 0 ]]; then
            echo 'Expected v0.0.12 RED contracts to fail before production patch' >&2
            exit 2
          fi
          echo "Observed expected RED exit status: $status"
      - name: Apply deterministic production patch
        run: |
          python scripts/patch_memory_learning_v012.py
          python scripts/patch_memory_runtime_binding_v012.py
          python -m py_compile nolane/memory/learning_substrate.py nolane/memory/runtime_binding.py
      - name: Prove focused v0.0.12 GREEN
        run: python -m pytest -q tests/test_memory_learning_verified_admission_forgetting_v012.py
      - name: Remove staging-only machinery and accidental status markers
        shell: bash
        run: |
          rm -f \
            scripts/patch_memory_learning_v012.py \
            scripts/patch_memory_runtime_binding_v012.py \
            .github/workflows/memory-learning-v012-staging.yml \
            CURRENT/.keep-v012 \
            CURRENT/MEMORY_LEARNING_V012_RED.md \
            CURRENT/MEMORY_LEARNING_V012_TEST_TARGETS.txt \
            CURRENT/MEMORY_LEARNING_V012_AUTHORITY_BOUNDARY.txt \
            CURRENT/MEMORY_LEARNING_V012_IMPLEMENTATION_ORDER.txt \
            CURRENT/MEMORY_LEARNING_V012_NO_EXPANSION.txt \
            CURRENT/MEMORY_LEARNING_V012_TDD.txt \
            CURRENT/MEMORY_LEARNING_V012_RED_HEAD.txt \
            CURRENT/MEMORY_LEARNING_V012_READY_FOR_RED_CI.txt \
            CURRENT/MEMORY_LEARNING_V012_BRANCH.txt \
            CURRENT/MEMORY_LEARNING_V012_NEXT.txt \
            CURRENT/MEMORY_LEARNING_V012_STATUS2.md \
            CURRENT/MEMORY_LEARNING_V012_STATUS3.md \
            CURRENT/MEMORY_LEARNING_V012_STATUS4.md \
            CURRENT/MEMORY_LEARNING_V012_RED_COMPLETE.txt \
            CURRENT/MEMORY_LEARNING_V012_STOP_DOC_SPAM.txt \
            CURRENT/MEMORY_LEARNING_V012_MARKER.txt \
            CURRENT/MEMORY_LEARNING_V012_IMPLEMENTATION_START.txt \
            CURRENT/MEMORY_LEARNING_V012_PR_NOTE.txt \
            CURRENT/MEMORY_LEARNING_V012_PR_READY.txt \
            CURRENT/MEMORY_LEARNING_V012_LAST_MARKER.txt
      - name: Commit GREEN implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(B): enforce verified memory admission and preauthorized forgetting'
          git push origin HEAD:codex/memory-learning-verified-admission-forgetting-v0.0.12
