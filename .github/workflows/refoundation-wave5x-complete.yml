name: Refoundation Wave 5X Complete Canonical Schema Authority

on:
  push:
    branches: [refoundation/epoch0-wave5x-canonical-event-context-schemas]
    paths:
      - '.github/workflows/refoundation-wave5x-complete.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation/epoch0-wave5x-canonical-event-context-schemas
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply fail-closed Wave 5X authority hygiene
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement anchor, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          event_imports = (
              'nolane/external_core/architecture.py',
              'nolane/organization/central.py',
              'nolane/organization/central_access.py',
              'nolane/organization/coordination.py',
              'nolane/organization/coordination_conflicts.py',
              'nolane/organization/coordination_delivery.py',
              'nolane/organization/coordination_leases.py',
              'nolane/organization/tasks.py',
          )
          for path in event_imports:
              replace_once(
                  path,
                  'from cogcoder.organization.types import EventKind',
                  'from nolane.organization.events import EventKind',
              )

          replace_once(
              'nolane/organization/lifecycle.py',
              'from cogcoder.organization.types import CognitiveEvent, EventKind',
              'from nolane.organization.events import CognitiveEvent, EventKind',
          )

          replace_once(
              'cogcoder/refoundation/component_versions.py',
              '        "organization.events": 1,',
              '        "organization.events": 2,',
          )
          replace_once(
              'tests/test_refoundation_component_versions.py',
              '    "organization.events": 1,',
              '    "organization.events": 2,',
          )
          replace_once(
              'tests/test_refoundation_wave2_native_organization.py',
              '        assert row.component_version == "0.0.1"\n        assert str(component_version(component_id)) == "0.0.1"',
              '        version = component_version(component_id)\n        assert row.component_version == str(version)\n        assert version.major == 0 and version.minor == 0\n        # Wave 2 established the native revision floor; later waves may advance it locally.\n        assert version.revision >= 1',
          )

          replace_once(
              'cogcoder/refoundation/implementation_status.py',
              '        "Native causal event ledger, subscriptions, delivery and state round-trip; historical module bridges to canonical class identity.",',
              '        "Native EventKind/CognitiveEvent schema authority plus causal event ledger, subscriptions, delivery and state round-trip; historical events and mixed types surfaces bridge exact canonical identities.",',
          )

          replace_once(
              'nolane/organization/central.py',
              "# Part II is stacked on the Part-I snapshot schema. Until the shared event\n# vocabulary receives its own schema migration, Central organizational actions\n# preserve the accepted runtime aliases of CENTRAL_INTERVENTION and carry the\n# specific action subtype in immutable event payloads.",
              "# Wave 5X moved shared event schema authority into nolane.organization.events.\n# Central organizational actions still preserve the accepted historical wire aliases\n# of CENTRAL_INTERVENTION and carry the specific action subtype in immutable payloads.",
          )

          replace_once(
              'nolane/external_core/requirements.py',
              "# Preserve the historical Part-I event wire schema. These semantic names are\n# aliases over the accepted event value; requirements_action remains the\n# discriminator carried in the payload until EventKind itself is refounded.",
              "# Preserve the historical Part-I event wire schema after Wave 5X moved EventKind\n# authority into nolane.organization.events. These semantic names remain aliases over\n# the accepted event value; requirements_action remains the payload discriminator.",
          )

          status = Path('CURRENT/STATUS.md')
          text = status.read_text(encoding='utf-8')
          bullet_anchor = '- Wave 5W candidate: `external.execution.executor` -> native `nolane.external_core.execution_executor`\n'
          bullet = '- Wave 5X prerequisite: canonical event/context schema authority -> `nolane.organization.events` + `nolane.external_core.context`\n'
          if text.count(bullet_anchor) != 1 or bullet in text:
              raise SystemExit('CURRENT/STATUS.md Wave 5X bullet anchor changed concurrently')
          text = text.replace(bullet_anchor, bullet_anchor + bullet, 1)

          paragraph_anchor = 'Wave 5W moves the fail-closed external-core executor, content-addressed core invocation receipts, bounded filesystem/Git/search/subprocess dispatch, task-lease enforcement, source-mutation claim checks and mirrored coding-tool receipts from historical `cogcoder.organization.execution_tools` to canonical `nolane.external_core.execution_executor`. The canonical executor now imports canonical artifact, identity, invokable-core, execution-schema/workspace, coding-claim/patch and digest authorities directly. Historical `cogcoder.organization.execution_tools` is an exact public-object bridge; `external.execution.control` remains a separate compatibility facade and is not claimed by Wave 5W.\n'
          paragraph = '\nWave 5X establishes canonical event/context schema authority without falsely retiring semantic component debt. `EventKind` and `CognitiveEvent` are now owned by `nolane.organization.events`; `ContextCapsule` is owned by `nolane.external_core.context`; historical `cogcoder.organization.types` preserves exact object bridges. Canonical `nolane` modules no longer reverse-import these shared schemas from the mixed historical types module. `external.context`, `neural.inference_bridge`, and `external.execution.control` remain explicit non-native boundaries until their own dependency-safe cutovers. The projection therefore remains at 24 non-native component records.\n'
          if text.count(paragraph_anchor) != 1 or 'Wave 5X establishes canonical event/context schema authority' in text:
              raise SystemExit('CURRENT/STATUS.md Wave 5X paragraph anchor changed concurrently')
          status.write_text(text.replace(paragraph_anchor, paragraph_anchor + paragraph, 1), encoding='utf-8')

          print('WAVE5X_AUTHORITY_HYGIENE_APPLIED')
          PY
      - name: Prove exact patch scope
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(cat <<'EOF' | sort
          CURRENT/STATUS.md
          cogcoder/refoundation/component_versions.py
          cogcoder/refoundation/implementation_status.py
          nolane/external_core/architecture.py
          nolane/external_core/requirements.py
          nolane/organization/central.py
          nolane/organization/central_access.py
          nolane/organization/coordination.py
          nolane/organization/coordination_conflicts.py
          nolane/organization/coordination_delivery.py
          nolane/organization/coordination_leases.py
          nolane/organization/lifecycle.py
          nolane/organization/tasks.py
          tests/test_refoundation_component_versions.py
          tests/test_refoundation_wave2_native_organization.py
          EOF
          )"
          printf 'Changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Compile canonical namespaces
        run: python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
      - name: Verify generated authority and repository projections stay fresh
        run: |
          python -m nolane.ai.materialize --check
          python -m nolane.repository.audit --check
      - name: Run Wave 5X and all Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run broad organization/campaign/execution regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Commit verified Wave 5X completion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            CURRENT/STATUS.md \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/implementation_status.py \
            nolane/external_core/architecture.py \
            nolane/external_core/requirements.py \
            nolane/organization/central.py \
            nolane/organization/central_access.py \
            nolane/organization/coordination.py \
            nolane/organization/coordination_conflicts.py \
            nolane/organization/coordination_delivery.py \
            nolane/organization/coordination_leases.py \
            nolane/organization/lifecycle.py \
            nolane/organization/tasks.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_wave2_native_organization.py
          git diff --cached --check
          git commit -m 'refoundation: complete Wave 5X schema authority hygiene'
          git push origin HEAD:refoundation/epoch0-wave5x-canonical-event-context-schemas
