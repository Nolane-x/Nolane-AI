name: R2.69 Source Authority Binding Integration

on:
  push:
    branches: [ r269-autonomous-transfer-meta-learning-kernel-gpt56sol ]
    paths:
      - '.github/workflows/r269-source-authority-fix.yml'

permissions:
  contents: write

env:
  BRANCH: r269-autonomous-transfer-meta-learning-kernel-gpt56sol

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Require materialized verifier-bound adapter
        run: |
          grep -q 'source_verifier_evidence_digest' cogcoder/r269_causal_basis_adapter.py
          grep -q 'verifier_evidence_digest' cogcoder/r269_causal_basis_adapter.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_source_authority_binding.py
      - name: Migrate compile call sites only
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          roots = [Path('benchmarks/kfigg'), Path('tests'), Path('research'), Path('external_tests')]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.py'):
                  if path.name == 'test_r269_source_authority_binding.py':
                      continue
                  text = path.read_text()
                  if 'compile_r268_experience' not in text or 'source_authority_digest=' not in text:
                      continue
                  tree = ast.parse(text)
                  lines = text.splitlines(keepends=True)
                  touched = False
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue
                      func = node.func
                      is_compile = (
                          isinstance(func, ast.Name) and func.id == 'compile_r268_experience'
                      ) or (
                          isinstance(func, ast.Attribute) and func.attr == 'compile_r268_experience'
                      )
                      if not is_compile:
                          continue
                      for keyword in node.keywords:
                          if keyword.arg != 'source_authority_digest':
                              continue
                          index = keyword.lineno - 1
                          lines[index] = lines[index].replace(
                              'source_authority_digest=', 'verifier_evidence_digest=', 1
                          )
                          touched = True
                  if touched:
                      path.write_text(''.join(lines))
                      changed.append(str(path))

          # Direct PortableExperience adversaries must carry the real verifier
          # evidence so they test the intended digest/role/parameter boundaries.
          for path in Path('tests').glob('test_r269_*.py'):
              text = path.read_text()
              needle = 'source_receipt_digest=portable.source_receipt_digest,'
              if needle not in text:
                  continue
              lines = text.splitlines(keepends=True)
              out = []
              touched = False
              for i, line in enumerate(lines):
                  out.append(line)
                  if needle not in line:
                      continue
                  next_line = lines[i + 1] if i + 1 < len(lines) else ''
                  if 'source_verifier_evidence_digest=' in next_line:
                      continue
                  indent = line[: len(line) - len(line.lstrip())]
                  out.append(
                      indent
                      + 'source_verifier_evidence_digest=portable.source_verifier_evidence_digest,\n'
                  )
                  touched = True
              if touched:
                  path.write_text(''.join(out))
                  changed.append(str(path))

          print('migrated:', *sorted(set(changed)), sep='\n')
          PY
      - name: Authority and roundtrip GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_source_authority_binding.py tests/test_r269_portable_experience.py
      - name: Full R2.69 plus protected R2.68 GREEN before commit
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Commit verified integration
        run: |
          if git diff --quiet -- benchmarks tests research external_tests 2>/dev/null; then
            echo 'No migration delta required.'
            exit 0
          fi
          git config user.name 'Nolane R2.69 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add benchmarks tests research external_tests 2>/dev/null || true
          git commit -m 'refactor(r269): use verifier evidence for source authority'
          git push origin HEAD:${BRANCH}
