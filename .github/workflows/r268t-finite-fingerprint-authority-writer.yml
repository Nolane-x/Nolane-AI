name: R2.68-T Finite Fingerprint Authority GREEN Writer

on:
  push:
    branches: [hardening-r268t-finite-fingerprint-authority-gpt56sol]
    paths:
      - 'scripts/r268t_apply_finite_fingerprint_authority.py'
      - '.github/workflows/r268t-finite-fingerprint-authority-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r268t-finite-fingerprint-authority-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-finite-fingerprint-authority-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_finite_fingerprint_authority.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Recompute authored benchmark
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r268_cross_task_causal_transfer import run_benchmark
          result = run_benchmark()
          assert result['all_gates_pass'] is True
          assert result['positive_transfer_exact'] == 3
          assert result['source_prior_ablation_exact'] == 0
          assert result['tight_scratch_exact'] == 0
          assert result['roomy_scratch_exact'] == 3
          assert result['negative_transfer_abstained'] == 2
          assert result['false_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          PY

  materialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-finite-fingerprint-authority-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_finite_fingerprint_authority.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Materialize tested source and authored diagnostic corpus
        run: |
          if git diff --quiet -- cogcoder/r268_cross_task_causal_transfer.py benchmarks/kfigg/r268_cross_task_causal_transfer.py; then
            echo 'Production changes already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r268_cross_task_causal_transfer.py benchmarks/kfigg/r268_cross_task_causal_transfer.py
          git commit -m 'fix: require proof-backed R2.68-T program equivalence'
          git push origin HEAD:hardening-r268t-finite-fingerprint-authority-gpt56sol
