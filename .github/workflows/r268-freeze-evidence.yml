name: R2.68 Freeze Fresh Evidence

on:
  push:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'cogcoder/r268_*.py'
      - 'cogcoder/_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - 'research/r268_*.py'
      - 'tests/test_r268_*.py'
      - '.github/workflows/r268-*.yml'
      - 'docs/superpowers/specs/2026-08-19-r268-proof-carrying-adaptive-causal-basis-design.md'
      - 'docs/superpowers/plans/2026-08-19-r268-proof-carrying-adaptive-causal-basis.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify exact triggering tree
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Accepted parent authority first
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.68 complete focused authority suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Recompute fresh authored and pinned external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from benchmarks.kfigg.r268_adaptive_causal_basis import run_benchmark
          from research.r268_external_transfer import run_external_transfer
          assert np.__version__=='2.4.6'
          phase=run_benchmark()
          external=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          assert phase['all_gates_pass'] is True
          assert phase['selected_basis_sizes']==[0,2,3,4]
          assert phase['adaptive_selected_basis_sizes']==[2,3,4]
          assert phase['one_probe_nuisance_rejected'] is True
          assert phase['replayable_global_ledgers'] is True
          assert phase['complete_local_ledgers'] is True
          assert phase['false_accepts']==0 and phase['trainable_parameter_count']==0
          assert external['passed'] is True
          assert external['source_id']=='numpy:numpy.linalg.det'
          assert external['source_version']=='2.4.6' and external['source_exposure']=='io_only'
          assert external['selected_basis_size']==2 and external['globally_minimal'] is True
          assert external['legal_interventions']==external['semantic_profiles']==4
          assert external['lower_basis_count']==external['lower_basis_certified']==external['lower_basis_certificate_count']==4
          assert external['necessity_certificate_count']==2
          assert external['proof_ledger_complete'] is True
          assert external['oracle_accounting_exact'] is True
          assert external['false_accepts']==0 and external['trainable_parameter_count']==0
          print('R268_FRESH_EVIDENCE_OK')
          PY

  freeze:
    needs: [verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r268-proof-carrying-adaptive-causal-basis-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Refuse stale freeze writer
        run: |
          set -euo pipefail
          git fetch origin r268-proof-carrying-adaptive-causal-basis-gpt56sol
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/r268-proof-carrying-adaptive-causal-basis-gpt56sol)" = "$GITHUB_SHA"
          git merge-base --is-ancestor b789dd7a48f10f3afb1cf42ee62d3dc77dee200e HEAD
      - name: Reverify exact source tree before freeze
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Materialize fresh proof evidence and source lock
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r268_adaptive_causal_basis import run_benchmark
          from research.r268_external_transfer import run_external_transfer

          phase=run_benchmark()
          external=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          assert np.__version__=='2.4.6'
          assert phase['all_gates_pass'] is True and phase['false_accepts']==0
          assert phase['selected_basis_sizes']==[0,2,3,4]
          assert phase['replayable_global_ledgers'] is True and phase['complete_local_ledgers'] is True
          assert external['passed'] is True and external['oracle_accounting_exact'] is True
          assert external['lower_basis_count']==external['lower_basis_certified']==external['lower_basis_certificate_count']==4
          assert external['necessity_certificate_count']==2 and external['false_accepts']==0

          Path('R2_68_PHASE_A_RESULT.json').write_text(json.dumps(phase,indent=2,sort_keys=True)+'\n')
          Path('R2_68_EXTERNAL_TRANSFER.json').write_text(json.dumps(external,indent=2,sort_keys=True)+'\n')

          fixed=[
            'cogcoder/r268_adaptive_causal_basis.py','cogcoder/_r268_runtime.py','cogcoder/_r268_proof.py','cogcoder/_r268_search.py','cogcoder/_r268_types.py',
            'benchmarks/kfigg/r268_adaptive_causal_basis.py','research/r268_external_transfer.py',
            '.github/workflows/r268-red-green.yml','.github/workflows/r268-external-transfer.yml','.github/workflows/r268-canonical-gate.yml','.github/workflows/r268-freeze-evidence.yml','.github/workflows/r268-release-bundle.yml','.github/workflows/r268-post-merge-release-bundle.yml',
            'docs/superpowers/specs/2026-08-19-r268-proof-carrying-adaptive-causal-basis-design.md','docs/superpowers/plans/2026-08-19-r268-proof-carrying-adaptive-causal-basis.md',
            'R2_68_PHASE_A_RESULT.json','R2_68_EXTERNAL_TRANSFER.json',
          ]
          tests=sorted(str(p) for p in Path('tests').glob('test_r268_*.py'))
          frozen_paths=tuple(dict.fromkeys(fixed+tests))
          for file in frozen_paths: assert Path(file).is_file(),file
          blobs={file:subprocess.check_output(['git','hash-object',file],text=True).strip() for file in frozen_paths}
          cp=json.dumps(phase,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          ce=json.dumps(external,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          lock={
            'schema_version':1,
            'milestone':'R2.68',
            'name':'Proof-Carrying Adaptive Causal Basis',
            'status':'PRE_HOSTED_SOURCE_AND_EVIDENCE_LOCK',
            'parent_release_commit':'b789dd7a48f10f3afb1cf42ee62d3dc77dee200e',
            'source_freeze_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'freeze_workflow_run_id':int(os.environ['FREEZE_RUN_ID']),
            'production_source_changes_after_lock_forbidden':True,
            'frozen_evidence_changes_after_lock_forbidden':True,
            'added_trainable_parameters':0,
            'claim_boundary':'bounded deterministic pure-input causal-basis discovery with legal intervention cardinality up to four, finite trusted expression grammar, discovery-only proposal search, disjoint validation, replayable collision certificates, terminal re-observation, and zero added trainable parameters; not a theorem of unrestricted causal minimality, not open-ended scientific autonomy, and not AGI/frontier-model equivalence',
            'authority_hardening':{
              'target_preserving_nuisance_rejected':True,
              'proposal_validation_disjoint':True,
              'proper_subset_certificate_authority':True,
              'intervention_distinct_global_universe':True,
              'replayable_global_lower_basis_ledger':True,
              'subset_specific_exposure_recomputed':True,
              'attempted_observation_accounting':True,
              'terminal_selected_probe_reobservation':True,
              'uncertified_search_miss_inconclusive':True,
              'external_io_only':True,
              'cross_python_required':True,
            },
            'authored_protocol':{
              'positive_selected_basis_sizes':[2,3,4],
              'nuisance_control_selected_basis_size':0,
              'max_basis_size':4,
              'intervention_arity':1,
              'expected_local_certificate_counts':[0,2,6,14],
              'expected_global_lower_basis_certificate_counts':[0,2,6,14],
            },
            'authored_evidence':{
              'all_gates_pass':bool(phase['all_gates_pass']),
              'selected_basis_sizes':phase['selected_basis_sizes'],
              'replayable_global_ledgers':bool(phase['replayable_global_ledgers']),
              'complete_local_ledgers':bool(phase['complete_local_ledgers']),
              'false_accepts':int(phase['false_accepts']),
              'trainable_parameter_count':int(phase['trainable_parameter_count']),
              'sha256_canonical_json':hashlib.sha256(cp).hexdigest(),
            },
            'external_evidence':{
              'source_id':external['source_id'],'source_version':external['source_version'],'source_exposure':external['source_exposure'],
              'passed':bool(external['passed']),'selected_basis_size':int(external['selected_basis_size']),'globally_minimal':bool(external['globally_minimal']),
              'legal_interventions':int(external['legal_interventions']),'lower_basis_count':int(external['lower_basis_count']),'lower_basis_certificate_count':int(external['lower_basis_certificate_count']),'necessity_certificate_count':int(external['necessity_certificate_count']),
              'oracle_calls_total':int(external['oracle_calls_total']),'oracle_accounting_exact':bool(external['oracle_accounting_exact']),'false_accepts':int(external['false_accepts']),
              'sha256_canonical_json':hashlib.sha256(ce).hexdigest(),
            },
            'independent_validation':{
              'composition_holdout_red_run':32220363255,
              'preoracle_accounting_red_run':32228145798,
              'validation_distinct_profile_red_run':32228801576,
              'latest_prefreeze_core_green_run':32231468200,
              'latest_prefreeze_external_green_run':32231468125,
              'proper_subset_challenger_pr':74,
              'composition_holdout_challenger_pr':75,
              'proper_subset_fix_challenger_pr':77,
            },
            'frozen_git_blobs':blobs,
          }
          Path('R2_68_PRE_HOSTED_LOCK.json').write_text(json.dumps(lock,indent=2,sort_keys=True)+'\n')
          print('R268_FRESH_LOCK_WRITTEN',len(blobs),lock['source_freeze_head'])
          PY
      - name: Verify freeze delta is evidence-only
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' R2_68_EXTERNAL_TRANSFER.json R2_68_PHASE_A_RESULT.json R2_68_PRE_HOSTED_LOCK.json | sort)"
          test "$changed" = "$expected"
      - name: Commit frozen R2.68 evidence records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R2_68_PHASE_A_RESULT.json R2_68_EXTERNAL_TRANSFER.json R2_68_PRE_HOSTED_LOCK.json
          git commit -m 'evidence: freeze R2.68 proof-carrying authority boundary'
          git push origin HEAD:r268-proof-carrying-adaptive-causal-basis-gpt56sol

# Retrigger after accepted-parent artifact synchronization; authority semantics unchanged.
