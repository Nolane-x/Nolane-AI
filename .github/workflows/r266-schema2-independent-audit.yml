name: R2.66 Schema-2 Independent Audit

on:
  push:
    branches: [validation-r266-schema2-exact-audit-gpt56sol]
  pull_request:
    branches: [r266-learned-contextual-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify schema-2 lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('R2_66_PRE_HOSTED_LOCK.json').read_text())
          assert lock['schema_version'] == 2
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['intervention_oracle_fail_closed_frozen'] is True
          print('R266_SCHEMA2_LOCK_PRESENT')
          PY
      - name: Accepted R2.65 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Independent schema-2 audit
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_schema2_independent_audit.py
