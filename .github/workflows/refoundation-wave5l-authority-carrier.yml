name: Refoundation Wave 5L Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5l-native-epistemic

permissions:
  contents: write

jobs:
  materialize-wave5l:
    if: github.ref_name == 'refoundation/epoch0-wave5l-native-epistemic'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_PARENT: a074f03a0503d9d96f4b93906a65b292744ddbbd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/epoch0-wave5l-native-epistemic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on exact authority parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "refoundation/epoch0-wave5l-native-epistemic"
      - name: Cut over Epistemic authority metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cogcoder/refoundation/implementation_status.py')
          text = path.read_text()
          anchor = '''    "external.knowledge": (\n        "nolane.memory.knowledge",\n        (\n            "cogcoder/knowledge_types.py",\n            "cogcoder/knowledge_store.py",\n            "cogcoder/knowledge_ledger.py",\n            "cogcoder/knowledge_adapters.py",\n        ),\n        "Native provenance-aware deterministic Knowledge fabric reconstructed from the dedicated R2 types/store/ledger/adapters lineage; historical modules bridge exact public identities while R2.54 Cognitive Retrieval remains outside this ownership boundary.",\n    ),\n'''
          addition = '''    "external.epistemic": (\n        "nolane.external_core.epistemic",\n        ("cogcoder/epistemic_workspace.py",),\n        "Native version-aware evidence workspace with fail-closed provenance, source/version supersession, corroboration, contested beliefs, conflicts and narrow missing-query generation; historical R2.2 module bridges exact public identities.",\n    ),\n'''
          assert anchor in text and addition not in text
          text = text.replace(anchor, anchor + addition)
          historical = '    "external.epistemic": ("historical R2 mechanisms; no dedicated current organization implementation",),\n'
          assert historical in text
          path.write_text(text.replace(historical, ''))

          path = Path('cogcoder/refoundation/inventory.py')
          text = path.read_text()
          anchor = '    "cogcoder/knowledge_adapters.py": "nolane/memory/knowledge.py",\n'
          mapping = '    "cogcoder/epistemic_workspace.py": "nolane/external_core/epistemic.py",\n'
          assert anchor in text and mapping not in text
          path.write_text(text.replace(anchor, anchor + mapping))

          path = Path('tests/test_refoundation_wave5k_native_knowledge.py')
          text = path.read_text()
          old = '''    assert len(non_native) == 34\n    assert counts == {\n        "compatibility_facade": 25,\n        "frozen_asset": 1,\n        "historical_only": 6,\n        "legacy_internal": 2,\n    }\n    assert ledger["external.knowledge"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n    assert ledger["external.epistemic"].status is ImplementationStatus.HISTORICAL_ONLY\n'''
          new = '''    assert len(non_native) <= 34\n    assert counts.get("historical_only", 0) <= 6\n    assert ledger["external.knowledge"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert ledger["external.knowledge"].canonical_module == "nolane.memory.knowledge"\n    assert ledger["external.knowledge"].canonical_write_authority\n'''
          assert old in text
          path.write_text(text.replace(old, new))
          PY
      - name: Prove targeted parity and Wave 5L contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_r22_epistemic_workspace.py \
            tests/test_refoundation_wave5k_native_knowledge.py \
            tests/test_refoundation_wave5l_native_epistemic.py
      - name: Materialize and verify official repository audit
        run: |
          python -m nolane.repository.audit --write
          python -m nolane.repository.audit --check
      - name: Commit explicit authority and audit outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/inventory.py \
            tests/test_refoundation_wave5k_native_knowledge.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md \
            archive/INDEX.json
          test -n "$(git diff --cached --name-only)"
          unexpected="$(git diff --cached --name-only | grep -Ev '^(cogcoder/refoundation/implementation_status.py|cogcoder/refoundation/inventory.py|tests/test_refoundation_wave5k_native_knowledge.py|CURRENT/NATIVE_DEBT.json|CURRENT/NATIVE_DEBT.md|archive/INDEX.json)$' || true)"
          test -z "$unexpected"
          git commit -m 'refoundation: cut over native Epistemic authority metadata'
          git push origin HEAD:refoundation/epoch0-wave5l-native-epistemic
