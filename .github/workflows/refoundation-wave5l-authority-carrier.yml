name: Refoundation Wave 5L Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5l-native-epistemic

permissions:
  contents: write

jobs:
  materialize-wave5l:
    if: github.ref_name == 'refoundation/epoch0-wave5l-native-epistemic'
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_PARENT: 3087df45b28dad2969e446adfab808e1cd838817
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/epoch0-wave5l-native-epistemic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on exact RED parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "refoundation/epoch0-wave5l-native-epistemic"
      - name: Materialize canonical Epistemic and authority metadata
        shell: bash
        run: |
          cat > nolane/external_core/epistemic.py <<'PYFILE'
          from __future__ import annotations

          import hashlib
          import re
          from collections import defaultdict
          from dataclasses import dataclass
          from typing import Iterable, Protocol


          COMPONENT_ID = "external.epistemic"
          COMPONENT_VERSION = "0.0.1"
          MIGRATED_FROM = "cogcoder.epistemic_workspace"

          _CLAIM = re.compile(r'^\s*(.+?)\s+--([^>-]+)-->\s+(.+?)\s*$')
          _VERSION_TOKEN = re.compile(r'(\d+|[A-Za-z]+)')


          class _EvidenceChunkLike(Protocol):
              chunk_id: str
              source_uri: str
              text: str
              content_sha256: str
              version: str
              score: float
              trust_score: float


          def _version_key(version: str) -> tuple:
              parts = []
              for token in _VERSION_TOKEN.findall(str(version)):
                  parts.append((0, int(token)) if token.isdigit() else (1, token.casefold()))
              return tuple(parts) or ((1, str(version).casefold()),)


          @dataclass(frozen=True)
          class ClaimRecord:
              subject: str
              relation: str
              object: str
              chunk_id: str
              source_uri: str
              version: str
              score: float
              trust_score: float


          @dataclass(frozen=True)
          class Belief:
              subject: str
              relation: str
              object: str | None
              confidence: float
              contested: bool
              independent_sources: int
              evidence_chunk_ids: tuple[str, ...]
              superseded_chunk_ids: tuple[str, ...]
              alternatives: tuple[str, ...]


          @dataclass(frozen=True)
          class EpistemicConflict:
              subject: str
              relation: str
              objects: tuple[str, ...]
              current_chunk_ids: tuple[str, ...]


          class EpistemicWorkspace:
              trainable_parameter_count = 0

              def __init__(self, *, contest_margin: float = 0.08):
                  self.contest_margin = float(contest_margin)
                  self._chunks: dict[str, _EvidenceChunkLike] = {}
                  self._claims: list[ClaimRecord] = []

              def ingest(self, chunk: _EvidenceChunkLike) -> bool:
                  if hashlib.sha256(chunk.text.encode()).hexdigest() != chunk.content_sha256:
                      raise ValueError('evidence content hash mismatch')
                  previous = self._chunks.get(chunk.chunk_id)
                  if previous is not None:
                      if previous != chunk:
                          raise ValueError('chunk id collision')
                      return False
                  self._chunks[chunk.chunk_id] = chunk
                  match = _CLAIM.match(chunk.text.strip())
                  if match:
                      self._claims.append(
                          ClaimRecord(
                              match.group(1).strip(),
                              match.group(2).strip(),
                              match.group(3).strip(),
                              chunk.chunk_id,
                              chunk.source_uri,
                              chunk.version,
                              float(chunk.score),
                              float(chunk.trust_score),
                          )
                      )
                  return True

              def ingest_many(self, chunks: Iterable[_EvidenceChunkLike]) -> int:
                  return sum(1 for chunk in chunks if self.ingest(chunk))

              def verify_provenance(self) -> bool:
                  return all(
                      hashlib.sha256(chunk.text.encode()).hexdigest() == chunk.content_sha256
                      for chunk in self._chunks.values()
                  )

              def _current_claims(self, subject: str, relation: str) -> tuple[list[ClaimRecord], list[ClaimRecord]]:
                  relevant = [c for c in self._claims if c.subject == subject and c.relation == relation]
                  by_source: dict[str, list[ClaimRecord]] = defaultdict(list)
                  for claim in relevant:
                      by_source[claim.source_uri].append(claim)
                  current: list[ClaimRecord] = []
                  superseded: list[ClaimRecord] = []
                  for rows in by_source.values():
                      best_key = max(_version_key(row.version) for row in rows)
                      latest = [row for row in rows if _version_key(row.version) == best_key]
                      latest.sort(key=lambda row: (-row.trust_score, -row.score, row.chunk_id))
                      current.append(latest[0])
                      keep = latest[0].chunk_id
                      superseded.extend(row for row in rows if row.chunk_id != keep)
                  current.sort(key=lambda row: (row.source_uri, row.chunk_id))
                  superseded.sort(key=lambda row: row.chunk_id)
                  return current, superseded

              def belief(self, subject: str, relation: str) -> Belief:
                  current, superseded = self._current_claims(subject, relation)
                  if not current:
                      return Belief(
                          subject, relation, None, 0.0, True, 0, (),
                          tuple(x.chunk_id for x in superseded), (),
                      )
                  grouped: dict[str, list[ClaimRecord]] = defaultdict(list)
                  for claim in current:
                      grouped[claim.object].append(claim)
                  scored = []
                  for obj, rows in grouped.items():
                      support = sum(0.7 * row.trust_score + 0.3 * row.score for row in rows)
                      scored.append((support, len({row.source_uri for row in rows}), obj, rows))
                  scored.sort(key=lambda row: (-row[0], -row[1], row[2]))
                  top_support, sources, obj, rows = scored[0]
                  total = sum(row[0] for row in scored)
                  confidence = top_support / total if total > 0 else 0.0
                  second = scored[1][0] if len(scored) > 1 else 0.0
                  contested = (
                      len(scored) > 1
                      and (top_support - second) <= self.contest_margin * max(1.0, top_support)
                  )
                  alternatives = tuple(row[2] for row in scored[1:])
                  return Belief(
                      subject,
                      relation,
                      obj,
                      confidence,
                      contested,
                      sources,
                      tuple(sorted(row.chunk_id for row in rows)),
                      tuple(row.chunk_id for row in superseded),
                      alternatives,
                  )

              def conflicts(self) -> tuple[EpistemicConflict, ...]:
                  keys = sorted({(claim.subject, claim.relation) for claim in self._claims})
                  out = []
                  for subject, relation in keys:
                      current, _ = self._current_claims(subject, relation)
                      objects = tuple(sorted({claim.object for claim in current}))
                      if len(objects) > 1:
                          out.append(
                              EpistemicConflict(
                                  subject,
                                  relation,
                                  objects,
                                  tuple(sorted(claim.chunk_id for claim in current)),
                              )
                          )
                  return tuple(out)

              def missing_queries(self, subject: str, relation: str) -> tuple[str, ...]:
                  belief = self.belief(subject, relation)
                  if belief.object is None:
                      return (f'{subject} {relation} current authoritative',)
                  if belief.contested:
                      options = ' '.join((belief.object,) + belief.alternatives)
                      return (f'{subject} {relation} current authoritative resolve {options}',)
                  return ()

              def chunks(self) -> tuple[_EvidenceChunkLike, ...]:
                  return tuple(self._chunks.values())


          __all__ = ("ClaimRecord", "Belief", "EpistemicConflict", "EpistemicWorkspace")
          PYFILE

          cat > cogcoder/epistemic_workspace.py <<'PYFILE'
          """Historical R2.2 Epistemic compatibility bridge.

          Canonical implementation authority moved to ``nolane.external_core.epistemic``
          in Refoundation Epoch 0 Wave 5L. ``EvidenceChunk`` remains available on
          this historical surface for source compatibility, but is owned by Knowledge.
          """

          from nolane.memory.knowledge import EvidenceChunk
          from nolane.external_core.epistemic import Belief, ClaimRecord, EpistemicConflict, EpistemicWorkspace

          __all__ = (
              "EvidenceChunk",
              "ClaimRecord",
              "Belief",
              "EpistemicConflict",
              "EpistemicWorkspace",
          )
          PYFILE

          python - <<'PY'
          from pathlib import Path

          path = Path('cogcoder/refoundation/component_versions.py')
          text = path.read_text()
          needle = '        "external.knowledge": 1,\n'
          assert needle in text and '        "external.epistemic": 1,\n' not in text
          path.write_text(text.replace(needle, needle + '        "external.epistemic": 1,\n'))

          path = Path('cogcoder/refoundation/implementation_status.py')
          text = path.read_text()
          knowledge_tail = '''    "external.knowledge": (\n        "nolane.memory.knowledge",\n        (\n            "cogcoder/knowledge_types.py",\n            "cogcoder/knowledge_store.py",\n            "cogcoder/knowledge_ledger.py",\n            "cogcoder/knowledge_adapters.py",\n        ),\n        "Native provenance-aware deterministic Knowledge fabric reconstructed from the dedicated R2 types/store/ledger/adapters lineage; historical modules bridge exact public identities while R2.54 Cognitive Retrieval remains outside this ownership boundary.",\n    ),\n'''
          addition = '''    "external.epistemic": (\n        "nolane.external_core.epistemic",\n        ("cogcoder/epistemic_workspace.py",),\n        "Native version-aware evidence workspace with fail-closed provenance, source/version supersession, corroboration, contested beliefs, conflicts and narrow missing-query generation; historical R2.2 module bridges exact public identities.",\n    ),\n'''
          assert knowledge_tail in text and addition not in text
          text = text.replace(knowledge_tail, knowledge_tail + addition)
          historical = '    "external.epistemic": ("historical R2 mechanisms; no dedicated current organization implementation",),\n'
          assert historical in text
          path.write_text(text.replace(historical, ''))

          path = Path('cogcoder/refoundation/inventory.py')
          text = path.read_text()
          needle = '    "cogcoder/knowledge_adapters.py": "nolane/memory/knowledge.py",\n'
          mapping = '    "cogcoder/epistemic_workspace.py": "nolane/external_core/epistemic.py",\n'
          assert needle in text and mapping not in text
          path.write_text(text.replace(needle, needle + mapping))

          path = Path('tests/test_refoundation_wave5k_native_knowledge.py')
          text = path.read_text()
          old = '''    assert len(non_native) == 34\n    assert counts == {\n        "compatibility_facade": 25,\n        "frozen_asset": 1,\n        "historical_only": 6,\n        "legacy_internal": 2,\n    }\n    assert ledger["external.knowledge"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert ledger["external.context"].status is ImplementationStatus.COMPATIBILITY_FACADE\n    assert ledger["external.epistemic"].status is ImplementationStatus.HISTORICAL_ONLY\n'''
          new = '''    assert len(non_native) <= 34\n    assert counts.get("historical_only", 0) <= 6\n    assert ledger["external.knowledge"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert ledger["external.knowledge"].canonical_module == "nolane.memory.knowledge"\n    assert ledger["external.knowledge"].canonical_write_authority\n'''
          assert old in text
          path.write_text(text.replace(old, new))
          PY

      - name: Prove Epistemic behavior and cutover contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q \
            tests/test_r22_epistemic_workspace.py \
            tests/test_refoundation_wave5k_native_knowledge.py \
            tests/test_refoundation_wave5l_native_epistemic.py
      - name: Materialize official repository audit
        run: |
          python -m nolane.repository.audit --write
          python -m nolane.repository.audit --check
      - name: Run all Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Commit only explicit Wave 5L authority files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            nolane/external_core/epistemic.py \
            cogcoder/epistemic_workspace.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/inventory.py \
            tests/test_refoundation_wave5k_native_knowledge.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md \
            archive/INDEX.json
          test -n "$(git diff --cached --name-only)"
          unexpected="$(git diff --cached --name-only | grep -Ev '^(nolane/external_core/epistemic.py|cogcoder/epistemic_workspace.py|cogcoder/refoundation/component_versions.py|cogcoder/refoundation/implementation_status.py|cogcoder/refoundation/inventory.py|tests/test_refoundation_wave5k_native_knowledge.py|CURRENT/NATIVE_DEBT.json|CURRENT/NATIVE_DEBT.md|archive/INDEX.json)$' || true)"
          test -z "$unexpected"
          git commit -m 'refoundation: cut over native Epistemic authority'
          git push origin HEAD:refoundation/epoch0-wave5l-native-epistemic
