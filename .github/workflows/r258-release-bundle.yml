name: R2.58 Full Repository Release Bundle

on:
  push:
    branches: [main, r258-active-probe-discovery]
    paths:
      - 'R2_58_DELIVERY.md'
      - 'R2_57_TO_R2_58_EVOLUTION.md'
      - 'R2_58_RELEASE_MANIFEST.json'
      - 'R2_58_EXTERNAL_TRANSFER.json'
      - 'R2_58_VERIFY_RESULT.json'
      - 'R2_58_WORLD_FINAL.json'
      - 'R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r258-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release test dependency
        run: python -m pip install pytest
      - name: Verify frozen release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          phase = json.loads(Path('R2_58_PHASE_A_RESULT.json').read_text())
          external = json.loads(Path('R2_58_EXTERNAL_TRANSFER.json').read_text())
          verify = json.loads(Path('R2_58_VERIFY_RESULT.json').read_text())
          world = json.loads(Path('R2_58_WORLD_FINAL.json').read_text())
          manifest = json.loads(Path('R2_58_RELEASE_MANIFEST.json').read_text())

          assert phase['active_discovery_runs'] == 3
          assert phase['metamorphic_rename_replays'] == 3
          assert phase['r257_harness_free_exact'] == 0
          assert phase['r258_active_exact'] == phase['episodes'] == 6
          assert phase['false_accepts'] == 0
          assert phase['renaming_invariance'] is True
          assert phase['max_oracle_calls'] == 77
          assert phase['max_interventions_considered'] == 8

          assert external['passed'] is True
          assert external['manual_probe_rows'] == 0
          assert external['probe_field_hints'] == 0
          assert external['harness_free_base_passed'] is False
          assert external['active_probe_passed'] is True
          assert external['challenge_exact'] == external['challenge_cases'] == 8
          assert external['heldout_exact'] == external['heldout_cases'] == 24
          assert external['source_commit'] == 'f1fbe6769850823a1976ccc28d14cd966130b645'

          assert verify['hosted_run_id'] == 32112510880
          assert verify['hosted_main_job'] == 'success'
          assert verify['focused_r258_tests'] == 7
          assert verify['benchmark_tests'] == 2
          assert verify['world_audit_valid'] is True
          assert verify['world_w5_passed'] is False
          assert verify['readiness_after'] == 48.1

          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == '5da4aee908f94f3af4772817c27fa54f8ed748957eac26e4304faf600b553523'
          assert world['gate']['passed'] is False
          assert world['gate']['score'] == 0
          assert world['active_seconds_credited'] == 0.0

          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['readiness'] == 48.1
          assert manifest['trainable_parameter_count'] == 0
          print('R258_RELEASE_BOUNDARY_OK')
          PY
      - name: Run R2.58 focused regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r258_active_probe.py
      - name: Run R2.58 benchmark regressions separately
        run: PYTHONPATH=. python -m pytest -q tests/test_r258_benchmark.py
      - name: Run R2.57 parent regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
      - name: Create complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.58-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.58-COMPLETE.zip | tee release/Nolane-AI-R2.58-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.58-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.58-COMPLETE
          path: |
            release/Nolane-AI-R2.58-COMPLETE.zip
            release/Nolane-AI-R2.58-COMPLETE.zip.sha256
      - name: Publish release-bundle commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success',
              'context': 'r258/release-bundle',
              'description': 'R2.58 release boundary, regressions, archive and ZIP integrity passed',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
