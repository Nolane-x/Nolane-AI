name: R2.58 Full Repository Release Bundle

on:
  push:
    branches: [main]
    paths:
      - 'R2_58_DELIVERY.md'
      - 'R2_58_EXTERNAL_TRANSFER.json'
      - 'R2_58_VERIFY_RESULT.json'
      - 'R2_58_WORLD_FINAL.json'
      - 'R2_58_RELEASE_MANIFEST.json'
      - 'R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r258-release-bundle.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R2_58_DELIVERY.md'
      - 'R2_58_EXTERNAL_TRANSFER.json'
      - 'R2_58_VERIFY_RESULT.json'
      - 'R2_58_WORLD_FINAL.json'
      - 'R2_58_RELEASE_MANIFEST.json'
      - 'R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r258-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release test dependency
        run: python -m pip install pytest
      - name: Verify frozen R2.58 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          phase=json.loads(Path('R2_58_PHASE_A_RESULT.json').read_text())
          external=json.loads(Path('R2_58_EXTERNAL_TRANSFER.json').read_text())
          verify=json.loads(Path('R2_58_VERIFY_RESULT.json').read_text())
          world=json.loads(Path('R2_58_WORLD_FINAL.json').read_text())
          manifest=json.loads(Path('R2_58_RELEASE_MANIFEST.json').read_text())
          assert phase['discovered'] == phase['configurations'] == 3
          assert phase['no_seed_failures'] == phase['seeded_successes'] == 3
          assert phase['probe_validation_exact'] == phase['probe_validation_cases'] == 12
          assert phase['wrong_role_false_accepts'] == 0
          assert phase['trainable_parameter_count'] == 0
          assert external['passed'] is True
          assert external['host_selected_intervention'] is False
          assert external['candidate_interventions_considered'] == 20
          assert external['no_seed_passed'] is False
          assert external['seeded_passed'] is True
          assert external['probe_validation_exact'] == external['probe_validation_cases'] == 4
          assert external['challenge_exact'] == external['challenge_cases'] == 8
          assert external['heldout_exact'] == external['heldout_cases'] == 24
          assert external['source_commit'] == 'f1fbe6769850823a1976ccc28d14cd966130b645'
          assert verify['hosted_relevant_tests_total'] == 186
          assert verify['phase_a_recomputed_exact'] is True
          assert verify['world_w5_passed'] is False
          assert verify['readiness_after'] == 47.8
          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == 'b6ec9a6c284ce8c9b957b81200a763a1f5796faa3eb68d25f8bda70dab203f9e'
          assert world['gate']['passed'] is False
          assert world['gate']['score'] == 0
          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['capability_commit'] == 'a7651f83f23ab3c021985f362e98c644323ecd6c'
          assert manifest['readiness'] == 47.8
          print('R258_RELEASE_BOUNDARY_OK')
          PY
      - name: Run focused release regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r258_*.py tests/test_r257_*.py
      - name: Create complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.58-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.58-COMPLETE.zip | tee release/Nolane-AI-R2.58-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.58-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.58-COMPLETE
          path: |
            release/Nolane-AI-R2.58-COMPLETE.zip
            release/Nolane-AI-R2.58-COMPLETE.zip.sha256
      - name: Publish release-bundle commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r258/release-bundle','description':'R2.58 release boundary, regressions, archive and ZIP integrity passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY
