name: Neural vNext Native R27 Dev

on:
  push:
    branches:
      - codex/neural-native-r27-robust-action-mass
    paths:
      - 'model/neural-vnext-native-r27/**'
      - '.github/workflows/neural-vnext-native-r27-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r27/**'
      - '.github/workflows/neural-vnext-native-r27-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r27-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r27-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R27 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r27:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r27/*.py model/neural-vnext-native-r27/scripts/*.py model/neural-vnext-native-r27/tests/*.py
          python -m pytest -q model/neural-vnext-native-r27/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r27/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r27/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['candidate']=='Neural-vNext-Native-R27-RobustActionMass'
          assert lock['benchmark']['development_indices']==[1568,1599]
          assert lock['benchmark']['confirmation_indices']==[1600,1631]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert len(lock['benchmark']['guard_blocks'])==4
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          assert lock['architecture']['expected_successor_parameters']==107799
          assert lock['private_label_boundary']['inference_private_goal_use'] is False
          assert lock['calibration_boundary']['dev_based_threshold_tuning'] is False
          assert lock['training']['minimum_block_override_rows']==5
          assert lock['training']['minimum_total_override_rows']==24
          PY
      - name: Train, robust-calibrate, and run locked R27 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r27:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r27-output
          python model/neural-vnext-native-r27/scripts/run_dev.py \
            --checkpoint r27-output/r27.pt \
            --manifest r27-output/r27.manifest.json \
            --dev-result r27-output/r27.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r27-output/r27.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_label_boundary']['inference_private_goal_use'] is False
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R27_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R27_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r27-dev
          path: |
            r27-output/r27.pt
            r27-output/r27.manifest.json
            r27-output/r27.dev.json
          if-no-files-found: error
          retention-days: 90
