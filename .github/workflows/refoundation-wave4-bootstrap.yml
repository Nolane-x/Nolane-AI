name: Refoundation Wave 4 Quarantine Bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave4-historical-quarantine' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify isolation rewriter contract before bulk migration
        run: python -m pytest -q tests/test_refoundation_wave4_repository_quarantine.py -k workflow_isolation_rewriter
      - name: Materialize repository audit ledgers
        run: python -m nolane.repository.audit --write
      - name: Isolate all historical PR workflows
        run: python -m nolane.repository.workflow_isolation --write
      - name: Verify generated audit and workflow isolation
        run: |
          python -m nolane.repository.audit --check
          python -m nolane.repository.workflow_isolation --check
          python -m pytest -q tests/test_refoundation_wave4_repository_quarantine.py
      - name: Commit Wave 4 generated quarantine state
        shell: bash
        run: |
          git add archive/INDEX.json CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md
          git add .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No Wave 4 bootstrap changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(refoundation): materialize historical quarantine census'
          git push origin HEAD:${GITHUB_HEAD_REF}
