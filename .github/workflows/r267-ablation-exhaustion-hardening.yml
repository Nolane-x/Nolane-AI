name: R2.67 Ablation Exhaustion Hardening

on:
  push:
    branches: [fix-r267-ablation-exhaustion-gpt56sol]
  pull_request:
    branches: [r267-three-probe-causal-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify R2.66 parent is green
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Confirm exact ablation-completeness RED before mutation
        id: red
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "ablation_inconclusive = False" cogcoder/r267_three_probe_causal_composition.py; then
            echo R267_ABLATION_FIX_ALREADY_PRESENT
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          else
            set +e
            PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
            RC=$?
            set -e
            test "$RC" -ne 0
            echo R267_ABLATION_COMPLETENESS_RED_CONFIRMED
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply minimal fail-closed ablation patch
        if: steps.red.outputs.needs_patch == 'true'
        run: python scripts/r267_apply_ablation_exhaustion_fix.py
      - name: Verify R2.67 GREEN and R2.66 protected parent
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit exact tested production patch
        if: steps.red.outputs.needs_patch == 'true' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          git commit -m 'fix: fail closed on R2.67 ablation exhaustion'
          git push origin HEAD:fix-r267-ablation-exhaustion-gpt56sol
