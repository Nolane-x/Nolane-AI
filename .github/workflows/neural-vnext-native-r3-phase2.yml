name: Neural vNext Native R3 Phase 2 Dev

on:
  push:
    branches:
      - codex/neural-native-r3-attributed-belief
    paths:
      - 'model/neural-vnext-native-r3/PHASE2_LOCK.json'
      - 'model/neural-vnext-native-r3/scripts/train_r3_phase2.py'
      - '.github/workflows/neural-vnext-native-r3-phase2.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r3/PHASE2_LOCK.json'
      - 'model/neural-vnext-native-r3/scripts/train_r3_phase2.py'
      - '.github/workflows/neural-vnext-native-r3-phase2.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: neural-vnext-native-r3-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r3-phase2:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
      PHASE1_RUN_ID: '35447526183'
      PHASE1_CHECKPOINT_SHA256: '8c2ba53e81b51d1418cbb7abead6380808dc558cde02af9e63bf8020f92e95da'
      PHASE1_STATE_SHA256: '6ecf000191d6212953c8f3a77b5f3de697795f9797c75da70ddd838003531c1e'
      PHASE1_MANIFEST_SHA256: '388b47e71cd83069c40af0ccad495bf340f19a037fb09ddbf3bb26deb4fccb8d'
      PHASE1_DEV_SHA256: '85f8b1250b288d9e67327126f4b3895becb6c8be7c2ede926040dae3e6c1abdf'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Download exact frozen R3 Phase-1 artifact
        uses: actions/download-artifact@v4
        with:
          name: neural-vnext-native-r3-dev
          path: phase1-artifact
          github-token: ${{ github.token }}
          repository: Nolane-x/Nolane-AI
          run-id: 35447526183

      - name: Verify Phase-1 authority before continuing
        run: |
          test "$(sha256sum phase1-artifact/r3.pt | awk '{print $1}')" = "$PHASE1_CHECKPOINT_SHA256"
          test "$(sha256sum phase1-artifact/r3.manifest.json | awk '{print $1}')" = "$PHASE1_MANIFEST_SHA256"
          test "$(sha256sum phase1-artifact/r3.dev.json | awk '{print $1}')" = "$PHASE1_DEV_SHA256"
          PYTHONPATH=model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8 python - <<'PY'
          from attributed_training import load_r3_checkpoint
          model, metadata = load_r3_checkpoint("phase1-artifact/r3.pt")
          assert metadata["state_dict_sha256"] == "6ecf000191d6212953c8f3a77b5f3de697795f9797c75da70ddd838003531c1e"
          assert metadata["training_summary"]["selected_candidate"] == "attributed_broad"
          assert metadata["training_summary"]["fresh_opened"] is False
          print("r3_phase1_authority=verified")
          PY

      - name: Compile Phase-2 trainer
        run: |
          python -m py_compile             model/neural-vnext-native-r3/*.py             model/neural-vnext-native-r3/scripts/*.py

      - name: Run R3 contracts before Phase-2
        env:
          PYTHONPATH: model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: python -m pytest -q model/neural-vnext-native-r3/tests

      - name: Continue Phase-2 on new train and dev blocks only
        env:
          PYTHONPATH: model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r3-phase2-output
          python model/neural-vnext-native-r3/scripts/train_r3_phase2.py             --phase1-checkpoint phase1-artifact/r3.pt             --checkpoint r3-phase2-output/r3-phase2.pt             --manifest r3-phase2-output/r3-phase2.manifest.json             --dev-result r3-phase2-output/r3-phase2.dev.json

      - name: Upload Phase-2 dev-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r3-phase2-dev
          path: r3-phase2-output/
          if-no-files-found: error
