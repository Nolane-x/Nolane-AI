name: Neural vNext Native R21 Dev

on:
  push:
    branches:
      - codex/neural-native-r21-supervised-goal-belief
    paths:
      - 'model/neural-vnext-native-r21/**'
      - '.github/workflows/neural-vnext-native-r21-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r21/**'
      - '.github/workflows/neural-vnext-native-r21-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r21-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r21-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and run R21 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r21:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r21/*.py model/neural-vnext-native-r21/scripts/*.py model/neural-vnext-native-r21/tests/*.py
          python -m pytest -q model/neural-vnext-native-r21/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r21/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r21/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['benchmark']['development_indices']==[1184,1215]
          assert lock['benchmark']['confirmation_indices']==[1216,1247]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          assert lock['private_label_boundary']['private_goal_label_allowed_at_dev_or_fresh'] is False
          assert lock['private_label_boundary']['exact_public_support_is_hard_mask'] is True
          PY

      - name: Train, calibrate, and run locked R21 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r21:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r21-output
          python model/neural-vnext-native-r21/scripts/run_dev.py             --checkpoint r21-output/r21.pt             --manifest r21-output/r21.manifest.json             --dev-result r21-output/r21.dev.json

      - name: Enforce fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r21-output/r21.manifest.json').read_text())
          assert manifest['fresh_opened'] is False
          assert manifest['private_label_boundary']['inference_private_goal_use'] is False
          assert manifest['status'] in {
              'R21_DEV_ELIGIBLE_FRESH_UNOPENED',
              'R21_DEV_REJECTED_FRESH_UNOPENED',
          }
          PY

      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r21-dev
          path: |
            r21-output/r21.pt
            r21-output/r21.manifest.json
            r21-output/r21.dev.json
          if-no-files-found: error
          retention-days: 90
