name: Neural R2.5 Full Authority GREEN Patch

on:
  push:
    branches: [neural-r25-full-authority-provenance]
    paths:
      - 'scripts/apply_neural_r25_full_authority_green.py'
      - '.github/workflows/neural-r25-full-authority-green.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neural-r25-full-authority-green
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neural-r25-full-authority-provenance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Apply exact fail-closed GREEN patch
        run: python scripts/apply_neural_r25_full_authority_green.py
      - name: Compile changed canonical modules
        run: |
          python -m py_compile \
            nolane/memory/context_intelligence.py \
            nolane/memory/context.py \
            nolane/external_core/context.py \
            nolane/metadata/component_versions.py
      - name: Run context decisive experiment and tamper hardening
        run: python -m pytest -q tests/test_coding_agi_context_intelligence.py
      - name: Run component revision projections
        run: |
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5y_native_context.py \
            tests/test_refoundation_wave5aa_native_execution_control.py \
            tests/test_refoundation_wave5p_native_integration.py
      - name: Run integration dependency projections
        run: |
          python -m pytest -q \
            tests/test_external_core_scoped_revalidation_public_contract.py \
            tests/test_external_core_integration_revalidation.py \
            tests/test_external_core_a5_public_contract.py \
            tests/test_external_core_a6_temporal_reattestation.py \
            tests/test_external_core_a7_atomic_observation.py
      - name: Remove temporary patch machinery and commit tested candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_neural_r25_full_authority_green.py .github/workflows/neural-r25-full-authority-green.yml
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo NEURAL_R25_GREEN_PATCH_EMPTY
            exit 1
          fi
          git commit -m 'fix(neural): bind receipts to full request authority frontier'
          git push origin HEAD:neural-r25-full-authority-provenance
