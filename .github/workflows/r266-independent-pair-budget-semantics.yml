name: R2.66 Independent Pair-Budget Semantics

on:
  push:
    branches: [validation-r266-current-budget-semantics-gpt56sol]
  pull_request:
    branches: [r266-learned-contextual-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run independent pair-budget semantic invariance contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_independent_pair_budget_semantics.py
