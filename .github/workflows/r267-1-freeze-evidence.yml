name: R2.67.1 Freeze Fresh Evidence

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'benchmarks/kfigg/r267_1_genuine_three_probe.py'
      - 'research/r267_1_external_cyclic_dot_transfer.py'
      - 'tests/test_r267_1_*.py'
      - 'tests/test_r267_independent_ablation_completeness.py'
      - '.github/workflows/r267-1-*.yml'
      - 'docs/superpowers/specs/2026-08-19-r267-1-genuine-causal-necessity-hotfix.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify exact triggering tree
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.67.1 materialized correctness and authority suite
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
      - name: Recompute fresh authored and pinned NumPy evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer

          phase = run_benchmark()
          external = run_external_transfer(
              np.dot,
              source_id='numpy:numpy.dot',
              source_version=np.__version__,
          )
          assert np.__version__ == '2.4.6'
          assert phase['all_gates_pass'] is True
          assert phase['false_accepts'] == 0
          assert phase['trainable_parameter_count'] == 0
          assert phase['oracle_accounting_exact'] is True
          assert external['source_id'] == 'numpy:numpy.dot'
          assert external['source_exposure'] == 'io_only'
          assert external['passed'] is True
          assert external['false_accepts'] == 0
          assert external['trainable_parameter_count'] == 0
          assert external['oracle_calls_collision_certificates'] == 72
          assert external['oracle_calls_challenge'] == 6
          assert external['oracle_calls_heldout'] == 6
          assert external['oracle_calls_total'] == (
              external['oracle_calls_learning_terminal']
              + external['oracle_calls_collision_certificates']
              + external['oracle_calls_challenge']
              + external['oracle_calls_heldout']
          )
          assert external['oracle_accounting_exact'] is True
          print('R267_1_FRESH_EVIDENCE_OK')
          PY

  freeze:
    needs: [verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Refuse stale freeze writer
        run: |
          set -euo pipefail
          git fetch origin r267-1-genuine-causal-necessity-hotfix-gpt56sol
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/r267-1-genuine-causal-necessity-hotfix-gpt56sol)" = "$GITHUB_SHA"
      - name: Reverify exact source tree before freezing
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
      - name: Materialize fresh evidence and source lock
        env:
          FREEZE_RUN_ID: ${{ github.run_id }}
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          import numpy as np

          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer

          phase = run_benchmark()
          external = run_external_transfer(
              np.dot,
              source_id='numpy:numpy.dot',
              source_version=np.__version__,
          )
          assert np.__version__ == '2.4.6'
          assert phase['all_gates_pass'] is True
          assert phase['oracle_accounting_exact'] is True
          assert external['source_id'] == 'numpy:numpy.dot'
          assert external['passed'] is True
          assert external['oracle_calls_collision_certificates'] == 72
          assert external['oracle_calls_total'] == (
              external['oracle_calls_learning_terminal']
              + external['oracle_calls_collision_certificates']
              + external['oracle_calls_challenge']
              + external['oracle_calls_heldout']
          )
          assert external['oracle_accounting_exact'] is True

          phase_path = Path('R2_67_1_PHASE_A_RESULT.json')
          external_path = Path('R2_67_1_EXTERNAL_TRANSFER.json')
          phase_path.write_text(json.dumps(phase, indent=2, sort_keys=True) + '\n')
          external_path.write_text(json.dumps(external, indent=2, sort_keys=True) + '\n')

          frozen_paths = (
              'cogcoder/r267_three_probe_causal_composition.py',
              'benchmarks/kfigg/r267_1_genuine_three_probe.py',
              'research/r267_1_external_cyclic_dot_transfer.py',
              'tests/test_r267_1_authority_boundaries.py',
              'tests/test_r267_1_correctness_hotfix.py',
              'tests/test_r267_1_evidence.py',
              'tests/test_r267_1_no_collision_failclosed.py',
              'tests/test_r267_1_preselection_receipt_units.py',
              'tests/test_r267_1_partial_probe_receipt_accounting.py',
              'tests/test_r267_1_triangle_min_robustness.py',
              'tests/test_r267_1_triplet_budget_semantics.py',
              'tests/test_r267_independent_ablation_completeness.py',
              'scripts/r267_1_apply_genuine_necessity_core.py',
              'scripts/r267_1_apply_certified_ablation_authority.py',
              'scripts/r267_1_apply_preselection_receipt_units.py',
              'scripts/r267_1_apply_partial_receipt_accounting.py',
              '.github/workflows/r267-1-commit-core-on-green.yml',
              '.github/workflows/r267-1-core-patch-experiment.yml',
              '.github/workflows/r267-1-correctness-red.yml',
              '.github/workflows/r267-1-evidence.yml',
              '.github/workflows/r267-1-preselection-receipt-hotfix.yml',
              '.github/workflows/r267-1-partial-receipt-hotfix.yml',
              '.github/workflows/r267-1-freeze-evidence.yml',
              '.github/workflows/r267-1-canonical-gate.yml',
              '.github/workflows/r267-1-release-bundle.yml',
              '.github/workflows/r267-1-post-merge-release-bundle.yml',
              'docs/superpowers/specs/2026-08-19-r267-1-genuine-causal-necessity-hotfix.md',
              'R2_67_1_PHASE_A_RESULT.json',
              'R2_67_1_EXTERNAL_TRANSFER.json',
          )
          for path in frozen_paths:
              assert Path(path).is_file(), path

          blobs = {
              path: subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              for path in frozen_paths
          }
          canonical_phase = json.dumps(phase, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
          canonical_external = json.dumps(external, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
          lock = {
              'schema_version': 1,
              'milestone': 'R2.67.1',
              'status': 'PRE_HOSTED_SOURCE_AND_EVIDENCE_LOCK',
              'parent_release_commit': '43b43ce4b324b0d74357957af18dd0f60b1cb85e',
              'source_freeze_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'freeze_workflow_run_id': int(os.environ['FREEZE_RUN_ID']),
              'production_source_changes_after_lock_forbidden': True,
              'frozen_evidence_changes_after_lock_forbidden': True,
              'historical_r267_artifacts_superseded_not_mutated': True,
              'claim_boundary': 'collision-certified insufficiency of proper-subset observable evidence on the tested pure-input corpora, with exactly three interventions, a finite trusted DSL, terminal re-observation, and zero added trainable parameters; not a universal theorem that two probes can never suffice',
              'authority_corrections': {
                  'subset_specific_ablation_fields': True,
                  'uncertified_search_miss_fails_closed': True,
                  'public_collision_certificate_required_for_lower_order_insufficiency': True,
                  'postselection_probe_case_unit': 'probe_observation',
                  'preselection_probe_cases_zero_without_selected_triplet': True,
                  'attempted_case_receipt_accounting': True,
                  'terminal_selected_probe_reobservation': True,
                  'oracle_ledger_exact': True,
                  'positive_domain_triangle_min_robustness': True,
                  'triplet_budget_semantic_invariance': True,
                  'canonical_and_release_gate_blobs_frozen': True,
              },
              'authored_evidence': {
                  'all_gates_pass': bool(phase['all_gates_pass']),
                  'oracle_accounting_exact': bool(phase['oracle_accounting_exact']),
                  'oracle_calls_total': int(phase['oracle_calls_total']),
                  'false_accepts': int(phase['false_accepts']),
                  'trainable_parameter_count': int(phase['trainable_parameter_count']),
                  'sha256_canonical_json': hashlib.sha256(canonical_phase).hexdigest(),
              },
              'external_evidence': {
                  'source_id': external['source_id'],
                  'source_version': external['source_version'],
                  'source_exposure': external['source_exposure'],
                  'same_algebraic_family_as_authored': True,
                  'passed': bool(external['passed']),
                  'oracle_accounting_exact': bool(external['oracle_accounting_exact']),
                  'oracle_calls_total': int(external['oracle_calls_total']),
                  'false_accepts': int(external['false_accepts']),
                  'trainable_parameter_count': int(external['trainable_parameter_count']),
                  'sha256_canonical_json': hashlib.sha256(canonical_external).hexdigest(),
              },
              'independent_validation_runs': {
                  'r267_probe_receipt_units_red': 32199123145,
                  'r267_lower_order_mask_red': 32199583627,
                  'genuine_cyclic_family_green': 32199850422,
                  'replacement_evidence_cross_python_green': 32202170465,
                  'preselection_receipt_red': 32201248043,
                  'preselection_receipt_red_green': 32202287192,
                  'fresh_receipt_materialization_green': 32202735763,
                  'partial_receipt_accounting_red': 32204776228,
                  'triplet_budget_semantic_invariance_green': 32218054272,
              },
              'frozen_git_blobs': blobs,
          }
          Path('R2_67_1_PRE_HOSTED_LOCK.json').write_text(
              json.dumps(lock, indent=2, sort_keys=True) + '\n'
          )
          print('R267_1_FRESH_LOCK_WRITTEN', len(blobs), lock['source_freeze_head'])
          PY
      - name: Verify freeze delta contains only fresh R2.67.1 records
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' R2_67_1_EXTERNAL_TRANSFER.json R2_67_1_PHASE_A_RESULT.json R2_67_1_PRE_HOSTED_LOCK.json | sort)"
          test "$changed" = "$expected"
      - name: Commit fresh frozen records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R2_67_1_PHASE_A_RESULT.json R2_67_1_EXTERNAL_TRANSFER.json R2_67_1_PRE_HOSTED_LOCK.json
          git commit -m 'evidence: freeze corrected R2.67.1 authority boundary'
          git push origin HEAD:r267-1-genuine-causal-necessity-hotfix-gpt56sol
