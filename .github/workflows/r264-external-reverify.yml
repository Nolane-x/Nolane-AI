name: R2.64 External Transfer Reverify

on:
  push:
    branches: [r264-learned-contextual-composition-gpt56sol]
    paths: ['.github/workflows/r264-external-reverify.yml']
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  external-ufunclab-step:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned external oracle dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'numpy>=2.1.0' meson-python ninja
          python -m pip install 'git+https://github.com/WarrenWeckesser/ufunclab.git@f1fbe6769850823a1976ccc28d14cd966130b645'
      - name: Recompute pinned I/O-only step transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import ufunclab
          from research.r264_external_contextual_transfer import run_external_transfer
          result=run_external_transfer(
              ufunclab.step,
              source_id='WarrenWeckesser/ufunclab:ufunclab.step',
              source_commit='f1fbe6769850823a1976ccc28d14cd966130b645',
          )
          assert result['milestone'] == 'R2.64'
          assert result['capability'] == 'learned-contextual-causal-composition'
          assert result['passed'] is True
          assert result['source_id'] == 'WarrenWeckesser/ufunclab:ufunclab.step'
          assert result['source_commit'] == 'f1fbe6769850823a1976ccc28d14cd966130b645'
          assert result['source_exposure'] == 'io_only'
          assert result['host_selected_intervention'] is False
          assert result['r262_fixed_op_passed'] is False
          assert result['singleton_composition_passed'] == [False, False]
          assert result['probe_validation_exact'] == result['probe_validation_cases'] * 2
          assert result['final_validation_exact'] == result['final_validation_cases']
          assert result['challenge_exact'] == result['challenge_cases'] == 12
          assert result['heldout_exact'] == result['heldout_cases'] == 36
          assert result['selected_position_set'] == [3, 4]
          assert result['shared_positions'] == [0, 1, 2]
          expr=result['learned_composition_expression']
          assert expr['op'] == 'if'
          assert expr['then'] == {'field':'__p0'}
          assert expr['else'] == {'field':'__p1'}
          assert result['trainable_parameter_count'] == 0
          Path('R2_64_EXTERNAL_TRANSFER_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.64-ufunclab-step-contextual-transfer
          path: R2_64_EXTERNAL_TRANSFER_RECOMPUTED.json
      - name: Publish external status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r264/external-transfer','description':'R2.64 pinned ufunclab.step contextual composition transfer passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY
