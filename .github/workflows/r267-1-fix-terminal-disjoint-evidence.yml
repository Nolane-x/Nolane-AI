name: R2.67.1 Fix Terminal-Disjoint Evidence

on:
  push:
    branches: [r267-1-evidence-gpt56sol]
    paths:
      - 'scripts/r267_1_fix_terminal_disjoint_evidence.py'
      - '.github/workflows/r267-1-fix-terminal-disjoint-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-evidence-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply corrected core semantics ephemerally
        run: |
          if ! grep -q 'def _examples_have_target_collision' cogcoder/r267_three_probe_causal_composition.py; then
            python scripts/r267_1_apply_genuine_necessity_core.py
            python scripts/r267_1_apply_certified_ablation_authority.py
          fi
          python -m py_compile cogcoder/r267_three_probe_causal_composition.py
      - name: Apply terminal-disjoint dataset correction ephemerally
        run: python scripts/r267_1_fix_terminal_disjoint_evidence.py
      - name: Verify replacement evidence
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_evidence.py
      - name: Accepted R2.66 after evidence
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  commit:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-evidence-gpt56sol
          fetch-depth: 0
      - name: Refuse stale write
        run: |
          set -euo pipefail
          git fetch origin r267-1-evidence-gpt56sol
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/r267-1-evidence-gpt56sol)" = "$GITHUB_SHA"
      - name: Materialize only dataset correction
        run: |
          set -euo pipefail
          python scripts/r267_1_fix_terminal_disjoint_evidence.py
          changed="$(git diff --name-only)"
          expected=$'benchmarks/kfigg/r267_1_genuine_three_probe.py\nresearch/r267_1_external_cyclic_dot_transfer.py'
          test "$changed" = "$expected"
      - name: Commit corrected evidence datasets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/kfigg/r267_1_genuine_three_probe.py research/r267_1_external_cyclic_dot_transfer.py
          git commit -m 'fix: keep R2.67.1 terminal evidence disjoint from learning'
          git push origin HEAD:r267-1-evidence-gpt56sol
