name: R2.69 External Transfer

on:
  pull_request:
    paths:
      - 'external_tests/test_r269_external_transfer.py'
      - 'research/r269_external_transfer.py'
      - 'cogcoder/r269_*.py'
      - '.github/workflows/r269-external-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Protected R2.68 safety
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: R2.69 external I/O-only transfer
        run: PYTHONPATH=. python -m pytest -q external_tests/test_r269_external_transfer.py
