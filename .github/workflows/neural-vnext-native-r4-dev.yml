name: Neural vNext Native R4 Accepted Authority

on:
  push:
    paths:
      - 'model/neural-vnext-native-r4/**'
      - '.github/workflows/neural-vnext-native-r4-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r4/**'
      - '.github/workflows/neural-vnext-native-r4-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_CHECKPOINT_SHA256: '167e845e9aa2bfe8a6431478723c777ee8a2f8e77c452192d74cd31d1959a244'
      EXPECTED_STATE_SHA256: '97f114dd202b0e533c01db1adf69efe35b67db02a713d7b40dc619afd3cd2aa9'
      EXPECTED_MANIFEST_SHA256: '899bf7eae191064527891bf3d2ca68d289e3672540777f68fa05723e083ad9c1'
      EXPECTED_DEV_SHA256: 'c4a3a197b38fb82fdbde4d7a21b7cc317eb10020c6f7635308b4f0769ca0d8d1'
      EXPECTED_CHECKPOINT_SIZE: '3539102'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify repository-archived accepted materialization
        run: |
          test -f model/neural-vnext-native-r4/accepted/r4.pt
          test "$(stat -c %s model/neural-vnext-native-r4/accepted/r4.pt)" = "$EXPECTED_CHECKPOINT_SIZE"
          test "$(sha256sum model/neural-vnext-native-r4/accepted/r4.pt | awk '{print $1}')" = "$EXPECTED_CHECKPOINT_SHA256"
          test "$(sha256sum model/neural-vnext-native-r4/accepted/r4.manifest.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum model/neural-vnext-native-r4/accepted/r4.dev.json | awk '{print $1}')" = "$EXPECTED_DEV_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("model/neural-vnext-native-r4")
          accepted = json.loads((root / "ACCEPTED_AUTHORITY.json").read_text())
          closure = json.loads((root / "evidence/ACCEPTANCE_CLOSURE.json").read_text())
          fresh = json.loads((root / "evidence/FRESH_COURT_001.json").read_text())
          negative = json.loads((root / "evidence/DEV_REPRO_NEGATIVE_001.json").read_text())
          archive = json.loads((root / "accepted/ARCHIVE_AUTHORITY.json").read_text())
          assert accepted["status"] == "ACCEPTED"
          assert accepted["repository_archive"]["status"] == "VERIFIED"
          assert accepted["repository_archive"]["git_lfs_oid"] == "sha256:167e845e9aa2bfe8a6431478723c777ee8a2f8e77c452192d74cd31d1959a244"
          assert accepted["repository_archive"]["size_bytes"] == 3539102
          assert closure["status"] == "ACCEPTANCE_CLOSED"
          assert closure["accepted_materialization_archived_in_repository"] is True
          assert fresh["status"] == "FRESH_ACCEPTED"
          assert fresh["preregistered_promotion_gate"]["accepted"] is True
          assert fresh["fresh_court"]["parent"]["solved"] == 146
          assert fresh["fresh_court"]["candidate"]["solved"] == 148
          assert negative["status"] == "R4_DEV_NON_BITWISE_REPRODUCIBLE"
          assert negative["cross_run_bitwise_reproducible"] is False
          assert archive["status"] == "ARCHIVED_ACCEPTED_CHECKPOINT"
          assert archive["checkpoint_sha256"] == accepted["accepted_candidate"]["checkpoint_sha256"]
          PY
      - name: Compile and run R4 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r4/*.py model/neural-vnext-native-r4/scripts/*.py model/neural-vnext-native-r4/tests/*.py
          python -m pytest -q model/neural-vnext-native-r4/tests
      - name: Load accepted checkpoint and verify embedded authority
        env:
          PYTHONPATH: model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python - <<'PY'
          from latent_goal_training import load_r4_checkpoint
          model, metadata = load_r4_checkpoint("model/neural-vnext-native-r4/accepted/r4.pt")
          assert metadata["checkpoint_sha256"] == "167e845e9aa2bfe8a6431478723c777ee8a2f8e77c452192d74cd31d1959a244"
          assert metadata["state_dict_sha256"] == "97f114dd202b0e533c01db1adf69efe35b67db02a713d7b40dc619afd3cd2aa9"
          assert metadata["parameters"] == 877542
          assert metadata["successor_parameters"] == 169552
          assert metadata["selected_candidate"] == "latent_goal_guarded"
          assert metadata["fresh_opened"] is False
          assert model.parent is not None
          print("accepted_r4_checkpoint_authority=verified")
          PY
