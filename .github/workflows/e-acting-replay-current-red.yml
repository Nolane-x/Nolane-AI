name: E Acting Replay Authority Current RED

on:
  push:
    branches:
      - e-acting-replay-current-red-gpt56sol

concurrency:
  group: e-acting-replay-current-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-authority-red:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Run current-tree replay authority RED regression
        run: python -m pytest -q tests/test_refoundation_acting_replay_authority.py
