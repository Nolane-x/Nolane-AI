name: R2.5 Integrity
on:
  push:
    paths:
      - '.github/workflows/r25-integrity.yml'
      - 'research/R2_5_LOCK.json'
      - 'research/R2_5_REALITY_REPORT.md'
permissions:
  contents: read
env:
  PYTHONPATH: .
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bc390a9f6659493ecf1741aeda7bcb3d04ecd4d4
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source identities
        run: |
          test "$(git rev-parse HEAD)" = "bc390a9f6659493ecf1741aeda7bcb3d04ecd4d4"
          test "$(git rev-parse HEAD:cogcoder/r25_n2.py)" = "255f73d00ba18fa8055e6909c36d634d1b386eaf"
          test "$(git rev-parse HEAD:cogcoder/r25_n.py)" = "8f6ce698f1ec5d294bda0e7b49112561b2d489c5"
          test "$(git rev-parse HEAD:cogcoder/arc_candidate_region.py)" = "375dbf24c4bcebe250156e7baa7f86c18a545165"
          test "$(git rev-parse HEAD:cogcoder/span_fit.py)" = "838d4d1a88125db3e9231c97b93fab61b6898bdf"
          test "$(git -C external/ARC-AGI-2 rev-parse HEAD)" = "f3283f727488ad98fe575ea6a5ac981e4a188e49"
      - name: Reproduce frozen training result
        run: |
          python - <<'PY'
          from cogcoder.r25_n2 import run
          d=run('external/ARC-AGI-2/data/training',2,64)
          print(d)
          assert d['cases']==1000
          assert d['errors']==0
          assert d['solved']==76
          assert d['max_attempts']==2
          assert d['max_programs']==64
          PY
