name: R2.66 External Contextual Transfer

on:
  push:
    branches: [r266-learned-contextual-composition-gpt56sol]
    paths:
      - 'research/r266_external_contextual_transfer.py'
      - 'cogcoder/r266_learned_contextual_composition.py'
      - 'cogcoder/_r266_contextual_composition_core.py'
      - '.github/workflows/r266-external-contextual-transfer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/r266_external_contextual_transfer.py'
      - 'cogcoder/r266_learned_contextual_composition.py'
      - 'cogcoder/_r266_contextual_composition_core.py'
      - '.github/workflows/r266-external-contextual-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  external-ufunclab-step:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned external oracle dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'numpy>=2.1.0' meson-python ninja
          python -m pip install 'git+https://github.com/WarrenWeckesser/ufunclab.git@f1fbe6769850823a1976ccc28d14cd966130b645'
      - name: Recompute fresh I/O-only contextual transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import ufunclab
          from research.r266_external_contextual_transfer import run_external_transfer

          result = run_external_transfer(
              ufunclab.step,
              source_id='WarrenWeckesser/ufunclab:ufunclab.step',
              source_commit='f1fbe6769850823a1976ccc28d14cd966130b645',
          )
          assert result['milestone'] == 'R2.66'
          assert result['capability'] == 'learned-contextual-causal-composition'
          assert result['passed'] is True
          assert result['source_exposure'] == 'io_only'
          assert result['host_selected_intervention'] is False
          assert result['r262_fixed_op_passed'] is False
          assert result['singleton_composition_passed'] == [False, False]
          assert result['probe_validation_exact'] == result['probe_validation_cases'] * 2
          assert result['final_validation_exact'] == result['final_validation_cases']
          assert result['challenge_exact'] == result['challenge_cases'] == 12
          assert result['heldout_exact'] == result['heldout_cases'] == 36
          assert result['selected_position_set'] == [3, 4]
          assert result['shared_positions'] == [0, 1, 2]
          assert result['false_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          expr = result['learned_composition_expression']
          assert expr['op'] == 'if'
          branch_fields = {expr['then'].get('field'), expr['else'].get('field')}
          assert branch_fields == {'__p0', '__p1'}
          Path('R2_66_EXTERNAL_TRANSFER_RECOMPUTED.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.66-ufunclab-step-contextual-transfer
          path: R2_66_EXTERNAL_TRANSFER_RECOMPUTED.json
      - name: Publish external status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r266/external-transfer',
              'description':'R2.66 fresh pinned ufunclab.step contextual transfer passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
