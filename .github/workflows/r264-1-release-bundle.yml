name: R2.64.1 Full Repository Release Bundle

on:
  push:
    branches: [main, r264-frontier-fairness-hotfix-gpt56sol]
    paths:
      - 'archive/root-history/historical_r_series/R2_64_1_*.json'
      - 'archive/root-history/historical_r_series/R2_64_1_DELIVERY.md'
      - 'cogcoder/r264_unified_adaptive_repository_search.py'
      - 'cogcoder/r264_unified_adaptive_repository_search_base.py'
      - 'cogcoder/r264_frontier_fairness_hotfix.py'
      - 'benchmarks/kfigg/r264_1_frontier_fairness.py'
      - 'tests/test_r264_*.py'
      - '.github/workflows/r264-1-release-bundle.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify R2.64.1 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          required = [
              'archive/root-history/historical_r_series/R2_64_1_TDD_RED.json', 'archive/root-history/historical_r_series/R2_64_1_PRE_HOSTED_LOCK.json',
              'archive/root-history/historical_r_series/R2_64_1_PHASE_A_RESULT.json', 'archive/root-history/historical_r_series/R2_64_1_HOSTED_VERIFICATION.json',
              'archive/root-history/historical_r_series/R2_64_1_WORLD_FINAL.json', 'archive/root-history/historical_r_series/R2_64_1_RELEASE_MANIFEST.json',
              'archive/root-history/historical_r_series/R2_64_1_DELIVERY.md',
              'cogcoder/r264_unified_adaptive_repository_search.py',
              'cogcoder/r264_unified_adaptive_repository_search_base.py',
              'cogcoder/r264_frontier_fairness_hotfix.py',
              'benchmarks/kfigg/r264_1_frontier_fairness.py',
          ]
          for path in required:
              assert Path(path).is_file(), path
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_64_1_PRE_HOSTED_LOCK.json').read_text())
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          red=json.loads(Path('archive/root-history/historical_r_series/R2_64_1_TDD_RED.json').read_text())
          verify=json.loads(Path('archive/root-history/historical_r_series/R2_64_1_HOSTED_VERIFICATION.json').read_text())
          world=json.loads(Path('archive/root-history/historical_r_series/R2_64_1_WORLD_FINAL.json').read_text())
          manifest=json.loads(Path('archive/root-history/historical_r_series/R2_64_1_RELEASE_MANIFEST.json').read_text())
          assert red['status'] == 'HOSTED_TDD_RED_CONFIRMED'
          assert verify['status'] == 'VERIFIED_BOUNDED_CORRECTNESS_HOTFIX'
          assert verify['canonical_hosted_verification']['hosted_relevant_tests_total'] == 247
          assert verify['canonical_hosted_verification']['conclusion'] == 'success'
          assert verify['causal_result']['accepted_r264_tight_budget_abstains'] == 6
          assert verify['causal_result']['hotfix_tight_budget_exact'] == 6
          assert verify['causal_result']['repairable_contradicted_ancestor_fallback_exact'] == 6
          assert world['audit_valid'] is True
          assert world['w5_passed'] is False
          assert world['convergence_forced'] is False
          assert manifest['readiness']['score'] == 49.4
          assert manifest['readiness']['delta'] == 0.0
          assert manifest['added_trainable_parameters'] == 0
          print('R2641_RELEASE_BOUNDARY_OK')
          PY
      - name: Recompute R2.64.1 causal evidence exactly
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r264_1_frontier_fairness import run_benchmark
          expected=json.loads(Path('archive/root-history/historical_r_series/R2_64_1_PHASE_A_RESULT.json').read_text())
          actual=run_benchmark()
          assert actual == expected
          print('R2641_PHASE_A_RELEASE_EXACT_OK')
          PY
      - name: Recompute inherited R2.64 evidence exactly
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r264_unified_adaptive_repository_search import run_benchmark
          from research.r264_external_unified_transfer import run_external_transfer
          assert run_benchmark() == json.loads(Path('archive/root-history/historical_r_series/R2_64_PHASE_A_RESULT.json').read_text())
          assert np.__version__ == '2.4.6'
          actual=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          assert actual == json.loads(Path('archive/root-history/historical_r_series/R2_64_EXTERNAL_TRANSFER.json').read_text())
          print('R264_INHERITED_RELEASE_EXACT_OK')
          PY
      - name: Run R2.64.1 and protected lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Create and verify complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.64.1-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.64.1-COMPLETE.zip | tee release/Nolane-AI-R2.64.1-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.64.1-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required={
              'archive/root-history/historical_r_series/R2_64_1_TDD_RED.json','archive/root-history/historical_r_series/R2_64_1_PRE_HOSTED_LOCK.json','archive/root-history/historical_r_series/R2_64_1_PHASE_A_RESULT.json',
              'archive/root-history/historical_r_series/R2_64_1_HOSTED_VERIFICATION.json','archive/root-history/historical_r_series/R2_64_1_WORLD_FINAL.json','archive/root-history/historical_r_series/R2_64_1_RELEASE_MANIFEST.json',
              'archive/root-history/historical_r_series/R2_64_1_DELIVERY.md','cogcoder/r264_unified_adaptive_repository_search.py',
              'cogcoder/r264_unified_adaptive_repository_search_base.py','cogcoder/r264_frontier_fairness_hotfix.py',
              'benchmarks/kfigg/r264_1_frontier_fairness.py'
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.64.1-COMPLETE.zip') as zf:
              names=set(zf.namelist())
          missing=required-names
          assert not missing, sorted(missing)
          print('R2641_COMPLETE_ZIP_CONTENTS_OK', len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.64.1-COMPLETE
          path: |
            release/Nolane-AI-R2.64.1-COMPLETE.zip
            release/Nolane-AI-R2.64.1-COMPLETE.zip.sha256
      - name: Publish release-bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
            'state':'success',
            'context':'r264.1/release-bundle',
            'description':'R2.64.1 boundary, exact evidence, full lineage and COMPLETE ZIP passed',
            'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
            data=payload,
            headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
            method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
