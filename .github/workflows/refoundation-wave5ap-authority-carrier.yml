name: Refoundation Wave 5AP Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5ap-native-operations

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Materialize Wave 5AP native Operations authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          legacy_root = root / 'cogcoder' / 'organization'
          canonical_root = root / 'nolane' / 'external_core'

          modules = {
              'operations': {
                  'from .artifacts import ArtifactStore': 'from nolane.external_core.artifacts import ArtifactStore',
                  'from .assurance import AssuranceControlPlane, AssuranceDisposition': 'from nolane.external_core.assurance import AssuranceControlPlane, AssuranceDisposition',
                  'from .data_operations import DataOperationsLedger': 'from nolane.external_core.data_operations import DataOperationsLedger',
                  'from .evolution import SkillEvolutionEngine, SkillRecord': 'from nolane.memory.skills import SkillEvolutionEngine, SkillRecord',
                  'from .infrastructure_operations import InfrastructureOperationsLedger': 'from nolane.external_core.infrastructure_operations import InfrastructureOperationsLedger',
                  'from .operations_profiles import OperationsProfileRegistry': 'from nolane.external_core.operations_profiles import OperationsProfileRegistry',
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .reliability_operations import ReliabilityOperationsLedger': 'from nolane.external_core.reliability_operations import ReliabilityOperationsLedger',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
              'operations_profiles': {
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
              'data_operations': {
                  'from .artifacts import ArtifactStore': 'from nolane.external_core.artifacts import ArtifactStore',
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
              'infrastructure_operations': {
                  'from .artifacts import ArtifactStore': 'from nolane.external_core.artifacts import ArtifactStore',
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
              'reliability_operations': {
                  'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
                  'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
              },
          }

          originals = {name: (legacy_root / f'{name}.py').read_text(encoding='utf-8') for name in modules}
          for name, replacements in modules.items():
              text = originals[name]
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Wave 5AP canonicalization anchor missing in {name}: {old}')
                  text = text.replace(old, new)
              if name == 'operations':
                  text += '\n\nCOMPONENT_ID = "external.operations"\nCOMPONENT_VERSION = "0.0.1"\nMIGRATED_FROM = "cogcoder.organization.operations"\n'
              (canonical_root / f'{name}.py').write_text(text, encoding='utf-8')

          for name in modules:
              (legacy_root / f'{name}.py').write_text(
                  f'from nolane.external_core.{name} import *\n', encoding='utf-8'
              )

          versions = root / 'cogcoder' / 'refoundation' / 'component_versions.py'
          text = versions.read_text(encoding='utf-8')
          if '        "external.operations": 1,\n' not in text:
              anchor = '        "external.individual_evolution": 1,\n'
              if anchor not in text:
                  raise SystemExit('Wave 5AP component-version insertion anchor missing')
              text = text.replace(anchor, anchor + '        "external.operations": 1,\n', 1)
              versions.write_text(text, encoding='utf-8')

          facades = root / 'cogcoder' / 'refoundation' / 'facades.py'
          text = facades.read_text(encoding='utf-8')
          row = '        FacadeBinding("external.operations", "nolane.external_core.operations", "cogcoder.organization.operations", ("OperationsControlPlane",)),\n'
          if row not in text:
              raise SystemExit('Wave 5AP active-facade row missing')
          facades.write_text(text.replace(row, '', 1), encoding='utf-8')

          implementation = root / 'cogcoder' / 'refoundation' / 'implementation_status.py'
          text = implementation.read_text(encoding='utf-8')
          if '        "nolane.external_core.operations",\n' not in text:
              anchor = '    "external.artifacts": (\n'
              entry = '''    "external.operations": (\n        "nolane.external_core.operations",\n        (\n            "cogcoder/organization/operations.py",\n            "cogcoder/organization/operations_profiles.py",\n            "cogcoder/organization/data_operations.py",\n            "cogcoder/organization/infrastructure_operations.py",\n            "cogcoder/organization/reliability_operations.py",\n        ),\n        "Native Operations readiness, twelve-profile routing, data migration/persistence/consistency, reproducible build/release/observability and reliability/performance authority over canonical artifacts, assurance, skills, identity and digest dependencies; historical Operations modules bridge exact semantic public identities.",\n    ),\n'''
              if anchor not in text:
                  raise SystemExit('Wave 5AP implementation-ledger insertion anchor missing')
              text = text.replace(anchor, entry + anchor, 1)
              implementation.write_text(text, encoding='utf-8')

          oracle = root / 'tests' / 'test_refoundation_component_versions.py'
          text = oracle.read_text(encoding='utf-8')
          if '    "external.operations": 1,\n' not in text:
              anchor = '    "external.individual_evolution": 1,\n'
              if anchor not in text:
                  raise SystemExit('Wave 5AP version-oracle insertion anchor missing')
              text = text.replace(anchor, anchor + '    "external.operations": 1,\n', 1)
              oracle.write_text(text, encoding='utf-8')

          predecessor = root / 'tests' / 'test_refoundation_wave5ao_native_individual_evolution.py'
          text = predecessor.read_text(encoding='utf-8')
          text = text.replace('assert len(state["components"]) == 8', 'assert len(state["components"]) <= 8')
          predecessor.write_text(text, encoding='utf-8')

          status = root / 'CURRENT' / 'STATUS.md'
          text = status.read_text(encoding='utf-8')
          if '## Wave 5AP — native Operations authority' not in text:
              text += '''\n\n## Wave 5AP — native Operations authority\n\nWave 5AP retires `external.operations` by moving the complete Operations semantic closure under canonical `nolane.external_core` ownership: twelve-profile operational routing, data migration/persistence/consistency authority, reproducible build/release/observability authority, reliability/failure/performance authority, and assurance-gated operational readiness. Canonical Operations code resolves artifacts, assurance, skills, identity and digest dependencies only through `nolane` authorities; historical Operations modules are exact semantic public-object bridges. The generated native-debt projection moves from 8 to 7 non-native component records.\n'''
              status.write_text(text, encoding='utf-8')
          PY
      - name: Materialize repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Verify generated authority is fresh
        run: |
          python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
          python -m nolane.ai.materialize --check
          python -m nolane.repository.audit --check
      - name: Run Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run Operations and dependent regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_evaluation_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Commit verified Wave 5AP authority receipts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nolane/external_core/operations.py \
                  nolane/external_core/operations_profiles.py \
                  nolane/external_core/data_operations.py \
                  nolane/external_core/infrastructure_operations.py \
                  nolane/external_core/reliability_operations.py \
                  cogcoder/organization/operations.py \
                  cogcoder/organization/operations_profiles.py \
                  cogcoder/organization/data_operations.py \
                  cogcoder/organization/infrastructure_operations.py \
                  cogcoder/organization/reliability_operations.py \
                  cogcoder/refoundation/component_versions.py \
                  cogcoder/refoundation/facades.py \
                  cogcoder/refoundation/implementation_status.py \
                  tests/test_refoundation_component_versions.py \
                  tests/test_refoundation_wave5ao_native_individual_evolution.py \
                  CURRENT/STATUS.md CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md archive/INDEX.json
          if git diff --cached --quiet; then
            echo 'No Wave 5AP carrier changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(refoundation): materialize Wave 5AP native Operations authority'
          git push origin HEAD:refoundation/epoch0-wave5ap-native-operations
