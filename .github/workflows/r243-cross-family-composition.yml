name: R2.43 Counterexample-Guided Cross-Family Composition

on:
  push:
    branches: [ main ]
    paths:
      - "cogcoder/r243_*.py"
      - "benchmarks/kfigg/r243_*.py"
      - "tests/test_r243_*.py"
      - "research/R2_43_*.json"
      - "R2_43_DELIVERY.md"
      - "R2_43_RELEASE_MANIFEST.json"
      - "docs/superpowers/plans/2026-08-17-r243-cross-family-composition.md"
      - ".github/workflows/r243-cross-family-composition.yml"
  pull_request:
    paths:
      - "cogcoder/r243_*.py"
      - "benchmarks/kfigg/r243_*.py"
      - "tests/test_r243_*.py"
      - "research/R2_43_*.json"
      - "R2_43_DELIVERY.md"
      - "R2_43_RELEASE_MANIFEST.json"
      - "docs/superpowers/plans/2026-08-17-r243-cross-family-composition.md"
      - ".github/workflows/r243-cross-family-composition.yml"

permissions:
  contents: read

jobs:
  verify-r243-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest z3-solver
      - name: Run R2.43 focused capability tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r243_macro_composition.py \
            tests/test_r243_cross_family_benchmark.py
      - name: Run parent compatibility gates
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r241_macro_competition.py \
            tests/test_r241_competitive_discovery.py \
            tests/test_r241_multi_macro_benchmark.py
      - name: Recompute frozen heldout evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r243_cross_family_macro_composition import HELDOUT_SEEDS, run_suite
          rows = run_suite(HELDOUT_SEEDS)
          assert len(rows) == 6
          assert all(row['accepted'] for row in rows)
          assert all(row['exact_truth_table'] for row in rows)
          assert not any(row['false_accept'] for row in rows)
          assert all(row['composition_candidates_evaluated'] <= 4 for row in rows)
          assert all(row['raw_semantic_space_size'] > row['composition_candidates_evaluated'] for row in rows)
          assert all(row['synergy'] > 0.0 for row in rows)
          assert all(not row['left_parent_exact'] and not row['right_parent_exact'] for row in rows)
          print('R2.43 heldout evidence boundary PASS')
          PY
