      - 'tests/test_truth_knowledge_*.py'
      - 'CURRENT/TRUTH_KNOWLEDGE.md'
      - '.github/workflows/truth-knowledge-a.yml'
  pull_request:
    paths:
      - 'nolane/core/canonical_digest.py'
      - 'nolane/external_core/evidence.py'
      - 'nolane/memory/knowledge.py'
      - 'nolane/external_core/epistemic.py'
      - 'nolane/external_core/verification.py'
      - 'nolane/external_core/assurance.py'
      - 'nolane/external_core/evidence_truth.py'
      - 'nolane/external_core/knowledge_truth.py'
