      - 'nolane/external_core/knowledge_context_truth.py'
      - 'nolane/external_core/epistemic_context_truth.py'
      - 'nolane/external_core/verification_context_truth.py'
      - 'nolane/external_core/assurance_context_truth.py'
      - 'nolane/external_core/knowledge_observation_truth.py'
      - 'nolane/external_core/evidence_observation_truth.py'
      - 'nolane/external_core/epistemic_observation_truth.py'
      - 'nolane/external_core/verification_observation_truth.py'
      - 'nolane/external_core/assurance_observation_truth.py'
      - 'nolane/metadata/subprotocols.py'
      - 'tests/test_truth_knowledge_*.py'
      - 'CURRENT/TRUTH_KNOWLEDGE.md'
      - '.github/workflows/truth-knowledge-a.yml'
  workflow_dispatch:

jobs:
  truth-knowledge:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical A authorities and A1-A15 v1-v9 truth sidecars
        run: |
          python -m py_compile \
            nolane/core/canonical_digest.py \
            nolane/external_core/evidence.py \
            nolane/memory/knowledge.py \
            nolane/external_core/epistemic.py \
            nolane/external_core/verification.py \
            nolane/external_core/assurance.py \
            nolane/external_core/evidence_truth.py \
            nolane/external_core/knowledge_truth.py \
            nolane/external_core/epistemic_truth.py \
            nolane/external_core/verification_truth.py \
            nolane/external_core/assurance_truth.py \
            nolane/external_core/temporal_truth.py \
            nolane/external_core/evidence_temporal_truth.py \
            nolane/external_core/knowledge_temporal_truth.py \
            nolane/external_core/epistemic_temporal_truth.py \
            nolane/external_core/verification_temporal_truth.py \
            nolane/external_core/assurance_temporal_truth.py \
            nolane/external_core/evidence_provenance_truth.py \
            nolane/external_core/epistemic_provenance_truth.py \
            nolane/external_core/verification_provenance_truth.py \
            nolane/external_core/assurance_provenance_truth.py \
            nolane/external_core/knowledge_justification_truth.py \
            nolane/external_core/epistemic_justification_truth.py \
            nolane/external_core/verification_justification_truth.py \
            nolane/external_core/assurance_justification_truth.py \
            nolane/external_core/knowledge_undercutter_truth.py \
            nolane/external_core/epistemic_defeasible_truth.py \
            nolane/external_core/verification_defeasible_truth.py \
            nolane/external_core/assurance_defeasible_truth.py \
            nolane/external_core/evidence_dependence_truth.py \
            nolane/external_core/epistemic_dependence_truth.py \
            nolane/external_core/verification_dependence_truth.py \
            nolane/external_core/assurance_dependence_truth.py \
            nolane/external_core/evidence_context_truth.py \
            nolane/external_core/knowledge_context_truth.py \
            nolane/external_core/epistemic_context_truth.py \
            nolane/external_core/verification_context_truth.py \
            nolane/external_core/assurance_context_truth.py \
            nolane/metadata/subprotocols.py
      - name: Run Truth Knowledge contracts
        run: python -m pytest -q tests/test_truth_knowledge_*.py
      - name: Verify repository authority projections
        run: python -m nolane.repository.audit --check
