      - 'nolane/external_core/evidence_dependence_truth.py'
      - 'nolane/external_core/epistemic_dependence_truth.py'
      - 'nolane/external_core/verification_dependence_truth.py'
      - 'nolane/external_core/assurance_dependence_truth.py'
      - 'nolane/external_core/evidence_context_truth.py'
      - 'nolane/external_core/knowledge_context_truth.py'
      - 'nolane/external_core/epistemic_context_truth.py'
      - 'nolane/external_core/verification_context_truth.py'
      - 'nolane/external_core/assurance_context_truth.py'
      - 'nolane/external_core/knowledge_observation_truth.py'
      - 'nolane/external_core/evidence_observation_truth.py'
