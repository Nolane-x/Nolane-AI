      - 'nolane/external_core/epistemic_provenance_truth.py'
      - 'nolane/external_core/verification_provenance_truth.py'
      - 'nolane/external_core/assurance_provenance_truth.py'
      - 'nolane/external_core/knowledge_justification_truth.py'
