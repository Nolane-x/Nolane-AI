name: R2.64.1 Frontier Fairness Canonical

on:
  push:
    branches: [r264-frontier-fairness-hotfix-gpt56sol]
    paths:
      - 'cogcoder/r264_unified_adaptive_repository_search.py'
      - 'cogcoder/r264_unified_adaptive_repository_search_base.py'
      - 'cogcoder/r264_frontier_fairness_hotfix.py'
      - 'benchmarks/kfigg/r264_1_frontier_fairness.py'
      - 'tests/test_r264_*.py'
      - 'R2_64_1_*.json'
      - '.github/workflows/r264-1-frontier-fairness-canonical.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  canonical-full-gate:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify frozen R2.64.1 blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_64_1_PRE_HOSTED_LOCK.json').read_text())
          assert lock['parent_release_commit'] == '91fa6c094f10df338ce95cf3fb89437e03943c39'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R2641_SOURCE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Recompute causal frontier-fairness evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r264_1_frontier_fairness import run_benchmark
          result=run_benchmark()
          assert result['all_gates_pass'] is True
          Path('R2_64_1_PHASE_A_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          frozen=Path('R2_64_1_PHASE_A_RESULT.json')
          if frozen.exists():
              assert result == json.loads(frozen.read_text())
              print('R2641_PHASE_A_EXACT_OK')
          else:
              print('R2641_PHASE_A_FREEZE_PENDING')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.64.1-phase-a
          path: R2_64_1_PHASE_A_RECOMPUTED.json
      - name: Recompute accepted R2.64 authored evidence exactly
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r264_unified_adaptive_repository_search import run_benchmark
          expected=json.loads(Path('R2_64_PHASE_A_RESULT.json').read_text())
          actual=run_benchmark()
          assert actual == expected
          print('R264_INHERITED_PHASE_A_EXACT_OK')
          PY
      - name: Recompute accepted R2.64 external NumPy evidence exactly
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from research.r264_external_unified_transfer import run_external_transfer
          assert np.__version__ == '2.4.6'
          expected=json.loads(Path('R2_64_EXTERNAL_TRANSFER.json').read_text())
          actual=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          assert actual == expected
          print('R264_INHERITED_EXTERNAL_EXACT_OK')
          PY
      - name: Run R2.64 plus hotfix focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: Run accepted R2.63 and R2.62 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
      - name: Run accepted R2.61 and R2.60 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
      - name: Run protected R2.59 through R2.55 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
      - name: Run protected R2.54 through R2.50 lineage
        run: PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
      - name: Run protected R2.49 through R2.41 lineage
        run: PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py

  cross-python:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify hotfix behavior
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r264_frontier_fairness.py \
            tests/test_r264_1_frontier_fairness_benchmark.py \
            tests/test_r264_unified_adaptive_repository_search.py

  publish-full-gate:
    needs: [canonical-full-gate, cross-python]
    runs-on: ubuntu-latest
    # REFOUNDATION_PR_ISOLATION
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/')) && (success()) }}
    steps:
      - name: Publish canonical hotfix status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r264.1/full-gate',
              'description':'R2.64.1 fairness, exact R2.64 evidence, cross-Python and R2.63-R2.41 lineage passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
