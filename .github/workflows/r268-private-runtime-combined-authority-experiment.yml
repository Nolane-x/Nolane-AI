name: R2.68 Experiment — Combined Private Runtime Query Authority

on:
  pull_request:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'tests/test_r268_private_runtime_combined_authority.py'
      - 'scripts/r268_apply_combined_private_query_authority.py'
      - '.github/workflows/r268-private-runtime-combined-authority-experiment.yml'

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted parent safety first
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Current public R2.68 authority remains green
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f -name 'test_r268_*.py' ! -name 'test_r268_private_runtime_combined_authority.py' | sort)
          PYTHONPATH=. python -m pytest -q "${files[@]}"
      - name: Require private-runtime bypass RED before patch
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r268_private_runtime_combined_authority.py > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -ne 0
          grep -Eq '4 failed, 1 passed|4 failed.*1 passed' /tmp/red.log
          echo R268_PRIVATE_RUNTIME_COMBINED_AUTHORITY_GENUINE_RED
      - name: Apply runner-only combined authority patch
        run: python scripts/r268_apply_combined_private_query_authority.py
      - name: Private and public authority GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_private_runtime_combined_authority.py
      - name: Full R2.68 plus accepted parents GREEN
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Projection-unique determinant remains exact
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from research.r268_external_transfer import run_external_transfer
          result=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          assert result['passed'] is True,result
          assert result['validation_oracle_query_attempts']==120,result
          assert result['validation_oracle_query_unique']==120,result
          assert result['validation_oracle_query_duplicates']==0,result
          assert result['discovery_validation_oracle_query_disjoint'] is True,result
          assert result['selected_basis_size']==2 and result['globally_minimal'] is True,result
          assert result['lower_basis_certified']==result['lower_basis_count']==4,result
          assert result['necessity_certificate_count']==2 and result['false_accepts']==0,result
          assert result['oracle_calls_total']==result['source_calls_observed']==1238,result
          print('R268_COMBINED_PRIVATE_RUNTIME_EXTERNAL_OK')
          PY
      - name: Runner patch scope remains architectural only
        run: |
          git diff -- cogcoder/_r268_runtime.py cogcoder/r268_adaptive_causal_basis.py
          git diff --exit-code -- research/r268_external_transfer.py benchmarks/kfigg/r268_adaptive_causal_basis.py cogcoder/_r268_proof.py cogcoder/_r268_search.py cogcoder/_r268_types.py
