name: Neural vNext Native R2 Fresh Court

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r2-fresh-court-40-79
  cancel-in-progress: false

jobs:
  fresh-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
      EXPECTED_PRE_FRESH_LOCK_BLOB: '__PRE_FRESH_LOCK_BLOB__'
      EXPECTED_FRESH_EVALUATOR_BLOB: '__FRESH_EVALUATOR_BLOB__'
    steps:
      - uses: actions/checkout@v4

      - name: Refuse unbound fresh authority
        run: |
          test "$EXPECTED_PRE_FRESH_LOCK_BLOB" != "__PRE_FRESH_LOCK_BLOB__"
          test "$EXPECTED_FRESH_EVALUATOR_BLOB" != "__FRESH_EVALUATOR_BLOB__"
          test "$(git hash-object model/neural-vnext-native-r2/PRE_FRESH_LOCK.json)" = "$EXPECTED_PRE_FRESH_LOCK_BLOB"
          test "$(git hash-object model/neural-vnext-native-r2/scripts/evaluate_fresh.py)" = "$EXPECTED_FRESH_EVALUATOR_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import torch
          print("torch_version=" + torch.__version__)
          assert torch.__version__.startswith("2.9.0")
          PY

      - name: Compile and verify frozen contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile \
            model/neural-vnext-native/*.py \
            model/neural-vnext-native/scripts/*.py \
            model/neural-vnext-native-r2/*.py \
            model/neural-vnext-native-r2/scripts/*.py \
            model/neural-vnext-native-r2/tests/*.py
          python -m pytest -q model/neural-vnext-native-r2/tests

      - name: Reproduce accepted parent from source
        env:
          PYTHONPATH: model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p fresh-output
          python model/neural-vnext-native/scripts/train_native_dev.py \
            --checkpoint fresh-output/native-vnext.pt \
            --manifest fresh-output/parent.manifest.json \
            --dev-result fresh-output/parent.dev.json
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path

          lock = json.loads(Path("model/neural-vnext-native-r2/PRE_FRESH_LOCK.json").read_text())
          parent = lock["frozen_candidate"]
          manifest = json.loads(Path("fresh-output/parent.manifest.json").read_text())
          checkpoint = sha256(Path("fresh-output/native-vnext.pt").read_bytes()).hexdigest()

          assert checkpoint == parent["parent_checkpoint_sha256"]
          assert manifest["state_dict_sha256"] == parent["parent_state_dict_sha256"]
          assert manifest["fresh_opened"] is False
          print("parent_checkpoint_sha256=" + checkpoint)
          print("parent_state_dict_sha256=" + manifest["state_dict_sha256"])
          PY

      - name: Reproduce frozen R2 candidate from source before fresh
        env:
          PYTHONPATH: model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python model/neural-vnext-native-r2/scripts/train_successor_dev.py \
            --parent-checkpoint fresh-output/native-vnext.pt \
            --checkpoint fresh-output/successor.pt \
            --manifest fresh-output/successor.manifest.json \
            --dev-result fresh-output/successor.dev.json
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path

          lock = json.loads(Path("model/neural-vnext-native-r2/PRE_FRESH_LOCK.json").read_text())
          frozen = lock["frozen_candidate"]
          manifest = json.loads(Path("fresh-output/successor.manifest.json").read_text())
          checkpoint = sha256(Path("fresh-output/successor.pt").read_bytes()).hexdigest()

          exact = {
              "checkpoint_sha256": checkpoint,
              "state_dict_sha256": manifest["state_dict_sha256"],
              "parameters": manifest["parameters"],
              "successor_parameters": manifest["successor_parameters"],
              "selected_candidate": manifest["selected_candidate"],
              "selected_rank": manifest["selected_rank"],
              "selected_eligibility": manifest["selected_eligibility"],
              "development": manifest["dev_evaluation"],
              "phase1_reference": manifest["phase1_phase2_dev_evaluation"],
              "parent_reference": manifest["parent_phase2_dev_evaluation"],
              "fresh_opened": manifest["fresh_opened"],
          }
          expected = {
              key: frozen[key]
              for key in exact
          }
          assert exact == expected, (expected, exact)
          assert manifest["predev_lock_sha256"] == frozen["predev_lock_sha256"]
          assert manifest["parent_checkpoint_sha256"] == frozen["parent_checkpoint_sha256"]
          assert manifest["parent_state_dict_sha256"] == frozen["parent_state_dict_sha256"]
          print("successor_checkpoint_sha256=" + checkpoint)
          print("successor_state_dict_sha256=" + manifest["state_dict_sha256"])
          PY

      - name: Open frozen fresh court exactly once
        id: fresh
        env:
          PYTHONPATH: model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          set +e
          python model/neural-vnext-native-r2/scripts/evaluate_fresh.py \
            --checkpoint fresh-output/successor.pt \
            --result fresh-output/successor.fresh.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload immutable fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r2-fresh-court-40-79
          path: fresh-output/
          if-no-files-found: error

      - name: Enforce preregistered fresh verdict
        if: always()
        run: |
          test "${{ steps.fresh.outputs.exit_code }}" = "0"
