name: R2.66 Frozen-Lock Independent Audit

on:
  push:
    branches: [validation-r266-frozen-lock-audit-gpt56sol]
  pull_request:
    branches: [r266-learned-contextual-composition-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify frozen lock is present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('R2_66_PRE_HOSTED_LOCK.json').read_text())
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['schema_version'] == 1
          print('R266_FROZEN_LOCK_PRESENT')
          PY
      - name: Accepted R2.65 regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Independent frozen-lock blockers
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_frozen_lock_independent_blockers.py
