name: R2.67 Required-Probe Search Fix

on:
  push:
    branches: [r267-three-probe-causal-composition-gpt56sol]
    paths:
      - 'scripts/r267_apply_three_probe_search_fix.py'
      - '.github/workflows/r267-search-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-three-probe-causal-composition-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Apply exact search patch in working tree
        run: python scripts/r267_apply_three_probe_search_fix.py
      - name: Run R2.67 focused GREEN candidate
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_*.py
      - name: Run accepted R2.66 regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit exact tested production patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          if git diff --cached --quiet; then
            echo R267_SEARCH_PATCH_ALREADY_PRESENT
          else
            git commit -m 'fix: add bounded R2.67 required-probe algebraic closure'
            git push origin HEAD:r267-three-probe-causal-composition-gpt56sol
          fi
