name: R2.57 Verified Cognitive Vocabulary Growth

on:
  push:
    branches: [main]
    paths:
      - 'cogcoder/r257_*.py'
      - 'benchmarks/kfigg/r257_*.py'
      - 'research/r257_*.py'
      - 'tests/test_r257_*.py'
      - 'R2_57_PHASE_A_RESULT.json'
      - '.github/workflows/r257-verified-vocabulary-growth.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-r257-and-parents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test and external oracle dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest 'numpy>=2.1.0' meson-python ninja
          python -m pip install 'git+https://github.com/WarrenWeckesser/ufunclab.git@f1fbe6769850823a1976ccc28d14cd966130b645'
      - name: Run R2.57 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
      - name: Run independently sourced ufunclab linearstep I/O transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import ufunclab
          from research.r257_external_vocabulary_transfer import run_external_transfer

          result = run_external_transfer(
              ufunclab.linearstep,
              source_id='WarrenWeckesser/ufunclab:ufunclab.linearstep',
              source_commit='f1fbe6769850823a1976ccc28d14cd966130b645',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result['passed'] is True
          assert result['base_passed'] is False
          assert result['extended_passed'] is True
          assert result['challenge_exact'] == result['challenge_cases'] == 8
          assert result['heldout_exact'] == result['heldout_cases'] == 24
          Path('R2_57_EXTERNAL_TRANSFER.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload independent external transfer evidence
        uses: actions/upload-artifact@v4
        with:
          name: R2.57-ufunclab-external-transfer
          path: R2_57_EXTERNAL_TRANSFER.json
      - name: Run R2.56 focused parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
      - name: Run R2.55 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
      - name: Run R2.54 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r254_*.py
      - name: Run R2.53 and R2.52 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r253_*.py tests/test_r252_*.py
      - name: Run R2.51 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r251_*.py
      - name: Run R2.50 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r250_*.py
      - name: Run R2.49 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r249_*.py
      - name: Run R2.48 and R2.47 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r248_*.py tests/test_r247_*.py
      - name: Run R2.46 parent
        run: PYTHONPATH=. python -m pytest -q tests/test_r246_*.py
      - name: Run R2.45 and R2.44 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r245_*.py tests/test_r244_*.py
      - name: Run R2.43 and R2.41 compatibility
        run: PYTHONPATH=. python -m pytest -q tests/test_r243_*.py tests/test_r241_*.py
      - name: Recompute frozen R2.57 Phase-A evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r257_verified_vocabulary_growth import run_benchmark
          expected = json.loads(Path('R2_57_PHASE_A_RESULT.json').read_text())
          actual = run_benchmark()
          assert actual == expected, (actual, expected)
          print(json.dumps(actual, indent=2, sort_keys=True))
          PY
      - name: Publish R2.57 hosted-gate commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success',
              'context': 'r257/hosted-gate',
              'description': 'R2.57 external transfer + protected lineage passed',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY

  cross-python-r257:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify R2.57 focused behavior across Python runtimes
        run: PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
      - name: Publish cross-Python commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PYVER: ${{ matrix.python }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success',
              'context': f"r257/cross-python-{os.environ['PYVER']}",
              'description': f"R2.57 focused tests passed on Python {os.environ['PYVER']}",
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
