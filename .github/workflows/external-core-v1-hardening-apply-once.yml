name: External Core v1 Hardening Apply Once

on:
  push:
    branches:
      - audit/external-core-v1-deep-verification-gpt56sol
    paths:
      - tools/external_core_v1_hardening_apply_once.py
      - .github/workflows/external-core-v1-hardening-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply exact hardening patch
        run: python tools/external_core_v1_hardening_apply_once.py
      - name: Compile canonical namespaces
        run: |
          python -m py_compile nolane/core/*.py
          python -m py_compile nolane/external_core/*.py
          python -m py_compile nolane/metadata/*.py
      - name: Run complete External Core contract suite
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/test_external_core_g*.py tests/test_external_core_a2_*.py tests/test_external_core_a3_*.py tests/test_external_core_version_discipline*.py tests/test_external_core_integration_*.py tests/test_external_core_scoped_*.py tests/test_external_core_a5_*.py tests/test_external_core_a6_*.py tests/test_external_core_a7_*.py tests/test_external_core_a8_*.py tests/test_external_core_a9_*.py tests/test_external_core_a10_*.py)
          python -m pytest -q "${tests[@]}"
      - name: Run projection regressions
        run: |
          python -m pytest -q tests/test_refoundation_component_versions.py tests/test_refoundation_wave5p_native_integration.py
      - name: Run canonical read-only audits
        run: |
          python -m nolane.external_core.audit --check
          python -m nolane.external_core.integration_admission_bundle --check
      - name: Prepare clean semantic commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/external_core_v1_hardening_apply_once.py .github/workflows/external-core-v1-hardening-apply-once.yml
          git add CURRENT/EXTERNAL_CORE.md nolane/external_core/observation.py nolane/external_core/observation_integration.py nolane/external_core/integration.py nolane/external_core/compatibility.py nolane/external_core/integration_admission_bundle.py nolane/metadata/component_versions.py tests/test_refoundation_component_versions.py tests/test_refoundation_wave5p_native_integration.py tests/test_external_core_a10_observation_audit.py tests/test_external_core_a10_v1_byte_exact_contract.py tests/test_external_core_a10_v1_document_contract.py
          git diff --cached --check
          git commit -m "fix: harden External Core v1 trust boundary"
      - name: Verify exact component-local revision discipline
        run: |
          python -m nolane.metadata.version_discipline_cli --base origin/main --head HEAD --json
          python -m nolane.metadata.version_discipline_cli --base origin/main --head HEAD --check
      - name: Push clean verified hardening commit
        run: git push origin HEAD:audit/external-core-v1-deep-verification-gpt56sol
