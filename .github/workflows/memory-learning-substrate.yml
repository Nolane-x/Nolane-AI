name: Memory Learning Substrate

on:
  push:
    branches:
      - codex/memory-learning-tombstone-authorization-v0.0.10

permissions:
  contents: write

concurrency:
  group: memory-learning-v010-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply guarded tombstone authorization GREEN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nolane/memory/learning_substrate.py")
          text = path.read_text()

          replacements = [
              ('@dataclass(frozen=True, slots=True)\nclass MemoryTombstone:\n    memory_id: str\n    content_digest: str\n    reason: str\n    evidence_refs: tuple[str, ...]\n\n    def __post_init__(self) -> None:\n        if not str(self.memory_id).strip():\n            raise ValueError("memory tombstone requires a memory id")\n        if not str(self.content_digest).strip():\n            raise ValueError("memory tombstone requires a content digest")\n        if not str(self.reason).strip():\n            raise ValueError("memory tombstone requires a reason")\n        if not self.evidence_refs or any(not str(value).strip() for value in self.evidence_refs):\n            raise ValueError("memory tombstone requires non-empty evidence")\n\n    def to_state(self) -> dict[str, Any]:\n        return {\n            "memory_id": self.memory_id,\n            "content_digest": self.content_digest,\n            "reason": self.reason,\n            "evidence_refs": list(self.evidence_refs),\n        }\n\n    @classmethod\n    def from_state(cls, state: Mapping[str, Any]) -> "MemoryTombstone":\n        return cls(\n            str(state["memory_id"]),\n            str(state["content_digest"]),\n            str(state["reason"]),\n            tuple(str(x) for x in state.get("evidence_refs", ())),\n        )\n', '@dataclass(frozen=True, slots=True)\nclass MemoryTombstone:\n    memory_id: str\n    content_digest: str\n    reason: str\n    evidence_refs: tuple[str, ...]\n    actor_agent_id: str | None = None\n    archive_receipt_id: str | None = None\n\n    def __post_init__(self) -> None:\n        if not str(self.memory_id).strip():\n            raise ValueError("memory tombstone requires a memory id")\n        if not str(self.content_digest).strip():\n            raise ValueError("memory tombstone requires a content digest")\n        if not str(self.reason).strip():\n            raise ValueError("memory tombstone requires a reason")\n        if not self.evidence_refs or any(not str(value).strip() for value in self.evidence_refs):\n            raise ValueError("memory tombstone requires non-empty evidence")\n        if self.actor_agent_id is not None and not str(self.actor_agent_id).strip():\n            raise ValueError("memory tombstone actor authority must be non-empty")\n        if self.archive_receipt_id is not None and not str(self.archive_receipt_id).strip():\n            raise ValueError("memory tombstone archive receipt authority must be non-empty")\n\n    def to_state(self) -> dict[str, Any]:\n        return {\n            "memory_id": self.memory_id,\n            "content_digest": self.content_digest,\n            "reason": self.reason,\n            "evidence_refs": list(self.evidence_refs),\n            "actor_agent_id": self.actor_agent_id,\n            "archive_receipt_id": self.archive_receipt_id,\n        }\n\n    @classmethod\n    def from_state(cls, state: Mapping[str, Any]) -> "MemoryTombstone":\n        return cls(\n            memory_id=str(state["memory_id"]),\n            content_digest=str(state["content_digest"]),\n            reason=str(state["reason"]),\n            evidence_refs=tuple(str(x) for x in state.get("evidence_refs", ())),\n            actor_agent_id=(\n                None if state.get("actor_agent_id") is None else str(state["actor_agent_id"])\n            ),\n            archive_receipt_id=(\n                None if state.get("archive_receipt_id") is None else str(state["archive_receipt_id"])\n            ),\n        )\n', 'MemoryTombstone authority schema'),
              ('    def forget(\n        self,\n        memory_id: str,\n        *,\n        actor_agent_id: str,\n        reason: str,\n        evidence_refs: tuple[str, ...],\n    ) -> MemoryTombstone:\n        row, reason = self.memory.get(memory_id), str(reason).strip()\n        actor = self.registry.get(str(actor_agent_id).strip())\n        if actor.region != self.lifecycle.REGION:\n            raise PermissionError("forgetting memory requires a Memory/Context identity")\n        evidence = _clean_refs(evidence_refs)\n        if not reason:\n            raise ValueError("forgetting requires an explicit reason")\n        if not evidence:\n            raise ValueError("forgetting requires evidence")\n        candidate = MemoryTombstone(\n            row.memory_id,\n            canonical_digest({"memory_id": row.memory_id, "text": row.text}),\n            reason,\n            evidence,\n        )\n        existing = self._tombstones.get(row.memory_id)\n        if existing is not None:\n            if existing != candidate:\n                raise ValueError("memory tombstone cannot be rebound")\n            return existing\n        if row.status is not MemoryStatus.ARCHIVED:\n            self.lifecycle.transition(\n                row.memory_id,\n                actor_agent_id=actor_agent_id,\n                new_status=MemoryStatus.ARCHIVED,\n                reason=reason,\n                evidence_refs=evidence,\n            )\n        self._tombstones[row.memory_id] = candidate\n        return candidate\n', '    def forget(\n        self,\n        memory_id: str,\n        *,\n        actor_agent_id: str,\n        reason: str,\n        evidence_refs: tuple[str, ...],\n    ) -> MemoryTombstone:\n        row, reason = self.memory.get(memory_id), str(reason).strip()\n        actor_id = str(actor_agent_id).strip()\n        actor = self.registry.get(actor_id)\n        if actor.region != self.lifecycle.REGION:\n            raise PermissionError("forgetting memory requires a Memory/Context identity")\n        evidence = _clean_refs(evidence_refs)\n        if not reason:\n            raise ValueError("forgetting requires an explicit reason")\n        if not evidence:\n            raise ValueError("forgetting requires evidence")\n\n        content_digest = canonical_digest({"memory_id": row.memory_id, "text": row.text})\n        existing = self._tombstones.get(row.memory_id)\n        if existing is not None:\n            candidate = MemoryTombstone(\n                memory_id=row.memory_id,\n                content_digest=content_digest,\n                reason=reason,\n                evidence_refs=evidence,\n                actor_agent_id=actor.agent_id,\n                archive_receipt_id=existing.archive_receipt_id,\n            )\n            if existing != candidate:\n                raise ValueError("memory tombstone cannot be rebound")\n            self._validate_tombstone_semantics(existing)\n            return existing\n\n        archive_receipt = None\n        if row.status is not MemoryStatus.ARCHIVED:\n            archive_receipt = self.lifecycle.transition(\n                row.memory_id,\n                actor_agent_id=actor.agent_id,\n                new_status=MemoryStatus.ARCHIVED,\n                reason=reason,\n                evidence_refs=evidence,\n            )\n        else:\n            archive_receipt = next(\n                (\n                    receipt\n                    for receipt in reversed(self.lifecycle.receipts_for(row.memory_id))\n                    if receipt.new_status is MemoryStatus.ARCHIVED\n                ),\n                None,\n            )\n            if archive_receipt is None:\n                raise ValueError("forgetting archived memory requires archived lifecycle authority")\n\n        candidate = MemoryTombstone(\n            memory_id=row.memory_id,\n            content_digest=content_digest,\n            reason=reason,\n            evidence_refs=evidence,\n            actor_agent_id=actor.agent_id,\n            archive_receipt_id=archive_receipt.receipt_id,\n        )\n        self._validate_tombstone_semantics(candidate)\n        self._tombstones[row.memory_id] = candidate\n        return candidate\n', 'forget authorization binding'),
              ('    def _validate_tombstone_semantics(self, tombstone: MemoryTombstone) -> None:\n        row = self.memory.get(tombstone.memory_id)\n        if row.status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived memory state")\n        archived = any(\n            receipt.new_status is MemoryStatus.ARCHIVED\n            for receipt in self.lifecycle.receipts_for(tombstone.memory_id)\n        )\n        if not archived:\n            raise ValueError("memory tombstone requires archived lifecycle authority")\n', '    def _validate_tombstone_semantics(self, tombstone: MemoryTombstone) -> None:\n        row = self.memory.get(tombstone.memory_id)\n        if row.status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived memory state")\n        if tombstone.actor_agent_id is None or tombstone.archive_receipt_id is None:\n            raise ValueError("memory tombstone requires forgetting authorization proof")\n        actor = self.registry.get(tombstone.actor_agent_id)\n        if actor.region != self.lifecycle.REGION:\n            raise PermissionError("memory tombstone actor requires Memory/Context authority")\n        archive_receipt = next(\n            (\n                receipt\n                for receipt in self.lifecycle.receipts_for(tombstone.memory_id)\n                if receipt.receipt_id == tombstone.archive_receipt_id\n            ),\n            None,\n        )\n        if archive_receipt is None or archive_receipt.new_status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived lifecycle authority")\n', 'tombstone restore authorization'),
          ]

          changed = False
          for old, new, label in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
                  changed = True
                  print(f"applied: {label}")
              elif old_count == 0 and new_count == 1:
                  print(f"already applied: {label}")
              else:
                  raise SystemExit(
                      f"unexpected source state for {label}: old={old_count} new={new_count}"
                  )

          path.write_text(text)
          print(f"semantic_changed={changed}")
          PY
      - name: Compile Memory Learning authority surface
        run: |
          python -m py_compile nolane/memory/*.py
          python -m py_compile nolane/external_core/self_model.py
          python -m py_compile nolane/external_core/individual_evolution.py
          python -m py_compile nolane/metadata/component_versions.py
          python -m py_compile nolane/metadata/runtime_state_map.py
          python -m py_compile cogcoder/organization/runtime.py
          python -m py_compile cogcoder/organization/runtime_core.py
      - name: Run full Memory Learning contracts before publish
        shell: bash
        run: |
          python -m pytest -q             tests/test_memory_learning_*.py             tests/test_refoundation_component_versions.py             tests/test_refoundation_runtime_state_map.py             tests/test_refoundation_wave2_zero_loss_runtime_digest.py             tests/test_refoundation_memory_public_layout.py             tests/test_refoundation_wave5c_native_memory_fabric.py             tests/test_refoundation_wave5d_native_memory_lifecycle.py             tests/test_refoundation_wave5e_native_memory_retrieval.py             tests/test_refoundation_wave5h_native_experience.py             tests/test_refoundation_wave5j_native_skills.py             tests/test_refoundation_wave5ao_native_individual_evolution.py             tests/test_coding_agi_memory_*.py             tests/test_coding_agi_self_*.py

  commit-green:
    needs: verify-green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Require exact verified staging head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Reapply exact guarded transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nolane/memory/learning_substrate.py")
          text = path.read_text()

          replacements = [
              ('@dataclass(frozen=True, slots=True)\nclass MemoryTombstone:\n    memory_id: str\n    content_digest: str\n    reason: str\n    evidence_refs: tuple[str, ...]\n\n    def __post_init__(self) -> None:\n        if not str(self.memory_id).strip():\n            raise ValueError("memory tombstone requires a memory id")\n        if not str(self.content_digest).strip():\n            raise ValueError("memory tombstone requires a content digest")\n        if not str(self.reason).strip():\n            raise ValueError("memory tombstone requires a reason")\n        if not self.evidence_refs or any(not str(value).strip() for value in self.evidence_refs):\n            raise ValueError("memory tombstone requires non-empty evidence")\n\n    def to_state(self) -> dict[str, Any]:\n        return {\n            "memory_id": self.memory_id,\n            "content_digest": self.content_digest,\n            "reason": self.reason,\n            "evidence_refs": list(self.evidence_refs),\n        }\n\n    @classmethod\n    def from_state(cls, state: Mapping[str, Any]) -> "MemoryTombstone":\n        return cls(\n            str(state["memory_id"]),\n            str(state["content_digest"]),\n            str(state["reason"]),\n            tuple(str(x) for x in state.get("evidence_refs", ())),\n        )\n', '@dataclass(frozen=True, slots=True)\nclass MemoryTombstone:\n    memory_id: str\n    content_digest: str\n    reason: str\n    evidence_refs: tuple[str, ...]\n    actor_agent_id: str | None = None\n    archive_receipt_id: str | None = None\n\n    def __post_init__(self) -> None:\n        if not str(self.memory_id).strip():\n            raise ValueError("memory tombstone requires a memory id")\n        if not str(self.content_digest).strip():\n            raise ValueError("memory tombstone requires a content digest")\n        if not str(self.reason).strip():\n            raise ValueError("memory tombstone requires a reason")\n        if not self.evidence_refs or any(not str(value).strip() for value in self.evidence_refs):\n            raise ValueError("memory tombstone requires non-empty evidence")\n        if self.actor_agent_id is not None and not str(self.actor_agent_id).strip():\n            raise ValueError("memory tombstone actor authority must be non-empty")\n        if self.archive_receipt_id is not None and not str(self.archive_receipt_id).strip():\n            raise ValueError("memory tombstone archive receipt authority must be non-empty")\n\n    def to_state(self) -> dict[str, Any]:\n        return {\n            "memory_id": self.memory_id,\n            "content_digest": self.content_digest,\n            "reason": self.reason,\n            "evidence_refs": list(self.evidence_refs),\n            "actor_agent_id": self.actor_agent_id,\n            "archive_receipt_id": self.archive_receipt_id,\n        }\n\n    @classmethod\n    def from_state(cls, state: Mapping[str, Any]) -> "MemoryTombstone":\n        return cls(\n            memory_id=str(state["memory_id"]),\n            content_digest=str(state["content_digest"]),\n            reason=str(state["reason"]),\n            evidence_refs=tuple(str(x) for x in state.get("evidence_refs", ())),\n            actor_agent_id=(\n                None if state.get("actor_agent_id") is None else str(state["actor_agent_id"])\n            ),\n            archive_receipt_id=(\n                None if state.get("archive_receipt_id") is None else str(state["archive_receipt_id"])\n            ),\n        )\n', 'MemoryTombstone authority schema'),
              ('    def forget(\n        self,\n        memory_id: str,\n        *,\n        actor_agent_id: str,\n        reason: str,\n        evidence_refs: tuple[str, ...],\n    ) -> MemoryTombstone:\n        row, reason = self.memory.get(memory_id), str(reason).strip()\n        actor = self.registry.get(str(actor_agent_id).strip())\n        if actor.region != self.lifecycle.REGION:\n            raise PermissionError("forgetting memory requires a Memory/Context identity")\n        evidence = _clean_refs(evidence_refs)\n        if not reason:\n            raise ValueError("forgetting requires an explicit reason")\n        if not evidence:\n            raise ValueError("forgetting requires evidence")\n        candidate = MemoryTombstone(\n            row.memory_id,\n            canonical_digest({"memory_id": row.memory_id, "text": row.text}),\n            reason,\n            evidence,\n        )\n        existing = self._tombstones.get(row.memory_id)\n        if existing is not None:\n            if existing != candidate:\n                raise ValueError("memory tombstone cannot be rebound")\n            return existing\n        if row.status is not MemoryStatus.ARCHIVED:\n            self.lifecycle.transition(\n                row.memory_id,\n                actor_agent_id=actor_agent_id,\n                new_status=MemoryStatus.ARCHIVED,\n                reason=reason,\n                evidence_refs=evidence,\n            )\n        self._tombstones[row.memory_id] = candidate\n        return candidate\n', '    def forget(\n        self,\n        memory_id: str,\n        *,\n        actor_agent_id: str,\n        reason: str,\n        evidence_refs: tuple[str, ...],\n    ) -> MemoryTombstone:\n        row, reason = self.memory.get(memory_id), str(reason).strip()\n        actor_id = str(actor_agent_id).strip()\n        actor = self.registry.get(actor_id)\n        if actor.region != self.lifecycle.REGION:\n            raise PermissionError("forgetting memory requires a Memory/Context identity")\n        evidence = _clean_refs(evidence_refs)\n        if not reason:\n            raise ValueError("forgetting requires an explicit reason")\n        if not evidence:\n            raise ValueError("forgetting requires evidence")\n\n        content_digest = canonical_digest({"memory_id": row.memory_id, "text": row.text})\n        existing = self._tombstones.get(row.memory_id)\n        if existing is not None:\n            candidate = MemoryTombstone(\n                memory_id=row.memory_id,\n                content_digest=content_digest,\n                reason=reason,\n                evidence_refs=evidence,\n                actor_agent_id=actor.agent_id,\n                archive_receipt_id=existing.archive_receipt_id,\n            )\n            if existing != candidate:\n                raise ValueError("memory tombstone cannot be rebound")\n            self._validate_tombstone_semantics(existing)\n            return existing\n\n        archive_receipt = None\n        if row.status is not MemoryStatus.ARCHIVED:\n            archive_receipt = self.lifecycle.transition(\n                row.memory_id,\n                actor_agent_id=actor.agent_id,\n                new_status=MemoryStatus.ARCHIVED,\n                reason=reason,\n                evidence_refs=evidence,\n            )\n        else:\n            archive_receipt = next(\n                (\n                    receipt\n                    for receipt in reversed(self.lifecycle.receipts_for(row.memory_id))\n                    if receipt.new_status is MemoryStatus.ARCHIVED\n                ),\n                None,\n            )\n            if archive_receipt is None:\n                raise ValueError("forgetting archived memory requires archived lifecycle authority")\n\n        candidate = MemoryTombstone(\n            memory_id=row.memory_id,\n            content_digest=content_digest,\n            reason=reason,\n            evidence_refs=evidence,\n            actor_agent_id=actor.agent_id,\n            archive_receipt_id=archive_receipt.receipt_id,\n        )\n        self._validate_tombstone_semantics(candidate)\n        self._tombstones[row.memory_id] = candidate\n        return candidate\n', 'forget authorization binding'),
              ('    def _validate_tombstone_semantics(self, tombstone: MemoryTombstone) -> None:\n        row = self.memory.get(tombstone.memory_id)\n        if row.status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived memory state")\n        archived = any(\n            receipt.new_status is MemoryStatus.ARCHIVED\n            for receipt in self.lifecycle.receipts_for(tombstone.memory_id)\n        )\n        if not archived:\n            raise ValueError("memory tombstone requires archived lifecycle authority")\n', '    def _validate_tombstone_semantics(self, tombstone: MemoryTombstone) -> None:\n        row = self.memory.get(tombstone.memory_id)\n        if row.status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived memory state")\n        if tombstone.actor_agent_id is None or tombstone.archive_receipt_id is None:\n            raise ValueError("memory tombstone requires forgetting authorization proof")\n        actor = self.registry.get(tombstone.actor_agent_id)\n        if actor.region != self.lifecycle.REGION:\n            raise PermissionError("memory tombstone actor requires Memory/Context authority")\n        archive_receipt = next(\n            (\n                receipt\n                for receipt in self.lifecycle.receipts_for(tombstone.memory_id)\n                if receipt.receipt_id == tombstone.archive_receipt_id\n            ),\n            None,\n        )\n        if archive_receipt is None or archive_receipt.new_status is not MemoryStatus.ARCHIVED:\n            raise ValueError("memory tombstone requires archived lifecycle authority")\n', 'tombstone restore authorization'),
          ]

          changed = False
          for old, new, label in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
                  changed = True
                  print(f"applied: {label}")
              elif old_count == 0 and new_count == 1:
                  print(f"already applied: {label}")
              else:
                  raise SystemExit(
                      f"unexpected source state for {label}: old={old_count} new={new_count}"
                  )

          path.write_text(text)
          print(f"semantic_changed={changed}")
          PY
      - name: Publish only semantic production file
        shell: bash
        run: |
          if git diff --quiet -- nolane/memory/learning_substrate.py; then
            echo "semantic GREEN already published"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nolane/memory/learning_substrate.py
          git commit -m "Harden tombstone forgetting authorization"
          git push origin "HEAD:${{ github.ref_name }}"
