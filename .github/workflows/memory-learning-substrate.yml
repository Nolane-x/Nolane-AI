name: Memory Learning Substrate

on:
  push:
    branches:
      - codex/memory-learning-snapshot-authority-v0.0.8

permissions:
  contents: write

concurrency:
  group: memory-v008-combined-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify-combined-v008:
    if: ${{ !contains(github.event.head_commit.message, 'combined snapshot and tombstone authority') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply combined v0.0.8 authority patches
        shell: bash
        run: |
          git apply --check .github/memory-v008-patches/learning-tombstone.patch
          git apply .github/memory-v008-patches/learning-tombstone.patch
          git apply --check .github/memory-v008-patches/learning-snapshot.patch
          git apply .github/memory-v008-patches/learning-snapshot.patch
          git apply --check .github/memory-v008-patches/versions.patch
          git apply .github/memory-v008-patches/versions.patch
          git diff --check
      - name: Compile combined Memory Learning authority surface
        run: |
          python -m py_compile nolane/memory/*.py
          python -m py_compile nolane/external_core/self_model.py
          python -m py_compile nolane/external_core/individual_evolution.py
          python -m py_compile nolane/metadata/component_versions.py
          python -m py_compile nolane/metadata/runtime_state_map.py
          python -m py_compile cogcoder/organization/runtime.py
          python -m py_compile cogcoder/organization/runtime_core.py
      - name: Run complete combined Memory Learning gate before commit
        shell: bash
        run: |
          shopt -s nullglob
          tests=(
            tests/test_memory_learning_substrate_v005.py
            tests/test_memory_learning_substrate_v005_integration.py
            tests/test_memory_learning_closure_v005.py
            tests/test_memory_learning_adaptive_policy_v005.py
            tests/test_memory_learning_restore_authority_v005.py
            tests/test_memory_learning_runtime_wiring_v005.py
            tests/test_memory_learning_reauthorization_v006.py
            tests/test_memory_learning_retrieval_receipt_replay_v007.py
            tests/test_memory_learning_retrieval_snapshot_authority_v008.py
            tests/test_memory_learning_tombstone_authority_v008.py
            tests/test_memory_learning_lifecycle_version_v008.py
            tests/test_refoundation_component_versions.py
            tests/test_refoundation_runtime_state_map.py
            tests/test_refoundation_wave2_zero_loss_runtime_digest.py
            tests/test_refoundation_memory_public_layout.py
            tests/test_refoundation_wave5c_native_memory_fabric.py
            tests/test_refoundation_wave5d_native_memory_lifecycle.py
            tests/test_refoundation_wave5e_native_memory_retrieval.py
            tests/test_refoundation_wave5h_native_experience.py
            tests/test_refoundation_wave5j_native_skills.py
            tests/test_refoundation_wave5ao_native_individual_evolution.py
            tests/test_coding_agi_memory_*.py
            tests/test_coding_agi_self_*.py
          )
          printf 'Running %s\n' "${tests[@]}"
          python -m pytest -q "${tests[@]}"
      - name: Commit verified production and contract changes only
        shell: bash
        run: |
          git config user.name "Nolane-x"
          git config user.email "casioreview20@gmail.com"
          git add \
            nolane/memory/learning_substrate.py \
            nolane/memory/lifecycle.py \
            nolane/memory/retrieval.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5d_native_memory_lifecycle.py \
            tests/test_refoundation_wave5e_native_memory_retrieval.py
          git commit -m "feat(memory): combine snapshot and tombstone authority v0.0.8"
          git push origin HEAD:codex/memory-learning-snapshot-authority-v0.0.8
