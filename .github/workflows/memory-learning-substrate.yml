name: Memory Learning Substrate

on:
  push:
    branches:
      - codex/memory-learning-tombstone-authorization-v0.0.10

permissions:
  contents: write

concurrency:
  group: memory-learning-v010-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-green:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply guarded tombstone authorization GREEN
        run: python .github/memory-v010-green-transform.py
      - name: Compile Memory Learning authority surface
        run: |
          python -m py_compile nolane/memory/*.py
          python -m py_compile nolane/external_core/self_model.py
          python -m py_compile nolane/external_core/individual_evolution.py
          python -m py_compile nolane/metadata/component_versions.py
          python -m py_compile nolane/metadata/runtime_state_map.py
          python -m py_compile cogcoder/organization/runtime.py
          python -m py_compile cogcoder/organization/runtime_core.py
      - name: Run full Memory Learning contracts before publish
        shell: bash
        run: |
          shopt -s nullglob
          tests=(
            tests/test_memory_learning_substrate_v005.py
            tests/test_memory_learning_substrate_v005_integration.py
            tests/test_memory_learning_closure_v005.py
            tests/test_memory_learning_adaptive_policy_v005.py
            tests/test_memory_learning_restore_authority_v005.py
            tests/test_memory_learning_runtime_wiring_v005.py
            tests/test_memory_learning_reauthorization_v006.py
            tests/test_memory_learning_retrieval_receipt_replay_v007.py
            tests/test_memory_learning_compaction_target_v008.py
            tests/test_memory_learning_retrieval_snapshot_authority_v009.py
            tests/test_memory_learning_tombstone_authorization_v010.py
            tests/test_refoundation_component_versions.py
            tests/test_refoundation_runtime_state_map.py
            tests/test_refoundation_wave2_zero_loss_runtime_digest.py
            tests/test_refoundation_memory_public_layout.py
            tests/test_refoundation_wave5c_native_memory_fabric.py
            tests/test_refoundation_wave5d_native_memory_lifecycle.py
            tests/test_refoundation_wave5e_native_memory_retrieval.py
            tests/test_refoundation_wave5h_native_experience.py
            tests/test_refoundation_wave5j_native_skills.py
            tests/test_refoundation_wave5ao_native_individual_evolution.py
            tests/test_coding_agi_memory_*.py
            tests/test_coding_agi_self_*.py
          )
          printf 'Running %s\n' "${tests[@]}"
          python -m pytest -q "${tests[@]}"

  commit-green:
    needs: verify-green
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Require exact verified staging head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Reapply exact guarded transformation
        run: python .github/memory-v010-green-transform.py
      - name: Publish only semantic production file
        shell: bash
        run: |
          if git diff --quiet -- nolane/memory/learning_substrate.py; then
            echo "semantic GREEN already published"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nolane/memory/learning_substrate.py
          git commit -m "Harden tombstone forgetting authorization"
          git push origin "HEAD:${{ github.ref_name }}"
