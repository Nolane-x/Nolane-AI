name: Post-Epoch 0 native inventory semantics carrier

on:
  push:
    branches:
      - post-epoch0/native-inventory-semantics
    paths:
      - .github/workflows/post-epoch0-native-inventory-carrier.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-epoch0/native-inventory-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install -q pytest

      - name: Harden non-native inventory semantics at generator source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/repository/audit_v2.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'DEBT_SCHEMA_VERSION = "nolane-native-debt-v1"\nREFERENCE_AUDIT_POLICY = "root-reference-aware-zero-loss-v2"',
                  'DEBT_SCHEMA_VERSION = "nolane-native-debt-v2"\nREFERENCE_AUDIT_POLICY = "root-reference-aware-zero-loss-v2"\n_ACTIONABLE_MIGRATION_STATUSES = frozenset(\n    {\n        ImplementationStatus.COMPATIBILITY_FACADE,\n        ImplementationStatus.LEGACY_INTERNAL,\n        ImplementationStatus.HISTORICAL_ONLY,\n    }\n)'
              ),
              (
'''def build_native_debt() -> dict[str, Any]:
    ledger = build_component_implementation_ledger()
    components: list[dict[str, Any]] = []
    counts: dict[str, int] = {}
    for component_id in sorted(ledger):
        row = ledger[component_id]
        if row.status is ImplementationStatus.CANONICAL_NATIVE:
            continue
        status = row.status.value
        counts[status] = counts.get(status, 0) + 1
        components.append(
            {
                "component_id": row.component_id,
                "component_version": row.component_version,
                "implementation_status": status,
                "canonical_module": row.canonical_module,
                "legacy_sources": list(row.legacy_sources),
                "canonical_write_authority": row.canonical_write_authority,
                "notes": row.notes,
            }
        )
    return {
        "schema_version": DEBT_SCHEMA_VERSION,
        "repository_quarantine_version": COMPONENT_VERSION,
        "definition": "Every canonical component not yet classified canonical_native. This is migration debt, not a capability-failure claim.",
        "counts_by_status": {key: counts[key] for key in sorted(counts)},
        "components": components,
    }
''',
'''def build_native_debt() -> dict[str, Any]:
    ledger = build_component_implementation_ledger()
    components: list[dict[str, Any]] = []
    counts: dict[str, int] = {}
    actionable_migration_debt_count = 0
    accepted_non_migration_count = 0
