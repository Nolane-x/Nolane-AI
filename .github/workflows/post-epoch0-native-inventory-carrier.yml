name: Post-Epoch 0 native inventory semantics carrier

on:
  push:
    branches:
      - post-epoch0/native-inventory-semantics
    paths:
      - .github/workflows/post-epoch0-native-inventory-carrier.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-epoch0/native-inventory-semantics
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install -q pytest

      - name: Harden generator source
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/migrate-native-inventory.py
          python /tmp/migrate-native-inventory.py

      - name: Regenerate canonical projections
        run: python -m nolane.repository.audit --write

      - name: Verify focused semantics and freshness
        shell: bash
        run: |
          python -m compileall -q nolane
          python -m pytest -q \
            tests/test_refoundation_post_epoch0_native_inventory_semantics.py \
            tests/test_refoundation_epoch0_final_closure.py
          python -m nolane.repository.audit --check

      - name: Self-delete and commit
        shell: bash
        run: |
          rm .github/workflows/post-epoch0-native-inventory-carrier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: distinguish frozen inventory from migration debt"
          git push origin HEAD:post-epoch0/native-inventory-semantics
