name: Post-Epoch 0 native inventory semantics carrier

on:
  push:
    branches:
      - post-epoch0/native-inventory-semantics
    paths:
      - .github/workflows/post-epoch0-native-inventory-carrier.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-epoch0/native-inventory-semantics
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install -q pytest

      - name: Recover and harden reviewed migration payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import subprocess
          from pathlib import Path

          workflow_path = ".github/workflows/post-epoch0-native-inventory-carrier.yml"
          prefix = "echo '"
          suffix = "' | base64 -d > /tmp/migrate-native-inventory.py"
          payload = None

          for depth in range(1, 5):
              revision = "HEAD" + "^" * depth
              try:
                  previous = subprocess.check_output(
                      ["git", "show", f"{revision}:{workflow_path}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              for line in previous.splitlines():
                  stripped = line.strip()
                  if stripped.startswith(prefix) and stripped.endswith(suffix):
                      payload = stripped[len(prefix) : -len(suffix)]
                      break
              if payload is not None:
                  break

          if payload is None:
              raise SystemExit("reviewed migration payload not found in carrier history")

          migration = base64.b64decode(payload, validate=True).decode("utf-8")
          declarations = [
              line for line in migration.splitlines() if line.startswith("new_renderer = ")
          ]
          if len(declarations) != 1:
              raise SystemExit(
                  f"renderer declaration drift: expected 1, found {len(declarations)}"
              )
          declaration = declarations[0]
          if declaration.startswith('new_renderer = r"""'):
              pass
          elif declaration.startswith('new_renderer = """'):
              migration = migration.replace(
                  'new_renderer = """',
                  'new_renderer = r"""',
                  1,
              )
          else:
              raise SystemExit(f"unsupported renderer declaration: {declaration!r}")

          compile(migration, "/tmp/migrate-native-inventory.py", "exec")
          Path("/tmp/migrate-native-inventory.py").write_text(migration, encoding="utf-8")
          PY
          python /tmp/migrate-native-inventory.py

      - name: Compile migrated source before generation
        run: python -m compileall -q nolane scripts

      - name: Regenerate canonical projections
        run: python -m nolane.repository.audit --write

      - name: Focused GREEN proof
        run: python -m pytest -q tests/test_refoundation_post_epoch0_native_inventory_semantics.py

      - name: Commit migrated source and projections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nolane/repository/audit_v2.py CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md
          git diff --cached --quiet && exit 0
          git commit -m "refactor: distinguish frozen inventory from migration debt"
          git push origin HEAD:post-epoch0/native-inventory-semantics
