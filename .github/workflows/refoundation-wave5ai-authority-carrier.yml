name: Refoundation Wave 5AI Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5ai-native-evaluation-claims

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation/epoch0-wave5ai-native-evaluation-claims
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Materialize native evaluation claims authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy_path = Path('cogcoder/organization/evaluation_claims.py')
          canonical_path = Path('nolane/evaluation/claims.py')
          source = legacy_path.read_text(encoding='utf-8')

          replacements = {
              'from .evaluation_evidence import EvaluationEvidenceLedger': 'from nolane.evaluation.evidence import EvaluationEvidenceLedger',
              'from .evaluation_regimes import BenchmarkDomain, BenchmarkRegimeRegistry, EvidenceProvenanceClass, EvaluationMode': 'from nolane.evaluation.regimes import BenchmarkDomain, BenchmarkRegimeRegistry, EvidenceProvenanceClass, EvaluationMode',
              'from .evaluation_stress import LongHorizonStressLedger': 'from nolane.evaluation.stress import LongHorizonStressLedger',
              'from .registry import AgentRegistry': 'from nolane.organization.identity import AgentRegistry',
              'from .types import canonical_digest': 'from nolane.core.canonical_digest import canonical_digest',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'expected exactly one claims import anchor: {old!r}')
              source = source.replace(old, new)

          source = source.rstrip() + '''\n\n\nCOMPONENT_ID = "evaluation.claims"\nCOMPONENT_VERSION = "0.0.1"\nMIGRATED_FROM = "cogcoder.organization.evaluation_claims"\n'''
          canonical_path.write_text(source, encoding='utf-8')

          bridge = '''from nolane.evaluation.claims import (\n    ClaimAssessment,\n    ClaimBoundaryEngine,\n    ClaimClass,\n    ClaimDisposition,\n    OrganizationReadinessReport,\n)\n\n__all__ = (\n    "ClaimClass",\n    "ClaimDisposition",\n    "ClaimAssessment",\n    "OrganizationReadinessReport",\n    "ClaimBoundaryEngine",\n)\n'''
          legacy_path.write_text(bridge, encoding='utf-8')

          versions = Path('cogcoder/refoundation/component_versions.py')
          text = versions.read_text(encoding='utf-8')
          anchor = '        "evaluation.stress": 1,\n        "neural.inference_bridge": 1,'
          replacement = '        "evaluation.stress": 1,\n        "evaluation.claims": 1,\n        "neural.inference_bridge": 1,'
          if text.count(anchor) != 1:
              raise SystemExit('component version anchor drift')
          versions.write_text(text.replace(anchor, replacement), encoding='utf-8')

          facades = Path('cogcoder/refoundation/facades.py')
          text = facades.read_text(encoding='utf-8')
          line = '        FacadeBinding("evaluation.claims", "nolane.evaluation.claims", "cogcoder.organization.evaluation_claims", ("ClaimBoundaryEngine",)),\n'
          if text.count(line) != 1:
              raise SystemExit('evaluation.claims facade anchor drift')
          facades.write_text(text.replace(line, ''), encoding='utf-8')

          status_path = Path('cogcoder/refoundation/implementation_status.py')
          text = status_path.read_text(encoding='utf-8')
          anchor = '''    "evaluation.stress": (\n        "nolane.evaluation.stress",\n        ("cogcoder/organization/evaluation_stress.py",),\n        "Native long-horizon stress scenario, observation, suite-assessment and ledger authority over canonical identity, verification-evidence and digest dependencies; historical evaluation-stress module bridges exact semantic public identities.",\n    ),\n    "neural.inference_bridge": ('''
          replacement = '''    "evaluation.stress": (\n        "nolane.evaluation.stress",\n        ("cogcoder/organization/evaluation_stress.py",),\n        "Native long-horizon stress scenario, observation, suite-assessment and ledger authority over canonical identity, verification-evidence and digest dependencies; historical evaluation-stress module bridges exact semantic public identities.",\n    ),\n    "evaluation.claims": (\n        "nolane.evaluation.claims",\n        ("cogcoder/organization/evaluation_claims.py",),\n        "Native claim-classification, claim assessment, readiness-gate and claim-boundary authority over canonical evaluation evidence, regimes, stress, identity and digest dependencies; historical evaluation-claims module bridges exact semantic public identities.",\n    ),\n    "neural.inference_bridge": ('''
          if text.count(anchor) != 1:
              raise SystemExit('implementation ledger anchor drift')
          status_path.write_text(text.replace(anchor, replacement), encoding='utf-8')

          inventory = Path('cogcoder/refoundation/inventory.py')
          text = inventory.read_text(encoding='utf-8')
          anchor = '    "cogcoder/epistemic_workspace.py": "nolane/external_core/epistemic.py",\n'
          replacement = anchor + '    "cogcoder/organization/evaluation_claims.py": "nolane/evaluation/claims.py",\n'
          if text.count(anchor) != 1:
              raise SystemExit('inventory anchor drift')
          inventory.write_text(text.replace(anchor, replacement), encoding='utf-8')

          current = Path('CURRENT/STATUS.md')
          text = current.read_text(encoding='utf-8')
          anchor = '- Wave 5AH candidate: `evaluation.stress` -> native `nolane.evaluation.stress`\n'
          replacement = anchor + '- Wave 5AI candidate: `evaluation.claims` -> native `nolane.evaluation.claims`\n'
          if text.count(anchor) != 1:
              raise SystemExit('CURRENT status lineage anchor drift')
          text = text.replace(anchor, replacement)
          narrative = 'Wave 5AH retires `evaluation.stress` by moving long-horizon stress scenarios, observations, required-scenario suite assessments and deterministic stress-ledger snapshot authority under native `nolane.evaluation.stress` ownership. The canonical stress layer resolves organization identity, verification evidence and canonical digest only through `nolane` authorities; historical `cogcoder.organization.evaluation_stress` is an exact semantic public-object bridge. The generated native-debt projection therefore moves from 16 to 15 non-native component records while evaluation parameters/release/claims/scaling/campaign and the remaining External Core/historical/frozen boundaries stay explicit debt.\n'
          addition = narrative + '\nWave 5AI retires `evaluation.claims` by moving claim classification, immutable claim/readiness receipts and the claim-boundary control engine under native `nolane.evaluation.claims` ownership. The canonical claims layer resolves evaluation evidence, benchmark regimes, long-horizon stress, organization identity and canonical digest only through `nolane` authorities; historical `cogcoder.organization.evaluation_claims` becomes an exact semantic public-object bridge. The generated native-debt projection therefore moves from 15 to 14 non-native component records.\n'
          if text.count(narrative) != 1:
              raise SystemExit('CURRENT status narrative anchor drift')
          text = text.replace(narrative, addition)
          current.write_text(text, encoding='utf-8')
          PY

      - name: Compile and materialize repository audit
        run: |
          python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
          python -m nolane.ai.materialize --check
          python -m nolane.repository.audit --write
          python -m nolane.repository.audit --check

      - name: Verify Wave 5AI and full Refoundation contracts
        run: |
          python -m pytest -q tests/test_refoundation_wave5ai_native_evaluation_claims.py
          python -m pytest -q tests/test_refoundation_*.py

      - name: Verify broad regressions and frozen Neural metadata
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
          python model/neural-r2.3/scripts/verify_neural_r23.py

      - name: Fail closed on unexpected diff scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'nolane/evaluation/claims.py',
              'cogcoder/organization/evaluation_claims.py',
              'cogcoder/refoundation/component_versions.py',
              'cogcoder/refoundation/facades.py',
              'cogcoder/refoundation/implementation_status.py',
              'cogcoder/refoundation/inventory.py',
              'CURRENT/NATIVE_DEBT.json',
              'CURRENT/NATIVE_DEBT.md',
              'archive/INDEX.json',
              'CURRENT/STATUS.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected Wave 5AI diff: {unexpected}')
          required = {
              'nolane/evaluation/claims.py',
              'cogcoder/organization/evaluation_claims.py',
              'cogcoder/refoundation/component_versions.py',
              'cogcoder/refoundation/facades.py',
              'cogcoder/refoundation/implementation_status.py',
              'cogcoder/refoundation/inventory.py',
              'CURRENT/NATIVE_DEBT.json',
              'CURRENT/NATIVE_DEBT.md',
              'CURRENT/STATUS.md',
          }
          missing = sorted(required - changed)
          if missing:
              raise SystemExit(f'missing expected Wave 5AI diff: {missing}')
          PY

      - name: Commit accepted authority cutover
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            nolane/evaluation/claims.py \
            cogcoder/organization/evaluation_claims.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/inventory.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md \
            archive/INDEX.json \
            CURRENT/STATUS.md
          git commit -m "refactor(refoundation): native evaluation claims authority"
          git push origin HEAD:refoundation/epoch0-wave5ai-native-evaluation-claims
