name: R2.57 Full Repository Release Bundle

on:
  push:
    branches: [main]
    paths:
      - 'archive/root-history/historical_r_series/R2_57_DELIVERY.md'
      - 'archive/root-history/historical_r_series/R2_56_TO_R2_57_EVOLUTION.md'
      - 'archive/root-history/historical_r_series/R2_57_RELEASE_MANIFEST.json'
      - 'archive/root-history/historical_r_series/R2_57_EXTERNAL_TRANSFER.json'
      - 'archive/root-history/historical_r_series/R2_57_VERIFY_RESULT.json'
      - 'archive/root-history/historical_r_series/R2_57_WORLD_FINAL.json'
      - 'archive/root-history/historical_r_series/R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r257-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release test dependency
        run: python -m pip install pytest
      - name: Verify frozen release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path

          phase = json.loads(Path('archive/root-history/historical_r_series/R2_57_PHASE_A_RESULT.json').read_text())
          external = json.loads(Path('archive/root-history/historical_r_series/R2_57_EXTERNAL_TRANSFER.json').read_text())
          verify = json.loads(Path('archive/root-history/historical_r_series/R2_57_VERIFY_RESULT.json').read_text())
          world = json.loads(Path('archive/root-history/historical_r_series/R2_57_WORLD_FINAL.json').read_text())
          manifest = json.loads(Path('archive/root-history/historical_r_series/R2_57_RELEASE_MANIFEST.json').read_text())

          assert phase['extended_exact'] == phase['heldout_episodes'] == 6
          assert phase['base_exact'] == 0
          assert phase['false_accepts'] == 0
          assert phase['learned_abstractions'] == 3
          assert phase['compression_gains'] == [1, 11, 11]

          assert external['passed'] is True
          assert external['base_passed'] is False
          assert external['extended_passed'] is True
          assert external['challenge_exact'] == external['challenge_cases'] == 8
          assert external['heldout_exact'] == external['heldout_cases'] == 24
          assert external['source_commit'] == 'f1fbe6769850823a1976ccc28d14cd966130b645'

          assert verify['hosted_run_id'] == 32098662916
          assert verify['hosted_main_job'] == 'success'
          assert verify['focused_r257_tests'] == 15
          assert verify['protected_local_relevant_tests'] == 175
          assert verify['world_audit_valid'] is True
          assert verify['world_w5_passed'] is False
          assert verify['readiness_after'] == 47.5

          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == '3ae5182269c9edd6750cb7b5549dd674b9cbb753b99b5915537800222347d664'
          assert world['gate']['passed'] is False
          assert world['gate']['score'] == 0
          assert world['active_seconds_credited'] == 0.0

          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['readiness'] == 47.5
          print('R257_RELEASE_BOUNDARY_OK')
          PY
      - name: Run focused release regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
      - name: Create complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.57-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.57-COMPLETE.zip | tee release/Nolane-AI-R2.57-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.57-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.57-COMPLETE
          path: |
            release/Nolane-AI-R2.57-COMPLETE.zip
            release/Nolane-AI-R2.57-COMPLETE.zip.sha256
      - name: Publish release-bundle commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({
              'state': 'success',
              'context': 'r257/release-bundle',
              'description': 'R2.57 release boundary, regressions, archive and ZIP integrity passed',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
