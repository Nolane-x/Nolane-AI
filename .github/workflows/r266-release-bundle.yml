name: R2.66 Full Repository Release Bundle

on:
  push:
    branches: [r266-learned-contextual-composition-gpt56sol]
    paths:
      - 'R2_66_*.json'
      - 'cogcoder/r266_*.py'
      - 'cogcoder/_r266_*.py'
      - 'tests/test_r266_*.py'
      - 'benchmarks/kfigg/r266_*.py'
      - 'research/r266_*.py'
      - 'scripts/r266_apply_authority_hardening.py'
      - '.github/workflows/r266-*.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies and pinned external oracle
        run: |
          python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
          python -m pip install 'git+https://github.com/WarrenWeckesser/ufunclab.git@f1fbe6769850823a1976ccc28d14cd966130b645'
      - name: Verify frozen R2.66 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          required = (
              'R2_66_PRE_HOSTED_LOCK.json',
              'R2_66_PHASE_A_RESULT.json',
              'R2_66_EXTERNAL_TRANSFER.json',
              'cogcoder/_r266_contextual_composition_core.py',
              'cogcoder/r266_learned_contextual_composition.py',
              'benchmarks/kfigg/r266_learned_contextual_composition.py',
              'research/r266_external_contextual_transfer.py',
              'scripts/r266_apply_authority_hardening.py',
              'tests/test_r266_pair_budget_semantics.py',
              'tests/test_r266_intervention_oracle_failclosed.py',
              'tests/test_r266_independent_terminal_contexts.py',
              'tests/test_r266_terminal_evidence_boundary.py',
              'tests/test_r266_frozen_lock_independent_blockers.py',
              'tests/test_r266_terminal_probe_evidence.py',
              '.github/workflows/r266-canonical-gate.yml',
              '.github/workflows/r266-freeze-evidence.yml',
              '.github/workflows/r266-release-bundle.yml',
              '.github/workflows/r266-intervention-oracle-hotfix.yml',
              '.github/workflows/r266-intervention-oracle-cross-python.yml',
              '.github/workflows/r266-authority-hardening-pr.yml',
          )
          for path in required:
              assert Path(path).is_file(), path
          lock=json.loads(Path('R2_66_PRE_HOSTED_LOCK.json').read_text())
          assert lock['schema_version'] >= 4
          assert lock['parent_release_commit'] == '768e500d6b3e8d1d8ec747e37aae6302ab6747d1'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['terminal_evidence_disjointness_frozen'] is True
          assert lock['semantic_pair_budget_invariance_frozen'] is True
          assert lock['independent_pair_budget_green_run_id'] == 32147458027
          assert lock['intervention_oracle_fail_closed_frozen'] is True
          assert lock['intervention_oracle_red_run_id'] == 32144226317
          assert lock['intervention_oracle_green_run_id'] == 32147372531
          assert lock['release_oracle_contract_frozen'] is True
          assert lock['evidence_authority_regressions_frozen'] is True
          assert lock['terminal_probe_authority_frozen'] is True
          assert lock['terminal_intervention_validator_frozen'] is True
          assert lock['oracle_ledger_frozen'] is True
          assert lock['semantic_profile_identity_frozen'] is True
          assert lock['terminal_probe_case_units_frozen'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R266_RELEASE_BOUNDARY_OK', lock['schema_version'], len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import ufunclab
          from benchmarks.kfigg.r266_learned_contextual_composition import run_benchmark
          from research.r266_external_contextual_transfer import run_external_transfer
          phase=run_benchmark()
          external=run_external_transfer(
              ufunclab.step,
              source_id='WarrenWeckesser/ufunclab:ufunclab.step',
              source_commit='f1fbe6769850823a1976ccc28d14cd966130b645',
          )
          assert phase == json.loads(Path('R2_66_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_66_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R266_RELEASE_EVIDENCE_EXACT_OK')
          PY
      - name: Run R2.66 and protected lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Create and verify complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.66-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.66-COMPLETE.zip | tee release/Nolane-AI-R2.66-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.66-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required = {
              'R2_66_PRE_HOSTED_LOCK.json',
              'R2_66_PHASE_A_RESULT.json',
              'R2_66_EXTERNAL_TRANSFER.json',
              'cogcoder/_r266_contextual_composition_core.py',
              'cogcoder/r266_learned_contextual_composition.py',
              'benchmarks/kfigg/r266_learned_contextual_composition.py',
              'research/r266_external_contextual_transfer.py',
              'scripts/r266_apply_authority_hardening.py',
              'tests/test_r266_pair_budget_semantics.py',
              'tests/test_r266_intervention_oracle_failclosed.py',
              'tests/test_r266_independent_terminal_contexts.py',
              'tests/test_r266_terminal_evidence_boundary.py',
              'tests/test_r266_frozen_lock_independent_blockers.py',
              'tests/test_r266_terminal_probe_evidence.py',
              '.github/workflows/r266-canonical-gate.yml',
              '.github/workflows/r266-freeze-evidence.yml',
              '.github/workflows/r266-release-bundle.yml',
              '.github/workflows/r266-intervention-oracle-hotfix.yml',
              '.github/workflows/r266-intervention-oracle-cross-python.yml',
              '.github/workflows/r266-authority-hardening-pr.yml',
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.66-COMPLETE.zip') as zf:
              names=set(zf.namelist())
          missing=required-names
          assert not missing, sorted(missing)
          print('R266_COMPLETE_ZIP_CONTENTS_OK', len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.66-COMPLETE
          path: |
            release/Nolane-AI-R2.66-COMPLETE.zip
            release/Nolane-AI-R2.66-COMPLETE.zip.sha256
      - name: Publish release-bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r266/release-bundle',
              'description':'R2.66 authority lock, exact evidence, protected lineage and COMPLETE ZIP passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R266_RELEASE_BUNDLE_STATUS_PUBLISHED')
          PY
