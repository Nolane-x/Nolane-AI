name: R2.65 Freeze Exact Evidence

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - 'cogcoder/r265_*.py'
      - 'tests/test_r265_*.py'
      - 'benchmarks/kfigg/r265_*.py'
      - 'research/r265_*.py'
      - '.github/workflows/r265-freeze-evidence.yml'
      - '.github/workflows/r265-verified-patch-primitive-induction.yml'
      - '.github/workflows/r265-canonical-gate.yml'
      - '.github/workflows/r265-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify fixed production before freezing
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Recompute and freeze exact evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer

          phase = run_benchmark()
          external = run_external_transfer(
              np.multiply,
              source_id='numpy.multiply',
              source_version=np.__version__,
          )
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          assert np.__version__ == '2.4.6'
          Path('archive/root-history/historical_r_series/R2_65_PHASE_A_RESULT.json').write_text(json.dumps(phase, indent=2, sort_keys=True) + '\n')
          Path('archive/root-history/historical_r_series/R2_65_EXTERNAL_TRANSFER.json').write_text(json.dumps(external, indent=2, sort_keys=True) + '\n')

          frozen_paths = (
              'cogcoder/r265_verified_patch_primitive_induction.py',
              'benchmarks/kfigg/r265_patch_primitive_induction.py',
              'research/r265_external_patch_primitive_transfer.py',
              'tests/test_r265_verified_patch_primitive_induction.py',
              'tests/test_r265_patch_primitive_benchmark.py',
              'tests/test_r265_external_patch_primitive_transfer.py',
              'tests/test_r265_patchmacro_field_contract.py',
              'tests/test_r265_hypothesis_budget_fairness.py',
              'tests/test_r265_true_global_generation_cap.py',
              'tests/test_r265_singleton_out_of_space_induction.py',
              'tests/test_r265_unanimous_misspecification.py',
              'tests/test_r265_post_selection_singleton_misspec.py',
              'tests/test_r265_diagnostic_order_invariance.py',
              'tests/test_r265_zero_challenge_promotion.py',
              '.github/workflows/r265-verified-patch-primitive-induction.yml',
              '.github/workflows/r265-canonical-gate.yml',
              '.github/workflows/r265-freeze-evidence.yml',
              '.github/workflows/r265-release-bundle.yml',
          )
          blobs = {path: subprocess.check_output(['git','hash-object',path], text=True).strip() for path in frozen_paths}
          parent = subprocess.check_output(['git','merge-base','HEAD','origin/main'], text=True).strip()
          lock = {
              'schema_version': 8,
              'milestone': 'R2.65 Verified Patch Primitive Induction',
              'parent_release_commit': parent,
              'frozen_git_blobs': blobs,
              'phase_a_result': 'archive/root-history/historical_r_series/R2_65_PHASE_A_RESULT.json',
              'external_result': 'archive/root-history/historical_r_series/R2_65_EXTERNAL_TRANSFER.json',
              'production_source_changes_after_lock_forbidden': True,
              'inherited_patchmacro_contract_frozen': True,
              'hypothesis_budget_fairness_frozen': True,
              'true_global_generation_cap_frozen': True,
              'singleton_out_of_space_diagnostic_frozen': True,
              'unanimous_misspecification_diagnostic_frozen': True,
              'post_selection_singleton_misspecification_frozen': True,
              'diagnostic_order_invariance_frozen': True,
              'independent_challenge_promotion_gate_frozen': True,
              'release_bundle_workflow_frozen': True,
              'singleton_red_run_id': 32137012090,
              'unanimous_red_run_id': 32137926223,
              'post_selection_singleton_red_run_id': 32138019297,
              'final_hardening_red_run_id': 32139275510,
              'note': (
                  'Frozen only after fixed R2.64.1 parent and hosted RED/GREEN evidence covered PatchMacro invariants, '
                  'hypothesis fairness, the true global generation cap, initial-singleton misspecification, unanimous '
                  'zero-entropy misspecification, post-selection singleton misspecification, caller-order-invariant '
                  'diagnostics, mandatory independent challenge promotion, exact authored evidence, NumPy multiply '
                  'transfer, canonical verification, and the complete release-bundle workflow. Freeze performs no '
                  'production mutation. Any later frozen-blob change requires complete remeasurement.'
              ),
          }
          Path('archive/root-history/historical_r_series/R2_65_PRE_HOSTED_LOCK.json').write_text(json.dumps(lock, indent=2, sort_keys=True) + '\n')
          print('R265_FREEZE_READY', parent, len(blobs))
          PY
      - name: Commit exact evidence if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/root-history/historical_r_series/R2_65_PHASE_A_RESULT.json archive/root-history/historical_r_series/R2_65_EXTERNAL_TRANSFER.json archive/root-history/historical_r_series/R2_65_PRE_HOSTED_LOCK.json
          if git diff --cached --quiet; then
            echo R265_EVIDENCE_ALREADY_FROZEN
          else
            git commit -m 'research: refreeze exact R2.65 evidence after final hardening'
            git push origin HEAD:r265-verified-patch-language-induction-gpt56sol
          fi
