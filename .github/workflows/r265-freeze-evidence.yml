name: R2.65 Freeze Exact Evidence

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - 'cogcoder/r265_*.py'
      - 'tests/test_r265_*.py'
      - 'benchmarks/kfigg/r265_*.py'
      - 'research/r265_*.py'
      - '.github/workflows/r265-freeze-evidence.yml'
      - '.github/workflows/r265-verified-patch-primitive-induction.yml'
      - '.github/workflows/r265-canonical-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Apply singleton diagnostic fix from clean hosted RED
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text=path.read_text()
          old='''    selected_probe: RepositoryProbe | None = None
    while len(survivors) > 1:
        if diagnostic_calls >= selection_budget:
            return receipt('abstain', None, None, False, 'selection_oracle_budget_exhausted')
        probe, partitions, probe_evals = _best_probe(survivors, diagnostics, used_diagnostics)
        candidate_evaluations += probe_evals
        if probe is None or partitions is None:
            return receipt('abstain', None, None, False, 'no_informative_diagnostic_probe')
        oracle_key, oracle_value, oracle_ok = _oracle_outcome(oracle, probe.args)
        diagnostic_calls += 1
        used_diagnostics.add(probe.probe_id)
        if not oracle_ok:
            return receipt('abstain', None, None, False, 'diagnostic_oracle_error')
        test_id = 'r265:diagnostic:' + probe.probe_id.split(':', 1)[-1]
        if test_id not in observed_test_ids:
            observed_tests.append(PatchTest(test_id, tuple(probe.args), oracle_value))
            observed_test_ids.add(test_id)
        if probe.probe_id not in observed_probe_ids:
            observed_probe_ids.append(probe.probe_id)
        matching = partitions.get(oracle_key)
        if matching:
            survivors = matching
            continue
        diagnostic_counterexamples += 1
        selected_probe = probe
        break
'''
          new='''    selected_probe: RepositoryProbe | None = None
    if len(survivors) == 1:
        # A singleton version space is not proof that its sole survivor is correct.
        # Validate it against target-independent diagnostics under the same public
        # oracle budget. A mismatch becomes an explicit out-of-space counterexample;
        # matching diagnostics never authorize primitive induction by themselves.
        singleton = survivors[0]
        ordered_diagnostics = tuple(sorted(diagnostics, key=lambda row: row.probe_id))
        for probe in ordered_diagnostics:
            if diagnostic_calls >= selection_budget:
                break
            candidate_key, _candidate_value = _outcome(singleton.fn, probe.args)
            candidate_evaluations += 1
            oracle_key, oracle_value, oracle_ok = _oracle_outcome(oracle, probe.args)
            diagnostic_calls += 1
            used_diagnostics.add(probe.probe_id)
            if not oracle_ok:
                return receipt('abstain', None, None, False, 'diagnostic_oracle_error')
            test_id = 'r265:diagnostic:' + probe.probe_id.split(':', 1)[-1]
            if test_id not in observed_test_ids:
                observed_tests.append(PatchTest(test_id, tuple(probe.args), oracle_value))
                observed_test_ids.add(test_id)
            if probe.probe_id not in observed_probe_ids:
                observed_probe_ids.append(probe.probe_id)
            if candidate_key != oracle_key:
                diagnostic_counterexamples += 1
                selected_probe = probe
                break
        if selected_probe is None and diagnostic_calls >= selection_budget and len(ordered_diagnostics) > diagnostic_calls:
            return receipt('abstain', None, None, False, 'selection_oracle_budget_exhausted')
    else:
        while len(survivors) > 1:
            if diagnostic_calls >= selection_budget:
                return receipt('abstain', None, None, False, 'selection_oracle_budget_exhausted')
            probe, partitions, probe_evals = _best_probe(survivors, diagnostics, used_diagnostics)
            candidate_evaluations += probe_evals
            if probe is None or partitions is None:
                return receipt('abstain', None, None, False, 'no_informative_diagnostic_probe')
            oracle_key, oracle_value, oracle_ok = _oracle_outcome(oracle, probe.args)
            diagnostic_calls += 1
            used_diagnostics.add(probe.probe_id)
            if not oracle_ok:
                return receipt('abstain', None, None, False, 'diagnostic_oracle_error')
            test_id = 'r265:diagnostic:' + probe.probe_id.split(':', 1)[-1]
            if test_id not in observed_test_ids:
                observed_tests.append(PatchTest(test_id, tuple(probe.args), oracle_value))
                observed_test_ids.add(test_id)
            if probe.probe_id not in observed_probe_ids:
                observed_probe_ids.append(probe.probe_id)
            matching = partitions.get(oracle_key)
            if matching:
                survivors = matching
                continue
            diagnostic_counterexamples += 1
            selected_probe = probe
            break
'''
          if old in text:
              assert text.count(old) == 1
              text=text.replace(old,new,1)
              path.write_text(text)
              print('R265_SINGLETON_PRODUCTION_PATCH_APPLIED')
          elif 'if len(survivors) == 1:' in text and 'ordered_diagnostics' in text:
              print('R265_SINGLETON_PRODUCTION_PATCH_ALREADY_PRESENT')
          else:
              raise SystemExit('R2.65 diagnostic surface changed concurrently; refusing unsafe rewrite')
          PY
      - name: Verify focused contracts before freezing
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Recompute and freeze exact evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          from research.r265_external_patch_primitive_transfer import run_external_transfer

          phase=run_benchmark()
          external=run_external_transfer(np.multiply, source_id='numpy.multiply', source_version=np.__version__)
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          assert np.__version__ == '2.4.6'
          Path('R2_65_PHASE_A_RESULT.json').write_text(json.dumps(phase, indent=2, sort_keys=True)+'\n')
          Path('R2_65_EXTERNAL_TRANSFER.json').write_text(json.dumps(external, indent=2, sort_keys=True)+'\n')

          frozen_paths = (
              'cogcoder/r265_verified_patch_primitive_induction.py',
              'benchmarks/kfigg/r265_patch_primitive_induction.py',
              'research/r265_external_patch_primitive_transfer.py',
              'tests/test_r265_verified_patch_primitive_induction.py',
              'tests/test_r265_patch_primitive_benchmark.py',
              'tests/test_r265_external_patch_primitive_transfer.py',
              'tests/test_r265_patchmacro_field_contract.py',
              'tests/test_r265_hypothesis_budget_fairness.py',
              'tests/test_r265_true_global_generation_cap.py',
              'tests/test_r265_singleton_out_of_space_induction.py',
              '.github/workflows/r265-verified-patch-primitive-induction.yml',
              '.github/workflows/r265-canonical-gate.yml',
              '.github/workflows/r265-freeze-evidence.yml',
          )
          blobs={path: subprocess.check_output(['git','hash-object',path], text=True).strip() for path in frozen_paths}
          parent=subprocess.check_output(['git','merge-base','HEAD','origin/main'], text=True).strip()
          lock={
              'schema_version':4,
              'milestone':'R2.65 Verified Patch Primitive Induction',
              'parent_release_commit':parent,
              'frozen_git_blobs':blobs,
              'phase_a_result':'R2_65_PHASE_A_RESULT.json',
              'external_result':'R2_65_EXTERNAL_TRANSFER.json',
              'production_source_changes_after_lock_forbidden':True,
              'hypothesis_budget_fairness_frozen':True,
              'true_global_generation_cap_frozen':True,
              'inherited_patchmacro_contract_frozen':True,
              'singleton_out_of_space_diagnostic_frozen':True,
              'singleton_red_run_id':32137012090,
              'note':'Frozen after fixed R2.64.1 parent, clean hosted singleton RED, R2.65 contract/fairness/true-global-generation-cap/singleton tests, and exact authored/NumPy multiply evidence. Any later frozen-blob change requires complete remeasurement.'
          }
          Path('R2_65_PRE_HOSTED_LOCK.json').write_text(json.dumps(lock, indent=2, sort_keys=True)+'\n')
          print('R265_FREEZE_READY', parent, len(blobs))
          PY
      - name: Commit verified production and exact evidence if changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py R2_65_PHASE_A_RESULT.json R2_65_EXTERNAL_TRANSFER.json R2_65_PRE_HOSTED_LOCK.json
          if git diff --cached --quiet; then
            echo R265_EVIDENCE_ALREADY_FROZEN
          else
            git commit -m 'research: fix singleton diagnostics and refreeze exact R2.65 evidence'
            git push origin HEAD:r265-verified-patch-language-induction-gpt56sol
          fi
