name: E Acting Replay Authority Patch

on:
  push:
    branches:
      - e-acting-replay-authority-gpt56sol

permissions:
  contents: write

concurrency:
  group: e-acting-replay-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e-acting-replay-authority-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Apply bounded replay authority patch
        run: python .github/e_acting_replay_green.py
      - name: Compile E runtime
        run: python -m py_compile nolane/external_core/acting_runtime.py
      - name: Run replay authority and runtime contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_replay_authority.py \
            tests/test_refoundation_acting_runtime.py \
            tests/test_refoundation_acting_receipt_provenance.py
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit production patch
        run: |
          if git diff --quiet -- nolane/external_core/acting_runtime.py; then
            echo "Production patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nolane/external_core/acting_runtime.py
          git diff --cached --check
          git commit -m "fix(e-acting): re-attest replay authority"
          git push origin HEAD:e-acting-replay-authority-gpt56sol
