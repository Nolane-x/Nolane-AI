name: R2.9 Verifier-Guided Patch Search Phase A

on:
  push:
    branches: [main]
    paths:
      - 'cogcoder/r29_*.py'
      - 'benchmarks/codeworld/r29_*.py'
      - 'scripts/*r29*.py'
      - 'tests/test_r29_*.py'
      - 'research/R2_9_*'
      - 'R2_9_*'
      - 'docs/superpowers/specs/2026-08-15-r29-*'
      - 'docs/superpowers/plans/2026-08-15-r29-*'
      - '.github/workflows/r29-patch-search.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  phase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: pip install 'torch>=2.2,<3' pytest
      - name: Verify R2.8 parent and R2.9 focused tests
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_r28_repo_world.py
          tests/test_r28_epistemic_debugger.py
          tests/test_r28_runtime.py
          tests/test_r28_protocol.py
          tests/test_r29_patch_model.py
          tests/test_r29_patch_search.py
          tests/test_r29_protocol.py
          tests/test_r29_measure.py
      - name: Reproduce locked R2.9 Phase-A measurement
        run: PYTHONPATH=. python scripts/measure_r29_patch_search.py > /tmp/r29_measure.json
      - name: Compare reproduced measurement with committed result
        run: >-
          python -c "import json;
          a=json.load(open('/tmp/r29_measure.json'));
          b=json.load(open('research/R2_9_PHASE_A_RESULT.json'));
          assert a==b, 'R2.9 measurement drifted from committed result'"
      - name: Verify R2.9 lock and claim boundary
        run: >-
          python -c "import json;
          p=json.load(open('research/R2_9_PHASE_A_RESULT.json'));
          l=json.load(open('research/R2_9_PRE_DEV_LOCK.json'));
          assert p['phase_a_gate_pass'] is True;
          assert p['verified_solves']==4;
          assert p['false_terminal_accepts']==0;
          assert p['duplicate_evaluator_calls']==0;
          assert p['rename_invariant_cases']==4;
          assert p['new_r29_neural_parameters']==0;
          assert p['candidate_effective_parameters']==79401400;
          assert p['external_coding_claim_allowed'] is False;
          assert p['agi_claim_allowed'] is False;
          assert l['candidate_parameter_ceiling']==79401400"
      - name: Compile source
        run: python -m compileall -q cogcoder benchmarks/codeworld scripts
      - name: Build full source snapshot
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/Nolane-AI-R2.9-Verifier-Guided-Patch-Search-Phase-A-SOURCE.zip HEAD
          sha256sum dist/Nolane-AI-R2.9-Verifier-Guided-Patch-Search-Phase-A-SOURCE.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nolane-r29-verifier-guided-patch-search-phase-a-source
          path: dist/
