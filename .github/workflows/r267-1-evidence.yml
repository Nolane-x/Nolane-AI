name: R2.67.1 Replacement Evidence

on:
  push:
    branches: [r267-1-evidence-gpt56sol]
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.67.1 replacement evidence contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_evidence.py
