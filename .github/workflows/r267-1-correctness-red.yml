name: R2.67.1 Correctness RED

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'tests/test_r267_1_correctness_hotfix.py'
      - '.github/workflows/r267-1-correctness-red.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/test_r267_1_correctness_hotfix.py'
      - '.github/workflows/r267-1-correctness-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Confirm R2.67.1 blockers remain RED before production mutation
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_correctness_hotfix.py
