name: Memory v0.0.9 Apply

on:
  push:
    branches:
      - codex/memory-learning-retrieval-snapshot-authority-v0.0.9
    paths:
      - '.github/workflows/memory-v009-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/memory-learning-retrieval-snapshot-authority-v0.0.9
          fetch-depth: 0
      - name: Apply lifecycle-authoritative retrieval snapshot patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/memory/learning_substrate.py')
          text = path.read_text()

          replacements = [
              (
                  '''        return {\n            "memory": self.memory.to_state(),\n            "metadata": [self._metadata[key].to_state() for key in sorted(self._metadata)],\n''',
                  '''        return {\n            "memory": self.memory.to_state(),\n            "lifecycle": self.lifecycle.to_state(),\n            "metadata": [self._metadata[key].to_state() for key in sorted(self._metadata)],\n''',
              ),
              (
                  '''        self._validate_retrieval_snapshot_digest(receipt.memory_state_digest, snapshot)\n\n        replay_memory = MemoryFabric.from_state(snapshot.get("memory", {}))\n        replay_relations = MemoryRelationGraph.from_state(\n''',
                  '''        self._validate_retrieval_snapshot_digest(receipt.memory_state_digest, snapshot)\n        raw_lifecycle = snapshot.get("lifecycle")\n        if not isinstance(raw_lifecycle, Mapping):\n            raise ValueError("retrieval replay snapshot requires lifecycle authority")\n\n        replay_memory = MemoryFabric.from_state(snapshot.get("memory", {}))\n        replay_lifecycle = MemoryLifecycleLedger.from_state(\n            registry=self.registry,\n            memory=replay_memory,\n            events=self.events,\n            state=raw_lifecycle,\n        )\n        replay_relations = MemoryRelationGraph.from_state(\n''',
              ),
              (
                  '''        replay = LearningSubstrate(\n            registry=self.registry,\n            events=self.events,\n            memory=replay_memory,\n            relations=replay_relations,\n        )\n''',
                  '''        replay = LearningSubstrate(\n            registry=self.registry,\n            events=self.events,\n            memory=replay_memory,\n            lifecycle=replay_lifecycle,\n            relations=replay_relations,\n        )\n''',
              ),
              (
                  '''        for metadata in replay._metadata.values():\n            replay_memory.get(metadata.memory_id)\n            if metadata.source_refs != _clean_refs(metadata.source_refs):\n                raise ValueError("retrieval replay metadata source refs are not canonical")\n''',
                  '''        for metadata in replay._metadata.values():\n            replay._validate_learning_metadata_semantics(metadata)\n''',
              ),
              (
                  '''            if tombstone.content_digest != expected_digest:\n                raise ValueError("retrieval replay tombstone content digest mismatch")\n''',
                  '''            if tombstone.content_digest != expected_digest:\n                raise ValueError("retrieval replay tombstone content digest mismatch")\n            replay._validate_tombstone_semantics(tombstone)\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit production patch and remove transaction workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/memory-v009-apply.yml
          git add nolane/memory/learning_substrate.py
          git commit -m "fix(memory): bind retrieval replay to lifecycle authority"
          git push origin HEAD:codex/memory-learning-retrieval-snapshot-authority-v0.0.9
