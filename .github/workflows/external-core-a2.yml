name: External Core A2

on:
  push:
    branches:
      - design/external-core-a2-g-infrastructure
  pull_request:
    paths:
      - 'nolane/external_core/**'
      - 'nolane/metadata/**'
      - 'tests/test_external_core_a2_*.py'
      - 'tests/test_external_core_g*.py'
      - 'CURRENT/EXTERNAL_CORE.md'
      - '.github/workflows/external-core-a2.yml'

jobs:
  external-core-a2:
    # REF0-CI-ISOLATION: refoundation PRs use the dedicated Refoundation regression gate.
    if: "${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical namespaces
        run: |
          python -m py_compile nolane/core/*.py
          python -m py_compile nolane/external_core/*.py
      - name: Run External Core A2 contracts
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/test_external_core_g*.py tests/test_external_core_a2_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo 'No A2 tests found' >&2
            exit 1
          fi
          python -m pytest -q "${tests[@]}"
      - name: Run prior G/Assurance regressions
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/test_coding_agi_ops_*.py tests/test_coding_agi_research_*.py tests/test_coding_agi_assurance_*.py)
          if [ ${#tests[@]} -gt 0 ]; then
            python -m pytest -q "${tests[@]}"
          fi
