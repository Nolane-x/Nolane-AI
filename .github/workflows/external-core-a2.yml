name: External Core

on:
  push:
    branches:
      - main
      - design/external-core-a2-g-infrastructure
      - design/external-core-a3-live-registry
      - upgrade/external-core-version-discipline
      - upgrade/external-core-scoped-evidence-revalidation
  pull_request:
    paths:
      - 'nolane/external_core/**'
      - 'nolane/metadata/**'
      - 'tests/test_external_core_*.py'
      - 'tests/test_external_core_g*.py'
      - 'tests/test_refoundation_component_versions.py'
      - 'CURRENT/EXTERNAL_CORE.md'
      - '.github/workflows/external-core-a2.yml'

jobs:
  external-core:
    # REF0-CI-ISOLATION: refoundation PRs use the dedicated Refoundation regression gate.
    if: "${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical namespaces
        run: |
          python -m py_compile nolane/core/*.py
          python -m py_compile nolane/external_core/*.py
          python -m py_compile nolane/metadata/*.py
      - name: Run External Core contracts
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/test_external_core_g*.py tests/test_external_core_a2_*.py tests/test_external_core_a3_*.py tests/test_external_core_version_discipline*.py tests/test_external_core_integration_*.py tests/test_external_core_scoped_*.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo 'No External Core tests found' >&2
            exit 1
          fi
          python -m pytest -q "${tests[@]}"
      - name: Resolve component-version comparison boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$REF_NAME" == "main" ]]; then
            base="$EVENT_BEFORE"
            head="$EVENT_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^")"
            fi
          else
            base="$(git rev-parse origin/main)"
            head="$EVENT_SHA"
          fi
          test -n "$base"
          test -n "$head"
          git cat-file -e "$base^{commit}"
          git cat-file -e "$head^{commit}"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$head" >> "$GITHUB_ENV"
          echo "Version discipline boundary: $base -> $head"
      - name: Enforce component-local version discipline
        shell: bash
        run: |
          set -euo pipefail
          python -m nolane.metadata.version_discipline_cli --base "$BASE_SHA" --head "$HEAD_SHA" --json > /tmp/version-discipline.json
          cat /tmp/version-discipline.json
          python -m nolane.metadata.version_discipline_cli --base "$BASE_SHA" --head "$HEAD_SHA" --check
          git diff --check "$BASE_SHA" "$HEAD_SHA" --
      - name: Verify canonical component version projection
        run: python -m pytest -q tests/test_refoundation_component_versions.py
      - name: Verify canonical External Core coherence audit
        run: |
          python -m nolane.external_core.audit --check
          python -m nolane.external_core.audit --json > /tmp/external-core-audit.json
          python -c "import json; p='/tmp/external-core-audit.json'; d=json.load(open(p, encoding='utf-8')); assert not d['findings']; assert d['digest']"
      - name: Run prior G/Assurance regressions
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/test_coding_agi_ops_*.py tests/test_coding_agi_research_*.py tests/test_coding_agi_assurance_*.py)
          if [ ${#tests[@]} -gt 0 ]; then
            python -m pytest -q "${tests[@]}"
          fi
