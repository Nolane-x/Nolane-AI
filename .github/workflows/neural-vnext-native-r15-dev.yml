name: Neural vNext Native R15 Dev

on:
  push:
    branches:
      - codex/neural-native-r15-broad-support-diagnostic
    paths:
      - 'model/neural-vnext-native-r15/**'
      - '.github/workflows/neural-vnext-native-r15-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r15/**'
      - '.github/workflows/neural-vnext-native-r15-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r15-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify accepted R11 parent authority
        run: |
          test "$(git hash-object model/neural-vnext-native-r11/ACCEPTED_AUTHORITY.json)" = "f8e8fac794fd339e261e9245ef7b46e1367683f1"
          test "$(git hash-object model/neural-vnext-native-r11/causal_version_space.py)" = "b13657c388d589751919be001d618f6fac2b0643"
          test "$(git hash-object model/neural-vnext-native-r11/causal_runtime.py)" = "9ae28255bd417094b262df948d62860f61116a01"
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R15 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r15:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r15/*.py model/neural-vnext-native-r15/scripts/*.py model/neural-vnext-native-r15/tests/*.py
          python -m pytest -q model/neural-vnext-native-r15/tests
      - name: Run accepted-R11 R15 deterministic dev court
        env:
          PYTHONPATH: model/neural-vnext-native-r15:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r15-dev
          python model/neural-vnext-native-r15/scripts/evaluate_r15_dev.py --manifest r15-dev/r15.manifest.json --dev-result r15-dev/r15.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r15/PREDEV_LOCK.json').read_text())
          manifest=json.loads(Path('r15-dev/r15.manifest.json').read_text())
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert lock['benchmark']['confirmation_indices']==[832,863]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert manifest['fresh_opened'] is False
          assert manifest['status']=='R15_DEV_ELIGIBLE_FRESH_UNOPENED'
          PY
      - name: Upload frozen R15 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r15-dev
          path: |
            r15-dev/r15.manifest.json
            r15-dev/r15.dev.json
          if-no-files-found: error
          retention-days: 90
