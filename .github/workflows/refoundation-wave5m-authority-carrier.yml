name: Refoundation Wave 5M Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5m-native-requirements

permissions:
  contents: write

jobs:
  materialize-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation/epoch0-wave5m-native-requirements
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize deterministic repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Commit generated projections if changed
        shell: bash
        run: |
          git add archive/INDEX.json CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md
          if git diff --cached --quiet; then
            echo 'Audit projections already fresh.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(refoundation): regenerate Wave 5M audit projections'
          git push origin HEAD:refoundation/epoch0-wave5m-native-requirements
