name: R2.45 Role-Free Goal-Directed Recursive Binding

on:
  push:
    branches: [ main ]
    paths:
      - "cogcoder/r245_*.py"
      - "benchmarks/kfigg/r245_*.py"
      - "tests/test_r245_*.py"
      - ".github/workflows/r245-role-free-recursive-binding.yml"
  pull_request:
    paths:
      - "cogcoder/r245_*.py"
      - "benchmarks/kfigg/r245_*.py"
      - "tests/test_r245_*.py"
      - ".github/workflows/r245-role-free-recursive-binding.yml"
  workflow_dispatch:

jobs:
  verify-r245-and-parents:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pytest z3-solver
      - name: Run R2.45 role-free binding tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r245_role_free_binding.py \
            tests/test_r245_role_free_benchmark.py
      - name: Run R2.44 recursive abstraction parent gates
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r244_recursive_abstraction.py \
            tests/test_r244_recursive_abstraction_benchmark.py
      - name: Run R2.43 and R2.41 compatibility gates
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r243_macro_composition.py \
            tests/test_r243_cross_family_benchmark.py \
            tests/test_r241_macro_competition.py \
            tests/test_r241_competitive_discovery.py \
            tests/test_r241_multi_macro_benchmark.py
      - name: Recompute frozen R2.45 evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from benchmarks.kfigg.r245_role_free_recursive_binding import run_frozen_heldout
          result = run_frozen_heldout()
          s = result['summary']
          assert result['all_gates_pass'] is True
          assert s['exact'] == 6
          assert s['false_accepts'] == 0
          assert s['privileged_role_scopes_used'] is False
          assert s['opaque_atom_ids'] is True
          assert s['role_permutation_scrambled'] is True
          assert s['shared_atom_count'] == 8
          assert s['base_bindings_evaluated'] == 224
          assert s['flat_unique_bindings'] == 40320
          assert s['max_candidates_evaluated'] <= 1068
          assert s['min_binding_contraction'] >= 35.0
          assert s['exhaustive_truth_table_rows_per_episode'] == 256
          print(json.dumps(s, sort_keys=True))
          PY
