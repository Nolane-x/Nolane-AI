name: R2.21 Confidence-Adaptive Evidence Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r221-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install pytest
      - name: Verify R2.21 adaptive core contracts
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. pytest -q \
            tests/test_r221_adaptive_evidence.py \
            tests/test_r221_adaptive_language_synthesis.py
      - name: Verify R2.19 parent focused contracts
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. pytest -q tests/test_r219_*.py
      - name: Verify evidence boundary
        run: |
          python - <<'PY'
          import json
          r220=json.load(open('research/R2_20_PHASE_A_RESULT.json'))
          r221=json.load(open('research/R2_21_PHASE_A_RESULT.json'))
          verify=json.load(open('research/R2_21_VERIFY_RESULT.json'))
          world=json.load(open('research/R2_21_WORLD_FINAL.json'))
          assert r220['decision']=='REJECTED' and r220['readiness_after']==22.8
          assert r221['decision']=='ACCEPTED' and r221['readiness_after']==23.4
          assert verify['decision']=='accepted' and verify['checks_passed']==verify['check_count']==47 and verify['exact_replays']==3
          assert world['audit']['valid'] is True and world['world_converged'] is False
          print('R2.21 evidence boundary PASS')
          PY
      - name: Compile projected Python source
        run: PYTHONPYCACHEPREFIX=/tmp/r221-pycache python -m compileall -q cogcoder benchmarks/kfigg tests
