name: R2.69 External NumPy Meta-Transfer

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'benchmarks/kfigg/r269_external_numpy_transfer.py'
      - 'tests/test_r269_external_numpy_transfer.py'
      - 'cogcoder/r269_*.py'
      - '.github/workflows/r269-external-numpy-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Exact pinned dependency
        run: python -c "import numpy as np; assert np.__version__ == '2.4.6', np.__version__"
      - name: Accepted R2.68 safety
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: External black-box transfer contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_external_numpy_transfer.py
