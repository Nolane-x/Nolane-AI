name: Refoundation Wave 5AX Green Carrier

on:
  push:
    branches:
      - refoundation-wave5ax-native-capability-acquisition
    paths:
      - .github/workflows/refoundation-wave5ax-green-carrier.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation-wave5ax-native-capability-acquisition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Patch canonical authority and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          versions = Path('cogcoder/refoundation/component_versions.py')
          text = versions.read_text(encoding='utf-8')
          needle = '        "external.causal": 1,\n        "external.experimentation": 1,\n'
          replacement = '        "external.causal": 1,\n        "external.capability_acquisition": 1,\n        "external.experimentation": 1,\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('component_versions insertion anchor missing')
              text = text.replace(needle, replacement, 1)
              versions.write_text(text, encoding='utf-8')

          status_py = Path('cogcoder/refoundation/implementation_status.py')
          text = status_py.read_text(encoding='utf-8')
          native_row = '''    "external.capability_acquisition": (\n        "nolane.external_core.capability_acquisition",\n        (\n            "cogcoder/r255_hardened_acquisition.py",\n            "cogcoder/r255_lifecycle.py",\n            "cogcoder/r255_authority.py",\n            "cogcoder/r255_reliability.py",\n            "cogcoder/r255_retrieval_firewall.py",\n        ),\n        "Native R2.55-lineage candidate/probation/promotion/quarantine governor over canonical Cognitive Library and Assurance boundaries, with content-addressed candidate identity, exact persisted promotion-receipt/evidence/baseline binding, fail-closed library drift, promoted-only retrieval firewall, live-failure revocation and deterministic state restoration; candidate generation and later version-space expansion remain outside this ownership boundary.",\n    ),\n'''
          anchor = '    "external.causal": (\n'
          if native_row not in text:
              if anchor not in text:
                  raise SystemExit('implementation_status native insertion anchor missing')
              text = text.replace(anchor, native_row + anchor, 1)
          historical = '    "external.capability_acquisition": ("historical capability-acquisition mechanisms; extraction not yet accepted",),\n'
          if historical in text:
              text = text.replace(historical, '', 1)
          status_py.write_text(text, encoding='utf-8')

          status = Path('CURRENT/STATUS.md')
          text = status.read_text(encoding='utf-8')
          section = '''\n## Wave 5AX — Native capability acquisition authority\n\nWave 5AX migrates `external.capability_acquisition` from the R2.55 hardened-acquisition lineage into `nolane.external_core.capability_acquisition` at component version `0.0.1`. The native boundary owns candidate admission, probation, Assurance-bound promotion, quarantine, promoted-only retrieval and live-failure revocation; it deliberately does not own candidate synthesis or later version-space expansion. The cutover moves from 3 to 2 non-native component records: `external.transfer_meta` plus the accepted frozen `neural.shared` asset.\n'''
          if '## Wave 5AX — Native capability acquisition authority' not in text:
              status.write_text(text.rstrip() + '\n' + section, encoding='utf-8')

          external = Path('CURRENT/EXTERNAL_CORE.md')
          text = external.read_text(encoding='utf-8')
          section = '''\n## Capability acquisition\n\n`external.capability_acquisition` is canonical-native in Wave 5AX. It is a control-plane governor over `external.cognitive_library` and `external.assurance`: candidate generation happens upstream; admitted candidates enter probation against an exact library baseline; independent/challenge/reliability evidence must pass; promotion requires the exact persisted native Assurance receipt bound to the same candidate, evidence set and predecessor baseline. Failed gates quarantine without library mutation. Only promoted records cross the acquisition retrieval firewall, and a post-promotion live failure revokes that visibility even though the Cognitive Library itself remains append-only.\n'''
          if '## Capability acquisition' not in text:
              external.write_text(text.rstrip() + '\n' + section, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          note = '\n- **Wave 5AX native capability acquisition:** R2.55-lineage candidate → probation → promoted/quarantined governance now lives in `nolane.external_core.capability_acquisition`, with exact Assurance receipt/evidence/baseline binding and a promoted-only retrieval firewall.\n'
          if 'Wave 5AX native capability acquisition' not in text:
              readme.write_text(text.rstrip() + '\n' + note, encoding='utf-8')
          PY
      - name: Regenerate canonical repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Verify generated repository audit projections
        run: python -m nolane.repository.audit --check
      - name: Run Wave 5AX focused contract
        run: python -m pytest -q tests/test_refoundation_wave5ax_native_capability_acquisition.py
      - name: Commit verified cutover and remove carrier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refoundation-wave5ax-green-carrier.yml
          git add cogcoder/refoundation/component_versions.py \
                  cogcoder/refoundation/implementation_status.py \
                  CURRENT/STATUS.md CURRENT/EXTERNAL_CORE.md README.md \
                  CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md archive/INDEX.json
          git commit -m 'refactor(refoundation): cut over native capability acquisition authority'
          git push origin HEAD:refoundation-wave5ax-native-capability-acquisition
