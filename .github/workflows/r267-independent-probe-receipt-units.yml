name: R2.67 Independent Probe Receipt Units

on:
  push:
    branches: [validation-r267-probe-receipt-units-gpt56sol]
  pull_request:
    branches: [r267-three-probe-causal-composition-gpt56sol]
    paths:
      - 'tests/test_r267_independent_probe_receipt_units.py'
      - '.github/workflows/r267-independent-probe-receipt-units.yml'
      - 'cogcoder/r267_three_probe_causal_composition.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Challenge R2.67 probe-validation receipt units
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_independent_probe_receipt_units.py
