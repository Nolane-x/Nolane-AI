name: R2.67.1 Surgical Preselection Materializer

on:
  push:
    branches: [runner-r2671-preselection-sol]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify parent and current production before mutation
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          test -f tests/test_r267_1_preselection_receipt_units.py
          test -f scripts/r267_1_apply_preselection_receipt_units.py
      - name: Preserve RED evidence semantics or detect prior materialization
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "probe_validation_cases=len(validation)" cogcoder/r267_three_probe_causal_composition.py; then
            set +e
            PYTHONPATH=. python -m pytest -q tests/test_r267_1_preselection_receipt_units.py
            rc=$?
            set -e
            test "$rc" -ne 0
            echo R2671_SURGICAL_RED_CONFIRMED
            python scripts/r267_1_apply_preselection_receipt_units.py
          else
            echo R2671_SURGICAL_ALREADY_MATERIALIZED
          fi
      - name: Verify exact corrected authority surface
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_r267_1_preselection_receipt_units.py \
            tests/test_r267_1_authority_boundaries.py \
            tests/test_r267_1_no_collision_failclosed.py \
            tests/test_r267_1_correctness_hotfix.py \
            tests/test_r267_1_evidence.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit only the one-file production correction
        run: |
          set -euo pipefail
          if git diff --quiet -- cogcoder/r267_three_probe_causal_composition.py; then
            echo R2671_SURGICAL_NO_DELTA
            exit 0
          fi
          test "$(git diff --name-only)" = 'cogcoder/r267_three_probe_causal_composition.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          git commit -m 'fix: correct R2.67.1 preselection receipt units'
          git fetch origin r267-1-genuine-causal-necessity-hotfix-gpt56sol
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/r267-1-genuine-causal-necessity-hotfix-gpt56sol)"
          git push origin HEAD:r267-1-genuine-causal-necessity-hotfix-gpt56sol
      - name: Publish surgical materialization status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r2671/surgical-preselection-materializer','description':'Preselection receipt RED/GREEN and R2.66/R2.67.1 authority checks passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY
