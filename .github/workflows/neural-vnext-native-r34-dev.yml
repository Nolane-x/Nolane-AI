name: Neural vNext Native R34 Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r34/trajectory_mechanism_core.py'
      - 'model/neural-vnext-native-r34/trajectory_mechanism_training.py'
      - 'model/neural-vnext-native-r34/PREDEV_LOCK.json'
      - 'model/neural-vnext-native-r34/FRESH_GATE_PREREGISTRATION.json'
      - 'model/neural-vnext-native-r34/scripts/**'
      - 'model/neural-vnext-native-r34/tests/**'
      - '.github/workflows/neural-vnext-native-r34-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r34-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r34-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R34 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r34:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r34/*.py model/neural-vnext-native-r34/scripts/*.py model/neural-vnext-native-r34/tests/*.py
          python -m pytest -q model/neural-vnext-native-r34/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r34/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r34/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['candidate']=='Neural-vNext-Native-R34-TrajectoryMechanism'
          assert lock['architecture']['pair_feature_dim']==774
          assert lock['architecture']['trajectory_regression_dim']==8
          assert lock['architecture']['expected_goal_successor_parameters']==107799
          assert lock['architecture']['expected_mechanism_successor_parameters']==165558
          assert lock['architecture']['expected_successor_parameters']==273357
          assert lock['architecture']['expected_physical_parameters']==1150899
          assert lock['controlled_change']['auxiliary_targets_used_at_inference_for_gating'] is False
          assert lock['controlled_change']['future_trajectory_used_as_input'] is False
          assert lock['training']['mechanism_loss_weight']==0.35
          assert lock['training']['trajectory_loss_weight']==0.25
          assert lock['benchmark']['development_indices']==[2016,2047]
          assert lock['benchmark']['confirmation_indices']==[2048,2079]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert len(lock['benchmark']['rescue_guard_blocks'])==4
          assert lock['training']['max_overrides_per_episode']==1
          assert lock['training']['require_zero_selected_harm'] is True
          assert lock['private_boundary']['future_branch_information_used_as_input'] is False
          assert lock['private_boundary']['inference_private_goal_use'] is False
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          PY
      - name: Train trajectory-mechanism ensemble and run locked R34 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r34:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r34-output
          python model/neural-vnext-native-r34/scripts/run_dev.py \
            --checkpoint r34-output/r34.pt \
            --manifest r34-output/r34.manifest.json \
            --dev-result r34-output/r34.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r34-output/r34.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_boundary']['inference_private_goal_use'] is False
          assert manifest['private_boundary']['trajectory_labels_are_training_only'] is True
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R34_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R34_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r34-dev
          path: |
            r34-output/r34.pt
            r34-output/r34.manifest.json
            r34-output/r34.dev.json
          if-no-files-found: error
          retention-days: 90
