name: tmp-memory-v012-historical-migration

on:
  push:
    branches:
      - codex/memory-learning-verified-admission-forgetting-v0.0.12
    paths:
      - .github/workflows/tmp-memory-v012-historical-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/memory-learning-verified-admission-forgetting-v0.0.12
          fetch-depth: 0
      - name: Migrate historical Memory/Learning authority fixtures
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          TARGETS = (
              "tests/test_memory_learning_adaptive_policy_v005.py",
              "tests/test_memory_learning_runtime_wiring_v005.py",
              "tests/test_memory_learning_reauthorization_v006.py",
              "tests/test_memory_learning_retrieval_receipt_replay_v007.py",
              "tests/test_memory_learning_compaction_target_v008.py",
              "tests/test_memory_learning_retrieval_snapshot_authority_v009.py",
              "tests/test_memory_learning_tombstone_authorization_v010.py",
          )
          HELPER_IMPORT = (
              "from tests.memory_learning_authority_helpers import "
              "admit_memory, authority_copy, forget_memory, remember_verified, verify_skill\n"
          )

          def offsets(text: str):
              lines = text.splitlines(keepends=True)
              starts = []
              total = 0
              for line in lines:
                  starts.append(total)
                  total += len(line)
              return starts

          def span(node, starts):
              return (
                  starts[node.lineno - 1] + node.col_offset,
                  starts[node.end_lineno - 1] + node.end_col_offset,
              )

          def seg(text, node):
              return ast.get_source_segment(text, node) or ast.unparse(node)

          def kwmap(call):
              return {kw.arg: kw for kw in call.keywords if kw.arg is not None}

          def one_ref_expr(node):
              if isinstance(node, (ast.Tuple, ast.List)) and len(node.elts) == 1:
                  return ast.unparse(node.elts[0])
              raise RuntimeError(f"expected exactly one historical evidence ref at line {node.lineno}: {ast.unparse(node)}")

          def call_text(name: str, positional: list[str], keywords: list[tuple[str, str]]):
              parts = list(positional) + [f"{key}={value}" for key, value in keywords]
              return f"{name}({', '.join(parts)})"

          class Migrator(ast.NodeVisitor):
              def __init__(self, text: str, starts):
                  self.text = text
                  self.starts = starts
                  self.replacements = []
                  self.function_stack = []

              def replace(self, node, value: str):
                  a, b = span(node, self.starts)
                  self.replacements.append((a, b, value))

              def visit_FunctionDef(self, node):
                  self.function_stack.append(node)
                  self.generic_visit(node)
                  self.function_stack.pop()

              visit_AsyncFunctionDef = visit_FunctionDef

              def _current_has_substrate(self):
                  if not self.function_stack:
                      return False
                  return any(isinstance(n, ast.Name) and n.id == "substrate" for n in ast.walk(self.function_stack[-1]))

              def visit_Call(self, node):
                  # Historical direct VERIFIED write -> quarantined candidate + exact authority admission.
                  if isinstance(node.func, ast.Attribute) and node.func.attr == "remember":
                      kws = kwmap(node)
                      epi = kws.get("epistemic_type")
                      evid = kws.get("evidence_ids")
                      if epi is not None and ast.unparse(epi.value).endswith("EpistemicType.VERIFIED"):
                          if evid is None:
                              raise RuntimeError(f"VERIFIED historical remember lacks evidence_ids at line {node.lineno}")
                          receiver = seg(self.text, node.func.value)
                          evidence_id = one_ref_expr(evid.value)
                          positional = [receiver] + [seg(self.text, arg) for arg in node.args]
                          keywords = [("evidence_id", evidence_id)]
                          for kw in node.keywords:
                              if kw.arg in {"epistemic_type", "evidence_ids"}:
                                  continue
                              if kw.arg is None:
                                  raise RuntimeError(f"unsupported **kwargs in historical remember at line {node.lineno}")
                              keywords.append((kw.arg, seg(self.text, kw.value)))
                          self.replace(node, call_text("remember_verified", positional, keywords))
                          return

                  # Historical first-time forgetting by string ref -> actual evidence + exact preissued lease.
                  if isinstance(node.func, ast.Attribute) and node.func.attr == "forget":
                      kws = kwmap(node)
                      if "evidence_refs" in kws and "evidence" not in kws and "authority_lease_id" not in kws:
                          if len(node.args) != 1:
                              raise RuntimeError(f"historical forget must have one memory arg at line {node.lineno}")
                          receiver = seg(self.text, node.func.value)
                          evidence_id = one_ref_expr(kws["evidence_refs"].value)
                          positional = [receiver, seg(self.text, node.args[0])]
                          keywords = []
                          for kw in node.keywords:
                              if kw.arg == "evidence_refs":
                                  continue
                              if kw.arg is None:
                                  raise RuntimeError(f"unsupported **kwargs in historical forget at line {node.lineno}")
                              keywords.append((kw.arg, seg(self.text, kw.value)))
                          keywords.append(("evidence_id", evidence_id))
                          self.replace(node, call_text("forget_memory", positional, keywords))
                          return

                  # Historical successful/negative validation fixtures use the same v0.0.12 authority path.
                  if isinstance(node.func, ast.Attribute) and node.func.attr == "validate_memory":
                      kws = kwmap(node)
                      if "evidence_refs" in kws and "evidence" not in kws and "authority_lease_id" not in kws:
                          if len(node.args) != 1:
                              raise RuntimeError(f"historical validate_memory must have one memory arg at line {node.lineno}")
                          receiver = seg(self.text, node.func.value)
                          evidence_id = one_ref_expr(kws["evidence_refs"].value)
                          positional = [receiver, seg(self.text, node.args[0])]
                          keywords = []
                          for kw in node.keywords:
                              if kw.arg in {"evidence_refs", "correction_ref"}:
                                  continue
                              if kw.arg is None:
                                  raise RuntimeError(f"unsupported **kwargs in historical validate at line {node.lineno}")
                              keywords.append((kw.arg, seg(self.text, kw.value)))
                          keywords.append(("evidence_id", evidence_id))
                          self.replace(node, call_text("admit_memory", positional, keywords))
                          return

                  # Positive skill evidence is now a governed learning operation.
                  if (
                      isinstance(node.func, ast.Attribute)
                      and node.func.attr == "verify"
                      and isinstance(node.func.value, ast.Attribute)
                      and node.func.value.attr == "skills"
                      and "authority_lease_id" not in kwmap(node)
                  ):
                      if len(node.args) < 2:
                          raise RuntimeError(f"historical skill verify shape unsupported at line {node.lineno}")
                      substrate_expr = seg(self.text, node.func.value.value)
                      positional = [substrate_expr] + [seg(self.text, arg) for arg in node.args]
                      keywords = []
                      for kw in node.keywords:
                          if kw.arg is None:
                              raise RuntimeError(f"unsupported **kwargs in historical skill verify at line {node.lineno}")
                          keywords.append((kw.arg, seg(self.text, kw.value)))
                      self.replace(node, call_text("verify_skill", positional, keywords))
                      return

                  # Direct substrate state excludes the authority ledger; migrated replay tests must inject its exact copy.
                  if (
                      isinstance(node.func, ast.Attribute)
                      and node.func.attr == "from_state"
                      and seg(self.text, node.func.value).endswith("LearningSubstrate")
                      and "learning_authority" not in kwmap(node)
                      and self._current_has_substrate()
                  ):
                      positional = [seg(self.text, arg) for arg in node.args]
                      keywords = []
                      for kw in node.keywords:
                          if kw.arg is None:
                              raise RuntimeError(f"unsupported **kwargs in LearningSubstrate.from_state at line {node.lineno}")
                          keywords.append((kw.arg, seg(self.text, kw.value)))
                      keywords.append(("learning_authority", "authority_copy(substrate)"))
                      self.replace(node, call_text(seg(self.text, node.func), positional, keywords))
                      return

                  # Preserve v2 replay envelope so this old tamper test reaches the selected/rejected-overlap invariant.
                  if (
                      isinstance(node.func, ast.Name)
                      and node.func.id == "MemoryRetrievalReceipt"
                      and self.function_stack
                      and self.function_stack[-1].name == "test_restore_rejects_retrieval_selected_rejected_overlap"
                      and "query" not in kwmap(node)
                  ):
                      positional = [seg(self.text, arg) for arg in node.args]
                      keywords = [(kw.arg, seg(self.text, kw.value)) for kw in node.keywords if kw.arg is not None]
                      keywords.append(("query", "receipt.query"))
                      self.replace(node, call_text("MemoryRetrievalReceipt", positional, keywords))
                      return

                  # Preserve v2 compaction target digest so the test still isolates self-certification laundering.
                  if (
                      isinstance(node.func, ast.Name)
                      and node.func.id == "MemoryCompactionReceipt"
                      and self.function_stack
                      and self.function_stack[-1].name == "test_restore_rejects_semantically_rehashed_self_certified_compaction"
                      and "compacted_digest" not in kwmap(node)
                  ):
                      positional = [seg(self.text, arg) for arg in node.args]
                      keywords = [(kw.arg, seg(self.text, kw.value)) for kw in node.keywords if kw.arg is not None]
                      keywords.append(("compacted_digest", "receipt.compacted_digest"))
                      self.replace(node, call_text("MemoryCompactionReceipt", positional, keywords))
                      return

                  self.generic_visit(node)

          for filename in TARGETS:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text, filename=filename)
              starts = offsets(text)
              migrator = Migrator(text, starts)
              migrator.visit(tree)
              # Prevent accidental overlapping rewrites; nested target calls would need explicit review.
              ordered = sorted(migrator.replacements)
              for (_, prev_end, _), (next_start, _, _) in zip(ordered, ordered[1:]):
                  if next_start < prev_end:
                      raise RuntimeError(f"overlapping migration rewrites in {filename}")
              for start, end, replacement in sorted(migrator.replacements, reverse=True):
                  text = text[:start] + replacement + text[end:]

              if HELPER_IMPORT.strip() not in text:
                  reparsed = ast.parse(text, filename=filename)
                  imports = [
                      node for node in reparsed.body
                      if isinstance(node, (ast.Import, ast.ImportFrom))
                  ]
                  if not imports:
                      raise RuntimeError(f"cannot locate import block in {filename}")
                  last = imports[-1].end_lineno
                  lines = text.splitlines(keepends=True)
                  lines.insert(last, HELPER_IMPORT)
                  text = "".join(lines)

              ast.parse(text, filename=filename)
              path.write_text(text, encoding="utf-8")
              print(filename, "rewrites=", len(migrator.replacements))
          PY

          python -m py_compile tests/memory_learning_authority_helpers.py \
            tests/test_memory_learning_adaptive_policy_v005.py \
            tests/test_memory_learning_runtime_wiring_v005.py \
            tests/test_memory_learning_reauthorization_v006.py \
            tests/test_memory_learning_retrieval_receipt_replay_v007.py \
            tests/test_memory_learning_compaction_target_v008.py \
            tests/test_memory_learning_retrieval_snapshot_authority_v009.py \
            tests/test_memory_learning_tombstone_authorization_v010.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/memory_learning_authority_helpers.py \
            tests/test_memory_learning_adaptive_policy_v005.py \
            tests/test_memory_learning_runtime_wiring_v005.py \
            tests/test_memory_learning_reauthorization_v006.py \
            tests/test_memory_learning_retrieval_receipt_replay_v007.py \
            tests/test_memory_learning_compaction_target_v008.py \
            tests/test_memory_learning_retrieval_snapshot_authority_v009.py \
            tests/test_memory_learning_tombstone_authorization_v010.py
          git diff --cached --check
          git commit -m "test(memory): migrate historical contracts to v0.0.12 authority"
          git push origin HEAD:codex/memory-learning-verified-admission-forgetting-v0.0.12
