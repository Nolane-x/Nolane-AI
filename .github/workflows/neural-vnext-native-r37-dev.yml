name: Neural vNext Native R37 Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r37/distributionally_robust_set_ranker_core.py'
      - 'model/neural-vnext-native-r37/distributionally_robust_set_ranker_training.py'
      - 'model/neural-vnext-native-r37/PREDEV_LOCK.json'
      - 'model/neural-vnext-native-r37/FRESH_GATE_PREREGISTRATION.json'
      - 'model/neural-vnext-native-r37/scripts/**'
      - 'model/neural-vnext-native-r37/tests/**'
      - '.github/workflows/neural-vnext-native-r37-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r37-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r37-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R37 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r37:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r37/*.py model/neural-vnext-native-r37/scripts/*.py model/neural-vnext-native-r37/tests/*.py
          python -m pytest -q model/neural-vnext-native-r37/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r37/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r37/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['candidate']=='Neural-vNext-Native-R37-DecisionSetRanker'
          assert lock['architecture']['pair_feature_dim']==774
          assert lock['architecture']['explicit_keep_r11_null_option'] is True
          assert lock['architecture']['expected_goal_successor_parameters']==107799
          assert lock['architecture']['expected_set_successor_parameters']==275730
          assert lock['architecture']['expected_successor_parameters']==383529
          assert lock['architecture']['expected_physical_parameters']==1261071
          assert lock['decision_target']['runtime_uses_full_alternative_set'] is True
          assert lock['decision_target']['permutation_equivariant'] is True
          assert lock['training']['listwise_loss_weight']==1.0
          assert lock['training']['harm_mass_weight']==0.75
          assert lock['training']['stratum_count']==8
          assert lock['training']['group_dro_eta']==0.15
          assert lock['training']['rescue_group_listwise_multiplier']==3.0
          assert lock['distributional_training']['selector_unchanged_from_r36'] is True
          assert lock['benchmark']['development_indices']==[2144,2175]
          assert lock['benchmark']['confirmation_indices']==[2176,2207]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert len(lock['benchmark']['rescue_guard_blocks'])==4
          assert lock['training']['require_zero_selected_harm'] is True
          assert lock['private_boundary']['future_branch_information_used_as_inference_input'] is False
          assert lock['private_boundary']['inference_private_goal_use'] is False
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          PY
      - name: Train decision-set ranker and run locked R37 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r37:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r37-output
          python model/neural-vnext-native-r37/scripts/run_dev.py \
            --checkpoint r37-output/r37.pt \
            --manifest r37-output/r37.manifest.json \
            --dev-result r37-output/r37.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r37-output/r37.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_boundary']['inference_private_goal_use'] is False
          assert manifest['private_boundary']['runtime_uses_full_alternative_set'] is True
          assert manifest['private_boundary']['training_identity_strata_not_used_at_inference'] is True
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R37_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R37_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r37-dev
          path: |
            r37-output/r37.pt
            r37-output/r37.manifest.json
            r37-output/r37.dev.json
          if-no-files-found: error
          retention-days: 90
