name: R2.66 Canonical Gate

on:
  push:
    branches: [r266-learned-contextual-composition-gpt56sol]
    paths:
      - 'R2_66_*.json'
      - 'cogcoder/r266_*.py'
      - 'cogcoder/_r266_*.py'
      - 'tests/test_r266_*.py'
      - 'benchmarks/kfigg/r266_*.py'
      - 'research/r266_*.py'
      - '.github/workflows/r266-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'R2_66_*.json'
      - 'cogcoder/r266_*.py'
      - 'cogcoder/_r266_*.py'
      - 'tests/test_r266_*.py'
      - 'benchmarks/kfigg/r266_*.py'
      - 'research/r266_*.py'
      - '.github/workflows/r266-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  frozen-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify frozen source boundary when lock exists
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock_path = Path('R2_66_PRE_HOSTED_LOCK.json')
          if not lock_path.exists():
              raise SystemExit('R2.66 lock not frozen yet')
          lock = json.loads(lock_path.read_text())
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R266_SOURCE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Accepted R2.65 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: R2.66 focused
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  canonical-full-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies and pinned external oracle
        run: |
          python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
          python -m pip install 'git+https://github.com/WarrenWeckesser/ufunclab.git@f1fbe6769850823a1976ccc28d14cd966130b645'
      - name: Verify exact parent and frozen source
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_66_PRE_HOSTED_LOCK.json').read_text())
          assert os.environ['EXPECTED_BASE_SHA'] == lock['parent_release_commit'], (os.environ['EXPECTED_BASE_SHA'], lock['parent_release_commit'])
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R266_PARENT_AND_SOURCE_LOCK_OK', lock['parent_release_commit'], len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and pinned external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import ufunclab
          from benchmarks.kfigg.r266_learned_contextual_composition import run_benchmark
          from research.r266_external_contextual_transfer import run_external_transfer
          phase = run_benchmark()
          external = run_external_transfer(
              ufunclab.step,
              source_id='WarrenWeckesser/ufunclab:ufunclab.step',
              source_commit='f1fbe6769850823a1976ccc28d14cd966130b645',
          )
          assert phase == json.loads(Path('R2_66_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_66_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R266_EXACT_EVIDENCE_OK')
          PY
      - name: Run R2.66 and accepted R2.65 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
      - name: Run protected R2.64 through R2.60 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
      - name: Run protected R2.59 through R2.50 lineage
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
      - name: Run protected R2.49 through R2.41 lineage
        run: PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py

  publish-full-gate:
    if: github.event_name == 'pull_request'
    needs: [frozen-focused, cross-python, canonical-full-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r266/full-gate',
              'description':'R2.66 frozen evidence, cross-Python and protected R2.65-R2.41 lineage passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R266_FULL_GATE_STATUS_PUBLISHED')
          PY
