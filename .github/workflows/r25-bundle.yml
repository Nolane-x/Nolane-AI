name: R2.5 Bundle
on:
  push:
    paths:
      - '.github/workflows/r25-bundle.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r25-bundle
          include-hidden-files: true
          path: |
            cogcoder
            scripts
            tests
            docs
            research
            .github/workflows
            .gitmodules
            .gitattributes
            README.md
            archive/root-history/historical_checkpoint_pointer/CHECKPOINT_MANIFEST.json
            archive/root-history/legacy_weight_pointer/CURRENT_ONE_WEIGHT_R2_0I.json
            RELEASE_MANIFEST_R2_0I.json
            archive/root-history/historical_r_series/R2_4_DELIVERY.md
