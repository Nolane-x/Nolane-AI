name: R2.65 Post-Fix Fairness Challenger

on:
  push:
    branches: [validation-r265-postfix-fairness-gpt56sol]
    paths:
      - 'tests/test_r265_postfix_fairness_challenger.py'
      - '.github/workflows/r265-postfix-fairness-challenger.yml'
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run independent fairness challenger only
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_postfix_fairness_challenger.py
      - name: Re-run frozen R2.65 contract/fairness surface
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r265_patchmacro_field_contract.py \
            tests/test_r265_hypothesis_budget_fairness.py \
            tests/test_r265_verified_patch_primitive_induction.py
