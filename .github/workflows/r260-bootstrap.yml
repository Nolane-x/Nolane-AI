name: R2.60 Bootstrap Exact Core
on:
  push:
    branches: [r260-complementary-experiment-program-gpt56sol]
    paths:
      - '.r260-bootstrap/**'
      - '.github/workflows/r260-bootstrap.yml'
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact R2.60 core
        shell: bash
        run: |
          set -euo pipefail
          cat .r260-bootstrap/core.part.* | base64 -d > cogcoder/r260_complementary_experiment_program.py
          test "$(git hash-object cogcoder/r260_complementary_experiment_program.py)" = "01e7953f42a858ac94052337b66834a30550d545"
          test "$(sha256sum cogcoder/r260_complementary_experiment_program.py | cut -d' ' -f1)" = "334384782e1ef8eca3fbf31a5e22c452864810867c340e668696c7219f834e93"
      - name: Commit reconstructed core to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r260_complementary_experiment_program.py
          git commit -m 'bootstrap: reconstruct exact R2.60 core'
          git push origin HEAD:${GITHUB_REF_NAME}
