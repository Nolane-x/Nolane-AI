name: Memory v0.0.12 Transactionality Staging

on:
  push:
    branches:
      - codex/memory-learning-verified-admission-forgetting-v0.0.12

permissions:
  contents: write

concurrency:
  group: memory-v012-transactionality-staging
  cancel-in-progress: true

jobs:
  patch-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Apply transactionality patch
        run: |
          python scripts/patch_memory_v012_transactionality.py
          python -m py_compile nolane/memory/learning_substrate.py
      - name: Prove focused GREEN
        run: |
          python -m pytest -q \
            tests/test_memory_learning_verified_admission_forgetting_v012.py \
            tests/test_memory_learning_lease_transactionality_v012.py
      - name: Commit verified production patch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nolane/memory/learning_substrate.py
          git commit -m 'fix(B): preserve verification lease on rejected activation'
          git push origin HEAD:codex/memory-learning-verified-admission-forgetting-v0.0.12
