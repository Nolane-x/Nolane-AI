name: Neural vNext Native R29 Dev

on:
  push:
    branches:
      - codex/neural-native-r29-certified-rescue-geometry
    paths:
      - 'model/neural-vnext-native-r29/**'
      - '.github/workflows/neural-vnext-native-r29-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r29/**'
      - '.github/workflows/neural-vnext-native-r29-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r29-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r29-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R29 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r29:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r29/*.py model/neural-vnext-native-r29/scripts/*.py model/neural-vnext-native-r29/tests/*.py
          python -m pytest -q model/neural-vnext-native-r29/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r29/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r29/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['candidate']=='Neural-vNext-Native-R29-CertifiedRescueGeometry'
          assert lock['architecture']['rescue_feature_dim']==238
          assert lock['architecture']['expected_goal_successor_parameters']==107799
          assert lock['architecture']['expected_rescue_successor_parameters']==59721
          assert lock['architecture']['expected_successor_parameters']==167520
          assert lock['architecture']['expected_physical_parameters']==1045062
          assert lock['benchmark']['development_indices']==[1696,1727]
          assert lock['benchmark']['confirmation_indices']==[1728,1759]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert len(lock['benchmark']['rescue_guard_blocks'])==4
          assert lock['training']['max_overrides_per_episode']==1
          assert lock['training']['require_zero_predicted_harm'] is True
          assert lock['private_boundary']['inference_private_goal_use'] is False
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          PY
      - name: Train certified rescue geometry and run locked R29 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r29:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r29-output
          python model/neural-vnext-native-r29/scripts/run_dev.py \
            --checkpoint r29-output/r29.pt \
            --manifest r29-output/r29.manifest.json \
            --dev-result r29-output/r29.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r29-output/r29.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_boundary']['inference_private_goal_use'] is False
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R29_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R29_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r29-dev
          path: |
            r29-output/r29.pt
            r29-output/r29.manifest.json
            r29-output/r29.dev.json
          if-no-files-found: error
          retention-days: 90
