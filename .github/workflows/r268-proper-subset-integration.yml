name: R2.68 Proper-Subset Integration

on:
  push:
    branches: [integrate-r268-proper-subset-authority-gpt56sol]
  pull_request:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted parent safety
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply guarded authority patch
        run: python scripts/r268_apply_proper_subset_authority.py
      - name: Compile patched authority
        run: python -m py_compile cogcoder/_r268_proof.py cogcoder/_r268_runtime.py
      - name: Proper-subset contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_proper_subset_authority.py tests/test_r268_proper_subset_authority_integration.py
      - name: Full current R2.68 suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: External determinant transfer
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_external_transfer.py
      - name: Accepted parent safety after patch
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Materialize runtime after GREEN
        if: matrix.python-version == '3.11' && github.event_name == 'push'
        shell: bash
        run: |
          git diff --check
          git config user.name 'Nolane R2.68 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add cogcoder/_r268_runtime.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: integrate R2.68 proper-subset proof authority'
          git push origin HEAD:integrate-r268-proper-subset-authority-gpt56sol
