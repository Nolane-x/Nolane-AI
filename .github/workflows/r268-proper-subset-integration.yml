name: R2.68 Proper-Subset Authority

on:
  push:
    branches: [integrate-r268-proper-subset-authority-gpt56sol, r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'cogcoder/_r268_proof.py'
      - 'cogcoder/_r268_runtime.py'
      - 'benchmarks/kfigg/r268_adaptive_causal_basis.py'
      - 'tests/test_r268_benchmark.py'
      - 'tests/test_r268_proper_subset_authority.py'
      - 'tests/test_r268_proper_subset_authority_integration.py'
      - '.github/workflows/r268-proper-subset-integration.yml'
  pull_request:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted parent safety
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Compile materialized authority
        run: python -m py_compile cogcoder/_r268_proof.py cogcoder/_r268_runtime.py
      - name: Proper-subset contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_proper_subset_authority.py tests/test_r268_proper_subset_authority_integration.py
      - name: Full current R2.68 suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: External determinant transfer
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_external_transfer.py
      - name: Accepted parent safety after authority verification
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
