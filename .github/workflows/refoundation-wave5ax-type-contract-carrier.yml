name: Refoundation Wave 5AX Type Contract Carrier

on:
  push:
    branches:
      - refoundation-wave5ax-native-capability-acquisition
    paths:
      - .github/workflows/refoundation-wave5ax-type-contract-carrier.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation-wave5ax-native-capability-acquisition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pytest
      - name: Replace the one stale public annotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/external_core/capability_acquisition.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def promote(\n        self,\n        candidate_id: str,\n        *,\n        assurance: PromotionReceiptStore,\n        receipt: PromotionAssuranceReceipt,\n    ) -> CapabilityRecord:\n'''
          new = '''    def promote(\n        self,\n        candidate_id: str,\n        *,\n        assurance: AssuranceControlPlane,\n        receipt: PromotionAssuranceReceipt,\n    ) -> CapabilityRecord:\n'''
          if old not in text:
              raise SystemExit('exact stale promote signature not found')
          if text.count(old) != 1:
              raise SystemExit('stale promote signature is not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify focused Wave 5AX contracts
        run: >-
          python -m pytest -q
          tests/test_refoundation_wave5ax_capability_acquisition_hardening.py
          tests/test_refoundation_wave5ax_native_capability_acquisition.py
      - name: Verify full Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Verify repository projections
        run: python -m nolane.repository.audit --check
      - name: Commit exact fix and remove carrier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refoundation-wave5ax-type-contract-carrier.yml
          git add nolane/external_core/capability_acquisition.py
          git commit -m 'fix(refoundation): expose native Assurance promotion contract'
          git push origin HEAD:refoundation-wave5ax-native-capability-acquisition
