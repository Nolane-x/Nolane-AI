name: R2.69 Static Sentinel Hotfix

on:
  push:
    branches: [r269-autonomous-transfer-meta-learning-kernel-gpt56sol]
    paths:
      - '.github/workflows/r269-static-sentinel-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r269-static-sentinel-hotfix
  cancel-in-progress: false

jobs:
  red-green-materialize:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r269-autonomous-transfer-meta-learning-kernel-gpt56sol
          fetch-depth: 0
      - name: Refuse stale hotfix writer
        run: |
          set -euo pipefail
          git fetch origin r269-autonomous-transfer-meta-learning-kernel-gpt56sol
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/r269-autonomous-transfer-meta-learning-kernel-gpt56sol)" = "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Apply minimal static-sentinel and retired-writer contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('cogcoder/r269_transfer_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          old = """        scratch = _filter(scratch, semantic, row.observed)\n\n    selected: _Hypothesis | None = None\n"""
          new = """        # The shallow scratch sentinel is a static information-floor reference,\n        # not posterior or selection authority. Filtering it by target evidence\n        # can collapse the floor after one query and incorrectly block further\n        # transfer adjudication. Only materialized scratch is evidence-filtered.\n        if scratch_materialized:\n            scratch = _filter(scratch, semantic, row.observed)\n\n    selected: _Hypothesis | None = None\n"""
          if text.count(old) != 1:
              raise SystemExit('runtime sentinel-filter boundary drifted')
          runtime.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_r269_release_authority_closure.py')
          text = test_path.read_text(encoding='utf-8')
          old = """def test_evidence_writers_do_not_mistake_untracked_receipts_for_already_materialized():\n    writers = {\n        '.github/workflows/r269-red-green.yml': 'R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json',\n        '.github/workflows/r269-external-numpy-transfer.yml': 'R2_69_EXTERNAL_TRANSFER.json',\n        '.github/workflows/r269-promotion-authority.yml': 'R2_69_PROMOTION_AUTHORITY.json',\n    }\n    for path, receipt in writers.items():\n        workflow = _text(path)\n        unsafe = f'git diff --quiet -- {receipt}'\n        assert unsafe not in workflow, (path, 'git diff ignores untracked receipt files')\n        assert f'git status --porcelain -- {receipt}' in workflow, (\n            path,\n            'writer must inspect tracked and untracked receipt materialization',\n        )\n"""
          new = """def test_active_evidence_writers_do_not_mistake_untracked_receipts_for_already_materialized():\n    writers = {\n        '.github/workflows/r269-red-green.yml': 'R2_69_SEQUENTIAL_INTEGRATION_EVIDENCE.json',\n        '.github/workflows/r269-external-numpy-transfer.yml': 'R2_69_EXTERNAL_TRANSFER.json',\n    }\n    for path, receipt in writers.items():\n        workflow = _text(path)\n        unsafe = f'git diff --quiet -- {receipt}'\n        assert unsafe not in workflow, (path, 'git diff ignores untracked receipt files')\n        assert f'git status --porcelain -- {receipt}' in workflow, (\n            path,\n            'active writer must inspect tracked and untracked receipt materialization',\n        )\n\n\ndef test_retired_promotion_workflow_is_verification_only_and_cannot_rewrite_receipt():\n    workflow = _text('.github/workflows/r269-promotion-authority.yml')\n    assert 'contents: write' not in workflow\n    assert 'git push origin' not in workflow\n    assert "git add R2_69_PROMOTION_AUTHORITY.json" not in workflow\n    assert 'Writer retired' in workflow\n"""
          if text.count(old) != 1:
              raise SystemExit('authority writer contract boundary drifted')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused regression GREEN
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r269_multi_prior_adjudication.py::test_multiple_compatible_priors_are_adjudicated_by_target_evidence_not_preselected_score \
            tests/test_r269_multi_prior_adjudication.py::test_multi_prior_adjudication_is_insertion_order_invariant \
            tests/test_r269_transfer_governor.py::test_successful_transfer_defers_full_scratch_materialization_and_reduces_total_search_work \
            tests/test_r269_release_authority_closure.py
      - name: Full R2.69 GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
      - name: Materialize exact verified fix and retire hotfix writer
        run: |
          set -euo pipefail
          git fetch origin r269-autonomous-transfer-meta-learning-kernel-gpt56sol
          test "$(git rev-parse origin/r269-autonomous-transfer-meta-learning-kernel-gpt56sol)" = "$GITHUB_SHA"
          git rm .github/workflows/r269-static-sentinel-hotfix.yml
          git add cogcoder/r269_transfer_runtime.py tests/test_r269_release_authority_closure.py
          git config user.name 'Nolane R2.69 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(r269): keep scratch information sentinel static'
          git push origin HEAD:r269-autonomous-transfer-meta-learning-kernel-gpt56sol
