name: R2.67.1 Core Patch Experiment

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'scripts/r267_1_apply_genuine_necessity_core.py'
      - 'tests/test_r267_1_correctness_hotfix.py'
      - '.github/workflows/r267-1-core-patch-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 before mutation
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Apply guarded R2.67.1 production patch in runner only
        run: python scripts/r267_1_apply_genuine_necessity_core.py
      - name: Compile patched production
        run: python -m py_compile cogcoder/r267_three_probe_causal_composition.py
      - name: R2.67.1 correctness contracts after patch
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_1_correctness_hotfix.py
      - name: Preserve R2.67 fail-closed and authority regressions where semantically compatible
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r267_ablation_search_completeness.py \
            tests/test_r267_independent_authority_boundaries.py \
            tests/test_r267_oracle_accounting.py \
            tests/test_r267_terminal_probe_evidence.py
