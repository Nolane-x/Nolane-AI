name: R2.67.1 Core Verification

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'scripts/r267_1_apply_genuine_necessity_core.py'
      - 'scripts/r267_1_apply_certified_ablation_authority.py'
      - 'tests/test_r267_1_correctness_hotfix.py'
      - 'tests/test_r267_1_no_collision_failclosed.py'
      - 'tests/test_r267_1_authority_boundaries.py'
      - 'tests/test_r267_1_partial_probe_receipt_accounting.py'
      - 'tests/test_r267_1_preselection_receipt_units.py'
      - '.github/workflows/r267-1-core-patch-experiment.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'scripts/r267_1_apply_genuine_necessity_core.py'
      - 'scripts/r267_1_apply_certified_ablation_authority.py'
      - 'tests/test_r267_1_correctness_hotfix.py'
      - 'tests/test_r267_1_no_collision_failclosed.py'
      - 'tests/test_r267_1_authority_boundaries.py'
      - 'tests/test_r267_1_partial_probe_receipt_accounting.py'
      - 'tests/test_r267_1_preselection_receipt_units.py'
      - '.github/workflows/r267-1-core-patch-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Require materialized R2.67.1 authority correction
        run: |
          grep -q "def _examples_have_target_collision" cogcoder/r267_three_probe_causal_composition.py
          python -m py_compile cogcoder/r267_three_probe_causal_composition.py
      - name: R2.67.1 correctness and authority contracts
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_r267_1_correctness_hotfix.py \
            tests/test_r267_1_no_collision_failclosed.py \
            tests/test_r267_1_authority_boundaries.py \
            tests/test_r267_1_partial_probe_receipt_accounting.py \
            tests/test_r267_1_preselection_receipt_units.py
      - name: Preserve semantically compatible historical fail-closed regression
        run: PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
