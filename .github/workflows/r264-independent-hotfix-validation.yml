name: R2.64 Independent Frontier Hotfix Validation

on:
  push:
    branches: [validation-r264-frontier-hotfix-gpt56sol]
    paths:
      - 'tests/test_r264_independent_frontier_hotfix_validation.py'
      - '.github/workflows/r264-independent-hotfix-validation.yml'
  pull_request:
    branches: [r264-frontier-fairness-hotfix-gpt56sol]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run independent fairness and fallback falsifiers
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_independent_frontier_hotfix_validation.py
      - name: Run peer hotfix contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_frontier_fairness.py
      - name: Publish independent validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r264/independent-frontier-hotfix','description':'Independent live-first, fallback and hard-budget validation passed','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_r264_independent_frontier_hotfix_validation.py
