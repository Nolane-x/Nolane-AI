name: R2.64 Unified Adaptive Repository Search

on:
  push:
    branches: [r264-unified-adaptive-repository-search-gpt56sol]
    paths:
      - 'cogcoder/r264_*.py'
      - 'tests/test_r264_*.py'
      - 'benchmarks/kfigg/r264_*.py'
      - 'research/r264_*.py'
      - 'archive/root-history/historical_r_series/R2_64_*.json'
      - '.github/workflows/r264-unified-adaptive-repository-search.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r264_*.py'
      - 'tests/test_r264_*.py'
      - 'benchmarks/kfigg/r264_*.py'
      - 'research/r264_*.py'
      - 'archive/root-history/historical_r_series/R2_64_*.json'
      - '.github/workflows/r264-unified-adaptive-repository-search.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Verify frozen R2.64 source blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_64_PRE_HOSTED_LOCK.json').read_text())
          assert lock['parent_release_commit'] == '1d1b05e0c1476327eaf3b2457aab16153a43c429'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R264_SOURCE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Verify accepted R2.63 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
      - name: Run R2.64 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py

  phase-a:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Verify source lock and exact Phase-A
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from benchmarks.kfigg.r264_unified_adaptive_repository_search import run_benchmark
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_64_PRE_HOSTED_LOCK.json').read_text())
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          result=run_benchmark()
          expected=json.loads(Path('archive/root-history/historical_r_series/R2_64_PHASE_A_RESULT.json').read_text())
          assert result == expected, (result, expected)
          assert result['all_gates_pass'] is True
          Path('R2_64_PHASE_A_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print('R264_PHASE_A_EXACT_OK')
          print(json.dumps(result['summary'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.64-phase-a
          path: R2_64_PHASE_A_RECOMPUTED.json

  external-numpy-square:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned external oracle dependency
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify source lock and exact external transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          import numpy as np
          from research.r264_external_unified_transfer import run_external_transfer
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_64_PRE_HOSTED_LOCK.json').read_text())
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          result=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          expected=json.loads(Path('archive/root-history/historical_r_series/R2_64_EXTERNAL_TRANSFER.json').read_text())
          assert result == expected, (result, expected)
          assert result['passed'] is True
          assert result['source_version'] == '2.4.6'
          assert result['verification_exact'] == result['verification_cases'] == 46
          Path('R2_64_EXTERNAL_TRANSFER_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print('R264_EXTERNAL_EXACT_OK')
          print(json.dumps({'source_version': result['source_version'], 'verification_cases': result['verification_cases'], 'total_external_oracle_calls': result['total_external_oracle_calls'], 'r263_reason': result['r263_baseline']['reason'], 'r264_reason': result['r264']['reason']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.64-numpy-square-external
          path: R2_64_EXTERNAL_TRANSFER_RECOMPUTED.json

  cross-python:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run R2.64 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py

  canonical-full-gate:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/')) && (github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify canonical accepted R2.63 parent and frozen R2.64 blobs
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_64_PRE_HOSTED_LOCK.json').read_text())
          assert os.environ['EXPECTED_BASE_SHA'] == lock['parent_release_commit'], (os.environ['EXPECTED_BASE_SHA'], lock['parent_release_commit'])
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R264_PARENT_AND_SOURCE_LOCK_OK', lock['parent_release_commit'])
          PY
      - name: Recompute exact R2.64 authored and external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r264_unified_adaptive_repository_search import run_benchmark
          from research.r264_external_unified_transfer import run_external_transfer
          phase=run_benchmark()
          external=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          assert phase == json.loads(Path('archive/root-history/historical_r_series/R2_64_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('archive/root-history/historical_r_series/R2_64_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          print('R264_EXACT_EVIDENCE_OK')
          PY
      - name: Run R2.64 focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: Run accepted R2.63 and R2.62 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
      - name: Run accepted R2.61 and R2.60 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
      - name: Run R2.59 through R2.55 parents
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
      - name: Run R2.54 through R2.50 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
      - name: Run R2.49 through R2.41 parents
        run: PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py

  publish-full-gate:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/')) && (github.event_name == 'pull_request') }}
    needs: [focused, phase-a, external-numpy-square, cross-python, canonical-full-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Publish canonical success status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r264/full-gate',
              'description':'R2.64 exact evidence, cross-Python and accepted R2.63-R2.41 lineage passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R264_FULL_GATE_STATUS_PUBLISHED')
          PY
