name: R2.65 Clean General Singleton Fix

on:
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - '.github/workflows/r265-general-singleton-misspec-clean.yml'
      - 'cogcoder/r265_verified_patch_primitive_induction.py'
      - 'tests/test_r265_singleton_out_of_space_induction.py'
      - 'tests/test_r265_post_selection_singleton_misspec.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependency
        run: python -m pip install pytest
      - name: Verify accepted R2.64 parent contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: Verify every R2.65 focused contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
