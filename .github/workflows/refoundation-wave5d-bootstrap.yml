name: Refoundation Wave 5D Memory Lifecycle Bootstrap

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5c-native-memory-fabric
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5d-native-memory-lifecycle' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply deterministic Wave 5D authority cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement anchor, found {text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def remove_once(path: str, old: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one removal anchor, found {text.count(old)}')
              target.write_text(text.replace(old, '', 1), encoding='utf-8')

          # Retire only the lifecycle facade; retrieval remains active.
          remove_once(
              'cogcoder/refoundation/facades.py',
              '        FacadeBinding("external.memory.lifecycle", "nolane.memory.lifecycle", "cogcoder.organization.memory_lifecycle", ("MemoryLifecycleLedger", "MemoryRelationGraph")),\n',
          )

          # Record canonical native lifecycle authority with historical provenance.
          impl = Path('cogcoder/refoundation/implementation_status.py')
          text = impl.read_text(encoding='utf-8')
          lifecycle_block = '''    "external.memory.lifecycle": (\n        "nolane.memory.lifecycle",\n        ("cogcoder/organization/memory_lifecycle.py",),\n        "Native governed memory lifecycle receipts and semantic relation graph with canonical Memory/Identity/Event dependencies; historical lifecycle module bridges all public object identities.",\n    ),\n'''
          if lifecycle_block not in text:
              anchor = '''    "external.memory.fabric": (\n        "nolane.memory.fabric",\n        ("cogcoder/organization/memory.py", "cogcoder/organization/types.py"),\n        "Native scoped memory schema and fabric with preserved visibility, promotion, lifecycle-status mutation and state round-trip; historical memory/types surfaces bridge to canonical authority.",\n    ),\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('implementation_status.py: memory fabric native anchor not unique')
              text = text.replace(anchor, anchor + lifecycle_block, 1)
              impl.write_text(text, encoding='utf-8')

          # Preserve pinned-tree migration provenance after facade retirement.
          replace_once(
              'cogcoder/refoundation/inventory.py',
              '    "cogcoder/organization/memory.py": "nolane/memory/fabric.py",\n',
              '    "cogcoder/organization/memory.py": "nolane/memory/fabric.py",\n    "cogcoder/organization/memory_lifecycle.py": "nolane/memory/lifecycle.py",\n',
          )

          # Cross-wave accepted revision set advances lifecycle only.
          versions = Path('tests/test_refoundation_component_versions.py')
          text = versions.read_text(encoding='utf-8')
          marker = '    "external.memory.lifecycle",\n'
          if marker not in text.split('}', 1)[0]:
              anchor = '    "external.memory.fabric",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('component-version test: memory fabric set anchor not unique')
              text = text.replace(anchor, anchor + marker, 1)
          text = text.replace(
              '    assert str(component_version("external.memory.lifecycle")) == "0.0.0"\n',
              '    assert str(component_version("external.memory.retrieval")) == "0.0.0"\n',
          )
          text = text.replace(
              '    assert str(next_component_version("external.memory.lifecycle")) == "0.0.1"\n',
              '    assert str(next_component_version("external.memory.retrieval")) == "0.0.1"\n',
          )
          versions.write_text(text, encoding='utf-8')

          # Canonical-native authority set advances lifecycle; retrieval remains the adjacent facade oracle.
          status = Path('tests/test_refoundation_implementation_status.py')
          text = status.read_text(encoding='utf-8')
          marker = '    "external.memory.lifecycle",\n'
          if marker not in text.split('}', 1)[0]:
              anchor = '    "external.memory.fabric",\n'
              if text.count(anchor) != 1:
                  raise SystemExit('implementation-status test: memory fabric set anchor not unique')
              text = text.replace(anchor, anchor + marker, 1)
          text = text.replace(
              '    assert ledger["external.memory.lifecycle"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
              '    assert ledger["external.memory.retrieval"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
          )
          status.write_text(text, encoding='utf-8')

          replace_once(
              'tests/test_refoundation_memory_public_layout.py',
              '        lifecycle: ("external.memory.lifecycle", "0.0.0"),\n',
              '        lifecycle: ("external.memory.lifecycle", "0.0.1"),\n',
          )

          # Wave 5C keeps asserting what Wave 5C established, without freezing later debt progress.
          wave5c = Path('tests/test_refoundation_wave5c_native_memory_fabric.py')
          text = wave5c.read_text(encoding='utf-8')
          text = text.replace('    assert "external.memory.lifecycle" in facade_ids\n', '')
          text = text.replace('    assert len(non_native) == 42\n', '    assert len(non_native) <= 42\n')
          old_counts = '''    assert counts == {\n        "compatibility_facade": 30,\n        "frozen_asset": 1,\n        "historical_only": 7,\n        "legacy_internal": 4,\n    }\n'''
          new_counts = '''    assert ledger["external.memory.fabric"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert all(row.component_id != "external.memory.fabric" for row in non_native)\n'''
          if old_counts in text:
              text = text.replace(old_counts, new_counts, 1)
          elif new_counts not in text:
              raise SystemExit('Wave 5C debt invariant block is neither old nor updated')
          text = text.replace(
              '    assert ledger["external.memory.lifecycle"].status is ImplementationStatus.COMPATIBILITY_FACADE\n',
              '',
          )
          wave5c.write_text(text, encoding='utf-8')
          PY
      - name: Materialize native-debt projections
        run: python -m nolane.repository.audit --write
      - name: Prove historical archive index did not drift
        run: git diff --exit-code -- archive/INDEX.json
      - name: Verify Wave 5D targeted contracts
        run: |
          python -m nolane.repository.audit --check
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_git_inventory.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5c_native_memory_fabric.py \
            tests/test_refoundation_wave5d_native_memory_lifecycle.py
      - name: Commit deterministic Wave 5D cutover
        shell: bash
        run: |
          git add \
            cogcoder/refoundation/facades.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/inventory.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5c_native_memory_fabric.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md
          if git diff --cached --quiet; then
            echo 'No Wave 5D cutover changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(refoundation): cut over native memory lifecycle authority'
          git push origin HEAD:${GITHUB_HEAD_REF}
