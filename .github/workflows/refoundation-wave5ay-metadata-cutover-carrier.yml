name: Refoundation Wave 5AY metadata cutover carrier

on:
  push:
    branches:
      - refoundation-wave5ay-native-transfer-meta
    paths:
      - .github/workflows/refoundation-wave5ay-metadata-cutover-carrier.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refoundation-wave5ay-metadata-cutover-carrier.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refoundation-wave5ay-native-transfer-meta
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Cut over transfer meta authority and canonical projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          versions = Path('cogcoder/refoundation/component_versions.py')
          replace_once(
              versions,
              '        "external.capability_acquisition": 1,\n        "external.experimentation": 1,\n',
              '        "external.capability_acquisition": 1,\n        "external.transfer_meta": 1,\n        "external.experimentation": 1,\n',
              'component_versions transfer insertion',
          )

          status_py = Path('cogcoder/refoundation/implementation_status.py')
          text = status_py.read_text(encoding='utf-8')
          native_row = '''    "external.transfer_meta": (\n        "nolane.external_core.transfer_meta",\n        (\n            "cogcoder/r269_causal_basis_adapter.py",\n            "cogcoder/r269_experience_compiler.py",\n            "cogcoder/r269_transfer_runtime.py",\n        ),\n        "Native Wave 5AY transfer/reuse authority over canonical Experience, optional accepted Causal support and Assurance: verified successful experience is compiled into an identity-free portable payload with a separate exact source-authority receipt; adaptation is deterministic and destination-bound; accepted reuse requires the exact persisted native Assurance receipt; negative transfer quarantines/revokes reuse; restore re-derives source authority from native ledgers and fails closed on same-ID source drift. R2.69 transfer runtime is provenance only for cross-domain transfer/adaptation and negative-transfer reuse semantics; cold-scratch search, meta-credit learning, multi-prior policy optimization, candidate synthesis and historical promotion authority remain outside this ownership boundary.",\n    ),\n'''
          anchor = '    "external.causal": (\n'
          if native_row not in text:
              if anchor not in text:
                  raise SystemExit('implementation_status native insertion anchor missing')
              text = text.replace(anchor, native_row + anchor, 1)
          historical = '    "external.transfer_meta": ("historical transfer/meta-learning mechanisms; extraction not yet accepted",),\n'
          if historical in text:
              text = text.replace(historical, '', 1)
          if '"external.transfer_meta": (' not in text or '"nolane.external_core.transfer_meta"' not in text:
              raise SystemExit('implementation_status transfer authority cutover missing')
          status_py.write_text(text, encoding='utf-8')

          versions_test = Path('tests/test_refoundation_component_versions.py')
          replace_once(
              versions_test,
              '    "external.capability_acquisition": 1,\n    "external.causal": 1,\n',
              '    "external.capability_acquisition": 1,\n    "external.transfer_meta": 1,\n    "external.causal": 1,\n',
              'component version contract transfer insertion',
          )

          status_test = Path('tests/test_refoundation_implementation_status.py')
          text = status_test.read_text(encoding='utf-8')
          pair = '        "external.capability_acquisition",\n        "external.causal",\n'
          replacement = '        "external.capability_acquisition",\n        "external.transfer_meta",\n        "external.causal",\n'
          count = text.count(pair)
          if count:
              if count != 2:
                  raise SystemExit(f'implementation status accepted/writer anchors: expected 2, found {count}')
              text = text.replace(pair, replacement)
          accepted_pair = '    "external.capability_acquisition",\n    "external.causal",\n'
          accepted_replacement = '    "external.capability_acquisition",\n    "external.transfer_meta",\n    "external.causal",\n'
          if accepted_replacement not in text:
              if text.count(accepted_pair) != 1:
                  raise SystemExit('implementation status accepted-set anchor missing')
              text = text.replace(accepted_pair, accepted_replacement, 1)
          old_historical_test = '''def test_unextracted_cognitive_components_are_not_falsely_marked_canonical() -> None:\n    ledger = build_component_implementation_ledger()\n    for component_id in (\n        "external.transfer_meta",\n    ):\n        assert ledger[component_id].status is ImplementationStatus.HISTORICAL_ONLY\n        assert not ledger[component_id].canonical_write_authority\n'''
          new_historical_test = '''def test_historical_only_component_debt_is_empty_after_wave5ay_cutover() -> None:\n    ledger = build_component_implementation_ledger()\n    historical = {\n        component_id\n        for component_id, row in ledger.items()\n        if row.status is ImplementationStatus.HISTORICAL_ONLY\n    }\n    assert historical == set()\n'''
          if new_historical_test not in text:
              if old_historical_test not in text:
                  raise SystemExit('historical-only contract replacement anchor missing')
              text = text.replace(old_historical_test, new_historical_test, 1)
          status_test.write_text(text, encoding='utf-8')

          status = Path('CURRENT/STATUS.md')
          text = status.read_text(encoding='utf-8')
          section = '''\n## Wave 5AY — Native transfer/meta authority\n\nWave 5AY migrates `external.transfer_meta` from the R2.69 autonomous transfer/meta-learning lineage into `nolane.external_core.transfer_meta` at component version `0.0.1`. The native boundary owns verified portable-experience compilation from exact canonical Experience/Attribution/evidence state, optional accepted Causal-program binding, deterministic destination adaptation, exact persisted Assurance-gated acceptance, negative-transfer quarantine/revocation and fail-closed state restoration that re-derives source authority from native ledgers. Cold-scratch search, meta-credit learning, multi-prior policy optimization, candidate synthesis, general capability acquisition and historical promotion authority remain outside this ownership boundary. The cutover moves from 2 to 1 non-native component records: only the accepted frozen `neural.shared` asset remains, and `historical_only` debt reaches zero.\n'''
          if '## Wave 5AY — Native transfer/meta authority' not in text:
              status.write_text(text.rstrip() + '\n' + section, encoding='utf-8')

          external = Path('CURRENT/EXTERNAL_CORE.md')
          text = external.read_text(encoding='utf-8')
          section = '''\n## Transfer/meta reuse\n\n`external.transfer_meta` is canonical-native in Wave 5AY. It consumes only externally verified successful canonical Experience attribution, emits an identity-free portable semantic payload plus a separate content-addressed source-authority receipt, optionally binds an accepted canonical Causal program, and deterministically adapts the portable lesson to a distinct destination domain. Accepted reuse is not caller-authorized: it requires the exact persisted native Assurance promotion receipt bound to the transfer subject, evidence set, predecessor/source authority and verifier identities. Negative-transfer evidence quarantines and revokes reuse. Snapshot restoration re-compiles native source authority and therefore rejects same-ID source rebinding or drift instead of trusting serialized authority claims.\n'''
          if '## Transfer/meta reuse' not in text:
              external.write_text(text.rstrip() + '\n' + section, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          note = '\n- **Wave 5AY native transfer/meta reuse:** R2.69-lineage verified portable experience → deterministic cross-domain adaptation → Assurance-gated acceptance now lives in `nolane.external_core.transfer_meta`, with exact source-state authority binding, negative-transfer quarantine/revocation and fail-closed restore; scratch search, meta-credit and candidate synthesis remain outside the boundary.\n'
          if 'Wave 5AY native transfer/meta reuse' not in text:
              readme.write_text(text.rstrip() + '\n' + note, encoding='utf-8')
          PY
      - name: Regenerate canonical repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Verify generated repository audit projections
        run: python -m nolane.repository.audit --check
      - name: Verify Wave 5AY cutover and full Refoundation contracts
        run: |
          python -m pytest -q tests/test_refoundation_wave5ay_native_transfer_meta.py tests/test_refoundation_wave5ay_transfer_meta_hardening.py tests/test_refoundation_wave5ay_transfer_meta_cutover.py
          python -m pytest -q tests/test_refoundation_*.py
      - name: Commit verified cutover and remove carrier
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refoundation-wave5ay-metadata-cutover-carrier.yml
          git add cogcoder/refoundation/component_versions.py \
                  cogcoder/refoundation/implementation_status.py \
                  tests/test_refoundation_component_versions.py \
                  tests/test_refoundation_implementation_status.py \
                  CURRENT/STATUS.md CURRENT/EXTERNAL_CORE.md README.md \
                  CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md archive/INDEX.json
          git commit -m 'refactor(refoundation): cut over native transfer meta authority'
          git push origin HEAD:refoundation-wave5ay-native-transfer-meta
