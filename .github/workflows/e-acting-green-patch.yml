name: E Acting Green Patch

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-green-patch.yml

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply canonical E Acting integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nolane/external_core/execution.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from nolane.external_core.artifacts import ArtifactStore\nfrom nolane.external_core.execution_executor import ExternalCoreExecutor\n',
              'from nolane.external_core.acting_protocol import EffectClass, ExecutionRisk, VerifierLevel\n'
              'from nolane.external_core.acting_runtime import TransactionalExternalCoreExecutor\n'
              'from nolane.external_core.artifacts import ArtifactStore\n'
              'from nolane.external_core.execution_executor import ExternalCoreExecutor\n',
          )
          replace_once('COMPONENT_VERSION = "0.0.1"', 'COMPONENT_VERSION = "0.0.2"')
          replace_once(
              '        executor: ExternalCoreExecutor | None = None,\n        sessions: tuple[ExecutionSession, ...] = (),\n',
              '        executor: ExternalCoreExecutor | None = None,\n'
              '        acting_executor: TransactionalExternalCoreExecutor | None = None,\n'
              '        sessions: tuple[ExecutionSession, ...] = (),\n',
          )
          replace_once(
              "            code_claims=getattr(coding, 'claims', None),\n        )\n        self._sessions = {row.session_id: row for row in sessions}\n",
              "            code_claims=getattr(coding, 'claims', None),\n        )\n"
              "        self.acting_executor = acting_executor or TransactionalExternalCoreExecutor(executor=self.executor)\n"
              "        self._sessions = {row.session_id: row for row in sessions}\n",
          )
          replace_once(
              '''            core = self.executor.invoke(\n                agent_id=session.agent_id,\n                task_id=session.task_id,\n                workspace=workspace,\n                action=action.tool_action,\n            )\n''',
              '''            if action.tool_action.mutation_paths:\n                effect_class = EffectClass.LOCAL_MUTATION\n                risk_class = ExecutionRisk.R2\n                recovery_plan = 'restore isolated workspace checkpoint'\n            elif is_external:\n                effect_class = EffectClass.EXTERNAL_MUTATION\n                risk_class = ExecutionRisk.R3\n                recovery_plan = 'reconcile externally observed effect from core receipt evidence'\n            else:\n                effect_class = EffectClass.READ\n                risk_class = ExecutionRisk.R1\n                recovery_plan = ''\n\n            acting = self.acting_executor.invoke(\n                agent_id=session.agent_id,\n                task_id=session.task_id,\n                workspace=workspace,\n                action=action.tool_action,\n                risk_class=risk_class,\n                effect_class=effect_class,\n                required_capabilities=(),\n                capability_grants=(),\n                authorization_ref=f'decision:{decision.receipt_id}',\n                preconditions=(),\n                precondition_evidence_refs=(),\n                postconditions=(),\n                postcondition_evidence_refs=(),\n                verifier_level=VerifierLevel.V1,\n                idempotency_key=f'{session.session_id}:{decision.receipt_id}',\n                recovery_plan=recovery_plan,\n                now_ms=int(time.time() * 1000),\n                lease_ttl_ms=60_000,\n            )\n            core = self.executor.get_receipt(acting.core_receipt_id)\n''',
          )
          replace_once(
              "            'executor': self.executor.to_state(),\n        }\n",
              "            'executor': self.executor.to_state(),\n            'acting_executor': self.acting_executor.to_state(),\n        }\n",
          )
          replace_once(
              "            state=state.get('executor', {}),\n        )\n        return cls(\n",
              "            state=state.get('executor', {}),\n        )\n"
              "        acting_executor = TransactionalExternalCoreExecutor.from_state(\n"
              "            executor=executor,\n"
              "            state=state.get('acting_executor', {}),\n"
              "        )\n"
              "        return cls(\n",
          )
          replace_once(
              '            encoder=encoder,\n            executor=executor,\n            sessions=',
              '            encoder=encoder,\n            executor=executor,\n            acting_executor=acting_executor,\n            sessions=',
          )
          path.write_text(text, encoding='utf-8')

          version_cases = {
              Path('tests/test_refoundation_wave5r_native_invokable_cores.py'): (
                  'assert canonical.COMPONENT_VERSION == "0.0.1"',
                  'assert canonical.COMPONENT_VERSION == "0.0.2"',
              ),
              Path('tests/test_refoundation_wave5s_native_execution_workspace.py'): (
                  'assert canonical.COMPONENT_VERSION == "0.0.1"',
                  'assert canonical.COMPONENT_VERSION == "0.1.0"',
              ),
          }
          for target, (old, new) in version_cases.items():
              data = target.read_text(encoding='utf-8')
              if data.count(old) != 1:
                  raise SystemExit(f'{target}: expected exactly one stale version assertion')
              target.write_text(data.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile and run E Acting contracts
        run: |
          python -m pip install -q pytest
          python -m py_compile nolane/external_core/*.py
          python -m pytest -q tests/test_refoundation_acting_protocol.py tests/test_refoundation_acting_workspace.py tests/test_refoundation_acting_runtime.py
      - name: Run full Refoundation regression to expose final digest
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Commit green integration
        if: success()
        run: |
          git config user.name "nolane-e-acting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nolane/external_core/execution.py tests/test_refoundation_wave5r_native_invokable_cores.py tests/test_refoundation_wave5s_native_execution_workspace.py
          git commit -m "feat(e-acting): make transactional executor canonical authority [e-acting-patch]"
          git push origin HEAD:refoundation/e-acting-transactional-runtime-gpt56sol
