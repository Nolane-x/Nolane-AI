name: R2.65 Apply Final Hardening Fixes

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - '.github/workflows/r265-apply-final-hardening-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r265-verified-patch-language-induction-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply surgical fail-closed hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('cogcoder/r265_verified_patch_primitive_induction.py')
          text=path.read_text()

          old_order='''        for probe in diagnostics:\n            if probe.probe_id in used_diagnostics:\n'''
          new_order='''        for probe in sorted(diagnostics, key=lambda row: row.probe_id):\n            if probe.probe_id in used_diagnostics:\n'''
          if old_order in text:
              assert text.count(old_order) == 1
              text=text.replace(old_order,new_order,1)
          elif new_order not in text:
              raise SystemExit('fallback diagnostic surface changed concurrently')

          marker='''    if not survivors:\n        return receipt('abstain', None, None, False, 'repository_version_space_empty')\n'''
          hardened='''    if min_challenges < 1 or challenge_budget < 1:\n        return receipt('abstain', None, None, False, 'independent_challenge_required')\n\n    if not survivors:\n        return receipt('abstain', None, None, False, 'repository_version_space_empty')\n'''
          if 'independent_challenge_required' not in text:
              assert text.count(marker) == 1
              text=text.replace(marker,hardened,1)
          path.write_text(text)
          print('R265_FINAL_HARDENING_PATCH_APPLIED')
          PY
      - name: Run targeted RED-to-GREEN contracts
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q \
            tests/test_r265_diagnostic_order_invariance.py \
            tests/test_r265_zero_challenge_promotion.py \
            tests/test_r265_singleton_out_of_space_induction.py \
            tests/test_r265_post_selection_singleton_misspec.py \
            tests/test_r265_unanimous_misspecification.py \
            tests/test_r265_hypothesis_budget_fairness.py \
            tests/test_r265_true_global_generation_cap.py
      - name: Run full R2.65 and R2.64 regressions
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: Commit verified source hardening
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r265_verified_patch_primitive_induction.py
          if git diff --cached --quiet; then
            echo R265_HARDENING_ALREADY_PRESENT
          else
            git commit -m 'fix: harden R2.65 diagnostic ordering and challenge promotion gate'
            git push origin HEAD:r265-verified-patch-language-induction-gpt56sol
          fi
