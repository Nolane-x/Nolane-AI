name: R2.5 N
on:
  push:
    paths:
      - 'cogcoder/r25_n_region.py'
      - 'cogcoder/arc_candidate_region.py'
      - 'cogcoder/region_grid.py'
      - 'tests/test_r25_region.py'
      - '.github/workflows/r25-n.yml'
permissions:
  contents: read
env:
  PYTHONPATH: .
jobs:
  n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_r25_region.py
      - run: python -c "import json; from cogcoder.r25_n_region import run; print(json.dumps(run('external/ARC-AGI-2/data/training',2,64),indent=2,sort_keys=True))" | tee r25_n.json
      - uses: actions/upload-artifact@v4
        with:
          name: r25-n
          path: r25_n.json
