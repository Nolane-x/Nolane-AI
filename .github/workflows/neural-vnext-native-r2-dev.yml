name: Neural vNext Native R2 Accepted Authority

on:
  push:
    paths:
      - 'model/neural-vnext-native-r2/**'
      - '.github/workflows/neural-vnext-native-r2-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r2/**'
      - '.github/workflows/neural-vnext-native-r2-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_CHECKPOINT_SHA256: 'bb18c0b0f398400aa0d8ab5a7a646c0ed57eec46cfb3415abe2693ab46a30c14'
      EXPECTED_STATE_SHA256: '20a2dcefbe6d5f22184569186716a31053231aa0599b3b52d4650fc30084f2bf'
      EXPECTED_MANIFEST_SHA256: '8386440845c6a8bc4153bce6fcad29737702521b1c82ae197532f32a48b04728'
      EXPECTED_DEV_RESULT_SHA256: 'd4d4f27bb9b79c1e900ae4f9ede5d1851e94e8406d5a34621c84c9894bb5b1d8'
      EXPECTED_CHECKPOINT_SIZE: '2168688'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import torch
          print("torch_version=" + torch.__version__)
          assert torch.__version__.startswith("2.9.0")
          PY

      - name: Verify repository-archived accepted materialization
        run: |
          test -f model/neural-vnext-native-r2/accepted/successor.pt
          test "$(stat -c %s model/neural-vnext-native-r2/accepted/successor.pt)" = "$EXPECTED_CHECKPOINT_SIZE"
          test "$(sha256sum model/neural-vnext-native-r2/accepted/successor.pt | awk '{print $1}')" = "$EXPECTED_CHECKPOINT_SHA256"
          test "$(sha256sum model/neural-vnext-native-r2/accepted/successor.manifest.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum model/neural-vnext-native-r2/accepted/successor.dev.json | awk '{print $1}')" = "$EXPECTED_DEV_RESULT_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("model/neural-vnext-native-r2")
          archive = json.loads((root / "accepted/ARCHIVE_AUTHORITY.json").read_text())
          accepted = json.loads((root / "ACCEPTED_AUTHORITY.json").read_text())
          closure = json.loads((root / "evidence/ACCEPTANCE_CLOSURE.json").read_text())
          fresh = json.loads((root / "evidence/FRESH_COURT_001.json").read_text())

          assert archive["status"] == "ARCHIVED_ACCEPTED_CHECKPOINT"
          assert archive["checkpoint_sha256"] == "bb18c0b0f398400aa0d8ab5a7a646c0ed57eec46cfb3415abe2693ab46a30c14"
          assert accepted["status"] == "ACCEPTED"
          assert accepted["accepted_candidate"]["checkpoint_sha256"] == archive["checkpoint_sha256"]
          assert accepted["accepted_candidate"]["state_dict_sha256"] == "20a2dcefbe6d5f22184569186716a31053231aa0599b3b52d4650fc30084f2bf"
          assert accepted["repository_archive"]["git_lfs_oid"] == "sha256:bb18c0b0f398400aa0d8ab5a7a646c0ed57eec46cfb3415abe2693ab46a30c14"
          assert accepted["repository_archive"]["size_bytes"] == 2168688
          assert closure["status"] == "ACCEPTANCE_CLOSED"
          assert closure["accepted_materialization_archived_in_repository"] is True
          assert fresh["status"] == "FRESH_ACCEPTED"
          assert fresh["preregistered_promotion_gate"]["accepted"] is True
          assert fresh["fresh_court"]["candidate"]["solved"] == 141
          assert fresh["fresh_court"]["parent"]["solved"] == 128
          assert fresh["source_training_reproducibility"]["cross_host_bitwise_reproducible"] is False
          PY

      - name: Compile neural source and contracts
        run: |
          python -m py_compile             model/neural-vnext-native/*.py             model/neural-vnext-native/scripts/*.py             model/neural-vnext-native-r2/*.py             model/neural-vnext-native-r2/scripts/*.py             model/neural-vnext-native-r2/tests/*.py

      - name: Run R2 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: python -m pytest -q model/neural-vnext-native-r2/tests

      - name: Load accepted checkpoint and verify embedded authority
        env:
          PYTHONPATH: model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python - <<'PY'
          from pathlib import Path
          from successor_training import load_successor_checkpoint

          path = Path("model/neural-vnext-native-r2/accepted/successor.pt")
          model, metadata = load_successor_checkpoint(path)
          assert metadata["checkpoint_sha256"] == "bb18c0b0f398400aa0d8ab5a7a646c0ed57eec46cfb3415abe2693ab46a30c14"
          assert metadata["state_dict_sha256"] == "20a2dcefbe6d5f22184569186716a31053231aa0599b3b52d4650fc30084f2bf"
          assert metadata["parameters"] == 536085
          assert metadata["successor_parameters"] == 201986
          assert metadata["training_summary"]["selected_candidate"] == "hidden_trace_broad"
          assert metadata["training_summary"]["fresh_opened"] is False
          assert model.parent is not None
          print("accepted_checkpoint_authority=verified")
          PY
