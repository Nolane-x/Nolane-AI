name: R2.65 Verified Patch Primitive Induction

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - 'cogcoder/r265_*.py'
      - 'tests/test_r265_*.py'
      - 'benchmarks/kfigg/r265_*.py'
      - 'research/r265_*.py'
      - 'R2_65_*.json'
      - '.github/workflows/r265-verified-patch-primitive-induction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cogcoder/r265_*.py'
      - 'tests/test_r265_*.py'
      - 'benchmarks/kfigg/r265_*.py'
      - 'research/r265_*.py'
      - 'R2_65_*.json'
      - '.github/workflows/r265-verified-patch-primitive-induction.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Verify accepted R2.64 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: Run R2.65 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run R2.65 focused tests
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
