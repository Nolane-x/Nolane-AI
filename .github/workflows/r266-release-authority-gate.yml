name: R2.66 Release Authority Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'R2_66_HOSTED_VERIFICATION.json'
      - 'R2_66_WORLD_FINAL.json'
      - 'R2_66_RELEASE_MANIFEST.json'
      - 'R2_66_DELIVERY.md'
      - '.github/workflows/r266-release-authority-gate.yml'
  push:
    branches: [release-r266-postmerge-gpt56sol]
    paths:
      - 'R2_66_HOSTED_VERIFICATION.json'
      - 'R2_66_WORLD_FINAL.json'
      - 'R2_66_RELEASE_MANIFEST.json'
      - 'R2_66_DELIVERY.md'
      - '.github/workflows/r266-release-authority-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cross-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Verify accepted R2.66 ancestry and frozen source
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2eef08f15e7c0a5e79f58579282db90c157cb4a HEAD
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_66_PRE_HOSTED_LOCK.json').read_text())
          assert lock['schema_version'] >= 4
          assert lock['parent_release_commit'] == '768e500d6b3e8d1d8ec747e37aae6302ab6747d1'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R266_RELEASE_AUTHORITY_SOURCE_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Run R2.66 exact contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical dependencies and pinned oracle
        run: |
          python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
          python -m pip install 'git+https://github.com/WarrenWeckesser/ufunclab.git@f1fbe6769850823a1976ccc28d14cd966130b645'
      - name: Verify accepted lineage, frozen blobs and release records
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2eef08f15e7c0a5e79f58579282db90c157cb4a HEAD
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path

          lock=json.loads(Path('R2_66_PRE_HOSTED_LOCK.json').read_text())
          hosted=json.loads(Path('R2_66_HOSTED_VERIFICATION.json').read_text())
          world=json.loads(Path('R2_66_WORLD_FINAL.json').read_text())
          manifest=json.loads(Path('R2_66_RELEASE_MANIFEST.json').read_text())

          assert lock['schema_version'] >= 4
          assert lock['parent_release_commit'] == '768e500d6b3e8d1d8ec747e37aae6302ab6747d1'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)

          assert hosted['accepted_main_commit'] == 'e2eef08f15e7c0a5e79f58579282db90c157cb4a'
          assert hosted['canonical']['workflow_run_id'] == 32152862847
          assert hosted['canonical']['conclusion'] == 'success'
          assert hosted['canonical']['r266_tests'] == 21
          assert hosted['canonical']['protected_parent_tests'] == 267
          assert hosted['canonical']['hosted_relevant_tests_total'] == 288
          assert hosted['pre_integration_release_bundle']['workflow_run_id'] == 32152862858
          assert hosted['pre_integration_release_bundle']['conclusion'] == 'success'

          assert world['runtime'] == 'Nolane World 0.8.0 Learning-to-Learn Cognitive OS'
          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == 'de32990437181d2f0c33e8a9db226aadd06121a3e435cafc2a0bfdaca6b62712'
          assert world['gate']['passed'] is False
          assert world['convergence_forced'] is False
          assert world['critical_unknowns'] >= 1
          assert world['fresh_verifications'] >= 2

          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['accepted_main_commit'] == hosted['accepted_main_commit']
          assert manifest['source_lock_schema_version'] == lock['schema_version']
          assert manifest['added_trainable_parameters'] == 0
          assert manifest['readiness']['previous_score'] == 49.7
          assert manifest['readiness']['score'] == 49.9
          assert manifest['readiness']['delta'] == 0.2
          assert manifest['world']['w5_passed'] is False
          assert manifest['release_bundle']['workflow'] == '.github/workflows/r266-post-merge-release-bundle.yml'
          print('R266_RELEASE_AUTHORITY_RECORDS_OK')
          PY
      - name: Recompute exact authored and pinned external evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import ufunclab
          from benchmarks.kfigg.r266_learned_contextual_composition import run_benchmark
          from research.r266_external_contextual_transfer import run_external_transfer
          phase=run_benchmark()
          external=run_external_transfer(
              ufunclab.step,
              source_id='WarrenWeckesser/ufunclab:ufunclab.step',
              source_commit='f1fbe6769850823a1976ccc28d14cd966130b645',
          )
          assert phase == json.loads(Path('R2_66_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_66_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert external['passed'] is True
          assert external['false_accepts'] == 0
          print('R266_RELEASE_AUTHORITY_EVIDENCE_EXACT_OK')
          PY
      - name: Run R2.66 and protected R2.65 through R2.41 lineage
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Publish release-authority success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r266/release-authority',
              'description':'Accepted ancestry, frozen blobs, World/manifest receipts, exact evidence and full lineage passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R266_RELEASE_AUTHORITY_STATUS_PUBLISHED')
          PY
