name: R2.65 Primitive Induction Measurement

on:
  push:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - 'cogcoder/r265_*.py'
      - 'tests/test_r265_*.py'
      - 'benchmarks/kfigg/r265_*.py'
      - 'research/r265_*.py'
      - '.github/workflows/r265-measurement.yml'
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Accepted R2.64 parent first
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
      - name: R2.65 focused
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py

  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python -m pytest -q tests/test_r265_*.py

  phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run authored causal benchmark
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r265_patch_primitive_induction import run_benchmark
          result=run_benchmark()
          assert result['all_gates_pass'] is True
          s=result['summary']
          assert s['episodes'] == 6
          assert s['r264_missing_macro_abstains'] == 6
          assert s['r265_exact'] == 6
          assert s['learned_expected_primitive'] == 6
          assert s['primitive_promoted'] == 6
          assert s['min_independent_challenges'] >= 4
          assert s['min_final_verification_cases'] >= 24
          assert s['negative_abstains'] == 8
          assert s['false_terminal_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          Path('R2_65_PHASE_A_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps(s, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.65-phase-a
          path: R2_65_PHASE_A_RECOMPUTED.json

  external-numpy-multiply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Run pinned callable-I/O transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from research.r265_external_patch_primitive_transfer import run_external_transfer
          result=run_external_transfer(np.multiply, source_id='numpy.multiply', source_version=np.__version__)
          assert result['passed'] is True
          assert result['source_version'] == '2.4.6'
          assert result['source_exposure'] == 'io_only'
          assert result['source_implementation_inspected'] is False
          assert result['exact_patch_macro_supplied'] is False
          assert result['r264_baseline']['reason'] == 'no_expansion_macros'
          assert result['r265']['reason'] == 'induced_patch_primitive_verified'
          assert result['r265']['learned_source_value'] == 'Add'
          assert result['r265']['learned_target_value'] == 'Mult'
          assert result['r265']['independent_challenges_passed'] == 8
          assert result['verification_exact'] == result['verification_cases'] == 225
          assert result['r265']['false_terminal_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          Path('R2_65_EXTERNAL_TRANSFER_RECOMPUTED.json').write_text(json.dumps(result, indent=2, sort_keys=True)+'\n')
          print(json.dumps({'source_version': result['source_version'], 'verification_cases': result['verification_cases'], 'total_external_oracle_calls': result['total_external_oracle_calls'], 'r264_reason': result['r264_baseline']['reason'], 'r265_reason': result['r265']['reason']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: R2.65-numpy-multiply-external
          path: R2_65_EXTERNAL_TRANSFER_RECOMPUTED.json
