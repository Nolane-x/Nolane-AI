name: R2.69 Multi-Prior Writer

on:
  push:
    branches: ['r269-external-architecture-hardening-gpt56sol']
    paths: ['.github/workflows/r269-multi-prior-writer.yml']

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r269-external-architecture-hardening-gpt56sol
      - name: Verify exact source boundary
        run: test "$(git hash-object cogcoder/r269_transfer_runtime.py)" = '647ddbb9a7bff4c2d1672fae0cac1403dae7ff33'
      - name: Apply proven proposal
        run: |
          PYTHONPATH=. python scripts/r269_multi_prior_patch.py
          PYTHONPATH=. python scripts/r269_multi_prior_adjust.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Python 3.11 gates
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_multi_prior_adjudication.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py -k 'not benchmark and not scratch_compositional_closure'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Python 3.13 gates
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_multi_prior_adjudication.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py -k 'not benchmark and not scratch_compositional_closure'
      - name: Commit only tested production source
        run: |
          test "$(git status --short | awk '{print $2}' | grep -v '^$' | sort -u)" = 'cogcoder/r269_transfer_runtime.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r269_transfer_runtime.py
          git commit -m 'fix(r269): adjudicate compatible priors with shared target evidence'
          git push origin HEAD:r269-external-architecture-hardening-gpt56sol
