name: R2.68 Validation Migration — Fresh Oracle Query Evidence

on:
  pull_request:
    branches: [r268-proof-carrying-adaptive-causal-basis-gpt56sol]
    paths:
      - 'tests/test_r268_learning_validation_query_disjointness.py'
      - 'scripts/r268_apply_disjoint_validation_fixtures.py'
      - '.github/workflows/r268-learning-validation-query-disjointness-fix-experiment.yml'

permissions:
  contents: read

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted parent safety first
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Production core rejects all four cross-phase overlap classes before oracle use
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_learning_validation_query_disjointness.py
      - name: Apply runner-only disjoint validation corpus migration
        run: python scripts/r268_apply_disjoint_validation_fixtures.py
      - name: Full R2.68 and accepted parent regressions stay green
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Recompute determinant transfer on genuinely fresh validation query universe
        run: |
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from research.r268_external_transfer import run_external_transfer
          assert np.__version__ == '2.4.6'
          result=run_external_transfer(np.linalg.det,source_id='numpy:numpy.linalg.det',source_version=np.__version__)
          assert result['passed'] is True,result
          assert result['selected_basis_size'] == 2,result
          assert result['globally_minimal'] is True,result
          assert result['lower_basis_certified'] == result['lower_basis_count'] == 4,result
          assert result['necessity_certificate_count'] == 2,result
          assert result['false_accepts'] == 0,result
          assert result['oracle_accounting_exact'] is True,result
          assert result['oracle_calls_total'] == result['source_calls_observed'] == 1238,result
          assert result['terminal_cases'] == result['terminal_exact'] == 6,result
          assert result['terminal_probe_cases'] == result['terminal_probe_exact'] == 12,result
          print('R268_FRESH_VALIDATION_DETERMINANT_TRANSFER_OK', result['oracle_calls_total'])
          PY
      - name: Migration changes only evidence fixtures in the runner
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'research/r268_external_transfer.py'
          test "${changed[1]}" = 'tests/test_r268_alias_order_invariance.py'
