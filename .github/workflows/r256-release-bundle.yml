name: R2.56 Full Repository Release Bundle

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install release test dependency
        run: python -m pip install --upgrade pytest
      - name: Verify frozen release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('research/R2_56_VERIFY_RESULT.json').read_text())
          w=json.loads(Path('research/R2_56_WORLD_FINAL.json').read_text())
          e=json.loads(Path('research/R2_56_EXTERNAL_TRANSFER.json').read_text())
          p=json.loads(Path('research/R2_56_PHASE_A_RESULT.json').read_text())
          m=json.loads(Path('archive/root-history/historical_r_series/R2_56_RELEASE_MANIFEST.json').read_text())
          assert v['status']=='ACCEPTED_BOUNDED_CAPABILITY'
          assert v['hosted_run_id']==32093519045
          assert v['hosted_gate_commit']=='4d407560b27a022d242aafdb391848cb0b019143'
          assert v['focused_tests']['passed']==16 and v['focused_tests']['failed']==0
          assert v['protected_lineage']['passed']==144 and v['protected_lineage']['failed']==0
          assert all(x=='success' for x in v['hosted_statuses'].values())
          assert p['episodes']==9 and p['exact']==9 and p['false_accepts']==0
          assert p['r255_no_invention_baseline_exact']==0
          assert e['passed'] is True and e['training_cases']==8 and e['challenge_cases']==8
          assert e['heldout_cases']==24 and e['heldout_exact']==24
          assert e['source_was_parsed_by_learner'] is False
          assert w['audit']['valid'] is True and w['gate']['passed'] is False and w['gate']['score']==0
          assert v['readiness']['current']==46.8 and m['readiness']==46.8
          assert v['trainable_parameter_count_added']==0
          for path in m['release_files']:
              assert Path(path).exists(), path
          print('R256_RELEASE_BOUNDARY_OK')
          PY
      - name: Run focused release regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_r256_operator_dsl.py \
            tests/test_r256_operator_invention.py \
            tests/test_r256_operator_invention_benchmark.py \
            tests/test_r256_external_operator_transfer.py
      - name: Create complete repository snapshot
        run: |
          set -euo pipefail
          git archive --format=zip --output=Nolane-AI-R2.56-COMPLETE.zip HEAD
          sha256sum Nolane-AI-R2.56-COMPLETE.zip | tee Nolane-AI-R2.56-COMPLETE.zip.sha256
          unzip -tq Nolane-AI-R2.56-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.56-COMPLETE
          path: |
            Nolane-AI-R2.56-COMPLETE.zip
            Nolane-AI-R2.56-COMPLETE.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Publish release-bundle commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --silent --show-error --request POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "$(python -c 'import json,os; print(json.dumps({"state":os.environ["STATE"],"context":"r256/release-bundle","description":"R2.56 frozen boundary+focused regressions+full ZIP","target_url":os.environ["RUN_URL"]}))')"
