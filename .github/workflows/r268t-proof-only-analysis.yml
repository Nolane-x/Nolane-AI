name: R2.68-T Proof-Only Dedupe Analysis

on:
  push:
    branches: [hardening-r268t-finite-fingerprint-authority-gpt56sol]
    paths:
      - 'scripts/r268t_analyze_proof_only_dedupe.py'
      - '.github/workflows/r268t-proof-only-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Analyze benchmark with no finite-fingerprint collapse
        run: PYTHONPATH=. python scripts/r268t_analyze_proof_only_dedupe.py
