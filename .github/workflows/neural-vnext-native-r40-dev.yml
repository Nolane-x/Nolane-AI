name: Neural vNext Native R40 Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r40/rescue_aligned_proposal_core.py'
      - 'model/neural-vnext-native-r40/rescue_aligned_proposal_training.py'
      - 'model/neural-vnext-native-r40/PREDEV_LOCK.json'
      - 'model/neural-vnext-native-r40/FRESH_GATE_PREREGISTRATION.json'
      - 'model/neural-vnext-native-r40/scripts/**'
      - 'model/neural-vnext-native-r40/tests/**'
      - '.github/workflows/neural-vnext-native-r40-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r40-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r40-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R40 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r40:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r40/*.py model/neural-vnext-native-r40/scripts/*.py model/neural-vnext-native-r40/tests/*.py
          python -m pytest -q model/neural-vnext-native-r40/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r40/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r40/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['candidate']=='Neural-vNext-Native-R40-RescueAlignedProposal'
          assert lock['architecture']['pair_feature_dim']==774
          assert lock['architecture']['explicit_keep_r11_null_option'] is True
          assert lock['architecture']['expected_goal_successor_parameters']==107799
          assert lock['architecture']['expected_set_successor_parameters']==313365
          assert lock['architecture']['expected_successor_parameters']==421164
          assert lock['architecture']['expected_physical_parameters']==1298706
          assert lock['distributional_training']['strata_are_contiguous_over_locked_set_training_range'] is True
          assert lock['distributional_training']['group_dro'] is True
          assert lock['training']['listwise_loss_weight']==1.0
          assert lock['training']['harm_mass_weight']==0.75
          assert lock['training']['stratum_count']==8
          assert lock['training']['group_dro_eta']==0.15
          assert lock['training']['rescue_group_listwise_multiplier']==3.0
          assert lock['binary_rescue_confidence']['dedicated_head'] is True
          assert lock['proposal_rule']['joint_selection_times_rescue'] is True
          assert lock['binary_rescue_confidence']['binary_supervision'] is True
          assert lock['proposal_rule']['unanimous_joint_argmax'] is True
          assert lock['binary_rescue_confidence']['retains_four_way_harm_gate'] is True
          assert lock['training']['selection_threshold_candidates']==[0.2,0.3,0.4]
          assert lock['training']['rescue_threshold_candidates']==[0.5,0.6,0.7,0.8]
          assert lock['benchmark']['development_indices']==[2400,2431]
          assert lock['benchmark']['confirmation_indices']==[2432,2463]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert len(lock['benchmark']['rescue_guard_blocks'])==4
          assert lock['training']['require_zero_selected_harm'] is True
          assert lock['private_boundary']['future_branch_information_used_as_inference_input'] is False
          assert lock['private_boundary']['inference_private_goal_use'] is False
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          PY
      - name: Train decision-set ranker and run locked R40 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r40:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r40-output
          python model/neural-vnext-native-r40/scripts/run_dev.py \
            --checkpoint r40-output/r40.pt \
            --manifest r40-output/r40.manifest.json \
            --dev-result r40-output/r40.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r40-output/r40.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_boundary']['inference_private_goal_use'] is False
          assert manifest['private_boundary']['runtime_uses_full_alternative_set'] is True
          assert manifest['private_boundary']['training_identity_strata_not_used_at_inference'] is True
          assert manifest['private_boundary']['dedicated_binary_rescue_probability_gate'] is True
          assert manifest['private_boundary']['rescue_aligned_joint_proposal'] is True
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R40_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R40_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r40-dev
          path: |
            r40-output/r40.pt
            r40-output/r40.manifest.json
            r40-output/r40.dev.json
          if-no-files-found: error
          retention-days: 90
