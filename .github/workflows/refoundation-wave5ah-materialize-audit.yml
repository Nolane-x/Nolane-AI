name: Refoundation Wave 5AH Audit Materializer

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5ag-native-evaluation-evidence

permissions:
  contents: read

jobs:
  materialize-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Upload generated audit projections
        uses: actions/upload-artifact@v4
        with:
          name: wave5ah-generated-audit
          path: |
            CURRENT/NATIVE_DEBT.json
            CURRENT/NATIVE_DEBT.md
            archive/INDEX.json
          if-no-files-found: error
