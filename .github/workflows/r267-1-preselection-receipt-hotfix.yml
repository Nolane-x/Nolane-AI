name: R2.67.1 Preselection Receipt Hotfix

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'tests/test_r267_1_preselection_receipt_units.py'
      - 'scripts/r267_1_apply_preselection_receipt_units.py'
      - '.github/workflows/r267-1-preselection-receipt-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Accepted R2.66 first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Confirm hosted RED before production mutation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_preselection_receipt_units.py
          rc=$?
          set -e
          test "$rc" -ne 0
          echo R267_1_PRESELECTION_RED_CONFIRMED
      - name: Apply minimal guarded fix
        run: python scripts/r267_1_apply_preselection_receipt_units.py
      - name: Verify focused GREEN
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_preselection_receipt_units.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_authority_boundaries.py tests/test_r267_1_no_collision_failclosed.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit production fix once from Python 3.11
        if: matrix.python == '3.11'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          git diff --cached --quiet && { echo 'expected production delta missing'; exit 1; }
          git commit -m 'fix: correct R2.67.1 preselection receipt units'
          git push origin HEAD:r267-1-genuine-causal-necessity-hotfix-gpt56sol
