name: Refoundation Wave 5C Memory Fabric Bootstrap

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5b-native-evidence
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5c-native-memory-fabric' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply deterministic Wave 5C cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def ensure_insert_after(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if addition in text:
                  return
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: insertion anchor count != 1')
              target.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          def ensure_remove_line(path: str, line: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if line not in text:
                  return
              if text.count(line) != 1:
                  raise SystemExit(f'{path}: removal line count != 1')
              target.write_text(text.replace(line, '', 1), encoding='utf-8')

          types_path = Path('cogcoder/organization/types.py')
          text = types_path.read_text(encoding='utf-8')
          canonical_import = 'from nolane.memory.fabric import MemoryEntry, MemoryScope, MemoryStatus\n'
          evidence_import = 'from nolane.external_core.evidence import EvidenceRecord\n'
          if canonical_import not in text:
              if text.count(evidence_import) != 1:
                  raise SystemExit('types.py: evidence import anchor not unique')
              text = text.replace(evidence_import, evidence_import + canonical_import, 1)

          scope_start = 'class MemoryScope(str, Enum):\n'
          skill_start = 'class SkillScope(str, Enum):\n'
          if scope_start in text:
              if text.count(scope_start) != 1 or text.count(skill_start) != 1:
                  raise SystemExit('types.py: memory enum boundary not unique')
              start = text.index(scope_start)
              end = text.index(skill_start)
              text = text[:start] + text[end:]
          elif 'class MemoryStatus(str, Enum):' in text:
              raise SystemExit('types.py: partial memory enum cutover detected')

          entry_start = '@dataclass(frozen=True, slots=True)\nclass MemoryEntry:\n'
          context_start = '@dataclass(frozen=True, slots=True)\nclass ContextCapsule:\n'
          if entry_start in text:
              if text.count(entry_start) != 1 or text.count(context_start) != 1:
                  raise SystemExit('types.py: MemoryEntry boundary not unique')
              start = text.index(entry_start)
              end = text.index(context_start)
              text = text[:start] + text[end:]
          elif 'class MemoryEntry:' in text:
              raise SystemExit('types.py: unexpected local MemoryEntry remains')

          for forbidden in (scope_start, 'class MemoryStatus(str, Enum):\n', entry_start):
              if forbidden in text:
                  raise SystemExit(f'types.py: migrated memory definition remains: {forbidden!r}')
          if canonical_import not in text:
              raise SystemExit('types.py: canonical memory import missing')
          types_path.write_text(text, encoding='utf-8')

          ensure_insert_after(
              'cogcoder/refoundation/component_versions.py',
              '        "external.evidence": 1,\n',
              '        "external.memory.fabric": 1,\n',
          )

          implementation_path = Path('cogcoder/refoundation/implementation_status.py')
          implementation = implementation_path.read_text(encoding='utf-8')
          evidence_block = '''    "external.evidence": (\n        "nolane.external_core.evidence",\n        ("cogcoder/organization/types.py",),\n        "Native verification evidence primitive with preserved historical import identity and state semantics; mixed historical types module bridges to canonical class authority.",\n    ),\n'''
          memory_block = '''    "external.memory.fabric": (\n        "nolane.memory.fabric",\n        ("cogcoder/organization/memory.py", "cogcoder/organization/types.py"),\n        "Native scoped memory schema and fabric with preserved visibility, promotion, lifecycle-status mutation and state round-trip; historical memory/types surfaces bridge to canonical authority.",\n    ),\n'''
          if memory_block not in implementation:
              if implementation.count(evidence_block) != 1:
                  raise SystemExit('implementation_status.py: evidence native anchor not unique')
              implementation = implementation.replace(evidence_block, evidence_block + memory_block, 1)
          implementation_path.write_text(implementation, encoding='utf-8')

          ensure_remove_line(
              'cogcoder/refoundation/facades.py',
              '        FacadeBinding("external.memory.fabric", "nolane.memory.fabric", "cogcoder.organization.memory", ("MemoryFabric",)),\n',
          )

          for path in (
              'tests/test_refoundation_component_versions.py',
              'tests/test_refoundation_implementation_status.py',
          ):
              target = Path(path)
              value = target.read_text(encoding='utf-8')
              marker = '    "external.memory.fabric",\n'
              if marker not in value:
                  anchor = '    "external.evidence",\n'
                  if value.count(anchor) != 1:
                      raise SystemExit(f'{path}: external.evidence set anchor not unique')
                  value = value.replace(anchor, anchor + marker, 1)
                  target.write_text(value, encoding='utf-8')
          PY
      - name: Materialize native-debt projections
        run: python -m nolane.repository.audit --write
      - name: Prove historical archive index did not drift
        run: git diff --exit-code -- archive/INDEX.json
      - name: Verify Wave 5C targeted contracts
        run: |
          python -m nolane.repository.audit --check
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_wave5b_native_evidence.py \
            tests/test_refoundation_wave5c_native_memory_fabric.py
      - name: Commit deterministic Wave 5C cutover
        shell: bash
        run: |
          git add \
            cogcoder/organization/types.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/facades.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md
          if git diff --cached --quiet; then
            echo 'No Wave 5C cutover changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(refoundation): cut over native memory fabric'
          git push origin HEAD:${GITHUB_HEAD_REF}
