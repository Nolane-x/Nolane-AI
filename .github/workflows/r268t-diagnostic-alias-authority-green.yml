name: R2.68-T Diagnostic Alias Authority GREEN

on:
  push:
    branches: [hardening-r268t-diagnostic-alias-authority-gpt56sol]
    paths:
      - 'scripts/r268t_apply_diagnostic_alias_authority.py'
      - '.github/workflows/r268t-diagnostic-alias-authority-green.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r268t-diagnostic-alias-authority-writer
  cancel-in-progress: false

jobs:
  materialize-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-diagnostic-alias-authority-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Apply conservative structural-equivalence dedupe
        run: PYTHONPATH=. python scripts/r268t_apply_diagnostic_alias_authority.py
      - name: Verify regression and full R2.68-T focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Materialize source only on GREEN
        run: |
          if git diff --quiet -- cogcoder/r268_cross_task_causal_transfer.py; then
            echo 'Source already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r268_cross_task_causal_transfer.py
          git commit -m 'fix: prevent diagnostic aliases from creating false uniqueness'
          git push origin HEAD:hardening-r268t-diagnostic-alias-authority-gpt56sol
