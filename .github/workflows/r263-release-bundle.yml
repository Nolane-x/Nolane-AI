name: R2.63 Full Repository Release Bundle

on:
  push:
    branches: [main, r263-compositional-repository-repair-integration]
    paths:
      - 'R2_62_TO_R2_63_EVOLUTION.md'
      - 'R2_63_TDD_RED.json'
      - 'R2_63_PRE_HOSTED_LOCK.json'
      - 'R2_63_PHASE_A_RESULT.json'
      - 'R2_63_EXTERNAL_TRANSFER.json'
      - 'R2_63_VERIFY_RESULT.json'
      - 'R2_63_WORLD_FINAL.json'
      - 'R2_63_DELIVERY.md'
      - 'R2_63_RELEASE_MANIFEST.json'
      - 'R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r263-release-bundle.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies
        run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify frozen R2.63 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          red=json.loads(Path('R2_63_TDD_RED.json').read_text())
          lock=json.loads(Path('R2_63_PRE_HOSTED_LOCK.json').read_text())
          phase=json.loads(Path('R2_63_PHASE_A_RESULT.json').read_text())
          external=json.loads(Path('R2_63_EXTERNAL_TRANSFER.json').read_text())
          verify=json.loads(Path('R2_63_VERIFY_RESULT.json').read_text())
          world=json.loads(Path('R2_63_WORLD_FINAL.json').read_text())
          manifest=json.loads(Path('R2_63_RELEASE_MANIFEST.json').read_text())
          parent=json.loads(Path('R2_62_RELEASE_MANIFEST.json').read_text())
          delivery=Path('R2_63_DELIVERY.md').read_text()
          readiness=Path('R2_READINESS_RECALIBRATION.md').read_text()

          assert parent['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert parent['readiness']['score'] == 48.8
          assert lock['parent_release_commit'] == '02f3d2f6dc16dbb82b0dd1cef111546173b4767e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          assert red['status'] == 'HOSTED_TDD_RED_CONFIRMED'
          assert red['production_module_absent_at_red'] is True
          assert red['failure_was_contract_relevant'] is True

          s=phase['summary']
          assert phase['all_gates_pass'] is True
          assert s['episodes'] == 6
          assert s['r261_terminal_verification_abstains'] == 6
          assert s['r263_exact'] == 6
          assert s['r263_two_round_repairs'] == 6
          assert s['r263_two_edit_repairs'] == 6
          assert s['refinement_counterexamples'] == 12
          assert s['final_verification_calls'] == 864
          assert s['false_terminal_accepts'] == 0
          assert s['verification_failures'] == 0
          assert s['target_output_leakage_into_generation'] is False
          assert s['unique_accepted_content_digests'] == 6
          assert phase['trainable_parameter_count'] == 0

          assert external['passed'] is True
          assert external['source_id'] == 'numpy:numpy.subtract'
          assert external['source_version'] == '2.4.6'
          assert external['source_exposure'] == 'io_only'
          assert external['r261_status'] == 'abstain'
          assert external['r261_reason'] == 'independent_verification_failed'
          assert external['r263_status'] == 'accept'
          assert external['r263_expansion_rounds'] == 2
          assert external['r263_refinement_counterexamples'] == 2
          assert external['r263_accepted_edit_count'] == 2
          assert external['r263_mutation_chain_length'] == 2
          assert external['r263_generation_used_target_outputs'] is False
          assert external['r263_false_terminal_accepts'] == 0
          assert external['verification_exact'] == external['verification_cases'] == 256
          assert external['trainable_parameter_count'] == 0

          assert verify['hosted_run_id'] == 32128298353
          assert verify['hosted_run_conclusion'] == 'success'
          assert verify['source_lock_verified'] is True
          assert verify['phase_a_recomputed_exact'] is True
          assert verify['external_recomputed_exact'] is True
          assert verify['focused_r263_tests'] == 7
          assert verify['protected_parent_tests'] == 227
          assert verify['hosted_relevant_tests_total'] == 234
          assert verify['cross_python'] == {'3.11':'success','3.13':'success'}
          assert verify['readiness_before'] == 48.8
          assert verify['readiness_after'] == 49.1
          assert verify['world_w5_passed'] is False

          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == 'd34314b1825cd214a6d603af89d889e304f35176639e56ad62964bffe80f1987'
          assert world['world_id'] == 'world_c3eaeda4e13d'
          assert world['active_seconds_credited'] == 0.0
          assert world['gate']['passed'] is False
          assert world['convergence_forced'] is False
          assert len(world['critical_unknowns']) == 3

          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['readiness']['score'] == 49.1
          assert manifest['added_trainable_parameters'] == 0
          assert manifest['world']['w5_passed'] is False
          assert '49.1/100' in delivery
          assert '## R2.63 — 49.1 / 100' in readiness
          print('R263_RELEASE_BOUNDARY_OK')
          PY
      - name: Recompute exact authored evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r263_compositional_repository_repair import run_benchmark
          expected=json.loads(Path('R2_63_PHASE_A_RESULT.json').read_text())
          actual=run_benchmark()
          assert actual == expected
          print('R263_PHASE_A_RELEASE_RECOMPUTE_OK')
          PY
      - name: Recompute exact pinned NumPy transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from research.r263_external_compositional_transfer import run_external_transfer
          expected=json.loads(Path('R2_63_EXTERNAL_TRANSFER.json').read_text())
          actual=run_external_transfer(np.subtract, source_id='numpy:numpy.subtract', source_version=np.__version__)
          assert np.__version__ == '2.4.6'
          assert actual == expected
          print('R263_EXTERNAL_RELEASE_RECOMPUTE_OK')
          PY
      - name: Run R2.63 and accepted R2.62 regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r263_*.py tests/test_r262_*.py
      - name: Create complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.63-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.63-COMPLETE.zip | tee release/Nolane-AI-R2.63-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.63-COMPLETE.zip
      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.63-COMPLETE
          path: |
            release/Nolane-AI-R2.63-COMPLETE.zip
            release/Nolane-AI-R2.63-COMPLETE.zip.sha256
      - name: Publish release-bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r263/release-bundle',
              'description':'R2.63 boundary, exact evidence, regressions and COMPLETE ZIP integrity passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          PY
