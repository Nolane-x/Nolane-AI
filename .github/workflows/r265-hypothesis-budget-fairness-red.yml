name: R2.65 Hypothesis Budget Fairness RED

on:
  push:
    branches: [validation-r265-hypothesis-budget-fairness-gpt56sol]
    paths:
      - 'tests/test_r265_hypothesis_budget_fairness_falsifier.py'
      - '.github/workflows/r265-hypothesis-budget-fairness-red.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Confirm sequential hypothesis generation starves bounded search
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m pytest -q tests/test_r265_hypothesis_budget_fairness_falsifier.py > r265-fairness-red.log 2>&1
          rc=$?
          cat r265-fairness-red.log
          test "$rc" -ne 0
      - name: Require exact fairness failure with roomy control green
        shell: bash
        run: |
          grep -F 'test_global_candidate_budget_does_not_starve_later_primitive_hypotheses' r265-fairness-red.log
          grep -F "AssertionError: assert 'abstain' == 'accept'" r265-fairness-red.log
          grep -E '1 failed, 1 passed|1 failed.*1 passed' r265-fairness-red.log
      - name: Publish independent RED status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({'state':'success','context':'r265/hypothesis-budget-red','description':'Independent RED: sequential primitive hypotheses starve bounded generation budget','target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",data=payload,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},method='POST')
          urllib.request.urlopen(req).read()
          PY
