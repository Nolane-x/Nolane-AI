name: R2.64 Full Repository Release Bundle

on:
  push:
    branches: [main, r264-unified-adaptive-repository-search-gpt56sol]
    paths:
      - 'R2_64_TDD_RED.json'
      - 'R2_64_PRE_HOSTED_LOCK.json'
      - 'R2_64_PHASE_A_RESULT.json'
      - 'R2_64_EXTERNAL_TRANSFER.json'
      - 'R2_64_HOSTED_VERIFICATION.json'
      - 'R2_64_WORLD_FINAL.json'
      - 'R2_64_DELIVERY.md'
      - 'R2_64_RELEASE_MANIFEST.json'
      - 'R2_READINESS_RECALIBRATION.md'
      - '.github/workflows/r264-release-bundle.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  bundle:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6'
      - name: Verify frozen R2.64 release boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path

          required = [
              'R2_64_TDD_RED.json',
              'R2_64_PRE_HOSTED_LOCK.json',
              'R2_64_PHASE_A_RESULT.json',
              'R2_64_EXTERNAL_TRANSFER.json',
              'R2_64_HOSTED_VERIFICATION.json',
              'R2_64_WORLD_FINAL.json',
              'R2_64_DELIVERY.md',
              'R2_64_RELEASE_MANIFEST.json',
              'R2_READINESS_RECALIBRATION.md',
              'cogcoder/r264_unified_adaptive_repository_search.py',
              'benchmarks/kfigg/r264_unified_adaptive_repository_search.py',
              'research/r264_external_unified_transfer.py',
          ]
          for path in required:
              assert Path(path).is_file(), path

          red=json.loads(Path('R2_64_TDD_RED.json').read_text())
          lock=json.loads(Path('R2_64_PRE_HOSTED_LOCK.json').read_text())
          phase=json.loads(Path('R2_64_PHASE_A_RESULT.json').read_text())
          external=json.loads(Path('R2_64_EXTERNAL_TRANSFER.json').read_text())
          verify=json.loads(Path('R2_64_HOSTED_VERIFICATION.json').read_text())
          world=json.loads(Path('R2_64_WORLD_FINAL.json').read_text())
          manifest=json.loads(Path('R2_64_RELEASE_MANIFEST.json').read_text())
          delivery=Path('R2_64_DELIVERY.md').read_text()
          readiness=Path('R2_READINESS_RECALIBRATION.md').read_text()

          assert lock['parent_release_commit'] == '1d1b05e0c1476327eaf3b2457aab16153a43c429'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert len(lock['frozen_git_blobs']) == 6
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)

          assert red['status'] == 'HOSTED_TDD_RED_CONFIRMED'
          assert len(red['red_gates']) == 3
          assert all(row['implementation_absent_at_red'] is True for row in red['red_gates'])

          s=phase['summary']
          assert phase['all_gates_pass'] is True
          assert s['episodes'] == 6
          assert s['r263_initial_out_of_space_abstains'] == 6
          assert s['r264_exact'] == 6
          assert s['target_absent_initial'] == 6
          assert s['target_absent_complete_one_step_space'] == 6
          assert s['diagnostic_counterexamples'] == 6
          assert s['refinement_counterexamples'] == 6
          assert s['two_expansion_rounds'] == 6
          assert s['public_observations_preserved'] == 6
          assert s['min_final_verification_cases'] >= 31
          assert s['negative_abstains'] == 10
          assert s['candidate_order_invariant'] is True
          assert s['caller_id_invariant'] is True
          assert s['generation_uses_target_outputs'] is False
          assert s['false_terminal_accepts'] == 0
          assert s['verification_failures_on_positive'] == 0
          assert phase['trainable_parameter_count'] == 0

          assert external['passed'] is True
          assert external['source_id'] == 'numpy.square'
          assert external['source_version'] == '2.4.6'
          assert external['source_exposure'] == 'io_only'
          assert external['source_implementation_inspected'] is False
          assert external['correct_target_absent_initial'] is True
          assert external['correct_target_absent_complete_one_step_space'] is True
          assert external['exact_target_supplied_to_solver'] is False
          assert external['r263_baseline']['status'] == 'abstain'
          assert external['r263_baseline']['reason'] == 'oracle_outside_initial_candidate_version_space'
          assert external['r263_baseline']['expansion_rounds'] == 0
          assert external['r264']['status'] == 'accept'
          assert external['r264']['reason'] == 'unified_candidate_verified'
          assert external['r264']['diagnostic_counterexamples'] == 1
          assert external['r264']['refinement_counterexamples'] == 1
          assert external['r264']['expansion_rounds'] == 2
          assert external['r264']['composition_depth'] == 2
          assert external['r264']['accepted_edit_count'] == 2
          assert len(external['r264']['accepted_mutation_chain']) == 2
          assert external['r264']['generation_used_target_outputs'] is False
          assert external['r264']['false_terminal_accepts'] == 0
          assert external['r264']['verification_failures'] == 0
          assert external['verification_exact'] == external['verification_cases'] == 46
          assert external['total_external_oracle_calls'] == 49
          assert external['trainable_parameter_count'] == 0

          assert verify['workflow_run_id'] == 32131078117
          assert verify['jobs']['canonical_full_gate']['conclusion'] == 'success'
          assert verify['jobs']['publish_full_gate']['conclusion'] == 'success'
          assert verify['frozen_source_lock']['passed'] is True
          assert verify['exact_evidence_recomputation'] == {'phase_a': True, 'external_numpy_2_4_6_square': True}
          assert verify['r264_focused'] == {'passed': 9, 'failed': 0}
          assert verify['protected_parent_lineage']['total_passed'] == 234
          assert verify['protected_parent_lineage']['failed'] == 0
          assert verify['cross_python'] == {'python_3_11':'success','python_3_13':'success'}
          assert verify['added_trainable_parameters'] == 0

          assert world['audit']['valid'] is True
          assert world['audit']['digest'] == 'a39a2f8fdc11cb711cded3d1537912d4bffb17fc85680270bf6409a8bcc76cc3'
          assert world['world_id'] == 'world4_710989051aaa4ef3'
          assert world['runtime_state']['fresh_verifications'] == 1
          assert world['runtime_state']['challengers_survived'] == 1
          assert world['w5']['passed'] is False
          assert world['w5']['score'] == 0.0

          assert manifest['status'] in {'ACCEPTED_BOUNDED_CAPABILITY_CANDIDATE','ACCEPTED_BOUNDED_CAPABILITY'}
          assert manifest['readiness'] == {'parent':49.1,'current':49.4,'delta':0.3,'kind':'internal_engineering_heuristic_not_agi_probability'}
          assert manifest['added_trainable_parameters'] == 0
          assert manifest['nolane_world']['w5_passed'] is False
          assert '49.4/100' in delivery
          assert '## R2.64 — 49.4 / 100' in readiness
          print('R264_RELEASE_BOUNDARY_OK')
          PY
      - name: Recompute exact authored evidence
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r264_unified_adaptive_repository_search import run_benchmark
          expected=json.loads(Path('R2_64_PHASE_A_RESULT.json').read_text())
          actual=run_benchmark()
          assert actual == expected
          print('R264_PHASE_A_RELEASE_RECOMPUTE_OK')
          PY
      - name: Recompute exact pinned NumPy transfer
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from research.r264_external_unified_transfer import run_external_transfer
          expected=json.loads(Path('R2_64_EXTERNAL_TRANSFER.json').read_text())
          actual=run_external_transfer(np.square, source_id='numpy.square', source_version=np.__version__)
          assert np.__version__ == '2.4.6'
          assert actual == expected
          print('R264_EXTERNAL_RELEASE_RECOMPUTE_OK')
          PY
      - name: Run R2.64 and accepted R2.63 regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_r264_*.py tests/test_r263_*.py
      - name: Create and verify complete repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.64-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.64-COMPLETE.zip | tee release/Nolane-AI-R2.64-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.64-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required={
              'R2_64_TDD_RED.json','R2_64_PRE_HOSTED_LOCK.json','R2_64_PHASE_A_RESULT.json',
              'R2_64_EXTERNAL_TRANSFER.json','R2_64_HOSTED_VERIFICATION.json','R2_64_WORLD_FINAL.json',
              'R2_64_DELIVERY.md','R2_64_RELEASE_MANIFEST.json','cogcoder/r264_unified_adaptive_repository_search.py',
              'benchmarks/kfigg/r264_unified_adaptive_repository_search.py','research/r264_external_unified_transfer.py',
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.64-COMPLETE.zip') as zf:
              names=set(zf.namelist())
          missing=required-names
          assert not missing, sorted(missing)
          print('R264_COMPLETE_ZIP_CONTENTS_OK', len(names))
          PY
      - name: Upload complete R2.64 repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.64-COMPLETE
          path: |
            release/Nolane-AI-R2.64-COMPLETE.zip
            release/Nolane-AI-R2.64-COMPLETE.zip.sha256
      - name: Publish release-bundle status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r264/release-bundle',
              'description':'R2.64 boundary, exact evidence, regressions and COMPLETE ZIP integrity passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R264_RELEASE_BUNDLE_STATUS_PUBLISHED')
          PY
