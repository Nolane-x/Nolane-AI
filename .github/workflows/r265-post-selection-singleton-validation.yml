name: R2.65 Post-Selection Singleton Challenger

on:
  pull_request:
    branches: [r265-verified-patch-language-induction-gpt56sol]
    paths:
      - '.github/workflows/r265-post-selection-singleton-validation.yml'
      - 'tests/test_r265_post_selection_singleton_misspec.py'
      - 'cogcoder/r265_verified_patch_primitive_induction.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run post-selection singleton misspecification challenger
        run: PYTHONPATH=. python -m pytest -q tests/test_r265_post_selection_singleton_misspec.py
