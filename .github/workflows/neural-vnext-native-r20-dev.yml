name: Neural vNext Native R20 Dev

on:
  push:
    branches:
      - codex/neural-native-r20-advantage-consensus
    paths:
      - 'model/neural-vnext-native-r20/**'
      - '.github/workflows/neural-vnext-native-r20-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r20/**'
      - '.github/workflows/neural-vnext-native-r20-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r20-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r20-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile and run R20 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r20:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r20/*.py model/neural-vnext-native-r20/scripts/*.py model/neural-vnext-native-r20/tests/*.py
          python -m pytest -q model/neural-vnext-native-r20/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r20/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r20/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['benchmark']['development_indices']==[1120,1151]
          assert lock['benchmark']['confirmation_indices']==[1152,1183]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          assert lock['governance']['no_dev_threshold_tuning'] is True
          PY

      - name: Train, calibrate, and run locked R20 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r20:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r20-output
          python model/neural-vnext-native-r20/scripts/run_dev.py             --checkpoint r20-output/r20.pt             --manifest r20-output/r20.manifest.json             --dev-result r20-output/r20.dev.json

      - name: Enforce fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r20-output/r20.manifest.json').read_text())
          assert manifest['fresh_opened'] is False
          assert manifest['status'] in {
              'R20_DEV_ELIGIBLE_FRESH_UNOPENED',
              'R20_DEV_REJECTED_FRESH_UNOPENED',
          }
          PY

      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r20-dev
          path: |
            r20-output/r20.pt
            r20-output/r20.manifest.json
            r20-output/r20.dev.json
          if-no-files-found: error
          retention-days: 90
