name: Neural R2.4 Runtime Cognition Activation

on:
  push:
    branches:
      - neural-r24-runtime-cognition-activation-gpt56sol
      - main
    paths:
      - 'nolane/neural/**'
      - 'nolane/memory/**'
      - 'nolane/metadata/runtime_state_map.py'
      - 'nolane/external_core/context.py'
      - 'nolane/external_core/_execution_base.py'
      - 'nolane/external_core/execution_types.py'
      - 'nolane/external_core/execution.py'
      - 'nolane/external_core/execution_neural.py'
      - 'cogcoder/organization/execution.py'
      - 'cogcoder/organization/runtime_core.py'
      - 'cogcoder/organization/runtime.py'
      - 'tests/test_neural_r24_*.py'
      - 'tests/test_refoundation_runtime_state_map.py'
      - 'tests/test_refoundation_wave2_zero_loss_runtime_digest.py'
      - '.github/workflows/neural-r24-runtime-activation.yml'
  pull_request:
    paths:
      - 'nolane/neural/**'
      - 'nolane/memory/**'
      - 'nolane/metadata/runtime_state_map.py'
      - 'nolane/external_core/context.py'
      - 'nolane/external_core/_execution_base.py'
      - 'nolane/external_core/execution_types.py'
      - 'nolane/external_core/execution.py'
      - 'nolane/external_core/execution_neural.py'
      - 'cogcoder/organization/execution.py'
      - 'cogcoder/organization/runtime_core.py'
      - 'cogcoder/organization/runtime.py'
      - 'tests/test_neural_r24_*.py'
      - 'tests/test_refoundation_runtime_state_map.py'
      - 'tests/test_refoundation_wave2_zero_loss_runtime_digest.py'
      - '.github/workflows/neural-r24-runtime-activation.yml'

permissions:
  contents: read

jobs:
  runtime-activation:
    if: "${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile runtime activation seam
        run: |
          python -m py_compile \
            nolane/neural/core_contract.py \
            nolane/neural/inference_bridge.py \
            nolane/memory/context_intelligence.py \
            nolane/memory/context.py \
            nolane/metadata/runtime_state_map.py \
            nolane/external_core/context.py \
            nolane/external_core/_execution_base.py \
            nolane/external_core/execution_types.py \
            nolane/external_core/execution.py \
            nolane/external_core/execution_neural.py \
            cogcoder/organization/execution.py \
            cogcoder/organization/runtime_core.py \
            cogcoder/organization/runtime.py
      - name: Run Neural R2.4 runtime activation contract suite
        run: python -m pytest -q tests/test_neural_r24_*.py
      - name: Verify frozen Neural R2.3 checkpoint authority
        run: python model/neural-r2.3/scripts/verify_neural_r23.py

  dependent-regression:
    if: "${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}"
    runs-on: ubuntu-24.04
    needs: runtime-activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Run execution, context, memory, assurance and state-closure regressions
        run: |
          python -m pytest -q \
            tests/test_refoundation_runtime_state_map.py \
            tests/test_refoundation_wave2_zero_loss_runtime_digest.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 checkpoint authority
        run: python model/neural-r2.3/scripts/verify_neural_r23.py

  full-regression:
    if: "${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}"
    runs-on: ubuntu-24.04
    needs: runtime-activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Run campaign and Parts I-XV regression suite
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 checkpoint authority
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
