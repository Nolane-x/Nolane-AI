name: R2.67.1 Final Post-Merge Complete Bundle

on:
  push:
    branches: [main]
    paths:
      - 'R2_67_1_HOSTED_VERIFICATION.json'
      - 'R2_67_1_WORLD_FINAL.json'
      - 'R2_67_1_RELEASE_MANIFEST.json'
      - 'R2_67_1_DELIVERY.md'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify accepted R2.67.1 source lock is in main history
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'], check=True)
          for path, expected in lock['frozen_git_blobs'].items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R267_1_POST_MERGE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Run R2.67.1 exact-main contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  final-bundle:
    needs: [cross-python]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install release dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
      - name: Verify final release authority records and frozen boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          required = (
              'R2_67_1_PRE_HOSTED_LOCK.json',
              'R2_67_1_PHASE_A_RESULT.json',
              'R2_67_1_EXTERNAL_TRANSFER.json',
              'R2_67_1_HOSTED_VERIFICATION.json',
              'R2_67_1_WORLD_FINAL.json',
              'R2_67_1_RELEASE_MANIFEST.json',
              'R2_67_1_DELIVERY.md',
          )
          for path in required:
              assert Path(path).is_file(), path
          lock = json.loads(Path('R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          hosted = json.loads(Path('R2_67_1_HOSTED_VERIFICATION.json').read_text())
          world = json.loads(Path('R2_67_1_WORLD_FINAL.json').read_text())
          manifest = json.loads(Path('R2_67_1_RELEASE_MANIFEST.json').read_text())
          assert hosted['milestone'] == 'R2.67.1' and hosted['conclusion'] == 'success'
          assert hosted['source_freeze_head'] == lock['source_freeze_head']
          assert world['milestone'].startswith('R2.67.1')
          assert world['audit']['valid'] is True
          assert world['gate']['passed'] is False
          assert world['convergence_forced'] is False
          assert manifest['milestone'] == 'R2.67.1'
          assert manifest['status'] == 'ACCEPTED_BOUNDED_CAPABILITY'
          assert manifest['source_freeze_head'] == lock['source_freeze_head']
          assert manifest['readiness']['delta'] <= 0.0
          for path, expected in lock['frozen_git_blobs'].items():
              actual = subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'], check=True)
          print('R267_1_POST_MERGE_AUTHORITY_OK')
          PY
      - name: Recompute exact authored and external evidence on main
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer
          assert np.__version__ == '2.4.6'
          phase = run_benchmark()
          external = run_external_transfer(np.dot, source_id='numpy:numpy.dot', source_version=np.__version__)
          assert phase == json.loads(Path('R2_67_1_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('R2_67_1_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True and phase['false_accepts'] == 0
          assert external['passed'] is True and external['false_accepts'] == 0
          assert external['oracle_accounting_exact'] is True
          print('R267_1_POST_MERGE_EXACT_EVIDENCE_OK')
          PY
      - name: Run R2.67.1 and protected lineage on main
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Create and verify exact-main complete repository snapshot
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.67.1-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.67.1-COMPLETE.zip | tee release/Nolane-AI-R2.67.1-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.67.1-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required = {
              'R2_67_1_PRE_HOSTED_LOCK.json',
              'R2_67_1_PHASE_A_RESULT.json',
              'R2_67_1_EXTERNAL_TRANSFER.json',
              'R2_67_1_HOSTED_VERIFICATION.json',
              'R2_67_1_WORLD_FINAL.json',
              'R2_67_1_RELEASE_MANIFEST.json',
              'R2_67_1_DELIVERY.md',
              'cogcoder/r267_three_probe_causal_composition.py',
              'benchmarks/kfigg/r267_1_genuine_three_probe.py',
              'research/r267_1_external_cyclic_dot_transfer.py',
              '.github/workflows/r267-1-post-merge-release-bundle.yml',
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.67.1-COMPLETE.zip') as zf:
              names = set(zf.namelist())
          missing = required - names
          assert not missing, sorted(missing)
          print('R267_1_POST_MERGE_COMPLETE_ZIP_OK', len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.67.1-COMPLETE-POST-MERGE
          path: |
            release/Nolane-AI-R2.67.1-COMPLETE.zip
            release/Nolane-AI-R2.67.1-COMPLETE.zip.sha256
      - name: Publish final R2.67.1 post-merge status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r2671/post-merge-complete-bundle',
              'description':'R2.67.1 exact-main lock, release records, evidence, cross-Python, lineage and COMPLETE ZIP passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R267_1_POST_MERGE_STATUS_PUBLISHED')
          PY
