name: R2.67.1 Final Post-Merge Complete Bundle

on:
  push:
    branches: [main]
    paths:
      - 'archive/root-history/historical_r_series/R2_67_1_*.json'
      - 'cogcoder/r267_three_probe_causal_composition.py'
      - 'benchmarks/kfigg/r267_1_*.py'
      - 'research/r267_1_*.py'
      - 'tests/test_r267_1_*.py'
      - 'tests/test_r267_independent_ablation_completeness.py'
      - '.github/workflows/r267-1-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cross-python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Verify frozen R2.67.1 source is in exact main history
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'], check=True)
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['frozen_evidence_changes_after_lock_forbidden'] is True
          assert lock['authority_corrections']['triplet_budget_semantic_invariance'] is True
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R267_1_POST_MERGE_SOURCE_LOCK_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Run exact-main R2.67.1 and accepted R2.66 contracts
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  final-bundle:
    needs: [cross-python]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install final release dependencies
        run: python -m pip install pytest z3-solver 'numpy==2.4.6' meson-python ninja
      - name: Verify accepted-main frozen authority boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import json, subprocess
          from pathlib import Path
          required=(
              'archive/root-history/historical_r_series/R2_67_1_PRE_HOSTED_LOCK.json',
              'archive/root-history/historical_r_series/R2_67_1_PHASE_A_RESULT.json',
              'archive/root-history/historical_r_series/R2_67_1_EXTERNAL_TRANSFER.json',
              'cogcoder/r267_three_probe_causal_composition.py',
              'benchmarks/kfigg/r267_1_genuine_three_probe.py',
              'research/r267_1_external_cyclic_dot_transfer.py',
              'tests/test_r267_1_triplet_budget_semantics.py',
              '.github/workflows/r267-1-freeze-evidence.yml',
              '.github/workflows/r267-1-canonical-gate.yml',
              '.github/workflows/r267-1-release-bundle.yml',
              '.github/workflows/r267-1-post-merge-release-bundle.yml',
          )
          for path in required:
              assert Path(path).is_file(), path
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_67_1_PRE_HOSTED_LOCK.json').read_text())
          assert lock['parent_release_commit'] == '43b43ce4b324b0d74357957af18dd0f60b1cb85e'
          assert lock['production_source_changes_after_lock_forbidden'] is True
          assert lock['frozen_evidence_changes_after_lock_forbidden'] is True
          a=lock['authority_corrections']
          assert a['subset_specific_ablation_fields'] is True
          assert a['uncertified_search_miss_fails_closed'] is True
          assert a['public_collision_certificate_required_for_lower_order_insufficiency'] is True
          assert a['attempted_case_receipt_accounting'] is True
          assert a['oracle_ledger_exact'] is True
          assert a['positive_domain_triangle_min_robustness'] is True
          assert a['triplet_budget_semantic_invariance'] is True
          subprocess.run(['git','merge-base','--is-ancestor',lock['source_freeze_head'],'HEAD'], check=True)
          for path, expected in lock['frozen_git_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',path], text=True).strip()
              assert actual == expected, (path, actual, expected)
          print('R267_1_POST_MERGE_AUTHORITY_OK', len(lock['frozen_git_blobs']))
          PY
      - name: Recompute exact authored and pinned NumPy evidence on main
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from benchmarks.kfigg.r267_1_genuine_three_probe import run_benchmark
          from research.r267_1_external_cyclic_dot_transfer import run_external_transfer
          assert np.__version__ == '2.4.6'
          phase=run_benchmark()
          external=run_external_transfer(np.dot, source_id='numpy:numpy.dot', source_version=np.__version__)
          assert phase == json.loads(Path('archive/root-history/historical_r_series/R2_67_1_PHASE_A_RESULT.json').read_text())
          assert external == json.loads(Path('archive/root-history/historical_r_series/R2_67_1_EXTERNAL_TRANSFER.json').read_text())
          assert phase['all_gates_pass'] is True
          assert phase['false_accepts'] == 0
          assert phase['oracle_accounting_exact'] is True
          assert external['passed'] is True
          assert external['false_accepts'] == 0
          assert external['source_id'] == 'numpy:numpy.dot'
          assert external['source_exposure'] == 'io_only'
          assert external['oracle_calls_collision_certificates'] == 72
          assert external['oracle_accounting_exact'] is True
          print('R267_1_POST_MERGE_EXACT_EVIDENCE_OK')
          PY
      - name: Run R2.67.1 and protected accepted lineage on main
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r265_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r264_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r263_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r262_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r261_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r260_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r259_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r258_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r257_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r256_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r255_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r25[0-4]_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r24[1-9]_*.py
      - name: Create and verify exact-main complete repository snapshot
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=zip -o release/Nolane-AI-R2.67.1-COMPLETE.zip HEAD
          sha256sum release/Nolane-AI-R2.67.1-COMPLETE.zip | tee release/Nolane-AI-R2.67.1-COMPLETE.zip.sha256
          unzip -tq release/Nolane-AI-R2.67.1-COMPLETE.zip
          python - <<'PY'
          import zipfile
          required={
              'archive/root-history/historical_r_series/R2_67_1_PRE_HOSTED_LOCK.json',
              'archive/root-history/historical_r_series/R2_67_1_PHASE_A_RESULT.json',
              'archive/root-history/historical_r_series/R2_67_1_EXTERNAL_TRANSFER.json',
              'tests/test_r267_1_triplet_budget_semantics.py',
              '.github/workflows/r267-1-post-merge-release-bundle.yml',
          }
          with zipfile.ZipFile('release/Nolane-AI-R2.67.1-COMPLETE.zip') as zf:
              names=set(zf.namelist())
          missing=required-names
          assert not missing, sorted(missing)
          print('R267_1_POST_MERGE_COMPLETE_ZIP_OK', len(names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.67.1-COMPLETE-POST-MERGE
          path: |
            release/Nolane-AI-R2.67.1-COMPLETE.zip
            release/Nolane-AI-R2.67.1-COMPLETE.zip.sha256
      - name: Publish final R2.67.1 post-merge status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload=json.dumps({
              'state':'success',
              'context':'r2671/post-merge-complete-bundle',
              'description':'Accepted main source lock, triplet fairness, exact evidence, cross-Python, lineage and COMPLETE ZIP passed',
              'target_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }).encode()
          req=urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=payload,
              headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'},
              method='POST',
          )
          urllib.request.urlopen(req).read()
          print('R267_1_POST_MERGE_STATUS_PUBLISHED')
          PY
