name: Refoundation Wave 5AO Authority Carrier

on:
  push:
    branches:
      - refoundation/epoch0-wave5ao-native-individual-evolution

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Materialize Wave 5AO authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          implementation = Path('cogcoder/refoundation/implementation_status.py')
          text = implementation.read_text(encoding='utf-8')
          if '"external.individual_evolution": (' not in text:
              anchor = '    "external.artifacts": (\n'
              entry = '''    "external.individual_evolution": (\n        "nolane.external_core.individual_evolution",\n        (\n            "cogcoder/organization/individual_evolution.py",\n            "cogcoder/organization/evolution_profiles.py",\n        ),\n        "Native individual-evolution lineage, profile, learning, self-model, neural challenger and longitudinal benchmark authority over canonical assurance, verification, identity, skill, experience, self-model, evidence and digest dependencies; historical individual-evolution/profile modules bridge exact semantic public identities.",\n    ),\n'''
              if anchor not in text:
                  raise SystemExit('implementation ledger insertion anchor missing')
              text = text.replace(anchor, entry + anchor, 1)
              implementation.write_text(text, encoding='utf-8')

          versions = Path('tests/test_refoundation_component_versions.py')
          text = versions.read_text(encoding='utf-8')
          if '"external.individual_evolution": 1,' not in text:
              anchor = '    "external.assurance": 1,\n'
              if anchor not in text:
                  raise SystemExit('component-version oracle insertion anchor missing')
              text = text.replace(anchor, anchor + '    "external.individual_evolution": 1,\n', 1)
              versions.write_text(text, encoding='utf-8')

          predecessor = Path('tests/test_refoundation_wave5an_native_external_assurance.py')
          text = predecessor.read_text(encoding='utf-8')
          text = text.replace('assert len(state["components"]) == 9', 'assert len(state["components"]) <= 9')
          predecessor.write_text(text, encoding='utf-8')

          status = Path('CURRENT/STATUS.md')
          text = status.read_text(encoding='utf-8')
          if '## Wave 5AO — native individual evolution authority' not in text:
              text += '''\n\n## Wave 5AO — native individual evolution authority\n\nWave 5AO retires `external.individual_evolution` by moving the individual-evolution control plane and evolution-profile authority under canonical `nolane.external_core` ownership. Canonical code resolves assurance, verification, identity, skills, experience, self-model, evidence and digest dependencies only through `nolane` authorities; historical `cogcoder.organization.individual_evolution` and `evolution_profiles` are exact semantic public-object bridges. The generated native-debt projection moves from 9 to 8 non-native component records.\n'''
              status.write_text(text, encoding='utf-8')
          PY
      - name: Materialize repository audit projections
        run: python -m nolane.repository.audit --write
      - name: Verify generated authority is fresh
        run: |
          python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
          python -m nolane.ai.materialize --check
          python -m nolane.repository.audit --check
      - name: Run Refoundation contracts
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Run broad regressions
        run: |
          python -m pytest -q \
            tests/test_coding_agi_campaign_*.py \
            tests/test_coding_agi_execution_*.py \
            tests/test_coding_agi_evaluation_*.py \
            tests/test_coding_agi_foundry_*.py \
            tests/test_coding_agi_coordination_*.py \
            tests/test_coding_agi_evolution_*.py \
            tests/test_coding_agi_individual_evolution_*.py \
            tests/test_coding_agi_memory_*.py \
            tests/test_coding_agi_context_intelligence.py \
            tests/test_coding_agi_research_*.py \
            tests/test_coding_agi_ops_*.py \
            tests/test_coding_agi_assurance_*.py \
            tests/test_coding_agi_ui_*.py \
            tests/test_coding_agi_debug_*.py \
            tests/test_coding_agi_code_claims.py \
            tests/test_coding_agi_coding_*.py \
            tests/test_coding_agi_foundation_*.py \
            tests/test_coding_agi_central_*.py \
            tests/test_coding_agi_requirements_*.py \
            tests/test_coding_agi_master_plan.py \
            tests/test_coding_agi_planning_*.py \
            tests/test_coding_agi_plan_reconciliation.py \
            tests/test_coding_agi_architecture_*.py \
            tests/test_coding_agi_integration_*.py
      - name: Verify frozen Neural R2.3 metadata contracts
        run: python model/neural-r2.3/scripts/verify_neural_r23.py
      - name: Commit verified Wave 5AO authority receipts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cogcoder/refoundation/implementation_status.py \
                  tests/test_refoundation_component_versions.py \
                  tests/test_refoundation_wave5an_native_external_assurance.py \
                  CURRENT/STATUS.md CURRENT/NATIVE_DEBT.json CURRENT/NATIVE_DEBT.md archive/INDEX.json
          if git diff --cached --quiet; then
            echo 'No carrier changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(refoundation): materialize Wave 5AO authority receipts'
          git push origin HEAD:refoundation/epoch0-wave5ao-native-individual-evolution
