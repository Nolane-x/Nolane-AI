name: Neural vNext Native R3 Accepted Authority

on:
  push:
    paths:
      - 'model/neural-vnext-native-r3/**'
      - '.github/workflows/neural-vnext-native-r3-dev.yml'
  pull_request:
    paths:
      - 'model/neural-vnext-native-r3/**'
      - '.github/workflows/neural-vnext-native-r3-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_CHECKPOINT_SHA256: '8c2ba53e81b51d1418cbb7abead6380808dc558cde02af9e63bf8020f92e95da'
      EXPECTED_STATE_SHA256: '6ecf000191d6212953c8f3a77b5f3de697795f9797c75da70ddd838003531c1e'
      EXPECTED_MANIFEST_SHA256: '388b47e71cd83069c40af0ccad495bf340f19a037fb09ddbf3bb26deb4fccb8d'
      EXPECTED_DEV_SHA256: '85f8b1250b288d9e67327126f4b3895becb6c8be7c2ede926040dae3e6c1abdf'
      EXPECTED_CHECKPOINT_SIZE: '2854493'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify repository-archived accepted materialization
        run: |
          test -f model/neural-vnext-native-r3/accepted/r3.pt
          test "$(stat -c %s model/neural-vnext-native-r3/accepted/r3.pt)" = "$EXPECTED_CHECKPOINT_SIZE"
          test "$(sha256sum model/neural-vnext-native-r3/accepted/r3.pt | awk '{print $1}')" = "$EXPECTED_CHECKPOINT_SHA256"
          test "$(sha256sum model/neural-vnext-native-r3/accepted/r3.manifest.json | awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA256"
          test "$(sha256sum model/neural-vnext-native-r3/accepted/r3.dev.json | awk '{print $1}')" = "$EXPECTED_DEV_SHA256"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("model/neural-vnext-native-r3")
          archive = json.loads((root / "accepted/ARCHIVE_AUTHORITY.json").read_text())
          accepted = json.loads((root / "ACCEPTED_AUTHORITY.json").read_text())
          closure = json.loads((root / "evidence/ACCEPTANCE_CLOSURE.json").read_text())
          fresh = json.loads((root / "evidence/FRESH_COURT_001.json").read_text())
          negative = json.loads((root / "evidence/PHASE2_NEGATIVE_001.json").read_text())

          assert archive["status"] == "ARCHIVED_ACCEPTED_CHECKPOINT"
          assert archive["checkpoint_sha256"] == "8c2ba53e81b51d1418cbb7abead6380808dc558cde02af9e63bf8020f92e95da"
          assert accepted["status"] == "ACCEPTED"
          assert accepted["accepted_candidate"]["checkpoint_sha256"] == archive["checkpoint_sha256"]
          assert accepted["accepted_candidate"]["state_dict_sha256"] == "6ecf000191d6212953c8f3a77b5f3de697795f9797c75da70ddd838003531c1e"
          assert accepted["repository_archive"]["git_lfs_oid"] == "sha256:8c2ba53e81b51d1418cbb7abead6380808dc558cde02af9e63bf8020f92e95da"
          assert accepted["repository_archive"]["size_bytes"] == 2854493
          assert closure["status"] == "ACCEPTANCE_CLOSED"
          assert closure["accepted_materialization_archived_in_repository"] is True
          assert fresh["status"] == "FRESH_ACCEPTED"
          assert fresh["preregistered_promotion_gate"]["accepted"] is True
          assert fresh["fresh_court"]["candidate"]["solved"] == 147
          assert fresh["fresh_court"]["parent"]["solved"] == 142
          assert negative["status"] == "R3_PHASE2_NEGATIVE_RESULT_FROZEN"
          PY

      - name: Compile R3 source and contracts
        run: |
          python -m py_compile \
            model/neural-vnext-native/*.py \
            model/neural-vnext-native-r2/*.py \
            model/neural-vnext-native-r3/*.py \
            model/neural-vnext-native-r3/scripts/*.py \
            model/neural-vnext-native-r3/tests/*.py

      - name: Run R3 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: python -m pytest -q model/neural-vnext-native-r3/tests

      - name: Load accepted R3 checkpoint and verify embedded authority
        env:
          PYTHONPATH: model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python - <<'PY'
          from attributed_training import load_r3_checkpoint

          model, metadata = load_r3_checkpoint("model/neural-vnext-native-r3/accepted/r3.pt")
          assert metadata["checkpoint_sha256"] == "8c2ba53e81b51d1418cbb7abead6380808dc558cde02af9e63bf8020f92e95da"
          assert metadata["state_dict_sha256"] == "6ecf000191d6212953c8f3a77b5f3de697795f9797c75da70ddd838003531c1e"
          assert metadata["parameters"] == 707990
          assert metadata["successor_parameters"] == 171905
          assert metadata["training_summary"]["selected_candidate"] == "attributed_broad"
          assert metadata["training_summary"]["fresh_opened"] is False
          assert model.parent is not None
          print("accepted_r3_checkpoint_authority=verified")
          PY
