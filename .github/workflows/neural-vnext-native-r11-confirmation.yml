name: Neural vNext Native R11 Confirmation

on:
  push:
    branches:
      - codex/neural-native-r11-causal-version-space
    paths:
      - 'model/neural-vnext-native-r11/PRE_CONFIRM_LOCK.json'
      - 'model/neural-vnext-native-r11/evidence/PRIMARY_DEV_REPRO_001.json'
      - 'model/neural-vnext-native-r11/scripts/evaluate_confirmation.py'
      - '.github/workflows/neural-vnext-native-r11-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen R11 source and selection authority
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r11/PRE_CONFIRM_LOCK.json').read_text())
          assert lock['status']=='FROZEN_CONFIRMATION_UNOPENED'
          assert lock['selected_candidate']=='causal_horizon1'
          assert lock['selected_config']=={'horizon':1,'max_support':3}
          assert lock['primary_evidence']['promotion_metrics_reproduced'] is True
          assert lock['primary_evidence']['trajectory_bitwise_reproduced'] is False
          assert lock['confirmation']['indices']==[576,607]
          assert lock['confirmation']['opened'] is False
          assert lock['fresh']=={'split':'fresh','indices':[240,279],'opened':False}
          for relative,expected in lock['frozen_source_blobs'].items():
              actual=subprocess.check_output(['git','hash-object',relative],text=True).strip()
              assert actual==expected,(relative,expected,actual)
          PY
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile frozen confirmation evaluator
        env:
          PYTHONPATH: model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r11/scripts/evaluate_confirmation.py
      - name: Open disjoint R11 confirmation court
        env:
          PYTHONPATH: model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r11-confirmation
          python model/neural-vnext-native-r11/scripts/evaluate_confirmation.py --result r11-confirmation/confirmation.json
      - name: Upload immutable R11 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r11-confirmation-576-607
          path: r11-confirmation/confirmation.json
          if-no-files-found: error
          retention-days: 90
