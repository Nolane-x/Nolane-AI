name: E Acting Final Current Main Verification

on:
  push:
    branches:
      - e-acting-final-current-main-verify-gpt56sol

jobs:
  final-e-acting:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Assert exact integration ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 773ef6a27d6629f9f571fbefef72f4eb744cbc8d^)" = "b38291098ca51131016d490bbc24cfee28cd6b7f"
          git merge-base --is-ancestor b38291098ca51131016d490bbc24cfee28cd6b7f 773ef6a27d6629f9f571fbefef72f4eb744cbc8d
      - name: Compile E authority modules
        run: |
          python -m py_compile \
            nolane/external_core/acting_protocol.py \
            nolane/external_core/acting_runtime.py \
            nolane/external_core/execution.py \
            nolane/external_core/execution_executor.py \
            nolane/external_core/execution_types.py \
            nolane/external_core/execution_workspace.py \
            nolane/external_core/invokable.py \
            nolane/neural/inference_bridge.py \
            nolane/metadata/component_versions.py
      - name: Run final E regression suite
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_*.py \
            tests/test_refoundation_wave5r_native_invokable_cores.py \
            tests/test_refoundation_wave5s_native_execution_workspace.py \
            tests/test_refoundation_wave5w_native_execution_executor.py \
            tests/test_refoundation_wave5z_native_neural_inference.py \
            tests/test_refoundation_wave5aa_native_execution_control.py
      - name: Verify integration diff hygiene
        shell: bash
        run: |
          git diff --check b38291098ca51131016d490bbc24cfee28cd6b7f..773ef6a27d6629f9f571fbefef72f4eb744cbc8d
