name: Diagnose R2.68 Frozen Phase Evidence

on:
  push:
    branches: [validation-r268-phase-evidence-diff-gpt56sol]
    paths: ['.github/workflows/diag-r268-phase-evidence-diff.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.4.6'
      - name: Recompute under fixed hash seeds and print structural diff
        run: |
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path

          frozen=json.loads(Path('R2_68_PHASE_A_RESULT.json').read_text())
          worker="""
          import json
          from benchmarks.kfigg.r268_adaptive_causal_basis import run_benchmark
          print(json.dumps(run_benchmark(),sort_keys=True,separators=(',',':'),allow_nan=False))
          """

          def digest(obj):
              raw=json.dumps(obj,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
              return hashlib.sha256(raw).hexdigest()

          def diffs(a,b,path='$',out=None):
              if out is None: out=[]
              if type(a) is not type(b):
                  out.append((path,'TYPE',type(a).__name__,type(b).__name__)); return out
              if isinstance(a,dict):
                  ka=set(a); kb=set(b)
                  for k in sorted(ka-kb): out.append((f'{path}.{k}','MISSING_RECOMPUTED',a[k],None))
                  for k in sorted(kb-ka): out.append((f'{path}.{k}','EXTRA_RECOMPUTED',None,b[k]))
                  for k in sorted(ka&kb): diffs(a[k],b[k],f'{path}.{k}',out)
              elif isinstance(a,list):
                  if len(a)!=len(b): out.append((path,'LEN',len(a),len(b)))
                  for i,(x,y) in enumerate(zip(a,b)): diffs(x,y,f'{path}[{i}]',out)
              elif a!=b:
                  out.append((path,'VALUE',a,b))
              return out

          print('FROZEN_DIGEST',digest(frozen))
          observed={}
          for seed in ('0','1','2','42','12345'):
              env=dict(os.environ,PYTHONHASHSEED=seed,PYTHONPATH='.')
              raw=subprocess.check_output([sys.executable,'-c',worker],env=env,text=True)
              current=json.loads(raw)
              d=digest(current); observed.setdefault(d,[]).append(seed)
              delta=diffs(frozen,current)
              print('SEED',seed,'DIGEST',d,'DIFF_COUNT',len(delta))
              for row in delta[:80]: print('DIFF',json.dumps(row,sort_keys=False,default=str))
          print('UNIQUE_RECOMPUTED_DIGESTS',json.dumps(observed,sort_keys=True))
          PY
