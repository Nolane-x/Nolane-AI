name: R2.69 Authored Benchmark Audit

on:
  pull_request:
    paths:
      - 'benchmarks/kfigg/r269_meta_learning.py'
      - 'tests/test_r269_benchmark.py'
      - 'tests/test_r269_scratch_compositional_closure.py'
      - 'cogcoder/r269_meta_learning_kernel.py'
      - 'cogcoder/r269_transfer_runtime.py'
      - '.github/workflows/r269-scratch-closure-proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Protected R2.68 safety
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Emit exact authored evidence
        env:
          PYTHONHASHSEED: '777'
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          result = run_benchmark()
          print(json.dumps({
              'positive_targets': result['positive_targets'],
              'positive_transfer_solved': result['positive_transfer_solved'],
              'tight_cold_scratch_solved': result['tight_cold_scratch_solved'],
              'roomy_scratch_solved': result['roomy_scratch_solved'],
              'ablation_solved': result['source_prior_ablation_solved'],
              'shuffled_prior_solved': result['shuffled_prior_solved'],
              'ablation_removed_fraction': result['source_prior_ablation_advantage_removed_fraction'],
              'median_transfer_diagnostic_calls': result['median_transfer_diagnostic_calls'],
              'median_cold_solved_diagnostic_calls': result['median_cold_solved_diagnostic_calls'],
              'median_transfer_search_work': result['median_transfer_search_work'],
              'median_tight_scratch_search_work': result['median_tight_scratch_search_work'],
              'negative_targets': result['negative_targets'],
              'negative_transfer_false_accepts': result['negative_transfer_false_accepts'],
              'continued_scratch_correctness_preserved': result['continued_scratch_correctness_preserved'],
              'max_negative_transfer_diagnostic_regret': result['max_negative_transfer_diagnostic_regret'],
              'false_accepts': result['false_accepts'],
              'authored_gate_pass': result['authored_gate_pass'],
              'semantic_result_digest': result['semantic_result_digest'],
          }, sort_keys=True))
          PY
      - name: Benchmark contract
        run: PYTHONPATH=. python -m pytest -q tests/test_r269_benchmark.py tests/test_r269_scratch_compositional_closure.py
