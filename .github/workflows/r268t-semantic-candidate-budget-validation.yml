name: R2.68-T Semantic Candidate Budget Validation

on:
  pull_request:
    branches: [r268-cross-task-causal-transfer-gpt56sol]
    paths:
      - 'tests/test_r268_semantic_candidate_budget.py'
      - 'scripts/r268t_apply_semantic_candidate_budget.py'
      - '.github/workflows/r268t-semantic-candidate-budget-validation.yml'
      - 'cogcoder/r268_cross_task_causal_transfer.py'
      - 'cogcoder/r268_cross_task_transfer_baseline.py'
      - 'benchmarks/kfigg/r268_cross_task_causal_transfer.py'

permissions:
  contents: read

jobs:
  cross-version-proposed-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Apply semantic candidate-budget proposal in runner only
        run: PYTHONPATH=. python scripts/r268t_apply_semantic_candidate_budget.py
      - name: Python 3.11 full R2.68-T focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Python 3.11 authored fair-budget benchmark
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r268_cross_task_causal_transfer import run_benchmark
          result = run_benchmark()
          assert result['all_gates_pass'] is True
          assert result['candidate_budget_unit'] == 'proof_distinct_hypotheses'
          assert result['transfer_vs_tight_scratch_same_candidate_budget'] is True
          assert result['positive_transfer_exact'] == 3
          assert result['tight_scratch_exact'] == 1
          assert result['transfer_advantage_over_tight_scratch'] == 2
          assert result['source_prior_ablation_exact'] == 0
          assert result['roomy_scratch_exact'] == 3
          assert result['negative_transfer_abstained'] == 2
          assert result['false_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          PY

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - name: Confirm proposal remains materialized
        run: PYTHONPATH=. python scripts/r268t_apply_semantic_candidate_budget.py
      - name: Python 3.13 full R2.68-T focused suite
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Python 3.13 authored fair-budget benchmark
        run: |
          PYTHONPATH=. python - <<'PY'
          from benchmarks.kfigg.r268_cross_task_causal_transfer import run_benchmark
          result = run_benchmark()
          assert result['all_gates_pass'] is True
          assert result['candidate_budget_unit'] == 'proof_distinct_hypotheses'
          assert result['transfer_vs_tight_scratch_same_candidate_budget'] is True
          assert result['positive_transfer_exact'] == 3
          assert result['tight_scratch_exact'] == 1
          assert result['transfer_advantage_over_tight_scratch'] == 2
          assert result['source_prior_ablation_exact'] == 0
          assert result['roomy_scratch_exact'] == 3
          assert result['negative_transfer_abstained'] == 2
          assert result['false_accepts'] == 0
          assert result['trainable_parameter_count'] == 0
          PY
