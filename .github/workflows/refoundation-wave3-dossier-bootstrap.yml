name: Refoundation Wave 3 Dossier Bootstrap

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave2c-native-central
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave3-ai-first-authority' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize canonical resolved dossiers
        run: python -m nolane.ai.materialize --write

      - name: Verify materialized dossiers are fresh
        run: python -m nolane.ai.materialize --check

      - name: Commit derived dossiers when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ai)" ]; then
            echo 'No dossier changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/*/RESOLVED.json ai/*/RESOLVED.md
          if git diff --cached --quiet; then
            echo 'No staged dossier changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(refoundation): materialize 67 AI resolved dossiers'
          git push origin HEAD:${GITHUB_HEAD_REF}
