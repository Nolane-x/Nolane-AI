name: Refoundation Wave 5G Identity Schemas Bootstrap

on:
  pull_request:
    branches:
      - refoundation/epoch0-wave5f-native-canonical-digest
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: >-
      github.head_ref == 'refoundation/epoch0-wave5g-native-identity-schemas' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply deterministic Wave 5G authority cutover
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          TARGET = {
              'PHYSICAL_PARAMETER_CEILING',
              'AgentRank',
              'AgentStatus',
              'ParameterAccounting',
              'AgentIdentity',
          }
          EXPECTED_IMPORT_FILES = {
              'nolane/external_core/verification.py',
              'nolane/organization/central.py',
              'nolane/organization/coordination.py',
              'nolane/organization/coordination_leases.py',
              'nolane/organization/identity.py',
              'nolane/organization/lifecycle.py',
              'cogcoder/refoundation/canonical_runtime.py',
              'cogcoder/refoundation/identity_source.py',
          }

          def insert_after_once(path: str, anchor: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if addition in text:
                  return
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{path}: insertion anchor count != 1: {count}')
              target.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          # Remove exactly the five accepted top-level identity definitions from mixed types.py.
          # ClassDef.lineno starts at `class`, not at decorators, so decorated classes must
          # remove their decorator span as part of the same semantic definition.
          types_path = Path('cogcoder/organization/types.py')
          source = types_path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(types_path))
          lines = source.splitlines(keepends=True)
          spans: list[tuple[int, int, str]] = []
          found: set[str] = set()
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  names = {target.id for target in node.targets if isinstance(target, ast.Name)}
                  if 'PHYSICAL_PARAMETER_CEILING' in names:
                      spans.append((node.lineno - 1, node.end_lineno or node.lineno, 'PHYSICAL_PARAMETER_CEILING'))
                      found.add('PHYSICAL_PARAMETER_CEILING')
              elif isinstance(node, ast.ClassDef) and node.name in TARGET:
                  start_line = min(
                      [node.lineno, *(decorator.lineno for decorator in node.decorator_list)]
                  )
                  spans.append((start_line - 1, node.end_lineno or node.lineno, node.name))
                  found.add(node.name)
          if found != TARGET:
              raise SystemExit(f'types.py identity definition set mismatch: found={sorted(found)} expected={sorted(TARGET)}')
          for start, end, _ in sorted(spans, reverse=True):
              lines[start:end] = []
          source = ''.join(lines)
          bridge = (
              'from nolane.schemas.identity import (\n'
              '    PHYSICAL_PARAMETER_CEILING,\n'
              '    AgentIdentity,\n'
              '    AgentRank,\n'
              '    AgentStatus,\n'
              '    ParameterAccounting,\n'
              ')\n\n'
          )
          if bridge not in source:
              anchor = 'from nolane.core.canonical_digest import canonical_digest, canonical_json\n\n'
              if source.count(anchor) != 1:
                  raise SystemExit('types.py canonical-digest import anchor not unique')
              source = source.replace(anchor, anchor + bridge, 1)
          types_path.write_text(source, encoding='utf-8')

          def alias_text(alias: ast.alias) -> str:
              return alias.name if alias.asname is None else f'{alias.name} as {alias.asname}'

          def rewrite_imports(path: Path) -> bool:
              source = path.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(path))
              lines = source.splitlines(keepends=True)
              changes: list[tuple[int, int, str]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.ImportFrom) or node.module != 'cogcoder.organization.types':
                      continue
                  moved = [alias for alias in node.names if alias.name in TARGET]
                  if not moved:
                      continue
                  remaining = [alias for alias in node.names if alias.name not in TARGET]
                  first = lines[node.lineno - 1]
                  indent = first[: len(first) - len(first.lstrip())]
                  replacement = (
                      indent + 'from nolane.schemas.identity import '
                      + ', '.join(alias_text(alias) for alias in moved) + '\n'
                  )
                  if remaining:
                      replacement += (
                          indent + 'from cogcoder.organization.types import '
                          + ', '.join(alias_text(alias) for alias in remaining) + '\n'
                      )
                  changes.append((node.lineno - 1, node.end_lineno or node.lineno, replacement))
              for start, end, replacement in sorted(changes, reverse=True):
                  lines[start:end] = [replacement]
              if changes:
                  path.write_text(''.join(lines), encoding='utf-8')
              return bool(changes)

          changed: set[str] = set()
          for root in (Path('nolane'), Path('cogcoder/refoundation')):
              for path in sorted(root.rglob('*.py')):
                  if rewrite_imports(path):
                      changed.add(path.as_posix())
          if changed != EXPECTED_IMPORT_FILES:
              raise SystemExit(
                  'identity import cutover file set mismatch: '
                  f'changed={sorted(changed)} expected={sorted(EXPECTED_IMPORT_FILES)}'
              )

          # Fail closed if any active reverse import remains.
          offenders: list[str] = []
          for root in (Path('nolane'), Path('cogcoder/refoundation')):
              for path in sorted(root.rglob('*.py')):
                  tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.ImportFrom) and node.module == 'cogcoder.organization.types':
                          moved = TARGET.intersection(alias.name for alias in node.names)
                          if moved:
                              offenders.append(f'{path}:{node.lineno}:{sorted(moved)}')
          if offenders:
              raise SystemExit('identity reverse imports remain: ' + '; '.join(offenders))

          # Advance only schemas.identity local revision.
          insert_after_once(
              'cogcoder/refoundation/component_versions.py',
              '        "core.canonical_digest": 1,\n',
              '        "schemas.identity": 1,\n',
          )

          # Canonical-native implementation ledger; retain mixed source as symbol-level provenance.
          impl = Path('cogcoder/refoundation/implementation_status.py')
          text = impl.read_text(encoding='utf-8')
          core_block = '''    "core.canonical_digest": (\n        "nolane.core.canonical_digest",\n        ("cogcoder/organization/types.py",),\n        "Native canonical JSON serialization and SHA-256 content identity; mixed historical types module bridges the two helper identities while unrelated schemas remain explicit debt.",\n    ),\n'''
          schema_block = '''    "schemas.identity": (\n        "nolane.schemas.identity",\n        ("cogcoder/organization/types.py",),\n        "Native permanent identity rank/status/parameter/namespace schema unit; mixed historical types module bridges exact objects while event/context/skill schemas remain separate debt.",\n    ),\n'''
          if schema_block not in text:
              if text.count(core_block) != 1:
                  raise SystemExit('implementation_status.py core block anchor not unique')
              text = text.replace(core_block, core_block + schema_block, 1)
          legacy_hint = '    "schemas.identity": ("cogcoder/organization/types.py",),\n'
          if legacy_hint in text:
              if text.count(legacy_hint) != 1:
                  raise SystemExit('implementation_status.py schemas.identity legacy hint not unique')
              text = text.replace(legacy_hint, '', 1)
          impl.write_text(text, encoding='utf-8')

          # Accepted revision/native-owner sets advance schemas.identity only.
          for path_string, set_name in (
              ('tests/test_refoundation_component_versions.py', 'ACCEPTED_REVISION_ONE_COMPONENTS'),
              ('tests/test_refoundation_implementation_status.py', 'ACCEPTED_CANONICAL_NATIVE_COMPONENTS'),
          ):
              path = Path(path_string)
              text = path.read_text(encoding='utf-8')
              set_anchor = f'{set_name} = {{\n'
              start = text.find(set_anchor)
              end = text.find('}\n', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'{path_string}: accepted set boundary missing')
              marker = '    "schemas.identity",\n'
              if marker not in text[start:end]:
                  insert_at = start + len(set_anchor)
                  text = text[:insert_at] + marker + text[insert_at:]
              path.write_text(text, encoding='utf-8')

          # Remove stale earlier-wave assertions that permanently freeze identity schema as legacy.
          stale = '    assert ledger["schemas.identity"].status is ImplementationStatus.LEGACY_INTERNAL\n'
          for path in sorted(Path('tests').glob('test_refoundation_wave5*.py')):
              if path.name == 'test_refoundation_wave5g_native_identity_schemas.py':
                  continue
              text = path.read_text(encoding='utf-8')
              if stale in text:
                  text = text.replace(stale, '')
                  path.write_text(text, encoding='utf-8')

          # Wave 5F keeps proving digest ownership without freezing later identity progress.
          wave5f = Path('tests/test_refoundation_wave5f_native_canonical_digest.py')
          text = wave5f.read_text(encoding='utf-8')
          text = text.replace('    assert len(non_native) == 39\n', '    assert len(non_native) <= 39\n')
          old_counts = '''    assert counts == {\n        "compatibility_facade": 28,\n        "frozen_asset": 1,\n        "historical_only": 7,\n        "legacy_internal": 3,\n    }\n'''
          new_counts = '''    assert ledger["core.canonical_digest"].status is ImplementationStatus.CANONICAL_NATIVE\n    assert all(row.component_id != "core.canonical_digest" for row in non_native)\n'''
          if old_counts in text:
              text = text.replace(old_counts, new_counts, 1)
          elif new_counts not in text:
              raise SystemExit('Wave 5F debt block is neither old nor updated')
          wave5f.write_text(text, encoding='utf-8')
          PY
      - name: Compile cutover state without staging generated bytecode
        run: python -m compileall -q cogcoder/organization cogcoder/refoundation nolane
      - name: Materialize native-debt projections
        run: python -m nolane.repository.audit --write
      - name: Prove historical archive index did not drift
        run: git diff --exit-code -- archive/INDEX.json
      - name: Verify no tracked Python bytecode
        run: python -m pytest -q tests/test_refoundation_wave5f_repository_hygiene.py
      - name: Verify Wave 5G targeted contracts
        run: |
          python -m nolane.repository.audit --check
          python -m pytest -q \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_git_inventory.py \
            tests/test_refoundation_wave5f_native_canonical_digest.py \
            tests/test_refoundation_wave5g_native_identity_schemas.py
      - name: Commit deterministic Wave 5G cutover with explicit staging
        shell: bash
        run: |
          git add \
            cogcoder/organization/types.py \
            cogcoder/refoundation/component_versions.py \
            cogcoder/refoundation/implementation_status.py \
            cogcoder/refoundation/canonical_runtime.py \
            cogcoder/refoundation/identity_source.py \
            nolane/external_core/verification.py \
            nolane/organization/central.py \
            nolane/organization/coordination.py \
            nolane/organization/coordination_leases.py \
            nolane/organization/identity.py \
            nolane/organization/lifecycle.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_implementation_status.py \
            tests/test_refoundation_wave5_native_evidence_foundations.py \
            tests/test_refoundation_wave5b_native_evidence.py \
            tests/test_refoundation_wave5f_native_canonical_digest.py \
            CURRENT/NATIVE_DEBT.json \
            CURRENT/NATIVE_DEBT.md
          python - <<'PY'
          import subprocess
          staged = subprocess.run(['git', 'diff', '--cached', '--name-only'], check=True, capture_output=True, text=True).stdout.splitlines()
          bad = [path for path in staged if path.endswith('.pyc') or '/__pycache__/' in f'/{path}']
          if bad:
              raise SystemExit('refusing to commit bytecode: ' + ', '.join(bad))
          print(f'Explicitly staged {len(staged)} Wave-5G files; no bytecode.')
          PY
          if git diff --cached --quiet; then
            echo 'No Wave 5G cutover changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(refoundation): cut over native identity schema authority'
          git push origin HEAD:${GITHUB_HEAD_REF}
