name: R2.68 RED GREEN

on:
  pull_request:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol, main]
    paths:
      - 'cogcoder/r268_*.py'
      - 'tests/test_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - '.github/workflows/r268-red-green.yml'
      - 'docs/superpowers/specs/2026-08-19-r268-proof-carrying-adaptive-causal-basis-design.md'
      - 'docs/superpowers/plans/2026-08-19-r268-proof-carrying-adaptive-causal-basis.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Corrected parent safety
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.68 proof authority
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_proof_authority.py
