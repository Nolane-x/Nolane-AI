name: R2.68 RED GREEN
# Final freeze retrigger after cross-Python external receipt materialization; no test semantics changed.
# Isolated retrigger after superseded child PRs were closed; runner fan-out reduced, no authority semantics changed.

on:
  pull_request:
    branches:
      - r267-1-genuine-causal-necessity-hotfix-gpt56sol
      - r268-proof-carrying-adaptive-causal-basis-gpt56sol
      - main
    paths:
      - 'cogcoder/r268_*.py'
      - 'cogcoder/_r268_*.py'
      - 'tests/test_r268_*.py'
      - 'benchmarks/kfigg/r268_*.py'
      - 'research/r268_*.py'
      - '.github/workflows/r268-red-green.yml'
      - 'docs/superpowers/specs/2026-08-19-r268-proof-carrying-adaptive-causal-basis-design.md'
      - 'docs/superpowers/plans/2026-08-19-r268-proof-carrying-adaptive-causal-basis.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    # REFOUNDATION_PR_ISOLATION
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'refoundation/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Corrected parent safety
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: R2.68 focused contracts
        run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
