name: R2.67.1 Partial Receipt Accounting Hotfix

on:
  push:
    branches: [r267-1-genuine-causal-necessity-hotfix-gpt56sol]
    paths:
      - 'tests/test_r267_1_partial_probe_receipt_accounting.py'
      - 'scripts/r267_1_apply_partial_receipt_accounting.py'
      - '.github/workflows/r267-1-partial-receipt-hotfix.yml'
      - '.github/workflows/r267-1-freeze-evidence.yml'
      - '.github/workflows/r267-1-canonical-gate.yml'
      - '.github/workflows/r267-1-release-bundle.yml'
      - 'cogcoder/r267_three_probe_causal_composition.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Accepted R2.66 safety first
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Preserve independent RED before source materialization
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git hash-object cogcoder/r267_three_probe_causal_composition.py)"
          if [ "$blob" = '6ff70969be3404c58ddd43c785b5d0450ee32bd1' ]; then
            set +e
            PYTHONPATH=. python -m pytest -q tests/test_r267_1_partial_probe_receipt_accounting.py
            rc=$?
            set -e
            test "$rc" -ne 0
            echo R267_1_PARTIAL_RECEIPT_RED_CONFIRMED
          else
            test "$blob" = 'ee7dc56db206a1e2f8a9da47976db112870dcd3e'
            echo R267_1_PARTIAL_RECEIPT_ALREADY_MATERIALIZED
          fi
      - name: Apply guarded production fix ephemerally
        run: python scripts/r267_1_apply_partial_receipt_accounting.py
      - name: Focused R2.67.1 GREEN
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
      - name: Accepted R2.66 remains GREEN
        run: PYTHONPATH=. python -m pytest -q tests/test_r266_*.py

  materialize:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r267-1-genuine-causal-necessity-hotfix-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'numpy==2.4.6'
      - name: Refuse stale writer
        run: |
          set -euo pipefail
          git fetch origin r267-1-genuine-causal-necessity-hotfix-gpt56sol
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/r267-1-genuine-causal-necessity-hotfix-gpt56sol)"
      - name: Materialize guarded production fix
        run: python scripts/r267_1_apply_partial_receipt_accounting.py
      - name: Reverify writer tree
        run: |
          PYTHONPATH=. python -m pytest -q tests/test_r267_1_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r267_independent_ablation_completeness.py
          PYTHONPATH=. python -m pytest -q tests/test_r266_*.py
      - name: Commit only verified production delta
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo R267_1_PARTIAL_RECEIPT_NO_SOURCE_DELTA
            exit 0
          fi
          test "$changed" = 'cogcoder/r267_three_probe_causal_composition.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r267_three_probe_causal_composition.py
          git commit -m 'fix: account only attempted R2.67.1 evidence cases'
          git push origin HEAD:r267-1-genuine-causal-necessity-hotfix-gpt56sol
