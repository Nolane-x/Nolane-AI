name: E Acting Decision Authority GREEN

on:
  push:
    branches:
      - e-acting-authority-green-staging-gpt56sol

permissions:
  contents: write

concurrency:
  group: e-acting-decision-authority-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e-acting-authority-green-staging-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Apply guarded decision authority patch
        run: python .github/e_acting_decision_authority_green.py
      - name: Compile execution authority modules
        run: |
          python -m py_compile \
            nolane/external_core/execution.py \
            nolane/external_core/execution_types.py \
            nolane/neural/inference_bridge.py \
            nolane/metadata/component_versions.py
      - name: Run focused decision and control authority contracts
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_decision_request_authority.py \
            tests/test_refoundation_wave5aa_native_execution_control.py \
            tests/test_refoundation_acting_control_provenance.py \
            tests/test_refoundation_acting_runtime.py \
            tests/test_refoundation_wave5z_native_neural_inference.py
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit production closure
        run: |
          if git diff --quiet -- \
            nolane/external_core/execution.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_wave5aa_native_execution_control.py; then
            echo "Production decision authority patch already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nolane/external_core/execution.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_wave5aa_native_execution_control.py
          git diff --cached --check
          git commit -m "fix(e-acting): attest decision request authority"
          git push origin HEAD:e-acting-authority-green-staging-gpt56sol
