name: Post-Epoch 0 Candidate Synthesis TDD

on:
  push:
    branches:
      - 'post-epoch0/candidate-synthesis-v0.0.1'

concurrency:
  group: candidate-synthesis-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contract:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Candidate synthesis focused contract
        run: python -m pytest -q tests/test_refoundation_post_epoch0_candidate_synthesis.py
