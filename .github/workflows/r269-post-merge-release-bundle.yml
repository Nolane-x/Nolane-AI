name: R2.69 Post-Merge Exact-Main Bundle

on:
  push:
    branches: [main]
    paths:
      - 'cogcoder/r269_*.py'
      - 'benchmarks/kfigg/r269_*.py'
      - 'tests/test_r269_*.py'
      - 'scripts/r269_build_complete_bundle.py'
      - 'R2_69_*.json'
      - '.github/workflows/r269-*.yml'

permissions:
  contents: read

env:
  SOURCE_AUTHORITY_PARENT: fda7f502185266fedb00886d5786c6d28cc0e0eb

jobs:
  exact-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main and frozen lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_AUTHORITY_PARENT" HEAD
          test -f R2_69_PRE_HOSTED_LOCK.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('R2_69_PRE_HOSTED_LOCK.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert lock['status']=='PRE_HOSTED_SOURCE_AND_EVIDENCE_LOCK'
          assert lock['source_authority_parent']=='fda7f502185266fedb00886d5786c6d28cc0e0eb'
          for ancestor in (lock['source_head_sha'], lock['integration_base_sha']):
              subprocess.run(['git','merge-base','--is-ancestor',ancestor,head],check=True)
          assert lock['writers_retired'] is True
          assert lock['w5_convergence_claimed'] is False
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python 3.11 exact-main verification
        run: |
          python -m pip install pytest 'numpy==2.4.6'
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          lock=json.loads(Path('R2_69_PRE_HOSTED_LOCK.json').read_text())
          authored=run_benchmark(); external=run_external_transfer()
          assert authored['authored_gate_pass'] is True
          assert authored['semantic_result_digest']==lock['authored_semantic_digest']
          assert external['all_gates_pass'] is True
          assert external['semantic_result_digest']==lock['external_semantic_digest']
          assert authored['false_accepts']==external['false_accepts']==0
          assert authored['trainable_parameter_count']==external['trainable_parameter_count']==0
          world=json.loads(Path('R2_69_WORLD_BOUNDED_ADJUDICATION.json').read_text())
          assert world['final_bounded_release']=='ACCEPT'
          assert world['w5_convergence_claimed'] is False
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python 3.13 exact-main replay
        run: |
          python -m pip install pytest 'numpy==2.4.6'
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          lock=json.loads(Path('R2_69_PRE_HOSTED_LOCK.json').read_text())
          assert run_benchmark()['semantic_result_digest']==lock['authored_semantic_digest']
          assert run_external_transfer()['semantic_result_digest']==lock['external_semantic_digest']
          print('R269_POST_MERGE_CROSS_PYTHON_OK')
          PY

      - name: Rebuild exact-main COMPLETE artifact
        run: PYTHONPATH=. python scripts/r269_build_complete_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.69-POST-MERGE-COMPLETE
          path: |
            release/Nolane-AI-R2.69-COMPLETE.zip
            release/Nolane-AI-R2.69-COMPLETE.zip.sha256
          if-no-files-found: error
          retention-days: 90
