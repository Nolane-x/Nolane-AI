name: R2.69 Post-Merge Exact-Main Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_AUTHORITY_PARENT: fda7f502185266fedb00886d5786c6d28cc0e0eb

jobs:
  exact-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact main and frozen lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_AUTHORITY_PARENT" HEAD
          test -f archive/root-history/historical_r_series/R2_69_PRE_HOSTED_LOCK.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_69_PRE_HOSTED_LOCK.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert lock['schema_version']>=4
          assert lock['status']=='PRE_HOSTED_SOURCE_AND_EVIDENCE_LOCK'
          assert lock['source_authority_parent']=='fda7f502185266fedb00886d5786c6d28cc0e0eb'
          for ancestor in (lock['source_head_sha'], lock['integration_base_sha']):
              subprocess.run(['git','merge-base','--is-ancestor',ancestor,head],check=True)
          assert lock['writers_retired'] is True
          assert lock['w5_convergence_claimed'] is False
          assert lock['host_attested_promotion_authority_required'] is True
          assert lock['promotion_authority_source_frozen'] is True
          assert lock['content_addressed_world_adjudication_required'] is True
          assert lock['exact_rollback_registry_required'] is True
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python 3.11 exact-main verification
        env:
          POSTMERGE_RUN_ID: ${{ github.run_id }}
        run: |
          python -m pip install pytest 'numpy==2.4.6'
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          from benchmarks.kfigg.r269_promotion_authority import run_promotion_authority_benchmark
          from scripts.r269_world_adjudication import verify_receipt as verify_world_receipt

          lock=json.loads(Path('archive/root-history/historical_r_series/R2_69_PRE_HOSTED_LOCK.json').read_text())
          authored=run_benchmark(); external=run_external_transfer()
          assert authored['authored_gate_pass'] is True
          assert authored['semantic_result_digest']==lock['authored_semantic_digest']
          assert external['all_gates_pass'] is True
          assert external['semantic_result_digest']==lock['external_semantic_digest']
          assert authored['false_accepts']==external['false_accepts']==0
          assert authored['trainable_parameter_count']==external['trainable_parameter_count']==0

          promo=json.loads(Path('archive/root-history/historical_r_series/R2_69_PROMOTION_AUTHORITY.json').read_text())
          assert promo['promotion_gate_pass'] is True
          assert promo['semantic_result_digest']==lock['promotion_semantic_digest']
          assert promo['authority_root_digest']==lock['promotion_authority_root_digest']
          assert promo['hosted_attestation_digest']==lock['promotion_hosted_attestation_digest']
          assert promo['authority_envelope_digest']==lock['promotion_authority_envelope_digest']
          assert promo['verifier_workflow_blob']==lock['promotion_verifier_workflow_blob']
          tree_sha=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          promotion=run_promotion_authority_benchmark(
              authority_root_digest=lock['promotion_authority_root_digest'],
              hosted_run_identity='github-actions:postmerge-311:'+os.environ['POSTMERGE_RUN_ID'],
              source_tree_digest=hashlib.sha256(tree_sha.encode()).hexdigest(),
          )
          assert promotion['promotion_gate_pass'] is True
          assert promotion['semantic_result_digest']==lock['promotion_semantic_digest']
          assert promotion['false_accepts']==0 and promotion['trainable_parameter_count']==0

          world=verify_world_receipt()
          assert world['final_bounded_release']=='ACCEPT'
          assert world['full_w5_gate_pass'] is False
          assert world['w5_convergence_claimed'] is False
          assert world['claim_boundary']==lock['claim_boundary']
          assert world['receipt_digest']==lock['world_bounded_receipt_digest']
          assert world['world_state_sha256']==lock['world_state_sha256']
          assert world['world_gate_sha256']==lock['world_gate_sha256']
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python 3.13 exact-main replay
        env:
          POSTMERGE_RUN_ID: ${{ github.run_id }}
        run: |
          python -m pip install pytest 'numpy==2.4.6'
          PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
          PYTHONPATH=. python -m pytest -q tests/test_r269_*.py
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from benchmarks.kfigg.r269_meta_learning import run_benchmark
          from benchmarks.kfigg.r269_external_numpy_transfer import run_external_transfer
          from benchmarks.kfigg.r269_promotion_authority import run_promotion_authority_benchmark
          from scripts.r269_world_adjudication import verify_receipt as verify_world_receipt
          lock=json.loads(Path('archive/root-history/historical_r_series/R2_69_PRE_HOSTED_LOCK.json').read_text())
          assert run_benchmark()['semantic_result_digest']==lock['authored_semantic_digest']
          assert run_external_transfer()['semantic_result_digest']==lock['external_semantic_digest']
          tree_sha=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          promotion=run_promotion_authority_benchmark(
              authority_root_digest=lock['promotion_authority_root_digest'],
              hosted_run_identity='github-actions:postmerge-313:'+os.environ['POSTMERGE_RUN_ID'],
              source_tree_digest=hashlib.sha256(tree_sha.encode()).hexdigest(),
          )
          assert promotion['semantic_result_digest']==lock['promotion_semantic_digest']
          assert promotion['promotion_gate_pass'] is True
          assert promotion['false_accepts']==0 and promotion['trainable_parameter_count']==0
          world=verify_world_receipt()
          assert world['receipt_digest']==lock['world_bounded_receipt_digest']
          print('R269_POST_MERGE_CROSS_PYTHON_OK')
          PY

      - name: Rebuild exact-main COMPLETE artifact
        run: PYTHONPATH=. python scripts/r269_build_complete_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nolane-AI-R2.69-POST-MERGE-COMPLETE
          path: |
            release/Nolane-AI-R2.69-COMPLETE.zip
            release/Nolane-AI-R2.69-COMPLETE.zip.sha256
          if-no-files-found: error
          retention-days: 90
