name: E Acting Record Integrity GREEN

on:
  push:
    branches:
      - refoundation/e-acting-transactional-runtime-gpt56sol
    paths:
      - .github/workflows/e-acting-record-integrity-green.yml

permissions:
  contents: write

concurrency:
  group: e-acting-record-integrity-green
  cancel-in-progress: true

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refoundation/e-acting-transactional-runtime-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply record integrity hardening
        run: python .github/e_acting_record_integrity_patch.py
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Run targeted E contracts
        run: |
          python -m py_compile nolane/external_core/*.py
          python -m pytest -q \
            tests/test_refoundation_acting_protocol.py \
            tests/test_refoundation_acting_record_integrity.py \
            tests/test_refoundation_acting_workspace.py \
            tests/test_refoundation_acting_runtime.py
      - name: Run full Refoundation regression
        run: python -m pytest -q tests/test_refoundation_*.py
      - name: Commit verified integrity hardening
        if: success()
        run: |
          git config user.name "nolane-e-acting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            nolane/external_core/acting_protocol.py \
            .github/workflows/refoundation-e-acting.yml \
            CURRENT/E_ACTING.md \
            docs/superpowers/specs/2026-08-30-refoundation-e-acting-transactional-runtime-design.md
          git commit -m "fix(e-acting): bind persisted action records to lifecycle evidence"
          git push origin HEAD:refoundation/e-acting-transactional-runtime-gpt56sol
