name: A10 Apply Once

on:
  push:
    branches:
      - upgrade/external-core-a8-a10-v1-closure
    paths:
      - tools/a10_apply_once.py
      - .github/workflows/a10-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Apply exact A10 owner patch
        run: python tools/a10_apply_once.py
      - name: Verify focused A8-A10 integration
        run: |
          python -m pytest -q \
            tests/test_external_core_a8_observed_population.py \
            tests/test_external_core_a10_observation_audit.py
          git diff --check
      - name: Commit production patch and self-clean transport
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nolane/external_core/integration_admission_bundle.py
          git rm tools/a10_apply_once.py .github/workflows/a10-apply-once.yml
          git commit -m "feat: integrate External Core A8-A10 observation witness"
          git push origin HEAD:upgrade/external-core-a8-a10-v1-closure
