name: R2.68-T Oracle Context Isolation GREEN Writer

on:
  push:
    branches: [hardening-r268t-oracle-context-immutability-gpt56sol]
    paths:
      - 'scripts/r268t_apply_oracle_context_isolation.py'
      - '.github/workflows/r268t-oracle-context-isolation-writer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r268t-oracle-context-isolation-writer
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-oracle-context-immutability-gpt56sol
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_oracle_context_isolation.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py

  materialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-r268t-oracle-context-immutability-gpt56sol
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. python scripts/r268t_apply_oracle_context_isolation.py
      - run: PYTHONPATH=. python -m pytest -q tests/test_r268_*.py
      - name: Materialize production source only after both Python gates are GREEN
        run: |
          if git diff --quiet -- cogcoder/r268_cross_task_causal_transfer.py cogcoder/r268_cross_task_transfer_baseline.py; then
            echo 'Source already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cogcoder/r268_cross_task_causal_transfer.py cogcoder/r268_cross_task_transfer_baseline.py
          git commit -m 'fix: isolate R2.68-T oracle contexts from mutation'
          git push origin HEAD:hardening-r268t-oracle-context-immutability-gpt56sol

# Retriggered only after hosted runner-only GREEN on Python 3.11 and 3.13.
