name: Neural vNext Native R28 Dev

on:
  push:
    branches:
      - codex/neural-native-r28-counterfactual-rescue-value
    paths:
      - 'model/neural-vnext-native-r28/**'
      - '.github/workflows/neural-vnext-native-r28-dev.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'model/neural-vnext-native-r28/**'
      - '.github/workflows/neural-vnext-native-r28-dev.yml'

permissions:
  contents: read

concurrency:
  group: neural-vnext-native-r28-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r28-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OMP_DYNAMIC: 'FALSE'
      MKL_DYNAMIC: 'FALSE'
      MKL_CBWR: 'COMPATIBLE'
      KMP_DETERMINISTIC_REDUCTION: 'TRUE'
      ATEN_CPU_CAPABILITY: 'default'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned neural dependencies
        run: |
          python -m pip install -q pytest numpy
          python -m pip install -q torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run R28 contracts
        env:
          PYTHONPATH: model/neural-vnext-native-r28:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          python -m py_compile model/neural-vnext-native-r28/*.py model/neural-vnext-native-r28/scripts/*.py model/neural-vnext-native-r28/tests/*.py
          python -m pytest -q model/neural-vnext-native-r28/tests
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('model/neural-vnext-native-r28/PREDEV_LOCK.json').read_text())
          fresh=json.loads(Path('model/neural-vnext-native-r28/FRESH_GATE_PREREGISTRATION.json').read_text())
          assert lock['candidate']=='Neural-vNext-Native-R28-CounterfactualRescueValue'
          assert lock['architecture']['expected_successor_parameters']==159834
          assert lock['architecture']['expected_physical_parameters']==1037376
          assert lock['benchmark']['development_indices']==[1632,1663]
          assert lock['benchmark']['confirmation_indices']==[1664,1695]
          assert lock['benchmark']['fresh_indices']==[280,319]
          assert len(lock['benchmark']['rescue_guard_blocks'])==4
          assert lock['training']['max_overrides_per_episode']==1
          assert lock['training']['require_zero_predicted_harm'] is True
          assert lock['private_boundary']['inference_private_goal_use'] is False
          assert lock['fresh_isolation']['status']=='UNOPENED'
          assert fresh['status']=='UNOPENED'
          PY
      - name: Train counterfactual rescue model and run locked R28 primary court
        env:
          PYTHONPATH: model/neural-vnext-native-r28:model/neural-vnext-native-r11:model/neural-vnext-native-r9:model/neural-vnext-native-r4:model/neural-vnext-native-r3:model/neural-vnext-native-r2:model/neural-vnext-native:model/r1.8
        run: |
          mkdir -p r28-output
          python model/neural-vnext-native-r28/scripts/run_dev.py \
            --checkpoint r28-output/r28.pt \
            --manifest r28-output/r28.manifest.json \
            --dev-result r28-output/r28.dev.json
      - name: Enforce confirmation and fresh isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('r28-output/r28.manifest.json').read_text())
          assert manifest['confirmation_opened'] is False
          assert manifest['fresh_opened'] is False
          assert manifest['private_boundary']['inference_private_goal_use'] is False
          assert manifest['selected_config']['max_overrides_per_episode']==1
          assert manifest['status'] in {
              'R28_DEV_ELIGIBLE_CONFIRMATION_UNOPENED_FRESH_UNOPENED',
              'R28_DEV_REJECTED_CONFIRMATION_FRESH_UNOPENED',
          }
          PY
      - name: Upload deterministic dev authority
        uses: actions/upload-artifact@v4
        with:
          name: neural-vnext-native-r28-dev
          path: |
            r28-output/r28.pt
            r28-output/r28.manifest.json
            r28-output/r28.dev.json
          if-no-files-found: error
          retention-days: 90
