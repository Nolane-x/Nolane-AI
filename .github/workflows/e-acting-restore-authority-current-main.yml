name: E Acting Restore Authority Current-Main GREEN

on:
  push:
    branches:
      - e-acting-restore-authority-current-1a8160cc

concurrency:
  group: e-acting-restore-authority-current-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Apply deterministic authority closure
        run: python tools/e_acting_restore_authority_patch.py
      - name: Compile changed authority surfaces
        run: |
          python -m compileall -q \
            nolane/external_core/execution.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_acting_restore_authority.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_wave5aa_native_execution_control.py
      - name: Focused E + Memory integration GREEN
        run: |
          python -m pytest -q \
            tests/test_refoundation_acting_*.py \
            tests/test_refoundation_wave5aa_native_execution_control.py \
            tests/test_refoundation_component_versions.py \
            tests/test_memory_learning_governed_skill_promotion_v013.py \
            tests/test_refoundation_memory_public_layout.py \
            tests/test_refoundation_wave5j_native_skills.py
      - name: Whitespace integrity
        run: git diff --check
      - name: Commit exact verified production patch
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nolane/external_core/execution.py \
            nolane/metadata/component_versions.py \
            tests/test_refoundation_component_versions.py \
            tests/test_refoundation_wave5aa_native_execution_control.py
          git diff --cached --check
          git commit -m "E Acting: close persisted restore authority [skip ci]"
          git push origin HEAD:e-acting-restore-authority-current-1a8160cc
